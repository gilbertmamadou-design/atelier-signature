name: Fabriquer les cadrans (Atelier de cadrans, T-Rex 3)
# Cadrans Zepp OS pour Amazfit T-Rex 3, fabriqués à partir de réglages (zepp/cadrans) :
#  - sans réglage fourni (et chaque nuit) : toute la collection (zepp/cadrans/collection/*.json) → release fixe « cadrans-collection »
#    (adresses stables, utilisées par l'appli Atelier de cadrans) ;
#  - avec « cadran » (réglages JSON encodés en base64, envoyés par l'appli) : un cadran perso → release « cadran-perso-N ».
# Pour chaque cadran : <id>-apercu.zab (variante « preview » pour le scanner du mode développeur de Zepp),
# <id>-qr.png (QR « zpkd1:// »), <id>.png et <id>-aod.png (aperçus), <id>.zab (paquet officiel).
on:
  workflow_dispatch:
    inputs:
      cadran:
        description: "Réglages d'un cadran perso (JSON en base64). Vide : toute la collection"
        required: false
        default: ""
      zeus:
        description: "Version de @zeppos/zeus-cli (ex. 1.9.3) ou « latest »"
        required: false
        default: "latest"
  push:
    branches: [main]
    paths: ["zepp/cadrans/**", ".github/workflows/cadrans.yml"]
  # les paquets « preview » de Zepp ne se scannent que 48 h après leur fabrication : la collection est refaite chaque jour
  schedule:
    - cron: "37 3 * * *"

permissions:
  contents: write

concurrency:
  group: cadrans-${{ github.event.inputs.cadran != '' && github.run_id || 'collection' }}
  cancel-in-progress: false

jobs:
  fabriquer:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: zepp/cadrans
    steps:
      - uses: actions/checkout@v5
      - name: Ménage (cadrans perso de plus de 3 jours)
        # les cadrans perso peuvent contenir une photo : on ne les garde que le temps de les installer (le QR expire au bout de 48 h)
        if: github.event.inputs.cadran == ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          limite=$(date -u -d '3 days ago' +%s)
          gh api "repos/$REPO/releases?per_page=100" --paginate --jq '.[] | select(.tag_name | startswith("cadran-perso-")) | "\(.id) \(.tag_name) \(.created_at)"' |
          while read -r id tag cree; do
            if [ "$(date -u -d "$cree" +%s)" -lt "$limite" ]; then
              gh api -X DELETE "repos/$REPO/releases/$id" && gh api -X DELETE "repos/$REPO/git/refs/tags/$tag" && echo "supprimé : $tag ($cree)"
            fi
          done
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Outils (Zeus CLI, Chromium pour dessiner, QR)
        env:
          ZEUS: ${{ github.event.inputs.zeus || 'latest' }}
        run: |
          npm install -g "@zeppos/zeus-cli@${ZEUS}" --no-audit --no-fund
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          pip install --quiet "qrcode[pil]==7.4.2"
      - name: Réglages
        id: reglages
        run: |
          mkdir -p ../out-cadrans/projets
          # réglages envoyés par l'appli : lus dans l'événement (ils n'apparaissent pas dans le journal, la photo non plus),
          # jamais interprétés par le shell, seulement décodés puis lus en JSON
          CADRAN=$(jq -r '.inputs.cadran // ""' "$GITHUB_EVENT_PATH")
          if [ -n "$CADRAN" ]; then
            printf '%s' "$CADRAN" | base64 -d > ../out-cadrans/perso.json
            python3 - ../out-cadrans/perso.json <<'PY'
          import json, sys
          p = sys.argv[1]; o = json.load(open(p, encoding='utf-8'))
          import re
          assert isinstance(o, dict), 'réglages invalides'
          photo = o.get('photo') or ''
          assert not photo or (len(photo) < 60000 and re.fullmatch(r'data:image/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+', photo)), 'photo invalide'
          assert len(json.dumps(o)) - len(photo) < 16000, 'réglages trop longs'
          assert len(o.get('blocs') or []) <= 40, 'trop d\'éléments'
          o.pop('appId', None); o.pop('id', None)
          json.dump(o, open(p, 'w', encoding='utf-8'), ensure_ascii=False)
          print('cadran perso :', o.get('nom'))
          PY
            echo "mode=perso" >> "$GITHUB_OUTPUT"
            echo "fichiers=../out-cadrans/perso.json" >> "$GITHUB_OUTPUT"
            echo "tag=cadran-perso-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "mode=collection" >> "$GITHUB_OUTPUT"
            echo "fichiers=$(ls collection/*.json | grep -v liste.json | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
            echo "tag=cadrans-collection" >> "$GITHUB_OUTPUT"
          fi
      - name: Dessiner les images et préparer les projets
        run: node outils/fabriquer.mjs ${{ steps.reglages.outputs.fichiers }} --sortie ../out-cadrans/projets
      - name: Essais (Zepp OS simulé, toutes les images présentes)
        run: |
          for d in ../out-cadrans/projets/*/; do echo "== $d"; CADRAN_PROJET="$d" node --test test/simulation.test.mjs; done
      - name: zeus build, variante « preview » et QR
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ steps.reglages.outputs.tag }}
        run: |
          set -o pipefail
          OUT=$(cd ../out-cadrans && pwd); ICI=$(pwd)
          for d in "$OUT"/projets/*/; do
            id=$(basename "$d")
            echo "::group::$id"
            ln -sfn "$ICI/node_modules" "$d/node_modules"
            ( cd "$d" && CI=1 zeus build < /dev/null 2>&1 | tail -20 )
            ZAB=$(ls -t "$d"/dist/*.zab | head -1)
            cp "$ZAB" "$OUT/$id.zab"
            python3 outils/variante_apercu.py "$OUT/$id.zab" "$OUT/$id-apercu.zab" > /dev/null
            URL="https://github.com/${REPO}/releases/download/${TAG}/${id}-apercu.zab"
            python3 -c "import qrcode,sys; qrcode.make(sys.argv[1], box_size=10, border=3).save(sys.argv[2])" "zpkd1://${URL#https://}" "$OUT/$id-qr.png"
            cp "$OUT/projets/$id.png" "$OUT/$id.png"; cp "$OUT/projets/$id-aod.png" "$OUT/$id-aod.png"; cp "$OUT/projets/$id.json" "$OUT/$id.json"
            echo "::endgroup::"
          done
          cp "$OUT/projets/liste.json" "$OUT/cadrans.json"
          ls -la "$OUT"
      - name: Publier (collection)
        if: steps.reglages.outputs.mode == 'collection'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cadrans-collection
          name: Cadrans T-Rex 3 – collection
          overwrite_files: true
          body: |
            Collection de cadrans pour Amazfit T-Rex 3 (Zepp OS), fabriqués à partir de zepp/cadrans/collection.
            Installation : ouvrez l'appli « Atelier de cadrans » › Collection, ou scannez <id>-qr.png avec Zepp › Profil › T-Rex 3 › Mode développeur › scan.
          files: |
            zepp/out-cadrans/*.zab
            zepp/out-cadrans/*.png
            zepp/out-cadrans/*.json
      - name: Publier (cadran perso)
        if: steps.reglages.outputs.mode == 'perso'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.reglages.outputs.tag }}
          name: Cadran perso ${{ github.run_number }}
          body: |
            Cadran perso fabriqué avec l'appli « Atelier de cadrans » (Amazfit T-Rex 3).
            Installation : scannez le QR avec Zepp › Profil › T-Rex 3 › Mode développeur › scan.
          files: |
            zepp/out-cadrans/*.zab
            zepp/out-cadrans/*.png
            zepp/out-cadrans/*.json
