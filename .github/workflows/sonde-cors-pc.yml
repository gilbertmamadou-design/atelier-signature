name: Sonde CORS (temporaire, Suite MAG sur PC)
on:
  push:
    branches: [sonde-cors-pc]
    paths: ['.github/sonde/**', '.github/workflows/sonde-cors-pc.yml']
permissions:
  contents: write
jobs:
  sonde:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: python3 .github/sonde/sonde.py
      - run: |
          mkdir -p resultats && mv resultat.json resultats/
          git config user.name "sonde" && git config user.email "sonde@users.noreply.github.com"
          git add resultats && git commit -m "Résultat de la sonde CORS" && git push
