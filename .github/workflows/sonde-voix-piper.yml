# TEMPORAIRE (retiré après usage) : essai de bout en bout des voix Piper de Majordome avec les VRAIS fichiers de
# huggingface.co/rhasspy/piper-voices (Chromium : CORS, somme SHA-256 figée, moteur sherpa-onnx WASM, synthèse, effets).
name: Sonde voix Piper (temporaire)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  sonde:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Essai dans Chromium
        run: |
          exec > >(tee out.txt) 2>&1
          npm i -s playwright@1.56.1 >/dev/null 2>&1 && npx -y playwright@1.56.1 install --with-deps chromium >/dev/null 2>&1
          python3 -m http.server 8000 >/dev/null 2>&1 &
          mkdir -p essai && cat > essai/t.html <<'H'
          <!doctype html><meta charset="utf-8"><script src="/applis/www-majordome/mj-voix.js"></script>
          <script>window.E = MJVoix.create({ engine: '/applis/www-majordome/piper/', worker: '/applis/www-majordome/mj-voix-worker.js', phon: '/applis/www-majordome/mj-phon.js' });</script>
          H
          cat > essai/t.js <<'J'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch({ args: ['--autoplay-policy=no-user-gesture-required'] }); const p = await b.newPage(); const errs = [];
            p.on('console', m => { if (m.type() === 'error') errs.push(m.text()); }); p.on('pageerror', e => errs.push(e.message));
            await p.goto('http://127.0.0.1:8000/essai/t.html');
            for (const v of ['pierre', 'siwis', 'gilles']) {
              const r = await p.evaluate(async (v) => {
                const t0 = performance.now(); const inst = await E.download(v); const dl = Math.round(performance.now() - t0);
                const w = await E.warm(v); const out = { inst, dl, load: w.ms, sr: w.sr };
                for (const fx of ['aucun', 'ia']) { const t1 = performance.now(); const a = await E.synth('Bonsoir Monsieur. Il est vingt et une heures quinze, et tous les systèmes sont opérationnels.', { voice: v, fx }); const s = MJVoix.stats(a.samples, a.sr); out[fx] = { ms: Math.round(performance.now() - t1), gen: a.chunks.map(c => c.genMs), dur: +s.dur.toFixed(2), rms: +s.rms.toFixed(3), peak: +s.peak.toFixed(3), clip: s.clip }; }
                let first = 0; await E.speak('Bonjour Monsieur.', { voice: v, fx: 'majordome' }, { onStart: ms => first = ms }); out.premierSon = first;
                return out;
              }, v);
              console.log('RESULTAT ' + v + ' ' + JSON.stringify(r));
            }
            console.log('ERREURS ' + JSON.stringify(errs)); await b.close();
          })().catch(e => { console.log('ECHEC ' + e.message); process.exit(1); });
          J
          node essai/t.js
      - name: Résultats en annotations (journaux non lisibles depuis le poste de travail)
        if: always()
        run: |
          python3 - <<'PY'
          t=open('out.txt',encoding='utf-8',errors='replace').read()
          parts=[t[i:i+3500] for i in range(0,len(t),3500)][:10]
          for k,x in enumerate(parts): print('::notice title=sonde %d::'%k + x.replace('%','%25').replace('\r','').replace('\n','%0A'))
          PY
