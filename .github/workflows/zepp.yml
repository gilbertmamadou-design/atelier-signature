name: Fabriquer la mini-appli Zepp OS « Jarvis » (montre)
# (et les cadrans « Jarvis » : zepp/jarvis-cadran, job « cadran », et « Jarvis Simple » : zepp/jarvis-simple, job « simple »)

# Construit zepp/jarvis avec l'outil officiel Zeus CLI (@zeppos/zeus-cli, licence ISC) et publie dans « Releases » :
#   jarvis-trex3.zab          paquet officiel (zeus build), à installer avec « zeus preview » (voie documentée par Zepp)
#   jarvis-trex3-apercu.zab   même paquet marqué « preview » (packageInfo.mode), pour le scanner du mode développeur
#   jarvis-qr.png             QR « zpkd1:// » vers jarvis-trex3-apercu.zab : voie NON documentée par Zepp (voir le guide)
# Lancement : Actions › « Fabriquer la mini-appli Zepp OS » › Run workflow (ou par l'API REST).
on:
  workflow_dispatch:
    inputs:
      zeus:
        description: "Version de @zeppos/zeus-cli (ex. 1.6.7) ou « latest »"
        required: false
        default: "latest"
      cible:
        description: "Quoi construire : tous, jarvis (mini-appli), cadran ou simple (cadran Jarvis Simple)"
        required: false
        default: "tous"
  push:
    branches: [main]
    paths: ["zepp/jarvis/**", "zepp/jarvis-cadran/**", "zepp/jarvis-simple/**", ".github/workflows/zepp.yml"]

permissions:
  contents: write

jobs:
  jarvis:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.cible == 'tous' || github.event.inputs.cible == 'jarvis'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: zepp/jarvis
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Zeus CLI et dépendances
        env:
          ZEUS: ${{ github.event.inputs.zeus || 'latest' }}
        run: |
          npm install -g "@zeppos/zeus-cli@${ZEUS}" --no-audit --no-fund
          npm install --no-audit --no-fund
          mkdir -p ../out
          { echo "Construction de Jarvis : $(date -u +%FT%TZ), commit ${GITHUB_SHA}"
            echo "Zeus CLI : $(npm ls -g @zeppos/zeus-cli --depth=0 | grep zeus-cli), licence $(node -p "require('$(npm root -g)/@zeppos/zeus-cli/package.json').license")"
            echo "zml : $(node -p "const p=require('./node_modules/@zeppos/zml/package.json'); p.version + ', licence ' + p.license")"
            echo "Node : $(node -v)"; } | tee ../out/jarvis-construction.txt
      - name: zeus build
        run: |
          set -o pipefail
          CI=1 zeus build < /dev/null 2>&1 | tee -a ../out/jarvis-construction.txt
          ls -la dist
      - name: Paquets et QR
        env:
          REPO: ${{ github.repository }}
          TAG: jarvis-montre-${{ github.run_number }}
        run: |
          set -o pipefail
          ZAB=$(ls -t dist/*.zab | head -1)
          cp "$ZAB" ../out/jarvis-trex3.zab
          python3 - <<'PY' | tee -a ../out/jarvis-construction.txt
          import io, json, zipfile, os, hashlib
          def walk(data, depth=0, path=''):
              src = zipfile.ZipFile(io.BytesIO(data)); out = io.BytesIO(); dst = zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED)
              for i in src.infolist():
                  b = src.read(i.filename)
                  print('  ' * depth + path + i.filename, len(b))
                  if i.filename.endswith(('.zpk', '.zip')):
                      b = walk(b, depth + 1, path + i.filename + ' › ')
                  elif i.filename == 'app.json':
                      o = json.loads(b)
                      if 'app' in o:
                          o.setdefault('packageInfo', {})['mode'] = 'preview'
                          b = json.dumps(o, ensure_ascii=False).encode('utf-8')
                          print('  ' * depth + '    → packageInfo.mode = preview')
                  dst.writestr(i, b)
              dst.close(); return out.getvalue()
          # .zab : un .zpk nommé par son md5, et manifest.json qui répète ce md5 ; on les recalcule après la modification
          src = zipfile.ZipFile('../out/jarvis-trex3.zab'); ren = {}; parts = []
          for i in src.infolist():
              b = src.read(i.filename)
              if i.filename.endswith('.zpk'):
                  b = walk(b, 1, i.filename + ' › '); m = hashlib.md5(b).hexdigest(); ren[i.filename[:-4]] = m; parts.append((m + '.zpk', b))
              elif i.filename != 'manifest.json': parts.append((i.filename, b))
          man = json.loads(src.read('manifest.json'))
          for z in man.get('zpks', []):
              old = z['name'][:-4]
              if old in ren: z['name'] = ren[old] + '.zpk'; z['md5'] = ren[old]
          out = zipfile.ZipFile('../out/jarvis-trex3-apercu.zab', 'w', zipfile.ZIP_DEFLATED)
          for n, b in parts: out.writestr(n, b)
          out.writestr('manifest.json', json.dumps(man, separators=(',', ':')))
          out.close()
          print('manifest de la variante « preview » :', json.dumps(man))
          z = zipfile.ZipFile('../out/jarvis-trex3.zab')
          zpk = [n for n in z.namelist() if n.endswith('.zpk')]
          if zpk: open('../out/jarvis-trex3.zpk', 'wb').write(z.read(zpk[0]))
          PY
          pip install --quiet "qrcode[pil]==7.4.2"
          URL="https://github.com/${REPO}/releases/download/${TAG}/jarvis-trex3-apercu.zab"
          python3 -c "import qrcode,sys; qrcode.make(sys.argv[1], box_size=10, border=3).save('../out/jarvis-qr.png')" "zpkd1://${URL#https://}"
          echo "zpkd1://${URL#https://}" > ../out/jarvis-qr.txt
          ls -la ../out
          sha256sum ../out/*
      - name: Publier dans « Releases »
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jarvis-montre-${{ github.run_number }}
          name: Jarvis (montre T-Rex 3) – version ${{ github.run_number }}
          body: |
            Mini-appli Zepp OS « Jarvis » pour Amazfit T-Rex 3 (Zepp OS 4, 480 × 480), construite avec Zeus CLI.
            Installation : voir le guide « Jarvis sur la montre » (zepp/jarvis/README.md).
          files: |
            zepp/out/jarvis-trex3.zab
            zepp/out/jarvis-trex3-apercu.zab
            zepp/out/jarvis-trex3.zpk
            zepp/out/jarvis-qr.png
            zepp/out/jarvis-qr.txt
            zepp/out/jarvis-construction.txt

  # Cadran « Jarvis » (watchface) : mêmes outils, même installation par le scanner du mode développeur
  #   jarvis-cadran-trex3.zab          paquet officiel (zeus build)
  #   jarvis-cadran-trex3-apercu.zab   même paquet marqué « preview » (outils/variante_apercu.py)
  #   jarvis-cadran-qr.png             QR « zpkd1:// » vers la variante « preview »
  cadran:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.cible == 'tous' || github.event.inputs.cible == 'cadran'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: zepp/jarvis-cadran
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Essais (Node, sans montre)
        run: node --test test/*.test.mjs
      - name: Zeus CLI
        env:
          ZEUS: ${{ github.event.inputs.zeus || 'latest' }}
        run: |
          npm install -g "@zeppos/zeus-cli@${ZEUS}" --no-audit --no-fund
          npm install --no-audit --no-fund
          mkdir -p ../out-cadran
          { echo "Construction du cadran Jarvis : $(date -u +%FT%TZ), commit ${GITHUB_SHA}"
            echo "Zeus CLI : $(npm ls -g @zeppos/zeus-cli --depth=0 | grep zeus-cli), licence $(node -p "require('$(npm root -g)/@zeppos/zeus-cli/package.json').license")"
            echo "Node : $(node -v)"
            # widgets et données de cadran déclarés par les types officiels (contrôle, sans effet sur le paquet)
            T=node_modules/@zeppos/device-types
            for m in IMG_TIME IMG_WEEK IMG_DATE IMG_ANIM IMG_LEVEL TEXT_IMG IMG_CLICK WIDGET_DELEGATE WEATHER_CURRENT SUN_RISE ALTIMETER ALTITUDE WIND launchApp onPerMinute; do
              echo "types $m : $(grep -rl "\b$m\b" "$T" 2>/dev/null | wc -l) fichier(s)"
            done
            grep -rhoE "\b(data_type|show_level|ONAL_AOD|ONLY_NORMAL|SCENE_AOD)\b" "$T" 2>/dev/null | sort | uniq -c | sed 's/^/types : /'; } | tee ../out-cadran/jarvis-cadran-construction.txt
      - name: zeus build
        run: |
          set -o pipefail
          CI=1 zeus build < /dev/null 2>&1 | tee -a ../out-cadran/jarvis-cadran-construction.txt
          ls -la dist
      - name: Paquets et QR
        env:
          REPO: ${{ github.repository }}
          TAG: jarvis-cadran-${{ github.run_number }}
        run: |
          set -o pipefail
          ZAB=$(ls -t dist/*.zab | head -1)
          cp "$ZAB" ../out-cadran/jarvis-cadran-trex3.zab
          python3 outils/variante_apercu.py ../out-cadran/jarvis-cadran-trex3.zab ../out-cadran/jarvis-cadran-trex3-apercu.zab ../out-cadran/jarvis-cadran-trex3.zpk | tee -a ../out-cadran/jarvis-cadran-construction.txt
          pip install --quiet "qrcode[pil]==7.4.2"
          URL="https://github.com/${REPO}/releases/download/${TAG}/jarvis-cadran-trex3-apercu.zab"
          python3 -c "import qrcode,sys; qrcode.make(sys.argv[1], box_size=10, border=3).save('../out-cadran/jarvis-cadran-qr.png')" "zpkd1://${URL#https://}"
          echo "zpkd1://${URL#https://}" > ../out-cadran/jarvis-cadran-qr.txt
          cp assets/trex3/images/preview.png ../out-cadran/jarvis-cadran-apercu.png
          ls -la ../out-cadran
          sha256sum ../out-cadran/*
      - name: Publier dans « Releases »
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jarvis-cadran-${{ github.run_number }}
          name: Cadran Jarvis (montre T-Rex 3) – version ${{ github.run_number }}
          body: |
            Cadran Zepp OS « Jarvis » pour Amazfit T-Rex 3 (Zepp OS 4, 480 × 480), construit avec Zeus CLI.
            Installation : scannez jarvis-cadran-qr.png avec Zepp › Profil › T-Rex 3 › Mode développeur (voir zepp/jarvis-cadran/README.md).
          files: |
            zepp/out-cadran/jarvis-cadran-trex3.zab
            zepp/out-cadran/jarvis-cadran-trex3-apercu.zab
            zepp/out-cadran/jarvis-cadran-trex3.zpk
            zepp/out-cadran/jarvis-cadran-qr.png
            zepp/out-cadran/jarvis-cadran-qr.txt
            zepp/out-cadran/jarvis-cadran-apercu.png
            zepp/out-cadran/jarvis-cadran-construction.txt

  # Cadran de secours « Jarvis Simple » (watchface minimal : couleur, texte, un fond, heure / date / batterie en TEXT)
  #   jarvis-simple-trex3.zab          paquet officiel (zeus build)
  #   jarvis-simple-trex3-apercu.zab   même paquet marqué « preview » (../jarvis-cadran/outils/variante_apercu.py)
  #   jarvis-simple-qr.png             QR « zpkd1:// » vers la variante « preview »
  simple:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.cible == 'tous' || github.event.inputs.cible == 'simple'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: zepp/jarvis-simple
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Essais (Node, sans montre)
        run: node --test test/*.test.mjs
      - name: Zeus CLI
        env:
          ZEUS: ${{ github.event.inputs.zeus || 'latest' }}
        run: |
          npm install -g "@zeppos/zeus-cli@${ZEUS}" --no-audit --no-fund
          npm install --no-audit --no-fund
          mkdir -p ../out-simple
          { echo "Construction du cadran Jarvis Simple : $(date -u +%FT%TZ), commit ${GITHUB_SHA}"
            echo "Zeus CLI : $(npm ls -g @zeppos/zeus-cli --depth=0 | grep zeus-cli), licence $(node -p "require('$(npm root -g)/@zeppos/zeus-cli/package.json').license")"
            echo "Node : $(node -v)"
            T=node_modules/@zeppos/device-types
            for m in FILL_RECT TEXT IMG IMG_TIME WIDGET_DELEGATE onPerMinute getCurrent ONAL_AOD ONLY_NORMAL; do
              echo "types $m : $(grep -rl "\b$m\b" "$T" 2>/dev/null | wc -l) fichier(s)"
            done; } | tee ../out-simple/jarvis-simple-construction.txt
      - name: zeus build
        run: |
          set -o pipefail
          CI=1 zeus build < /dev/null 2>&1 | tee -a ../out-simple/jarvis-simple-construction.txt
          ls -la dist
      - name: Paquets et QR
        env:
          REPO: ${{ github.repository }}
          TAG: jarvis-simple-${{ github.run_number }}
        run: |
          set -o pipefail
          ZAB=$(ls -t dist/*.zab | head -1)
          cp "$ZAB" ../out-simple/jarvis-simple-trex3.zab
          python3 ../jarvis-cadran/outils/variante_apercu.py ../out-simple/jarvis-simple-trex3.zab ../out-simple/jarvis-simple-trex3-apercu.zab ../out-simple/jarvis-simple-trex3.zpk | tee -a ../out-simple/jarvis-simple-construction.txt
          pip install --quiet "qrcode[pil]==7.4.2"
          URL="https://github.com/${REPO}/releases/download/${TAG}/jarvis-simple-trex3-apercu.zab"
          python3 -c "import qrcode,sys; qrcode.make(sys.argv[1], box_size=10, border=3).save('../out-simple/jarvis-simple-qr.png')" "zpkd1://${URL#https://}"
          echo "zpkd1://${URL#https://}" > ../out-simple/jarvis-simple-qr.txt
          cp assets/trex3/images/preview.png ../out-simple/jarvis-simple-apercu.png
          ls -la ../out-simple
          sha256sum ../out-simple/*
      - name: Publier dans « Releases »
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jarvis-simple-${{ github.run_number }}
          name: Cadran Jarvis Simple (montre T-Rex 3) – version ${{ github.run_number }}
          body: |
            Cadran de secours « Jarvis Simple » pour Amazfit T-Rex 3 (Zepp OS 4, 480 × 480), construit avec Zeus CLI.
            Installation : scannez jarvis-simple-qr.png avec Zepp › Profil › T-Rex 3 › Mode développeur (voir zepp/jarvis-simple/README.md).
          files: |
            zepp/out-simple/jarvis-simple-trex3.zab
            zepp/out-simple/jarvis-simple-trex3-apercu.zab
            zepp/out-simple/jarvis-simple-trex3.zpk
            zepp/out-simple/jarvis-simple-qr.png
            zepp/out-simple/jarvis-simple-qr.txt
            zepp/out-simple/jarvis-simple-apercu.png
            zepp/out-simple/jarvis-simple-construction.txt
