name: Cadrans Garmin (Fenix 6X Pro, 6S)
# Fabrique les cadrans Garmin Connect IQ. Il faut deux secrets du dépôt : GARMIN_USERNAME et GARMIN_PASSWORD
# (compte Garmin, pour télécharger le SDK et les fiches des montres). La clé de signature du développeur est
# GARMIN_CLE (base64 d'une clé RSA 4096 au format DER) ; sans elle, une clé jetable est créée pour l'essai.
on:
  workflow_dispatch:
    inputs:
      projet:
        description: "Dossier du projet (garmin/…)"
        required: false
        default: "garmin/essai"

permissions:
  contents: write

jobs:
  fabriquer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Gestionnaire du SDK Connect IQ
        run: |
          curl -fsSL https://raw.githubusercontent.com/lindell/connect-iq-sdk-manager-cli/master/install.sh -o "$RUNNER_TEMP/inst.sh"
          (cd "$RUNNER_TEMP" && sh inst.sh) || true
          B=$(command -v connect-iq-sdk-manager || find / -type f -name 'connect-iq-sdk-manager*' -perm -u+x 2>/dev/null | grep -v '\.sh$' | head -1)
          echo "outil : $B"; test -n "$B"
          mkdir -p "$HOME/bin"; ln -sf "$B" "$HOME/bin/connect-iq-sdk-manager"; echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Accord de licence
        run: |
          connect-iq-sdk-manager agreement view > "$RUNNER_TEMP/accord.txt" 2>&1 || true
          head -c 600 "$RUNNER_TEMP/accord.txt"; echo; echo ...; tail -c 800 "$RUNNER_TEMP/accord.txt"
          H=$(grep -oiE '[0-9a-f]{32,}' "$RUNNER_TEMP/accord.txt" | tail -1)
          echo "hash : $H"; test -n "$H"
          connect-iq-sdk-manager agreement accept --agreement-hash="$H"
      - name: Connexion, SDK et fiches des montres
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          connect-iq-sdk-manager sdk set "^8.0.0" || connect-iq-sdk-manager sdk set "^7.0.0" || connect-iq-sdk-manager sdk set "^6.4.0"
          echo "$(connect-iq-sdk-manager sdk current-path --bin)" >> "$GITHUB_PATH"
          test -n "$GARMIN_USERNAME" || { echo "::error::secrets GARMIN_USERNAME / GARMIN_PASSWORD absents"; exit 1; }
          connect-iq-sdk-manager login
          connect-iq-sdk-manager device download --manifest="${{ github.event.inputs.projet }}/manifest.xml"
      - name: Clé du développeur
        env:
          CLE: ${{ secrets.GARMIN_CLE }}
        run: |
          if [ -n "$CLE" ]; then printf '%s' "$CLE" | base64 -d > "$RUNNER_TEMP/cle.der"
          else
            echo "::warning::GARMIN_CLE absent : clé jetable (essai seulement)"
            openssl genrsa -out "$RUNNER_TEMP/cle.pem" 4096
            openssl pkcs8 -topk8 -inform PEM -outform DER -in "$RUNNER_TEMP/cle.pem" -out "$RUNNER_TEMP/cle.der" -nocrypt
          fi
      - name: Compiler
        run: |
          P="${{ github.event.inputs.projet }}"; mkdir -p sortie-garmin
          for d in fenix6xpro fenix6s; do
            monkeyc -f "$P/monkey.jungle" -d "$d" -y "$RUNNER_TEMP/cle.der" -o "sortie-garmin/$(basename "$P")-$d.prg" -w
          done
          ls -la sortie-garmin
      - name: Nom de la publication
        id: pub
        run: echo "tag=garmin-$(basename "${{ github.event.inputs.projet }}")" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pub.outputs.tag }}
          name: Cadran Garmin ${{ steps.pub.outputs.tag }}
          overwrite_files: true
          body: |
            Cadran Garmin Connect IQ (Fenix 6X Pro, Fenix 6S). Installation : brancher la montre en USB et copier le fichier .prg
            de sa montre dans le dossier GARMIN/APPS, puis débrancher.
          files: sortie-garmin/*.prg
