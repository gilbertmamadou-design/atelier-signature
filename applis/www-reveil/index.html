<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Aube</title>
<meta name="theme-color" content="#0c0e1f">
<style>
:root{
  color-scheme:dark;
  --bg:#0c0e1f;--bg2:#151834;--bg3:#20244a;--bg4:#2a2f5c;--line:#ffffff17;
  --tx:#f6f2ea;--tx2:#bcb8d2;--tx3:#807d9e;
  --acc:#ffb35c;--acc2:#ff7e5f;--rose:#f59fb0;--ok:#6fd6a4;--bad:#ff6b6b;
  --r:18px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
  --sky:linear-gradient(160deg,#1b1f4b,#0c0e1f);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select{font:inherit;color:inherit}
svg{display:block}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* En-tête et navigation */
header{padding:calc(12px + var(--safe-t)) 18px 6px;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:20px;letter-spacing:.2px}
.logo svg{width:30px;height:30px}
header .sp{flex:1}
.hdate{color:var(--tx2);font-size:13px;text-align:right;line-height:1.25}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 16px calc(96px + var(--safe-b));scroll-behavior:smooth}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;padding:8px 6px calc(8px + var(--safe-b));background:linear-gradient(transparent,var(--bg) 30%);z-index:20}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--tx3);padding:6px 12px;border-radius:14px;min-width:68px;transition:color .2s,background .2s}
nav button .ic{width:24px;height:24px}
nav button.on{color:var(--acc);background:#ffb35c14}
section.tab{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Éléments communs */
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:13px;letter-spacing:.6px;text-transform:uppercase;color:var(--tx3);font-weight:700}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.muted{color:var(--tx2)}.dim{color:var(--tx3)}.small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:14px;background:var(--bg3);font-weight:650;border:1px solid var(--line);transition:transform .1s,background .2s}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#2a1405;border:0}
.btn.ghost{background:transparent}
.btn.bad{color:var(--bad)}
.btn.full{width:100%}
.btn.sm{padding:8px 12px;font-size:13.5px;border-radius:11px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 13px;border-radius:999px;background:var(--bg3);border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--tx2)}
.chip.on{background:var(--acc);color:#2a1405;border-color:transparent}
.sw{width:50px;height:30px;border-radius:99px;background:var(--bg4);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#e9e6f2;transition:transform .2s}
.sw.on{background:var(--acc)}.sw.on::after{transform:translateX(20px);background:#fff}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:6px;background:linear-gradient(90deg,var(--acc) var(--p,50%),var(--bg4) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;margin-top:-9px;box-shadow:0 2px 8px #0008}
input[type=range]::-moz-range-track{height:6px;border-radius:6px;background:var(--bg4)}
input[type=range]::-moz-range-progress{height:6px;border-radius:6px;background:var(--acc)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:0}
.field{width:100%;padding:13px 14px;border-radius:13px;background:var(--bg3);border:1px solid var(--line);outline:none}
.field:focus{border-color:var(--acc)}
.lbl{font-size:13px;font-weight:700;color:var(--tx2);margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translateX(-50%);background:#f6f2ea;color:#14162c;padding:11px 18px;border-radius:14px;font-weight:600;z-index:99;box-shadow:0 8px 30px #0008;max-width:88vw;text-align:center;animation:fade .2s}

/* Horloge */
.hero{border-radius:26px;padding:26px 20px 18px;background:var(--sky);position:relative;overflow:hidden;margin-bottom:12px;border:1px solid var(--line);transition:background 2s}
.hero .stars{position:absolute;inset:0;opacity:var(--stars,0);transition:opacity 2s;pointer-events:none}
.bigtime{font-size:clamp(72px,24vw,116px);font-weight:250;letter-spacing:-3px;line-height:1;text-align:center;position:relative;text-shadow:0 4px 30px #0005}
.bigtime .col{animation:blink 2s steps(1) infinite}
@keyframes blink{50%{opacity:.25}}
.bigtime small{font-size:.28em;letter-spacing:0;font-weight:400;opacity:.65;margin-left:4px}
.bigdate{text-align:center;font-size:17px;color:#ffffffd9;margin-top:6px;position:relative;text-transform:capitalize}
.arc{position:relative;margin-top:16px}
.arc svg{width:100%;height:auto;overflow:visible}
.arc .lab{display:flex;justify-content:space-between;font-size:12.5px;color:#ffffffc0;margin-top:-4px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.mini{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:112px}
.mini .k{font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:var(--tx3);font-weight:700}
.mini .v{font-size:26px;font-weight:600;display:flex;align-items:center;gap:8px}
.mini .s{font-size:13px;color:var(--tx2)}
.mini svg.w{width:40px;height:40px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.act{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;align-items:center;gap:12px;font-weight:650;text-align:left}
.act i{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none}
.act span small{display:block;font-weight:500;color:var(--tx3);font-size:12px}

/* Réveils */
.next{border-radius:var(--r);padding:16px;background:linear-gradient(135deg,#3a2b5e,#5b3554 60%,#7a4840);margin-bottom:12px;display:flex;align-items:center;gap:14px}
.next .ic{width:30px;height:30px;color:var(--acc)}
.next b{font-size:17px}
.alarm{display:flex;align-items:center;gap:12px;padding:16px;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;text-align:left;width:100%;transition:opacity .2s}
.alarm.off{opacity:.55}
.alarm .t{font-size:40px;font-weight:300;letter-spacing:-1px;line-height:1}
.alarm .meta{font-size:13px;color:var(--tx2);margin-top:5px;display:flex;flex-wrap:wrap;gap:4px 10px}
.alarm .meta span{display:inline-flex;align-items:center;gap:4px}
.alarm .meta .ic{width:14px;height:14px}
.alarm .lab{font-weight:650;font-size:14.5px;margin-bottom:3px}
.fab{position:fixed;right:18px;bottom:calc(84px + var(--safe-b));width:60px;height:60px;border-radius:20px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#2a1405;display:grid;place-items:center;box-shadow:0 10px 30px #ff7e5f55;z-index:19}
.fab .ic{width:28px;height:28px;stroke-width:2.4}
.perm{border:1px solid #ffb35c55;background:#ffb35c10}
.perm .it{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.perm .it:first-of-type{border-top:0}
.empty{text-align:center;padding:30px 20px;color:var(--tx2)}
.empty svg{width:120px;height:120px;margin:0 auto 10px}

/* Feuilles (éditeur, choix de musique) */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;animation:up .25s ease}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sheet>header{border-bottom:1px solid var(--line);padding-bottom:12px}
.sheet>header h2{margin:0;font-size:18px;flex:1}
.sheet .body{flex:1;overflow-y:auto;padding:12px 16px 30px}
.sheet .foot{padding:12px 16px calc(12px + var(--safe-b));border-top:1px solid var(--line);display:flex;gap:10px}
.iconbtn{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--bg3);flex:none}
.wheels{display:flex;justify-content:center;align-items:center;gap:6px;position:relative;margin:4px 0 6px}
.wheel{height:186px;width:96px;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);-webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent)}
.wheel::-webkit-scrollbar{display:none}
.wheel div{height:62px;display:grid;place-items:center;font-size:50px;font-weight:300;scroll-snap-align:center;color:var(--tx3);transition:color .15s}
.wheel div.sel{color:var(--tx)}
.wheel .pad{scroll-snap-align:none}
.wheels .colon{font-size:46px;font-weight:300;color:var(--tx2);padding-bottom:6px}
.wheels::before{content:"";position:absolute;left:50%;transform:translateX(-50%);width:230px;height:62px;border-radius:16px;background:var(--bg3);z-index:-1}
.inwhen{text-align:center;color:var(--acc);font-weight:600;font-size:14px}
.days{display:flex;justify-content:space-between;gap:6px}
.days button{flex:1;aspect-ratio:1;max-width:46px;border-radius:50%;background:var(--bg3);font-weight:700;color:var(--tx2);border:1px solid var(--line)}
.days button.on{background:var(--acc);color:#2a1405;border-color:transparent}
.seg{display:flex;background:var(--bg3);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:10px 6px;border-radius:11px;font-weight:650;font-size:14px;color:var(--tx2)}
.seg button.on{background:var(--bg);color:var(--tx);box-shadow:0 2px 8px #0006}
.track{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;background:var(--bg3);border:1px solid var(--line);text-align:left;width:100%}
.cover{width:50px;height:50px;border-radius:10px;background:linear-gradient(135deg,#3b3f7a,#7a4870);flex:none;display:grid;place-items:center;overflow:hidden;color:#fff9}
.cover img{width:100%;height:100%;object-fit:cover}
.trk{display:flex;align-items:center;gap:12px;padding:9px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.trk .cover{width:44px;height:44px;border-radius:9px}
.trk.sel{background:#ffb35c14;border-radius:12px}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.line:first-child{border-top:0}

/* Météo */
.search{position:relative;margin-bottom:12px}
.search .field{padding-left:44px;padding-right:52px}
.search>.ic{position:absolute;left:14px;top:14px;color:var(--tx3)}
.search .loc{position:absolute;right:6px;top:6px;width:40px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--acc)}
.results{position:absolute;left:0;right:0;top:54px;background:var(--bg3);border:1px solid var(--line);border-radius:14px;z-index:5;overflow:hidden;box-shadow:0 16px 40px #000a}
.results button{display:block;width:100%;text-align:left;padding:12px 14px;border-top:1px solid var(--line)}
.results button:first-child{border-top:0}
.wxhero{border-radius:26px;padding:20px;background:var(--sky);border:1px solid var(--line);margin-bottom:12px;position:relative;overflow:hidden}
.wxhero .place{font-weight:700;font-size:17px;display:flex;align-items:center;gap:6px}
.wxhero .temp{font-size:84px;font-weight:250;letter-spacing:-3px;line-height:1}
.wxhero .big{width:118px;height:118px;flex:none}
.wxhero .desc{font-size:17px;font-weight:600}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cell{background:var(--bg3);border-radius:14px;padding:11px;display:flex;flex-direction:column;gap:3px}
.cell .k{font-size:11.5px;color:var(--tx3);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.cell .v{font-size:17px;font-weight:650}
.hours{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;margin:0 -4px}
.hours::-webkit-scrollbar{display:none}
.hr{flex:none;width:58px;padding:10px 0;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:5px;background:var(--bg3);font-size:13px}
.hr.now{background:linear-gradient(180deg,#ffb35c33,#ffb35c10);outline:1px solid #ffb35c66}
.hr svg{width:32px;height:32px}
.hr b{font-size:16px}
.hr .rain{color:#8ec5ff;font-size:11.5px;min-height:14px}
.day{display:grid;grid-template-columns:62px 34px 40px 36px 1fr 36px;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:14.5px}
.day:first-of-type{border-top:0}
.day svg{width:32px;height:32px}
.day .rain{color:#8ec5ff;font-size:12px}
.bar{height:6px;border-radius:6px;background:var(--bg4);position:relative}
.bar i{position:absolute;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,#7fc4ff,#ffd36b,#ff8a5c)}
.tip{display:flex;gap:10px;align-items:flex-start;padding:7px 0}
.tip .e{font-size:20px;line-height:1.2}

/* Icônes météo animées */
.wsun{animation:spin 30s linear infinite;transform-origin:32px 32px}
@keyframes spin{to{transform:rotate(360deg)}}
.wcloud{animation:drift 6s ease-in-out infinite}
@keyframes drift{50%{transform:translateX(2.5px)}}
.wdrop{animation:drop 1.2s linear infinite}
@keyframes drop{0%{transform:translateY(-3px);opacity:0}30%{opacity:1}100%{transform:translateY(7px);opacity:0}}
.wflake{animation:flake 2.6s linear infinite}
@keyframes flake{0%{transform:translateY(-3px);opacity:0}30%{opacity:1}100%{transform:translateY(8px);opacity:0}}
.wbolt{animation:bolt 3s steps(1) infinite}
@keyframes bolt{0%,72%,80%,100%{opacity:1}75%,85%{opacity:.15}}

/* Soir */
.glow{height:210px;border-radius:26px;display:grid;place-items:center;margin-bottom:12px;position:relative;overflow:hidden;background:#07080f;border:1px solid var(--line)}
.glow .orb{width:150px;height:150px;border-radius:50%;filter:blur(18px);transition:background .4s,opacity .3s}
.glow .orb.flick{animation:flick 3.2s infinite}
@keyframes flick{0%,100%{opacity:1;transform:scale(1)}20%{opacity:.86;transform:scale(.97)}35%{opacity:.95}52%{opacity:.8;transform:scale(1.02)}70%{opacity:.97}}
.glow .lab{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-weight:650;color:#fff;text-shadow:0 1px 8px #000}
.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.swatch{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--tx2)}
.swatch i{width:48px;height:48px;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 0 0 2px #0006}
.swatch.on i{border-color:#fff}
.swatch.on{color:var(--tx)}

/* Plein écran : chevet, lumière, lever de soleil, sonnerie */
.ovl{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none}
#chevet{background:#000;color:var(--cv,#ff8a3d)}
#chevet .t{font-size:clamp(90px,30vw,220px);font-weight:200;letter-spacing:-4px;line-height:1;transition:transform 1.5s}
#chevet .s{font-size:18px;opacity:.7;margin-top:10px;display:flex;gap:18px;align-items:center}
#chevet .s svg{width:26px;height:26px}
.ctl{position:absolute;left:16px;right:16px;bottom:calc(24px + var(--safe-b));background:#14162cf0;border:1px solid var(--line);border-radius:22px;padding:14px 16px;color:var(--tx);animation:up .2s}
#light{background:#000;transition:background 1s}
#light .orb{position:absolute;inset:-20%;transition:opacity 1.5s}
#light .orb.flick{animation:flick 3.2s infinite}
#light .breath{position:relative;width:200px;height:200px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:20px;font-weight:600;text-shadow:0 1px 10px #0009}
#light .breath::before{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #ffffff66;transform:scale(var(--b,.6));transition:transform var(--bd,4s) ease-in-out;background:#ffffff14}
#light .clk{position:absolute;top:calc(18px + var(--safe-t));font-size:15px;color:#ffffff99}
#dawn{background:#000;transition:background 4s linear}
#dawn .sun{position:absolute;left:50%;width:70vmin;height:70vmin;border-radius:50%;transform:translateX(-50%);filter:blur(30px);transition:all 4s linear}
#dawn .t{position:relative;font-size:72px;font-weight:200;color:#fff;text-shadow:0 2px 20px #0006}
#ring{background:linear-gradient(180deg,#1d2257 0%,#7a3f6b 45%,#f08a5d 78%,#ffd28a 100%);background-size:100% 300%;animation:sunrise 40s ease-out forwards;padding:calc(30px + var(--safe-t)) 22px calc(30px + var(--safe-b));justify-content:space-between}
@keyframes sunrise{from{background-position:0 0}to{background-position:0 100%}}
#ring .t{font-size:clamp(80px,26vw,130px);font-weight:250;letter-spacing:-3px;line-height:1;text-shadow:0 4px 30px #0004}
#ring .l{font-size:21px;font-weight:650;margin-top:8px;text-align:center}
#ring .m{color:#ffffffd0;margin-top:8px;text-align:center;font-size:15px}
#ring .wx{display:flex;align-items:center;gap:10px;background:#ffffff1f;border-radius:16px;padding:10px 16px;margin-top:20px;font-weight:600;backdrop-filter:blur(6px)}
#ring .wx svg{width:44px;height:44px}
.slide{position:relative;width:100%;max-width:420px;height:72px;border-radius:40px;background:#ffffff26;backdrop-filter:blur(8px);display:grid;place-items:center;font-weight:650;color:#fff;overflow:hidden;touch-action:none}
.slide .knob{position:absolute;left:6px;top:6px;width:60px;height:60px;border-radius:50%;background:#fff;color:#7a3f6b;display:grid;place-items:center;box-shadow:0 4px 18px #0004}
.slide .knob .ic{width:28px;height:28px;stroke-width:2.4}
.slide span{animation:shine 2.4s infinite}
@keyframes shine{50%{opacity:.5}}
.snz{width:100%;max-width:420px;padding:18px;border-radius:22px;background:#ffffffe6;color:#5b2f4f;font-weight:750;font-size:18px;margin-bottom:14px}
.hello{background:#ffffff26;border-radius:20px;padding:18px;text-align:center;max-width:420px;backdrop-filter:blur(6px)}
.webnote{font-size:12.5px;color:var(--tx3);text-align:center;margin:14px 6px 0}
</style>
</head>
<body>
<header>
  <div class="logo"><svg viewBox="0 0 64 64"><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b2f72"/><stop offset=".55" stop-color="#c2577a"/><stop offset="1" stop-color="#ffb35c"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="url(#lg)"/><circle cx="32" cy="42" r="13" fill="#ffe2a8"/><rect x="0" y="42" width="64" height="22" fill="#2a1d4d" opacity=".85"/><path d="M32 18v6M17 24l4 4M47 24l-4 4M10 37h5M49 37h5" stroke="#ffe2a8" stroke-width="3" stroke-linecap="round"/></svg>Aube</div>
  <div class="sp"></div>
  <div class="hdate" id="hdate"></div>
</header>
<main id="main"></main>
<nav id="nav">
  <button data-t="clock"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Horloge</button>
  <button data-t="alarms"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="13" r="7"/><path d="M12 10v3l2 1.5M5 4 2.5 6.5M19 4l2.5 2.5M7 19.5 5.5 21M17 19.5l1.5 1.5"/></svg>Réveils</button>
  <button data-t="wx"><svg class="ic" viewBox="0 0 24 24"><path d="M7 18h10a4 4 0 0 0 .6-7.96A6 6 0 0 0 6.2 9.1 4.5 4.5 0 0 0 7 18z"/></svg>Météo</button>

/* ============ Stockage ============ */

/* ============ Calcul des réveils ============ */
function nextRing(a, now = Date.now()) {
  if (!a || !a.on) return 0;

  const d = new Date(now); d.setHours(a.h, a.m, 0, 0);
  for (let i = 0; i < 9; i++) {

    }

  }

}
function nextAlarm() {

}

/* ============ Météo (Open-Meteo, sans clé) ============ */
const WMO = c => c === 0 ? ["Ciel dégagé", "sun"] : c === 1 ? ["Plutôt ensoleillé", "sun-c"] : c === 2 ? ["Éclaircies", "part"] : c === 3 ? ["Couvert", "cloud"]
  : c <= 48 ? ["Brouillard", "fog"] : c <= 57 ? ["Bruine", "drizzle"] : c <= 67 ? ["Pluie", "rain"] : c <= 77 ? ["Neige", "snow"]
  : c <= 82 ? ["Averses", "rain"] : c <= 86 ? ["Averses de neige", "snow"] : ["Orages", "storm"];
function wxIcon(code, day = true) {
  const k = WMO(code)[1];
  const sun = (x = 32, y = 32, r = 11, a = 1) => `<g class="wsun" style="transform-origin:${x}px ${y}px"><circle cx="${x}" cy="${y}" r="${r}" fill="#ffc94d" opacity="${a}"/>${[0, 45, 90, 135, 180, 225, 270, 315].map(t => { const c = Math.cos(t * Math.PI / 180), s = Math.sin(t * Math.PI / 180); return `<line x1="${x + c * (r + 4)}" y1="${y + s * (r + 4)}" x2="${x + c * (r + 9)}" y2="${y + s * (r + 9)}" stroke="#ffc94d" stroke-width="3" stroke-linecap="round" opacity="${a}"/>`; }).join("")}</g>`;
  const moon = (x = 34, y = 28) => `<path d="M${x + 8} ${y + 7}A12 12 0 1 1 ${x - 3} ${y - 12} 9.5 9.5 0 0 0 ${x + 8} ${y + 7}z" fill="#e8e3ff"/>`;
  const cloud = (x = 0, y = 0, f = "#eef1f8", o = 1) => `<g class="wcloud" transform="translate(${x} ${y})" opacity="${o}"><path d="M18 50h28a10 10 0 0 0 1.5-19.9A14 14 0 0 0 20.3 27 11.5 11.5 0 0 0 18 50z" fill="${f}"/></g>`;

async function getJSON(url) {

}

    + "&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,wind_gusts_10m,is_day,precipitation"
    + "&hourly=temperature_2m,weather_code,precipitation_probability,is_day"

}
async function searchPlace(q) {
  const j = await getJSON("https://geocoding-api.open-meteo.com/v1/search?count=6&language=fr&format=json&name=" + encodeURIComponent(q));
  return (j.results || []).map(r => ({ name: r.name, sub: [r.admin2 || r.admin1, r.country].filter(Boolean).join(", "), lat: +r.latitude.toFixed(3), lon: +r.longitude.toFixed(3) }));
}

  WX.place = p; WX.data = null;

function locate() {

  if (NATIVE) call("askLocation");
  toast("Recherche de votre position…");
  navigator.geolocation.getCurrentPosition(async pos => {
    const lat = +pos.coords.latitude.toFixed(3), lon = +pos.coords.longitude.toFixed(3);
    let name = "Ma position";
    try { const j = await getJSON(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=fr`); name = j.city || j.locality || name; } catch (e) { }
    setPlace({ name, sub: "Position actuelle", lat, lon }); await refreshWx(true);
  }, () => toast("Position refusée : cherchez votre ville"), { timeout: 15000, maximumAge: 600000 });
}
const todayWx = () => { const d = WX.data; if (!d || !d.daily) return null; const i = Math.max(0, d.daily.time.indexOf(ymd(new Date()))); return { i, code: d.daily.weather_code[i], max: Math.round(d.daily.temperature_2m_max[i]), min: Math.round(d.daily.temperature_2m_min[i]), rain: d.daily.precipitation_probability_max[i], rise: d.daily.sunrise[i], set: d.daily.sunset[i], uv: d.daily.uv_index_max[i], wind: d.daily.wind_speed_10m_max[i] }; };

  const d = WX.data, t = todayWx(); if (!d || !t) return [];

  else if (rmax >= 35) out.push(["🌂", `Un parapluie pliant peut servir (${rmax} % de risque d'averse).`]);

}

const STARS = (() => { let s = ""; for (let i = 0; i < 40; i++) s += `<circle cx="${(Math.sin(i * 12.9898) * 43758.5453 % 1 + 1) % 1 * 100}%" cy="${(Math.sin(i * 78.233) * 12345.678 % 1 + 1) % 1 * 70}%" r="${i % 5 ? .7 : 1.3}" fill="#fff" opacity="${.3 + (i % 4) * .17}"/>`; return `<svg class="stars" width="100%" height="100%">${s}</svg>`; })();

/* ============ Navigation ============ */

  coucher: { n: "Coucher", c: "linear-gradient(180deg,#2a1745 0%,#8a2f5e 35%,#e8613f 70%,#ffb15e 100%)", sw: "linear-gradient(180deg,#8a2f5e,#e8613f,#ffb15e)" },
  rouge: { n: "Rouge", c: "radial-gradient(circle at 50% 55%,#ff5a3c 0%,#b3200e 40%,#300400 75%,#000 95%)", sw: "radial-gradient(circle,#ff7a5c,#b3200e)" },
  lune: { n: "Lune", c: "radial-gradient(circle at 50% 40%,#8ea2ff 0%,#3a4590 35%,#0d1030 70%,#000 95%)", sw: "radial-gradient(circle,#b7c4ff,#3a4590)" },
};
function vSoir() {
  const L = LIGHTS[SOIR.color] || LIGHTS.bougie;
  const mus = SOIR.music;
  return `<div class="glow"><div class="orb ${L.flick ? "flick" : ""}" id="orb" style="background:${L.sw};opacity:${.25 + SOIR.lum * .75}"></div><div class="lab">${L.n} · ${Math.round(SOIR.lum * 100)} %</div></div>
  <div class="card"><h3>Couleur de la lumière</h3><div class="swatches">${Object.entries(LIGHTS).map(([k, v]) => `<button class="swatch ${SOIR.color === k ? "on" : ""}" data-l="${k}"><i style="background:${v.sw}"></i>${v.n}</button>`).join("")}</div>
    <div class="small dim" style="margin-top:10px">Les lumières chaudes (bougie, ambre, rouge) gênent moins l'endormissement que la lumière blanche ou bleue.</div>
    <div class="lbl">Intensité</div><input type="range" id="lum" min="0.05" max="1" step="0.05" value="${SOIR.lum}">
    <div class="lbl">S'éteint doucement en</div>
    <div class="chips" id="dur">${[15, 30, 45, 60, 90, 0].map(v => `<button class="chip ${SOIR.min === v ? "on" : ""}" data-v="${v}">${v ? v + " min" : "Veilleuse toute la nuit"}</button>`).join("")}</div>
  </div>
  <div class="card" style="padding:4px 16px">
    <div class="line"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="8" opacity=".5"/></svg><div class="grow">Respiration guidée<div class="small dim">La lumière gonfle et dégonfle (4 – 7 – 8) pendant 5 minutes</div></div><button class="sw ${SOIR.breath ? "on" : ""}" id="br"></button></div>
    <div class="line">${I.note}<div class="grow">Musique pour s'endormir<div class="small dim ell">${mus ? esc(mus.label) + (mus.sub ? " · " + esc(mus.sub) : "") : NATIVE ? "Le son baisse en même temps que la lumière" : "Choisissez un fichier audio"}</div></div>${mus ? `<button class="iconbtn" id="mx" style="background:transparent">${I.x}</button>` : ""}<button class="btn sm" id="mp">${mus ? "Changer" : "Choisir"}</button></div>
    ${mus ? `<div class="line" style="padding-top:4px"><span class="small dim" style="width:60px">Volume</span><input type="range" id="mv" min="5" max="100" step="5" value="${SOIR.vol}"></div>` : ""}
  </div>
  <button class="btn pri full" id="go" style="padding:17px;font-size:17px">${I.moon} Allumer la lumière du soir</button>
  <button class="btn full ghost" id="cv2" style="margin-top:10px">${I.bed} Mode chevet (heure discrète toute la nuit)</button>`;
}
function bSoir(m) {
  const orb = $("#orb", m), lab = $(".glow .lab", m);
  $$("[data-l]", m).forEach(b => b.onclick = () => { SOIR.color = b.dataset.l; saveSoir(); render(); });
  const lum = $("#lum", m); rangeFill(lum);
  lum.oninput = () => { SOIR.lum = +lum.value; rangeFill(lum); orb.style.opacity = .25 + SOIR.lum * .75; lab.textContent = LIGHTS[SOIR.color].n + " · " + Math.round(SOIR.lum * 100) + " %"; saveSoir(); };
  $$("#dur button", m).forEach(b => b.onclick = () => { SOIR.min = +b.dataset.v; saveSoir(); $$("#dur button", m).forEach(x => x.classList.toggle("on", x === b)); });
  $("#br", m).onclick = e => { SOIR.breath = !SOIR.breath; e.currentTarget.classList.toggle("on"); saveSoir(); };
  $("#mp", m).onclick = () => {
    if (NATIVE) pickTrack(null, r => { SOIR.music = r; saveSoir(); render(); }, true);
    else { const i = document.createElement("input"); i.type = "file"; i.accept = "audio/*"; i.onchange = async () => { const f = i.files[0]; if (!f) return; await IDB.set("soirsnd", f); SOIR.music = { file: true, label: f.name }; saveSoir(); render(); }; i.click(); }
  };
  const mx = $("#mx", m); if (mx) mx.onclick = () => { SOIR.music = null; saveSoir(); render(); };
  const mv = $("#mv", m); if (mv) { rangeFill(mv); mv.oninput = () => { SOIR.vol = +mv.value; rangeFill(mv); saveSoir(); }; }
  $("#go", m).onclick = () => startLight();
  $("#cv2", m).onclick = openChevet;
}
let LIGHT = null;
async function startLight() {
  if (LIGHT) return;
  const L = LIGHTS[SOIR.color] || LIGHTS.bougie;
  const total = SOIR.min ? SOIR.min * 60000 : 0;
  LIGHT = { start: Date.now(), end: total ? Date.now() + total : 0, lum: SOIR.lum, audio: null };
  const d = document.createElement("div"); d.className = "ovl"; d.id = "light";
  d.innerHTML = `<div class="orb ${L.flick ? "flick" : ""}" style="background:${L.c}"></div><div class="clk num" id="lc"></div>${SOIR.breath ? `<div class="breath" id="bre"><span>Inspirez</span></div>` : ""}`;
  document.body.appendChild(d);
  call("keepScreen", true); wakeLock(true);
  // Musique d'endormissement : baisse avec la lumière
  const dur = SOIR.min || 60;
  if (SOIR.music) {
    if (NATIVE && SOIR.music.ids) call("alarmCmd", "sleep", JSON.stringify({ ids: SOIR.music.ids, min: dur, vol: SOIR.vol }));
    else if (!NATIVE) { const f = await IDB.get("soirsnd"); if (f) { const el = new Audio(URL.createObjectURL(f)); el.loop = true; el.volume = SOIR.vol / 100; el.play().catch(() => { }); LIGHT.audio = el; LIGHT.audioEnd = Date.now() + dur * 60000; } }
  }
  // Respiration 4-7-8
  if (SOIR.breath) {
    const b = $("#bre", d), sp = $("span", b); let k = 0;
    const phases = [["Inspirez", 4, 1], ["Retenez", 7, 1], ["Expirez", 8, .6]];
    const run = () => { if (!LIGHT || !b.isConnected) return; if (Date.now() - LIGHT.start > 5 * 60000) { b.style.transition = "opacity 3s"; b.style.opacity = 0; setTimeout(() => b.remove(), 3000); return; }
      const [w, s, sc] = phases[k % 3]; sp.textContent = w; b.style.setProperty("--bd", s + "s"); b.style.setProperty("--b", sc); k++; LIGHT.bt = setTimeout(run, s * 1000); };
    b.style.setProperty("--b", .6); setTimeout(run, 300);
  }
  const orb = $(".orb", d);
  const step = () => {
    if (!LIGHT) return;
    const now = Date.now();
    let f = 1;
    if (LIGHT.end) { const r = (now - LIGHT.start) / (LIGHT.end - LIGHT.start); f = r < .4 ? 1 : Math.max(0, 1 - (r - .4) / .6); }
    const lum = LIGHT.lum * f;
    orb.style.opacity = Math.max(0, lum);
    call("setBright", LIGHT.end && f === 0 ? 0.004 : .004 + lum * lum * .5);
    const lc = $("#lc", d); lc.textContent = hm(new Date()) + (LIGHT.end ? " · extinction " + hm(new Date(LIGHT.end)) : "");
    lc.style.opacity = Math.max(.15, f * .7);
    if (LIGHT.audio) { const r = (now - LIGHT.start) / (LIGHT.audioEnd - LIGHT.start); LIGHT.audio.volume = Math.max(0, Math.min(1, SOIR.vol / 100 * (r < .5 ? 1 : 1 - (r - .5) * 2))); if (r >= 1) { LIGHT.audio.pause(); LIGHT.audio = null; } }
    if (LIGHT.end && now >= LIGHT.end) { goodnight(d); return; }
  };
  step(); LIGHT.iv = setInterval(step, 2000);
  d.onclick = e => {
    if (e.target.closest(".ctl")) return;
    const c = $(".ctl", d); if (c) { c.remove(); return; }
    const p = document.createElement("div"); p.className = "ctl";
    p.innerHTML = `<div class="row"><div class="grow"><b>${L.n}</b><div class="small muted">${LIGHT.end ? "S'éteint à " + hm(new Date(LIGHT.end)) : "Veilleuse toute la nuit"}</div></div>${LIGHT.end ? `<button class="btn sm" id="p15">+15 min</button>` : ""}</div>
      <div class="lbl">Intensité</div><input type="range" id="ll" min="0.05" max="1" step="0.05" value="${LIGHT.lum}">
      <button class="btn full" id="lx" style="margin-top:12px">Éteindre maintenant</button>`;
    d.appendChild(p);
    const ll = $("#ll", p); rangeFill(ll); ll.oninput = () => { LIGHT.lum = +ll.value; rangeFill(ll); step(); };
    const p15 = $("#p15", p); if (p15) p15.onclick = () => { LIGHT.end += 15 * 60000; if (LIGHT.audioEnd) LIGHT.audioEnd += 15 * 60000; p.remove(); step(); toast("Lumière prolongée de 15 minutes"); };
    $("#lx", p).onclick = () => stopLight();
  };
}
function goodnight(d) {
  clearInterval(LIGHT.iv);
  d.innerHTML = `<div style="color:#ffffff30;font-size:15px">Bonne nuit · touchez pour fermer</div>`;
  d.style.background = "#000";
  call("keepScreen", false); wakeLock(false); call("setBright", 0.004);
  d.onclick = () => stopLight();
}
function stopLight() {
  if (!LIGHT) return;
  clearInterval(LIGHT.iv); clearTimeout(LIGHT.bt);
  if (LIGHT.audio) LIGHT.audio.pause();
  if (NATIVE && SOIR.music) call("alarmCmd", "sleepStop", null);
  LIGHT = null; closeOverlay("light");
  call("keepScreen", false); call("setBright", -1); wakeLock(false);
}

/* ============ Boucle principale ============ */
let lastMin = -1;
function tick() {
  const now = Date.now(), d = new Date(now);
  if (TAB === "clock") paintClock(); else $("#hdate").innerHTML = `${JOURS[d.getDay()]}<br><b class="num">${hm(d)}</b>`;
  if (d.getMinutes() !== lastMin) {
    lastMin = d.getMinutes(); applySky();
    if (TAB === "clock") paintArc();
    const n2 = $("#nIn2"), n = nextAlarm(); if (n2 && n) n2.textContent = "dans " + inText(n.at - now);
    if (WX.place && now - WX.at > 60 * 60000) loadWx(true).catch(() => { });
  }
  if (NATIVE) pollNative(); else webSchedule(now);
}
function pollNative() {
  let st; try { st = JSON.parse(call("alarmState") || "{}"); } catch (e) { return; }
  if (st.ringing && !RING_UI && Date.now() > RING_GUARD) showRing(st);
  else if (!st.ringing && RING_UI) { hideRing(); loadNativeAlarms(); }
  if (st.dawn >= 0 && st.dawnRing > Date.now() && !document.getElementById("dawn") && !RING_UI) showDawn(st.dawnAt, st.dawnRing);
}
function webSchedule(now) {
  if (WEB.ringing) { if (now - WEB.ringing.since > 10 * 60000) { stopWebSound(); WEB.ringing = null; hideRing(); } return; }
  if (WEB.snoozeAt && now >= WEB.snoozeAt) { const a = WEB.snoozeA; WEB.snoozeAt = 0; webRing(a); return; }
  for (const a of ALARMS) {
    if (!a.on) continue;
    const key = a.id + ":" + a.h + ":" + a.m + ":" + ymd(new Date(now));
    const t = new Date(now); t.setHours(a.h, a.m, 0, 0);
    const iso = t.getDay() === 0 ? 7 : t.getDay();
    const okDay = !a.days.length || a.days.includes(iso);
    if (okDay && a.skip !== ymd(t) && a.dawn && !WEB.dawn && now >= t - a.dawn * 60000 && now < t.getTime()) { WEB.dawn = key; showDawn(t - a.dawn * 60000, t.getTime()); }
    if (okDay && a.skip !== ymd(t) && now >= t.getTime() && now - t.getTime() < 60000 && !WEB.fired[key]) {
      WEB.fired[key] = 1; WEB.dawn = null;
      if (!a.days.length) a.on = false;
      saveAlarms(); webRing(a); return;
    }
    if (a.skip && a.skip < ymd(new Date(now))) { a.skip = ""; saveAlarms(); }
  }
}

/* ============ Démarrage ============ */
(async function start() {
  if (!NATIVE) { await sleep(250); MP = window.MAGPrint; NATIVE = !!(MP && MP.alarmSave); }
  loadNativeAlarms();
  // Siestes terminées : retirées
  const before = ALARMS.length; ALARMS = ALARMS.filter(a => !(a.tmp && !a.on)); if (ALARMS.length !== before) saveAlarms();
  applySky();
  go(TAB);
  setInterval(tick, 1000); tick();
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { loadNativeAlarms(); if (!RING_UI && (TAB === "alarms" || TAB === "clock")) render(); tick(); } });
  if (WX.place) refreshWx(false);
})();
</script>
