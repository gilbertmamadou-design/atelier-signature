<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Socle</title>
<style>
:root{
  --acc:#8fb4ff;--acc-d:#10131c;--tile:rgba(14,16,24,.55);--tile-b:rgba(255,255,255,.12);
  --tx:#fff;--tx2:rgba(255,255,255,.78);--tx3:rgba(255,255,255,.58);
  --st:24px;--nb:24px;--r:20px;--sheet:#171a24;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:transparent;color:var(--tx);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
body.nobridge{background:linear-gradient(160deg,#28345a,#121624)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.sh{text-shadow:0 1px 3px rgba(0,0,0,.45)}
[hidden]{display:none!important}

/* Accueil */
/* Pages qu'on fait glisser (défilement horizontal aimanté), chaque page défile verticalement */
#home{position:fixed;inset:0;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior:none}
#home::-webkit-scrollbar,.page::-webkit-scrollbar{display:none}
#pages{display:flex;height:100%;width:100%}
.page{flex:0 0 100%;width:100%;height:100%;overflow-y:auto;overflow-x:hidden;scroll-snap-align:start;scroll-snap-stop:always;padding:calc(var(--st) + 10px) 12px calc(var(--nb) + 96px);scrollbar-width:none}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
#pages.snap{pointer-events:none}
#dots{position:fixed;left:0;right:0;bottom:calc(var(--nb) + 74px);display:flex;justify-content:center;gap:7px;z-index:4;pointer-events:none}
#dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.4);box-shadow:0 1px 3px rgba(0,0,0,.4);transition:.2s}
#dots i.on{background:#fff;width:18px;border-radius:5px}
.phd{display:none;align-items:center;gap:8px;margin:0 2px 10px;font-size:13px;font-weight:600;color:var(--tx2)}
body.edit .phd{display:flex}
.phd span{flex:1}
.phd button{padding:7px 11px;border-radius:11px;background:rgba(0,0,0,.45);font-size:12.5px;display:flex;align-items:center;gap:5px}
.phd button svg{width:15px;height:15px}
.pempty{grid-column:span 2;border:2px dashed rgba(255,255,255,.3);border-radius:var(--r);padding:28px 16px;text-align:center;color:var(--tx2);font-size:14px}
body:not(.edit) .pempty{display:none}
/* Tuiles ajoutées : appli, contact, site, rendez-vous, téléphone, météo détaillée */
.t-app,.t-link{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;text-align:center}
.t-app img,.t-app .ph{width:54px;height:54px;border-radius:15px;display:block}
.t-app .ph{background:rgba(255,255,255,.15)}
.t-app.w2,.t-link.w2{flex-direction:row;justify-content:flex-start;gap:14px;text-align:left}
.t-app .nm,.t-link .nm{font-size:13.5px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-link .dm{font-size:11.5px;color:var(--tx3);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lav{width:50px;height:50px;border-radius:15px;background:var(--acc);color:var(--acc-d);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:21px;flex:none}
.t-contact .crow2{display:flex;align-items:center;gap:10px;margin-top:2px}
.t-contact .av{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--acc);color:var(--acc-d);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.t-contact b{display:block;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-contact .num{font-size:12px;color:var(--tx3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbtns{display:flex;gap:6px;margin-top:9px}
.cbtns button{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:8px 4px;border-radius:12px;background:rgba(255,255,255,.12);font-size:12.5px;font-weight:600}
.cbtns button svg{width:16px;height:16px}
.nev .when{font-size:12.5px;color:var(--acc);font-weight:600;margin-top:6px}
.nev .ti{font-size:16px;font-weight:600;margin-top:2px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.nev .pl{font-size:12px;color:var(--tx2);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dev .lbl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--tx2);margin-top:8px}
.dev .lbl b{color:var(--tx);font-weight:600}
.dev .bar{margin-top:4px}
.wxh{display:flex;justify-content:space-between;gap:2px;margin-top:9px}
.wxh div{flex:1;text-align:center;font-size:11.5px;color:var(--tx2);min-width:0}
.wxh b{display:block;color:var(--tx);font-size:13px}
.wxh svg{width:19px;height:19px;margin:3px auto}
.wxh .rp{display:block;font-size:10.5px;color:#8fd0ff}
.wxd{display:flex;gap:6px;margin-top:9px}
.wxd div{flex:1;background:rgba(255,255,255,.08);border-radius:11px;padding:6px 4px;text-align:center;font-size:11.5px;color:var(--tx2);min-width:0}
.wxd b{color:var(--tx)}
.wxd svg{width:18px;height:18px;margin:2px auto}
.terr{font-size:12.5px;color:var(--tx3);margin-top:6px}
/* Journal */
.logl{font-size:12.5px;line-height:1.45}
.logl div{padding:8px 0;border-top:1px solid rgba(255,255,255,.08);word-break:break-word}
.logl div:first-child{border-top:0}
.logl time{display:block;color:var(--tx3);font-size:11.5px}
.logl .st{color:#6fd6a4}
.picks{max-height:52vh;overflow-y:auto;margin-top:8px}
.picks .apps4{grid-template-columns:repeat(4,minmax(0,1fr))}
.tile{position:relative;background:var(--tile);border:1px solid var(--tile-b);border-radius:var(--r);padding:13px 14px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);min-height:96px;overflow:hidden;transition:transform .15s}
.tile.w2{grid-column:span 2}
.tile:active{transform:scale(.985)}
.tile .hd{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--tx2);font-weight:600;letter-spacing:.2px}
.tile .hd svg{width:15px;height:15px}
.tile .big{font-size:30px;font-weight:600;line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums}
.tile .sub{font-size:12.5px;color:var(--tx2);margin-top:3px}
.t-clock .time{font-size:58px;font-weight:300;line-height:1;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.t-clock .date{font-size:15px;color:var(--tx2);margin-top:6px}
.t-clock .al{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--acc);margin-top:6px}
.t-clock .al svg{width:15px;height:15px}
.t-clock .crow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.t-clock .cwx{display:flex;flex-direction:column;align-items:flex-end;gap:2px;padding:4px 2px 4px 8px;min-width:0;max-width:48%;text-align:right;border-radius:14px}
.t-clock .cwx .tp{display:flex;align-items:center;gap:6px;font-size:30px;font-weight:300;line-height:1}
.t-clock .cwx .tp svg{width:30px;height:30px}
.t-clock .cwx .pl{display:flex;align-items:center;gap:3px;font-size:12.5px;color:var(--tx2);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-clock .cwx .pl svg{width:12px;height:12px;flex:none}
.t-clock .cwx .ds{font-size:12px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.t-clock .cwx.ask{font-size:13px;color:var(--acc);flex-direction:row;align-items:center;gap:5px;margin-top:10px}
.t-clock .cwx.ask svg{width:15px;height:15px}
.t-clock:not(.w2) .time{font-size:46px}
.t-clock:not(.w2) .crow{flex-direction:column;gap:6px}
.t-clock:not(.w2) .cwx{align-items:flex-start;text-align:left;max-width:100%;padding:0}
.t-clock:not(.w2) .cwx .tp{font-size:24px}
.t-clock:not(.w2) .cwx .tp svg{width:24px;height:24px}
.t-clock:not(.w2) .cwx.ask{margin-top:0}
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.18);margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:var(--acc)}
.ev{display:flex;gap:8px;margin-top:7px;font-size:13px;align-items:flex-start}
.ev b{font-weight:600;min-width:42px;color:var(--acc);font-variant-numeric:tabular-nums}
.ev span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.ev .c{width:3px;align-self:stretch;border-radius:3px;flex:none}
.mini{display:inline-flex;align-items:center;gap:6px;margin-top:9px;padding:7px 11px;border-radius:12px;background:rgba(255,255,255,.14);font-size:12.5px;font-weight:600}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.tools button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--tx2);padding:7px 0;border-radius:12px;background:rgba(255,255,255,.08)}
.tools button svg{width:22px;height:22px;color:var(--tx)}
.tools button.on{background:var(--acc);color:var(--acc-d)}
.tools button.on svg{color:var(--acc-d)}
.apps4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 4px;margin-top:6px}
.app{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;padding:4px 0;border-radius:14px}
.app:active{background:rgba(255,255,255,.1)}
.app img,.app .ph{width:50px;height:50px;border-radius:14px;display:block}
.app .ph{background:rgba(255,255,255,.15)}
.app span{font-size:11.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tx)}
.mus{display:flex;gap:12px;align-items:center;margin-top:8px}
.mus .art{width:62px;height:62px;border-radius:14px;object-fit:cover;background:rgba(255,255,255,.12);flex:none;display:flex;align-items:center;justify-content:center}
.mus .art svg{width:26px;height:26px;color:var(--tx2)}
.mus .tt{flex:1;min-width:0}
.mus .tt b{display:block;font-size:15.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mus .tt span{display:block;font-size:12.5px;color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mctl{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:10px}
.mctl button{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.1)}
.mctl button.pp{width:52px;height:52px;background:var(--acc);color:var(--acc-d)}
.mctl button.pp svg{fill:currentColor}
.mctl button[disabled]{opacity:.35}
.mbar{height:4px;border-radius:4px;background:rgba(255,255,255,.18);margin-top:10px;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--acc)}
.mtm{display:flex;justify-content:space-between;font-size:11px;color:var(--tx3);margin-top:3px;font-variant-numeric:tabular-nums}
.tile.h2{min-height:250px}
.hdr{display:flex;align-items:center;gap:6px}
.hdr .hd{flex:1}
.hbtn{width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;flex:none}
.hbtn svg{width:17px;height:17px}
.pgrid{display:grid;gap:5px;margin-top:9px}
.pgrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block;background:rgba(255,255,255,.1)}
.cgrid{display:grid;gap:8px 4px;margin-top:9px}
.cav{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.cav .av{width:48px;height:48px;border-radius:50%;object-fit:cover;background:var(--acc);color:var(--acc-d);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
.cav span{font-size:11.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nt{background:rgba(255,255,255,.08);border-radius:12px;padding:8px 10px;margin-top:7px;font-size:13px;line-height:1.35;overflow:hidden;text-align:left;width:100%;display:block}
.nt b{display:block;font-weight:600;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nt .tx{color:var(--tx2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.nt .li{display:flex;gap:5px;align-items:center;color:var(--tx2)}
.nt .li svg{width:14px;height:14px}
.nt .li.c{text-decoration:line-through;opacity:.6}
.wallp{display:flex;gap:12px;align-items:center;margin-top:9px}
.ld{display:flex;gap:10px;align-items:center;width:100%;text-align:left;margin-top:8px;border-radius:12px;min-height:50px}
.ld:active{background:rgba(255,255,255,.08)}
.ld img,.ld .ph3{width:36px;height:48px;border-radius:5px;object-fit:cover;object-position:top;background:#fff;flex:none;display:flex;align-items:center;justify-content:center;color:#8b90a0}
.ld .tt{flex:1;min-width:0}
.ld .tt b{display:block;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ld .tt span{display:block;font-size:12px;color:var(--tx2)}
.ld .mbar{margin-top:5px;height:3px}
.an{display:block;width:100%;text-align:left;padding:6px 0;border-top:1px solid rgba(255,255,255,.1);border-radius:0}
.an:first-of-type{border-top:0}
.an:active{background:rgba(255,255,255,.08)}
.an b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13.5px;font-weight:600;line-height:1.28}
.an span{display:block;font-size:11.5px;color:var(--tx2);margin-top:1px}
.avig{display:flex;align-items:center;gap:6px;width:100%;text-align:left;margin-top:7px;padding:5px 9px;border-radius:10px;font-size:12.5px;font-weight:700;color:#1a1300}
.wallp img,.wallp .ph2{width:58px;aspect-ratio:9/19;border-radius:9px;object-fit:cover;background:rgba(255,255,255,.12);flex:none}
.calcin{width:100%;background:rgba(255,255,255,.1);border:0;outline:0;border-radius:12px;padding:10px 12px;margin-top:9px;font-size:17px;font-variant-numeric:tabular-nums}
.calcres{font-size:24px;font-weight:600;margin-top:6px;text-align:right;font-variant-numeric:tabular-nums;min-height:30px}
.t-note textarea{width:100%;min-height:70px;background:transparent;border:0;outline:0;resize:none;margin-top:6px;font-size:14px;color:var(--tx)}
.empty{font-size:12.5px;color:var(--tx3);margin-top:8px}

/* Barre de recherche */
#dock{position:fixed;left:12px;right:12px;bottom:calc(var(--nb) + 10px);z-index:5}
#searchBar{display:flex;align-items:center;gap:10px;background:var(--tile);border:1px solid var(--tile-b);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:99px;padding:12px 16px;color:var(--tx2);width:100%;text-align:left}
#searchBar .sp{flex:1}
.hint{text-align:center;font-size:11px;color:var(--tx3);margin-top:6px}

/* Mode édition */
body.edit .tile{animation:wig .35s ease-in-out infinite alternate;outline:2px dashed rgba(255,255,255,.35);outline-offset:-2px;min-height:96px}
body.edit .tile>*:not(.ed){pointer-events:none;opacity:.55}
@keyframes wig{from{transform:rotate(-.4deg)}to{transform:rotate(.4deg)}}
.ed{display:none;position:absolute;inset:auto 8px 8px 8px;gap:6px;justify-content:center;z-index:2}
body.edit .ed{display:flex}
.ed button{width:38px;height:34px;border-radius:11px;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center}
.ed button.x{background:#ff6b6bcc}
#editBar{position:fixed;left:12px;right:12px;bottom:calc(var(--nb) + 10px);display:none;gap:8px;z-index:6}
body.edit #editBar{display:flex}
body.edit #dock{display:none}
.pbtn{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:13px;border-radius:15px;background:var(--sheet);border:1px solid var(--tile-b);font-weight:600}
.pbtn.main{background:var(--acc);color:var(--acc-d);border:0}

/* Tiroir */
#drawer{position:fixed;inset:0;z-index:10;background:rgba(10,12,18,.82);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-top:calc(var(--st) + 8px)}
#drawer.on{transform:none}
.sbox{display:flex;align-items:center;gap:10px;margin:0 12px;background:rgba(255,255,255,.1);border-radius:99px;padding:11px 16px}
.sbox input{flex:1;background:transparent;border:0;outline:0;font-size:16px;min-width:0}
.sbox input::placeholder{color:var(--tx3)}
#chips{display:flex;gap:7px;overflow-x:auto;padding:12px 12px 6px;scrollbar-width:none;flex:none}
#chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:7px 13px;border-radius:99px;background:rgba(255,255,255,.08);font-size:13px;font-weight:600;color:var(--tx2)}
.chip.on{background:var(--acc);color:var(--acc-d)}
#dlist{flex:1;overflow-y:auto;padding:6px 10px calc(var(--nb) + 20px)}
#dlist .apps4{gap:14px 4px}
.res{display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:14px;background:rgba(255,255,255,.06);margin:6px 2px}
.res .ico{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;flex:none}
.res .t{flex:1;min-width:0}
.res .t div:first-child{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .t div+div{font-size:12.5px;color:var(--tx3)}
.res .act{width:40px;height:40px;border-radius:12px;background:var(--acc);color:var(--acc-d);display:flex;align-items:center;justify-content:center;flex:none}
.sect{font-size:12px;color:var(--tx3);font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin:14px 6px 4px}

/* Feuilles (menus du bas) */
#veil{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
#veil.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--sheet);border-radius:24px 24px 0 0;padding:10px 16px calc(var(--nb) + 18px);max-height:86vh;overflow-y:auto;transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
#sheet.on{transform:none}
#sheet .grab{width:40px;height:4px;border-radius:4px;background:rgba(255,255,255,.25);margin:0 auto 12px}
#sheet h2{font-size:18px;margin:2px 0 12px}
.row{display:flex;align-items:center;gap:12px;padding:12px 2px;border-top:1px solid rgba(255,255,255,.08)}
.row:first-of-type{border-top:0}
.row .t{flex:1;min-width:0}
.row .t div+div{font-size:12.5px;color:var(--tx3);margin-top:2px}
.row .ok{color:#6fd6a4;font-size:13px;font-weight:600}
.sbtn{padding:9px 14px;border-radius:12px;background:var(--acc);color:var(--acc-d);font-weight:600;font-size:13.5px;flex:none}
.sbtn.ghost{background:rgba(255,255,255,.1);color:var(--tx)}
.menu button{display:flex;align-items:center;gap:14px;width:100%;padding:14px 4px;font-size:15.5px;border-top:1px solid rgba(255,255,255,.07)}
.menu button:first-child{border-top:0}
.menu button.bad{color:#ff8a8a}
.seg{display:flex;background:rgba(255,255,255,.08);border-radius:12px;padding:3px;gap:3px;margin-top:8px}
.seg button{flex:1;padding:8px 4px;border-radius:9px;font-size:13px;font-weight:600;color:var(--tx2)}
.seg button.on{background:rgba(255,255,255,.16);color:var(--tx)}
.sw{position:relative;width:46px;height:28px;flex:none}
.sw input{opacity:0;position:absolute;inset:0;margin:0;z-index:1}
.sw span{position:absolute;inset:0;border-radius:99px;background:rgba(255,255,255,.18);transition:.2s}
.sw span:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#d6d9e2;transition:.2s}
.sw input:checked+span{background:var(--acc)}
.sw input:checked+span:after{transform:translateX(18px);background:#fff}
input[type=range]{width:100%;accent-color:var(--acc)}
.inp{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:11px 13px;outline:0}
.palette{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.palette button{width:34px;height:34px;border-radius:50%;border:2px solid transparent}
.palette button.on{border-color:#fff}
.day{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid rgba(255,255,255,.08)}
.day:first-of-type{border-top:0}
.day .n{width:76px;text-transform:capitalize;font-weight:600}
.day .w{flex:1;color:var(--tx2);font-size:13.5px}
.day .tt{font-variant-numeric:tabular-nums;font-weight:600}
.hours{display:flex;gap:4px;align-items:flex-end;height:70px;margin-top:10px}
.hours div{flex:1;background:var(--acc);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
.hl{display:flex;justify-content:space-between;font-size:11px;color:var(--tx3);margin-top:4px}
.compass{width:230px;height:230px;margin:10px auto;position:relative}
.compass .dial{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,255,255,.25);transition:transform .15s linear}
.compass .dial span{position:absolute;left:50%;top:6px;transform:translateX(-50%);font-weight:700}
.compass .needle{position:absolute;left:50%;top:14px;width:4px;height:60px;margin-left:-2px;background:#ff6b6b;border-radius:4px}
.cdeg{text-align:center;font-size:34px;font-weight:600;font-variant-numeric:tabular-nums}
.level{width:240px;height:240px;margin:10px auto;border-radius:50%;border:2px solid rgba(255,255,255,.25);position:relative}
.level:before,.level:after{content:"";position:absolute;background:rgba(255,255,255,.2)}
.level:before{left:50%;top:0;bottom:0;width:1px}
.level:after{top:50%;left:0;right:0;height:1px}
.level .ring{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;border:2px solid rgba(255,255,255,.45)}
.level .bub{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:var(--acc);transition:transform .08s linear}
.level.flat .bub{background:#6fd6a4}
#toast{position:fixed;left:16px;right:16px;bottom:calc(var(--nb) + 84px);background:#262b3a;border:1px solid rgba(255,255,255,.14);padding:12px 14px;border-radius:14px;font-size:14px;z-index:40;transform:translateY(30px);opacity:0;transition:.22s;pointer-events:none}
#toast.on{transform:none;opacity:1}
</style>

/* Instantané : la dernière image de l'accueil (enregistrée en quittant l'écran) s'affiche tout de suite,
   pendant que le reste de la page se prépare. Aucune donnée n'est lue ici, seulement du HTML déjà rendu. */
(function(){
  try{
    var s=JSON.parse(localStorage.getItem('socle-snap')||'null');
    if(!s || !s.h || Math.abs((s.w||0)-window.innerWidth)>2) return;
    if(s.css) document.documentElement.setAttribute('style', s.css);
    var p=document.getElementById('pages'); p.innerHTML=s.h; p.classList.add('snap');
    var d=new Date(), t=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
    var tm=p.querySelector('.t-clock .time'); if(tm) tm.textContent=t;
    window.__snap=1;
  }catch(e){}
})();
</script>

function cleanTile(t){
  if(!t || typeof t!=='object' || !TYPES[t.t]) return null;
  t.w = t.w===2 ? 2 : 1; t.h = t.h===2 ? 2 : 0;
  if(t.t==='app' && typeof t.k!=='string') return null;
  if(t.t==='contact' && !t.uri && !t.num) return null;
  if(t.t==='link' && !/^https?:\/\//i.test(String(t.url||''))) return null;

function cleanPages(c){
  var pg = Array.isArray(c.pages) ? c.pages : (Array.isArray(c.tiles) ? [c.tiles] : null);
  if(!pg) return null;
  pg = pg.filter(Array.isArray).slice(0,9).map(function(p){ return p.map(cleanTile).filter(Boolean).slice(0,40); });

var BATK='socle-batt';
function batInfo(){ return A ? J(A.homeBattery(), {level:-1}) : {level:-1}; }
function batEstimate(b){
  var s=J(localStorage.getItem(BATK), []), now=Date.now();
  if(b.plugged){ if(s.length) localStorage.setItem(BATK,'[]'); return b.chargeLeft>0 ? 'Pleine dans '+dur(b.chargeLeft) : b.full ? 'Chargée' : 'En charge'; }
  if(!s.length || now-s[s.length-1].t > 5*60000 || s[s.length-1].l!==b.level){ s.push({t:now,l:b.level}); }
  s = s.filter(function(x){ return now-x.t < 8*3600000; });
  localStorage.setItem(BATK, JSON.stringify(s));
  var f=s[0];
  if(f && now-f.t > 45*60000 && f.l-b.level >= 2){
    var perMs=(f.l-b.level)/(now-f.t); return '≈ '+dur(b.level/perMs)+' restant';

}
function dur(ms){ var h=ms/3600000; if(h>=48) return Math.round(h/24)+' jours'; if(h>=24) return '1 jour '+Math.round(h-24)+' h'; if(h>=1) return Math.floor(h)+' h '+String(Math.round((h%1)*60)).padStart(2,'0'); return Math.max(1,Math.round(h*60))+' min'; }

}

/* Mélodie : son lecteur tourne-t-il vraiment ? (si Android l'a arrêté, l'état publié est périmé) */

function melWake(cmd){

/* Repli sans l'accès « Socle : musique » : Mélodie et Ondes publient elles-mêmes le morceau en cours */
function mediaFromApps(m){
  if(!A.homeWidget) return m;
  var best=null, now=Date.now();
  [['fr.magformation13.musique','Mélodie'],['fr.magformation13.ondes','Ondes']].forEach(function(x){
    var pa=findApp(function(a){ return a.pkg===x[0]; }); if(!pa) return;
    var d=J(A.homeWidget(x[0]),null); if(!d) return;
    var t=d.music || (d.ep ? {title:d.ep.title, artist:d.ep.sub, album:'', dur:(d.ep.dur||0)*1000, pos:(d.ep.pos||0)*1000, playing:d.ep.playing, at:d.ep.at||d.at, art:d.ep.art} : null);
    if(!t || !t.title) return;
    if(t.playing && x[0]===MELP && !melAlive()) t=Object.assign({},t,{playing:false});
    var at=t.at||d.at||0; if(!t.playing && now-at>6*3600000) return;
    var score=(t.playing?1e13:0)+at;
    if(!best || score>best.score) best={score:score, pkg:x[0], app:x[1], t:t, at:at};
  });
  if(!best) return m;
  var t=best.t, pos=t.pos||0; if(t.playing && best.at) pos+=now-best.at;
  return {access:m.access, fromApp:true, pkg:best.pkg, app:best.app, title:t.title, artist:t.artist||'', album:t.album||'', dur:t.dur||0, pos:Math.min(pos,t.dur||pos), speed:1, playing:!!t.playing, canPrev:best.pkg!=='fr.magformation13.ondes', canNext:best.pkg!=='fr.magformation13.ondes', artKey:'app:'+best.pkg+':'+t.title, art:t.art||''};
}

/* Réseau */
var RES='fr.magformation13.reseau', WGP='com.wireguard.android';
var SECK={0:'open',1:'wep',2:'psk',3:'eap',4:'sae',5:'eap',6:'owe',7:'psk',8:'eap',9:'eap',10:'eap',11:'eap',12:'eap',13:'sae'};
/* VPN : état en direct (MAGPrint.homeVpn) si possible, sinon ce que Réseau a publié (vpn, wifiSec) */
function resVpn(d){
  var lv=A&&A.homeVpn?J(A.homeVpn(),null):null;
  var vpn=lv&&lv.vpn!=null?!!lv.vpn:!!d.vpn;
  var wifi=lv&&lv.wifi!=null?!!lv.wifi:d.type==='wifi';
  var sec=!wifi?'':(lv&&lv.sec!=null&&SECK[lv.sec])?SECK[lv.sec]:(d.type==='wifi'?(d.wifiSec||''):'');
  return {vpn:vpn, sec:sec, open:!vpn&&(sec==='open'||sec==='wep')};
}
function reseauHtml(cfg){
  var hd='<div class="hd">'+ic('web')+'Réseau</div>'; if(!app(RES)) return hd+missing('Réseau');
  var d=wd(RES)||{}, q=Math.max(0,Math.min(4,d.quality||0)), w2=cfg.w===2;
  var bars='<span style="display:inline-flex;gap:2px;align-items:flex-end;height:16px;margin-left:6px;flex:none">'+[1,2,3,4].map(function(i){ return '<i style="display:block;width:4px;height:'+(4+i*3)+'px;border-radius:2px;background:'+(i<=q?'var(--acc)':'rgba(255,255,255,.25)')+'"></i>'; }).join('')+'</span>';
  var vb=w2?' <button class="mini" data-act="res-vpn">'+ic('shield')+'VPN</button>':'';
  if(!d.type) return hd+'<div class="empty">Ouvre Réseau une fois pour l\'afficher ici</div><button class="mini" data-act="res-speed">'+ic('bolt')+'Tester</button>'+vb;
  var v=resVpn(d), lab=v.vpn?'VPN':v.sec==='wep'?'Wifi WEP':'Wifi ouvert';
  var sh=v.vpn||v.open?'<span title="'+lab+'" style="display:inline-flex;align-items:center;gap:3px;margin-left:7px;flex:none;font-size:11.5px;font-weight:700;color:'+(v.vpn?'#6fd6a4':'#ffb35c')+'">'+ic('shield',' style="width:16px;height:16px"')+(w2?lab:'')+'</span>':'';
  var name=d.type==='none'?'Hors ligne':(d.type==='mobile'?(d.name||'Mobile')+(d.gen?' · '+d.gen:''):(d.name||'Wifi'));
  var l=d.last;

/* Prochain rendez-vous de l'agenda (autorisation Agenda d'Android, déjà demandée pour la tuile Agenda) */
function evWhen(e){
  var now=Date.now(), d=new Date(e.begin);
  if(e.all){ d=new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()); var dl=dayLabel(d.getTime()); return dl.charAt(0).toUpperCase()+dl.slice(1)+' · toute la journée'; }
  if(e.begin<=now) return 'En cours · jusqu\'à '+hm(e.end);
  var m=Math.round((e.begin-now)/60000);
  if(m<60) return 'Dans '+Math.max(1,m)+' min';
  var dl2=dayLabel(e.begin); return dl2.charAt(0).toUpperCase()+dl2.slice(1)+' à '+hm(e.begin);
}

/* Météo détaillée : les prochaines heures et les jours suivants (même source que la météo de l'horloge) */

}

/* ---------- Gestes ---------- */
var tStart=null, longT=null, longFired=false, lastTap=0;
home.addEventListener('touchstart', function(e){
  var t=e.touches[0]; tStart={x:t.clientX,y:t.clientY,s:curPage().scrollTop,tm:Date.now(),target:e.target,moved:false};
  clearTimeout(longT);
  if(!document.body.classList.contains('edit')){
    longT=setTimeout(function(){
      if(!tStart || tStart.moved) return;
      var ap=tStart.target.closest && tStart.target.closest('[data-app]');
      longFired=true;
      if(ap){ var a=byKey(ap.dataset.app); if(a) appMenu(a, true); }
      else startEdit();
      if(navigator.vibrate) navigator.vibrate(18);
    }, 550);
  }
}, {passive:true});
home.addEventListener('touchmove', function(e){
  if(!tStart) return; var t=e.touches[0];
  if(Math.abs(t.clientX-tStart.x)>10 || Math.abs(t.clientY-tStart.y)>10){ tStart.moved=true; clearTimeout(longT); }
}, {passive:true});
home.addEventListener('touchend', function(e){
  clearTimeout(longT);
  if(!tStart) return;
  var t=e.changedTouches[0], dx=t.clientX-tStart.x, dy=t.clientY-tStart.y, s=tStart; tStart=null;
  if(longFired){ setTimeout(function(){ longFired=false; }, 400); return; }
  if(document.body.classList.contains('edit')) return;
  if(Math.abs(dy)>70 && Math.abs(dx)<80 && Date.now()-s.tm<600){
    var pg=curPage(), atBottom = pg.scrollTop + pg.clientHeight >= pg.scrollHeight - 4;
    if(dy<0 && atBottom && s.s===pg.scrollTop){ openDrawer(); return; }
    if(dy>0 && s.s<=0 && C.gestures){ if(A && !A.homeNotif(false)) gestureHelp(); return; }
  }
  if(!s.moved && C.gestures && !(s.target.closest && s.target.closest('.tile,button,textarea'))){
    var now=Date.now();
    if(now-lastTap<320){ lastTap=0; if(A && !A.homeLock()) gestureHelp(); }
    else lastTap=now;
  }
}, {passive:true});
var dockY=null;
$('dock').addEventListener('touchstart', function(e){ dockY=e.touches[0].clientY; }, {passive:true});

function calcExpr(q){
  var s=q.replace(/×|x/gi,'*').replace(/÷/g,'/').replace(/,/g,'.').replace(/\s/g,'');
  if(!/^[\d.+\-*/()%^]+$/.test(s) || !/\d[+\-*/%^]/.test(s)) return null;
  s=s.replace(/\^/g,'**').replace(/(\d+(?:\.\d+)?)%/g,'($1/100)');
  try{ var v=Function('"use strict";return ('+s+')')(); if(typeof v!=='number'||!isFinite(v)) return null; return '= '+(Math.round(v*1e8)/1e8).toLocaleString('fr-FR',{maximumFractionDigits:8}); }catch(e){ return null; }
}

/* Boussole */
var compH=null, compSmooth=null;
function compassSheet(){
  openSheet('<h2>Boussole</h2><div class="compass"><div class="dial" id="dial"><span>N</span><span style="top:auto;bottom:6px">S</span><span style="left:auto;right:10px;top:50%;transform:translateY(-50%)">E</span><span style="left:10px;top:50%;transform:translateY(-50%)">O</span></div><div class="needle"></div></div><div class="cdeg" id="cdeg">—</div><div class="empty" style="text-align:center">Tiens le téléphone à plat, loin des objets métalliques. Si l\'aiguille dérive, fais un 8 dans l\'air avec le téléphone.</div>','compass');
  compH=function(e){
    var h=null;
    if(e.webkitCompassHeading!=null) h=e.webkitCompassHeading;
    else if(e.absolute!==false && e.alpha!=null) h=360-e.alpha;
    if(h==null) return;
    if(compSmooth==null) compSmooth=h; else { var d=((h-compSmooth+540)%360)-180; compSmooth=(compSmooth+d*0.25+360)%360; }
    var deg=Math.round(compSmooth)%360, dirs=['N','NE','E','SE','S','SO','O','NO'];
    $('dial').style.transform='rotate('+(-compSmooth)+'deg)';
    $('cdeg').textContent=deg+'° '+dirs[Math.round(deg/45)%8];
  };
  window.addEventListener('deviceorientationabsolute', compH);
  window.addEventListener('deviceorientation', compH);
}
function stopCompass(){ window.removeEventListener('deviceorientationabsolute', compH); window.removeEventListener('deviceorientation', compH); compSmooth=null; }

/* Niveau à bulle */
var levH=null;
function levelSheet(){
  openSheet('<h2>Niveau à bulle</h2><div class="level" id="lev"><div class="ring"></div><div class="bub" id="bub"></div></div><div class="cdeg" id="ldeg">—</div><div class="empty" style="text-align:center">À plat : bulle au centre. Sur la tranche : lis l\'angle affiché.</div>','level');
  levH=function(e){
    if(e.beta==null) return;
    var b=e.beta, g=e.gamma, flat=Math.abs(b)<45 && Math.abs(g)<45;
    var x=Math.max(-95,Math.min(95,-g*4)), y=Math.max(-95,Math.min(95,-b*4));
    if(flat){ $('bub').style.transform='translate('+x+'px,'+y+'px)'; var tilt=Math.sqrt(b*b+g*g); $('ldeg').textContent=tilt.toFixed(1).replace('.',',')+'°'; $('lev').classList.toggle('flat', tilt<1); }
    else { var a=Math.abs(b)>Math.abs(g)? 90-Math.abs(b) : 90-Math.abs(g); $('bub').style.transform='translate(0,0)'; $('ldeg').textContent=Math.abs(a).toFixed(1).replace('.',',')+'° (sur la tranche)'; $('lev').classList.toggle('flat', Math.abs(a)<1); }
  };
  window.addEventListener('deviceorientation', levH);
}
function stopLevel(){ window.removeEventListener('deviceorientation', levH); }

   '<div class="sect" style="margin-left:0">Couleur</div><div class="palette">'+PAL.map(function(c){ return '<button data-c="'+c+'" class="'+(C.accent===c?'on':'')+'" style="background:'+(c==='auto'?'conic-gradient(#8fb4ff,#ff9a8a,#ffc46b,#7fe0c4,#8fb4ff)':c)+'" aria-label="'+(c==='auto'?'Couleur du fond d\'écran':c)+'"></button>'; }).join('')+'</div><div class="empty">Le premier cercle suit les couleurs de ton fond d\'écran Toile.</div>'+
   '<div class="sect" style="margin-left:0">Opacité des tuiles <span id="opV">'+C.opacity+' %</span></div><input type="range" min="20" max="90" step="5" id="sOp" value="'+C.opacity+'">'+
   '<div class="sect" style="margin-left:0">Colonnes dans la liste des applis</div><div class="seg" id="sCols">'+[4,5].map(function(n){ return '<button data-n="'+n+'" class="'+(C.cols===n?'on':'')+'">'+n+'</button>'; }).join('')+'</div>'+
   (C.hidden.length?'<div class="sect" style="margin-left:0">Applis masquées</div>'+C.hidden.map(byKey).filter(Boolean).map(function(a){ return '<div class="row"><div class="t"><div>'+esc(a.label)+'</div></div><button class="sbtn ghost" data-unhide="'+esc(a.key)+'">Afficher</button></div>'; }).join(''):'')+
   '<div class="menu" style="margin-top:14px"><button data-s="edit">'+ic('grid')+'Modifier l\'écran (pages, tuiles, panneaux)</button><button data-s="log">'+ic('list')+'Journal et démarrage</button><button data-s="wall">'+ic('star')+'Changer de fond d\'écran</button><button data-s="sys">'+ic('tool')+'Paramètres du téléphone</button><button data-s="reset" class="bad">'+ic('trash')+'Remettre la disposition d\'origine</button></div>';
  openSheet(h,'settings');
  $('sGest').onchange=function(){ C.gestures=this.checked; save(); };
  $('sBar').onchange=function(){ C.hideBar=this.checked; save(); applyBar(); if(A && A.homeStatusBar) A.homeStatusBar(C.hideBar); };
  $('sMag').onchange=function(){ C.preferMag=this.checked; save(); if(C.preferMag){ C.magSeen=[]; magMigrate(); render(); } };
  $('sRep').onchange=function(){ C.hideReplaced=this.checked; save(); };
  $('sOp').oninput=function(){ C.opacity=+this.value; $('opV').textContent=C.opacity+' %'; theme(); save(); };
  $('sbody').onclick=function(e){
    var c=e.target.closest('[data-c]'); if(c){ C.accent=c.dataset.c; save(); theme(); settingsSheet(); return; }
    var n=e.target.closest('[data-n]'); if(n){ C.cols=+n.dataset.n; save(); settingsSheet(); return; }
    var u=e.target.closest('[data-unhide]'); if(u){ C.hidden.splice(C.hidden.indexOf(u.dataset.unhide),1); save(); settingsSheet(); return; }
    var s=e.target.closest('[data-s]'); if(!s) return; var k=s.dataset.s;
    if(k==='home') A.homeOpen('home','');
    if(k==='a11y') gestureHelp();
    if(k==='calendar'||k==='contacts') A.homeAsk(k);
    if(k==='edit'){ closeSheet(); startEdit(); }
    if(k==='log'){ logSheet(); return; }
    if(k==='wall'){ var t=findApp(function(a){ return a.pkg==='fr.magformation13.toile'; }); closeSheet(); if(t) launch(t); else A.homeOpen('wallpaper',''); }
    if(k==='sys') A.homeOpen('settings','');
    if(k==='reset'){ C.pages=[clone(DEF.tiles)]; save(); render(); goPage(0); closeSheet(); toast('Disposition d\'origine remise'); }
  };
}
/* Journal : erreurs rattrapées, redémarrages de l'affichage, temps de démarrage */
function logSheet(){
  var l=readLog().slice().reverse(), st=l.filter(function(x){ return x.k==='start'; })[0];
  var h='<h2>Journal de Socle</h2>'+(st?'<div class="row"><div class="t"><div>Dernier démarrage</div><div>'+esc(st.m)+'</div></div></div>':'')+
    '<div class="logl">'+(l.length?l.slice(0,80).map(function(x){ return '<div'+(x.k==='start'?' class="st"':'')+'><time>'+new Date(x.t).toLocaleString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',second:'2-digit'})+'</time>'+esc(x.m)+'</div>'; }).join(''):'<div>Aucune erreur enregistrée.</div>')+'</div>'+
    '<div style="display:flex;gap:8px;margin-top:16px"><button class="pbtn" id="lgB">Retour</button><button class="pbtn" id="lgC">Effacer</button></div>';
  openSheet(h,'log');
  $('lgB').onclick=settingsSheet;
  $('lgC').onclick=function(){ try{ if(S && S.logClear) S.logClear(); }catch(e){} lsSet(LOGK,'[]'); logN=0; logSheet(); };
}
function gestureHelp(){
  openSheet('<h2>Activer les gestes</h2><div class="empty" style="font-size:14px;color:var(--tx2);line-height:1.55">Pour verrouiller l\'écran (double appui ou tuile) et afficher le menu Éteindre, Android demande d\'activer le service <b>Socle : gestes</b>. Il ne lit jamais le contenu de l\'écran.<br><br>1. Touche <b>Ouvrir l\'accessibilité</b>, puis <b>Applications installées</b> (ou Services téléchargés) › <b>Socle : gestes</b> › activer.<br><br>2. Si l\'option est grisée (« paramètre restreint ») : touche <b>Infos de l\'appli</b>, puis le menu <b>⋮</b> en haut à droite › <b>Autoriser les paramètres restreints</b>, et recommence l\'étape 1.</div><div style="display:flex;gap:8px;margin-top:16px"><button class="pbtn main" id="gA">Ouvrir l\'accessibilité</button><button class="pbtn" id="gI">Infos de l\'appli</button></div>','gest');
  $('gA').onclick=function(){ A&&A.homeOpen('a11y',''); };
  $('gI').onclick=function(){ A&&A.homeOpen('appinfo',''); };
}
$('sbody').addEventListener('click', safe(function(e){
  var b=e.target.closest('[data-add]'); if(!b) return;
  var k=b.dataset.add;
  if(k==='app'){ appPicker(); return; }
  if(k==='contact'){ contactPicker(); return; }
  if(k==='link'){ linkForm(); return; }
  var cfg={t:k,w:TYPES[k].w}; if(k==='note') cfg.nid=newId();
  addTile(cfg);
}, 'Ajouter'));

/* ---------- Événements Android ---------- */
window.accueilBack=safe(function(){
  if(sheetType){ closeSheet(); return; }
  if($('drawer').classList.contains('on')){ closeDrawer(); return; }
  if(document.body.classList.contains('edit')){ endEdit(); return; }
  if(CP>0) goPage(0, true);
},'Retour');
window.accueilHome=safe(function(){ closeSheet(); closeDrawer(); endEdit(); if(CP>0) goPage(0, true); else curPage().scrollTo({top:0,behavior:'smooth'}); },'Accueil');
window.accueilColors=safe(function(){ theme(); },'Couleurs');
window.accueilPerms=safe(function(){
  render(); if(sheetType==='settings') settingsSheet();
  if($('drawer').classList.contains('on')) renderList();
  if(pendingLocate){ pendingLocate=false; var p=J(A.homePerms(),{}); if(p.location) locateMe(); else toast('Choisis une ville à la place'); }
},'Autorisations');
/* Liste des applis : relue seulement si Android signale une installation / désinstallation (ou toutes les 10 min) */
var lastAppsSig='', lastResume=0, appsVer=-2, appsAt=0, booted=false;
function checkApps(force){
  if(!A) return false;
  var v=-1; try{ if(S && S.appsVersion) v=S.appsVersion(); }catch(e){}
  if(!force && v>=0 && v===appsVer && Date.now()-appsAt<10*60000) return false;
  appsVer=v; appsAt=Date.now();
  var l=A.homeApps(); if(l===lastAppsSig) return false;
  loadApps(l); lsSet('socle-apps', l);
  if($('drawer').classList.contains('on')) renderList();
  return true;
}
window.accueilApps=safe(function(){ if(checkApps(true)) render(); },'Applis');
window.accueilResume=safe(function(){
  if(!booted || Date.now()-lastResume<1000) return; lastResume=Date.now();
  checkApps(false);
  PHOTOS=null; PHOTOS_N=0; theme();
  if(!document.body.classList.contains('edit')) renderProgressive(function(){ refreshMag(); snapSoon(); });
  fetchWeather(false); autoLocate(); medSig=''; pollMedia();
},'Retour sur l\'accueil');
/* Mémoire basse : on libère ce qui se recharge facilement */
window.accueilTrim=safe(function(){ PHOTOS=null; PHOTOS_N=0; iconCache={}; },'Mémoire');
/* Contrôle de santé demandé par Android (page blanche ?) */
window.socleOk=function(){ return document.querySelector('#pages .page') ? 1 : 0; };

/* ---------- Démarrage ---------- */
/* 1. l'instantané (s'il existe) est déjà à l'écran ; 2. la page principale est construite au premier moment libre ;
   3. les autres pages, les tuiles des applis, la météo et la position viennent ensuite, sans bloquer l'affichage */
var socleReady=false;
function readyNative(){ if(socleReady) return; socleReady=true; try{ if(S) S.ready(); }catch(e){} }
var WC0=J(lsGet('socle-wc'),null); if(WC0 && typeof WC0==='object' && !Array.isArray(WC0)) WCACHE=WC0;
if(window.__snap) requestAnimationFrame(function(){ readyNative(); });
function boot1(){
  var cached=A ? lsGet('socle-apps') : null;
  if(A){ if(cached && J(cached,null)) loadApps(cached); else { var l=A.homeApps(); loadApps(l); lsSet('socle-apps', l); } }
  renderProgressive(function(){ booted=true; });
  requestAnimationFrame(function(){ readyNative(); });
  setTimeout(safe(function(){ if(cached && checkApps(true)) render(); refreshMag(); pollMedia(); },'Démarrage'), 350);
  setTimeout(safe(function(){ if(C.city) fetchWeather(false); else refresh('weather'); },'Météo'), 900);
  setTimeout(safe(autoLocate,'Position'), 4000);
  /* Une seule fois : la météo de l'horloge suit ma position (si la position est refusée, la ville choisie reste) */
  if(A && !C.wxPos){ C.wxPos=1; save(); if(!C.city || !C.city.auto) setTimeout(safe(locateMe,'Position'), 3000); }
  if(A){ var pp=J(A.homePerms(),{}); if(!pp.home && !lsGet('socle-welcome')){ lsSet('socle-welcome','1'); setTimeout(function(){ openSheet('<h2>Bienvenue dans Socle</h2><div class="empty" style="font-size:14px;color:var(--tx2);line-height:1.55">Pour que Socle remplace ton écran d\'accueil, choisis-le comme <b>appli d\'accueil</b> par défaut. Tu pourras revenir à l\'ancien à tout moment depuis les mêmes réglages.<br><br>Astuces : appui long sur l\'accueil pour <b>modifier l\'écran</b> (pages, tuiles, panneaux), appui long sur une appli pour l\'ajouter aux favoris, glisser vers le haut pour toutes les applis.</div><div style="display:flex;gap:8px;margin-top:16px"><button class="pbtn main" id="wH">Choisir Socle</button><button class="pbtn" id="wL">Plus tard</button></div>','welcome'); $('wH').onclick=function(){ A.homeOpen('home',''); closeSheet(); }; $('wL').onclick=closeSheet; }, 600); } }
}
theme();
requestAnimationFrame(function(){ setTimeout(safe(boot1,'Démarrage'), 0); });
setInterval(safe(function(){ if(!document.hidden){ refresh('clock'); } },'Horloge'), 15000);
setInterval(safe(function(){ pollMedia(); if(!document.hidden) document.querySelectorAll('[data-since]').forEach(function(el){ el.textContent=mt(Date.now()-el.dataset.since); }); },'Musique'), 1000);
setInterval(safe(function(){ if(!document.hidden){ ['battery','alarm','agenda','nextev','device'].forEach(refresh); fetchWeather(false); } },'Mise à jour'), 120000);
document.addEventListener('visibilitychange', safe(function(){
  if(!document.hidden) window.accueilResume();
  else { endEdit(); saveSnap(); persistW(); }   // on quitte l'accueil : instantané et cache pour le prochain démarrage
},'Visibilité'));
})();
</script>
