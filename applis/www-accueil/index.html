<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Socle</title>
<style>
:root{
  --acc:#8fb4ff;--acc-d:#10131c;--tile:rgba(14,16,24,.55);--tile-b:rgba(255,255,255,.12);
  --tx:#fff;--tx2:rgba(255,255,255,.78);--tx3:rgba(255,255,255,.58);
  --st:24px;--nb:24px;--r:20px;--sheet:#171a24;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:transparent;color:var(--tx);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
body.nobridge{background:linear-gradient(160deg,#28345a,#121624)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.sh{text-shadow:0 1px 3px rgba(0,0,0,.45)}
[hidden]{display:none!important}

/* Accueil */
#home{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;padding:calc(var(--st) + 10px) 12px calc(var(--nb) + 84px);scrollbar-width:none}
#home::-webkit-scrollbar{display:none}
#grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{position:relative;background:var(--tile);border:1px solid var(--tile-b);border-radius:var(--r);padding:13px 14px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);min-height:96px;overflow:hidden;transition:transform .15s}
.tile.w2{grid-column:span 2}
.tile:active{transform:scale(.985)}
.tile .hd{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--tx2);font-weight:600;letter-spacing:.2px}
.tile .hd svg{width:15px;height:15px}
.tile .big{font-size:30px;font-weight:600;line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums}
.tile .sub{font-size:12.5px;color:var(--tx2);margin-top:3px}
.t-clock .time{font-size:58px;font-weight:300;line-height:1;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.t-clock .date{font-size:15px;color:var(--tx2);margin-top:6px}
.t-clock .al{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--acc);margin-top:6px}
.t-clock .al svg{width:15px;height:15px}
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.18);margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:var(--acc)}
.ev{display:flex;gap:8px;margin-top:7px;font-size:13px;align-items:flex-start}
.ev b{font-weight:600;min-width:42px;color:var(--acc);font-variant-numeric:tabular-nums}
.ev span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.ev .c{width:3px;align-self:stretch;border-radius:3px;flex:none}
.mini{display:inline-flex;align-items:center;gap:6px;margin-top:9px;padding:7px 11px;border-radius:12px;background:rgba(255,255,255,.14);font-size:12.5px;font-weight:600}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.tools button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--tx2);padding:7px 0;border-radius:12px;background:rgba(255,255,255,.08)}
.tools button svg{width:22px;height:22px;color:var(--tx)}
.tools button.on{background:var(--acc);color:var(--acc-d)}
.tools button.on svg{color:var(--acc-d)}
.apps4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 4px;margin-top:6px}
.app{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;padding:4px 0;border-radius:14px}
.app:active{background:rgba(255,255,255,.1)}
.app img,.app .ph{width:50px;height:50px;border-radius:14px;display:block}
.app .ph{background:rgba(255,255,255,.15)}
.app span{font-size:11.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tx)}
.mus{display:flex;gap:12px;align-items:center;margin-top:8px}
.mus .art{width:62px;height:62px;border-radius:14px;object-fit:cover;background:rgba(255,255,255,.12);flex:none;display:flex;align-items:center;justify-content:center}
.mus .art svg{width:26px;height:26px;color:var(--tx2)}
.mus .tt{flex:1;min-width:0}
.mus .tt b{display:block;font-size:15.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mus .tt span{display:block;font-size:12.5px;color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mctl{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:10px}
.mctl button{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.1)}
.mctl button.pp{width:52px;height:52px;background:var(--acc);color:var(--acc-d)}
.mctl button.pp svg{fill:currentColor}
.mctl button[disabled]{opacity:.35}
.mbar{height:4px;border-radius:4px;background:rgba(255,255,255,.18);margin-top:10px;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--acc)}
.mtm{display:flex;justify-content:space-between;font-size:11px;color:var(--tx3);margin-top:3px;font-variant-numeric:tabular-nums}
.tile.h2{min-height:250px}
.hdr{display:flex;align-items:center;gap:6px}
.hdr .hd{flex:1}
.hbtn{width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;flex:none}
.hbtn svg{width:17px;height:17px}
.pgrid{display:grid;gap:5px;margin-top:9px}
.pgrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block;background:rgba(255,255,255,.1)}
.cgrid{display:grid;gap:8px 4px;margin-top:9px}
.cav{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.cav .av{width:48px;height:48px;border-radius:50%;object-fit:cover;background:var(--acc);color:var(--acc-d);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
.cav span{font-size:11.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nt{background:rgba(255,255,255,.08);border-radius:12px;padding:8px 10px;margin-top:7px;font-size:13px;line-height:1.35;overflow:hidden;text-align:left;width:100%;display:block}
.nt b{display:block;font-weight:600;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nt .tx{color:var(--tx2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.nt .li{display:flex;gap:5px;align-items:center;color:var(--tx2)}
.nt .li svg{width:14px;height:14px}
.nt .li.c{text-decoration:line-through;opacity:.6}
.wallp{display:flex;gap:12px;align-items:center;margin-top:9px}
.ld{display:flex;gap:10px;align-items:center;width:100%;text-align:left;margin-top:8px;border-radius:12px;min-height:50px}
.ld:active{background:rgba(255,255,255,.08)}
.ld img,.ld .ph3{width:36px;height:48px;border-radius:5px;object-fit:cover;object-position:top;background:#fff;flex:none;display:flex;align-items:center;justify-content:center;color:#8b90a0}
.ld .tt{flex:1;min-width:0}
.ld .tt b{display:block;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ld .tt span{display:block;font-size:12px;color:var(--tx2)}
.ld .mbar{margin-top:5px;height:3px}
.wallp img,.wallp .ph2{width:58px;aspect-ratio:9/19;border-radius:9px;object-fit:cover;background:rgba(255,255,255,.12);flex:none}
.calcin{width:100%;background:rgba(255,255,255,.1);border:0;outline:0;border-radius:12px;padding:10px 12px;margin-top:9px;font-size:17px;font-variant-numeric:tabular-nums}
.calcres{font-size:24px;font-weight:600;margin-top:6px;text-align:right;font-variant-numeric:tabular-nums;min-height:30px}
.t-note textarea{width:100%;min-height:70px;background:transparent;border:0;outline:0;resize:none;margin-top:6px;font-size:14px;color:var(--tx)}
.empty{font-size:12.5px;color:var(--tx3);margin-top:8px}

/* Barre de recherche */
#dock{position:fixed;left:12px;right:12px;bottom:calc(var(--nb) + 10px);z-index:5}
#searchBar{display:flex;align-items:center;gap:10px;background:var(--tile);border:1px solid var(--tile-b);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:99px;padding:12px 16px;color:var(--tx2);width:100%;text-align:left}
#searchBar .sp{flex:1}
.hint{text-align:center;font-size:11px;color:var(--tx3);margin-top:6px}

/* Mode édition */
body.edit .tile{animation:wig .35s ease-in-out infinite alternate;outline:2px dashed rgba(255,255,255,.35);outline-offset:-2px}
body.edit .tile>*:not(.ed){pointer-events:none;opacity:.55}
@keyframes wig{from{transform:rotate(-.4deg)}to{transform:rotate(.4deg)}}
.ed{display:none;position:absolute;inset:auto 8px 8px 8px;gap:6px;justify-content:center;z-index:2}
body.edit .ed{display:flex}
.ed button{width:38px;height:34px;border-radius:11px;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center}
.ed button.x{background:#ff6b6bcc}
#editBar{position:fixed;left:12px;right:12px;bottom:calc(var(--nb) + 10px);display:none;gap:8px;z-index:6}
body.edit #editBar{display:flex}
body.edit #dock{display:none}
.pbtn{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:13px;border-radius:15px;background:var(--sheet);border:1px solid var(--tile-b);font-weight:600}
.pbtn.main{background:var(--acc);color:var(--acc-d);border:0}

/* Tiroir */
#drawer{position:fixed;inset:0;z-index:10;background:rgba(10,12,18,.82);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-top:calc(var(--st) + 8px)}
#drawer.on{transform:none}
.sbox{display:flex;align-items:center;gap:10px;margin:0 12px;background:rgba(255,255,255,.1);border-radius:99px;padding:11px 16px}
.sbox input{flex:1;background:transparent;border:0;outline:0;font-size:16px;min-width:0}
.sbox input::placeholder{color:var(--tx3)}
#chips{display:flex;gap:7px;overflow-x:auto;padding:12px 12px 6px;scrollbar-width:none;flex:none}
#chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:7px 13px;border-radius:99px;background:rgba(255,255,255,.08);font-size:13px;font-weight:600;color:var(--tx2)}
.chip.on{background:var(--acc);color:var(--acc-d)}
#dlist{flex:1;overflow-y:auto;padding:6px 10px calc(var(--nb) + 20px)}
#dlist .apps4{gap:14px 4px}
.res{display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:14px;background:rgba(255,255,255,.06);margin:6px 2px}
.res .ico{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;flex:none}
.res .t{flex:1;min-width:0}
.res .t div:first-child{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .t div+div{font-size:12.5px;color:var(--tx3)}
.res .act{width:40px;height:40px;border-radius:12px;background:var(--acc);color:var(--acc-d);display:flex;align-items:center;justify-content:center;flex:none}
.sect{font-size:12px;color:var(--tx3);font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin:14px 6px 4px}

/* Feuilles (menus du bas) */
#veil{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
#veil.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--sheet);border-radius:24px 24px 0 0;padding:10px 16px calc(var(--nb) + 18px);max-height:86vh;overflow-y:auto;transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
#sheet.on{transform:none}
#sheet .grab{width:40px;height:4px;border-radius:4px;background:rgba(255,255,255,.25);margin:0 auto 12px}
#sheet h2{font-size:18px;margin:2px 0 12px}
.row{display:flex;align-items:center;gap:12px;padding:12px 2px;border-top:1px solid rgba(255,255,255,.08)}
.row:first-of-type{border-top:0}
.row .t{flex:1;min-width:0}
.row .t div+div{font-size:12.5px;color:var(--tx3);margin-top:2px}
.row .ok{color:#6fd6a4;font-size:13px;font-weight:600}
.sbtn{padding:9px 14px;border-radius:12px;background:var(--acc);color:var(--acc-d);font-weight:600;font-size:13.5px;flex:none}
.sbtn.ghost{background:rgba(255,255,255,.1);color:var(--tx)}
.menu button{display:flex;align-items:center;gap:14px;width:100%;padding:14px 4px;font-size:15.5px;border-top:1px solid rgba(255,255,255,.07)}
.menu button:first-child{border-top:0}
.menu button.bad{color:#ff8a8a}
.seg{display:flex;background:rgba(255,255,255,.08);border-radius:12px;padding:3px;gap:3px;margin-top:8px}
.seg button{flex:1;padding:8px 4px;border-radius:9px;font-size:13px;font-weight:600;color:var(--tx2)}
.seg button.on{background:rgba(255,255,255,.16);color:var(--tx)}
.sw{position:relative;width:46px;height:28px;flex:none}
.sw input{opacity:0;position:absolute;inset:0;margin:0;z-index:1}
.sw span{position:absolute;inset:0;border-radius:99px;background:rgba(255,255,255,.18);transition:.2s}
.sw span:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#d6d9e2;transition:.2s}
.sw input:checked+span{background:var(--acc)}
.sw input:checked+span:after{transform:translateX(18px);background:#fff}
input[type=range]{width:100%;accent-color:var(--acc)}
.inp{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:11px 13px;outline:0}
.palette{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.palette button{width:34px;height:34px;border-radius:50%;border:2px solid transparent}
.palette button.on{border-color:#fff}
.day{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid rgba(255,255,255,.08)}
.day:first-of-type{border-top:0}
.day .n{width:76px;text-transform:capitalize;font-weight:600}
.day .w{flex:1;color:var(--tx2);font-size:13.5px}
.day .tt{font-variant-numeric:tabular-nums;font-weight:600}
.hours{display:flex;gap:4px;align-items:flex-end;height:70px;margin-top:10px}
.hours div{flex:1;background:var(--acc);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
.hl{display:flex;justify-content:space-between;font-size:11px;color:var(--tx3);margin-top:4px}
.compass{width:230px;height:230px;margin:10px auto;position:relative}
.compass .dial{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,255,255,.25);transition:transform .15s linear}
.compass .dial span{position:absolute;left:50%;top:6px;transform:translateX(-50%);font-weight:700}
.compass .needle{position:absolute;left:50%;top:14px;width:4px;height:60px;margin-left:-2px;background:#ff6b6b;border-radius:4px}
.cdeg{text-align:center;font-size:34px;font-weight:600;font-variant-numeric:tabular-nums}
.level{width:240px;height:240px;margin:10px auto;border-radius:50%;border:2px solid rgba(255,255,255,.25);position:relative}
.level:before,.level:after{content:"";position:absolute;background:rgba(255,255,255,.2)}
.level:before{left:50%;top:0;bottom:0;width:1px}
.level:after{top:50%;left:0;right:0;height:1px}
.level .ring{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;border:2px solid rgba(255,255,255,.45)}
.level .bub{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:var(--acc);transition:transform .08s linear}
.level.flat .bub{background:#6fd6a4}
#toast{position:fixed;left:16px;right:16px;bottom:calc(var(--nb) + 84px);background:#262b3a;border:1px solid rgba(255,255,255,.14);padding:12px 14px;border-radius:14px;font-size:14px;z-index:40;transform:translateY(30px);opacity:0;transition:.22s;pointer-events:none}
#toast.on{transform:none;opacity:1}
</style>
</head>
<body>
<div id="home">
  <div id="grid"></div>
</div>
<div id="dock">
  <button id="searchBar"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span class="sp" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Rechercher…</span><svg class="i" viewBox="0 0 24 24" id="bSet"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  <div class="hint sh">Glisser vers le haut : toutes les applis</div>
</div>
<div id="editBar">
  <button class="pbtn" id="bAddTile"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Ajouter une tuile</button>
  <button class="pbtn main" id="bDone">Terminé</button>
</div>

<div id="drawer">
  <div class="sbox"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Applis, contacts, calcul, web…" autocomplete="off"><button id="qx" hidden><svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
  <div id="chips"></div>
  <div id="dlist"></div>
</div>

<div id="veil"></div>
<div id="sheet"><div class="grab"></div><div id="sbody"></div></div>
<div id="toast"></div>

<script>
(function(){
"use strict";
var A = window.MAGPrint && window.MAGPrint.homeApps ? window.MAGPrint : null;
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function J(s, d){ try{ var v = JSON.parse(s); return v==null ? d : v; }catch(e){ return d; } }
function toast(t){ var e=$('toast'); e.textContent=t; e.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(function(){ e.classList.remove('on'); }, 3000); }
if(!A) document.body.classList.add('nobridge');

/* ---------- Icônes (traits) ---------- */
var IC = {
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  alarm:'<circle cx="12" cy="13" r="7"/><path d="M12 10v3l2 1.5M5 4 2.5 6.5M19 4l2.5 2.5"/>',
  cloud:'<path d="M7 18a4.5 4.5 0 0 1-.6-9A6 6 0 0 1 18 9.5a4 4 0 0 1-.5 8.5z"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  rain:'<path d="M7 15a4.5 4.5 0 0 1-.6-9A6 6 0 0 1 18 6.5a4 4 0 0 1-.5 8.5z"/><path d="M8 19l-1 2M12 19l-1 2M16 19l-1 2"/>',
  snow:'<path d="M7 15a4.5 4.5 0 0 1-.6-9A6 6 0 0 1 18 6.5a4 4 0 0 1-.5 8.5z"/><path d="M8 19h.01M12 20h.01M16 19h.01"/>',
  storm:'<path d="M7 15a4.5 4.5 0 0 1-.6-9A6 6 0 0 1 18 6.5a4 4 0 0 1-.5 8.5z"/><path d="m13 14-3 4h4l-3 4"/>',

function hexToHsl(h){
  var r=parseInt(h.substr(1,2),16)/255,g=parseInt(h.substr(3,2),16)/255,b=parseInt(h.substr(5,2),16)/255;
  var mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,s=0,hh=0,d=mx-mn;
  if(d){ s=l>.5?d/(2-mx-mn):d/(mx+mn); hh = mx===r?(g-b)/d+(g<b?6:0) : mx===g?(b-r)/d+2 : (r-g)/d+4; hh*=60; }
  return [hh,s,l];
}
function theme(){
  var acc = C.accent;
  if(acc==='auto'){
    acc = '#8fb4ff';
    if(A){
      var w = J(A.homeColors(),{}), cands=[w.p,w.s,w.t].filter(Boolean), best=null, bs=-1;
      cands.forEach(function(c){ var h=hexToHsl(c); if(h[1]>bs){ bs=h[1]; best=h; } });
      if(best){ var hue=Math.round(best[0]), sat=Math.round(Math.max(.45,Math.min(.85,best[1]+.2))*100); acc='hsl('+hue+','+sat+'%,72%)'; }
    }
  }
  var st=document.documentElement.style;
  st.setProperty('--acc', acc);
  st.setProperty('--tile', 'rgba(14,16,24,'+(C.opacity/100)+')');
}

/* ---------- Gestes ---------- */
var tStart=null, longT=null, longFired=false, lastTap=0;
var home=$('home');
home.addEventListener('touchstart', function(e){
  var t=e.touches[0]; tStart={x:t.clientX,y:t.clientY,s:home.scrollTop,tm:Date.now(),target:e.target,moved:false};
  clearTimeout(longT);
  if(!document.body.classList.contains('edit')){
    longT=setTimeout(function(){
      if(!tStart || tStart.moved) return;
      var ap=tStart.target.closest && tStart.target.closest('[data-app]');
      longFired=true;
      if(ap){ var a=byKey(ap.dataset.app); if(a) appMenu(a, true); }
      else startEdit();
      if(navigator.vibrate) navigator.vibrate(18);
    }, 550);
  }
}, {passive:true});
home.addEventListener('touchmove', function(e){
  if(!tStart) return; var t=e.touches[0];
  if(Math.abs(t.clientX-tStart.x)>10 || Math.abs(t.clientY-tStart.y)>10){ tStart.moved=true; clearTimeout(longT); }

  s=s.replace(/\^/g,'**').replace(/(\d+(?:\.\d+)?)%/g,'($1/100)');
  try{ var v=Function('"use strict";return ('+s+')')(); if(typeof v!=='number'||!isFinite(v)) return null; return '= '+(Math.round(v*1e8)/1e8).toLocaleString('fr-FR',{maximumFractionDigits:8}); }catch(e){ return null; }
}

var compH=null, compSmooth=null;
function compassSheet(){
  openSheet('<h2>Boussole</h2><div class="compass"><div class="dial" id="dial"><span>N</span><span style="top:auto;bottom:6px">S</span><span style="left:auto;right:10px;top:50%;transform:translateY(-50%)">E</span><span style="left:10px;top:50%;transform:translateY(-50%)">O</span></div><div class="needle"></div></div><div class="cdeg" id="cdeg">—</div><div class="empty" style="text-align:center">Tiens le téléphone à plat, loin des objets métalliques. Si l\'aiguille dérive, fais un 8 dans l\'air avec le téléphone.</div>','compass');
  compH=function(e){
    var h=null;
    if(e.webkitCompassHeading!=null) h=e.webkitCompassHeading;
    else if(e.absolute!==false && e.alpha!=null) h=360-e.alpha;
    if(h==null) return;
    if(compSmooth==null) compSmooth=h; else { var d=((h-compSmooth+540)%360)-180; compSmooth=(compSmooth+d*0.25+360)%360; }
    var deg=Math.round(compSmooth)%360, dirs=['N','NE','E','SE','S','SO','O','NO'];
    $('dial').style.transform='rotate('+(-compSmooth)+'deg)';
    $('cdeg').textContent=deg+'° '+dirs[Math.round(deg/45)%8];
  };
  window.addEventListener('deviceorientationabsolute', compH);
  window.addEventListener('deviceorientation', compH);
}
function stopCompass(){ window.removeEventListener('deviceorientationabsolute', compH); window.removeEventListener('deviceorientation', compH); compSmooth=null; }

var levH=null;
function levelSheet(){

  levH=function(e){
    if(e.beta==null) return;
    var b=e.beta, g=e.gamma, flat=Math.abs(b)<45 && Math.abs(g)<45;
    var x=Math.max(-95,Math.min(95,-g*4)), y=Math.max(-95,Math.min(95,-b*4));

    else { var a=Math.abs(b)>Math.abs(g)? 90-Math.abs(b) : 90-Math.abs(g); $('bub').style.transform='translate(0,0)'; $('ldeg').textContent=Math.abs(a).toFixed(1).replace('.',',')+'° (sur la tranche)'; $('lev').classList.toggle('flat', Math.abs(a)<1); }
  };
  window.addEventListener('deviceorientation', levH);
}

  openSheet('<h2>Activer les gestes</h2><div class="empty" style="font-size:14px;color:var(--tx2);line-height:1.55">Pour verrouiller l\'écran par un double appui, Android demande d\'activer le service <b>Socle : gestes</b>. Il ne lit jamais le contenu de l\'écran.<br><br>1. Touche <b>Ouvrir l\'accessibilité</b>, puis <b>Applications installées</b> (ou Services téléchargés) › <b>Socle : gestes</b> › activer.<br><br>2. Si l\'option est grisée (« paramètre restreint ») : touche <b>Infos de l\'appli</b>, puis le menu <b>⋮</b> en haut à droite › <b>Autoriser les paramètres restreints</b>, et recommence l\'étape 1.</div><div style="display:flex;gap:8px;margin-top:16px"><button class="pbtn main" id="gA">Ouvrir l\'accessibilité</button><button class="pbtn" id="gI">Infos de l\'appli</button></div>','gest');
  $('gA').onclick=function(){ A&&A.homeOpen('a11y',''); };
  $('gI').onclick=function(){ A&&A.homeOpen('appinfo',''); };
}
$('sbody').addEventListener('click', function(e){
  var b=e.target.closest('[data-add]'); if(!b) return;
  var k=b.dataset.add; C.tiles.push({t:k,w:TYPES[k].w}); save(); render(); closeSheet();
  if(k==='weather' && !C.city) weatherSheet();
  setTimeout(function(){ home.scrollTop=home.scrollHeight; }, 50);
});

/* ---------- Événements Android ---------- */
window.accueilBack=function(){
  if(sheetType){ closeSheet(); return; }
  if($('drawer').classList.contains('on')){ closeDrawer(); return; }
  if(document.body.classList.contains('edit')){ endEdit(); return; }
};
window.accueilHome=function(){ closeSheet(); closeDrawer(); endEdit(); home.scrollTo({top:0,behavior:'smooth'}); };
window.accueilColors=function(){ theme(); };
window.accueilPerms=function(){
  render(); if(sheetType==='settings') settingsSheet();
  if($('drawer').classList.contains('on')) renderList();
  if(pendingLocate){ pendingLocate=false; var p=J(A.homePerms(),{}); if(p.location) locateMe(); else toast('Choisis une ville à la place'); }
};
var lastAppsSig='';
window.accueilResume=function(){
  if(A){ var l=A.homeApps(); if(l.length!==lastAppsSig.length || l!==lastAppsSig){ lastAppsSig=l; loadApps(); if($('drawer').classList.contains('on')) renderList(); } }
  WCACHE={}; PHOTOS=null; theme(); render(); fetchWeather(false); medSig=''; pollMedia();
};

/* ---------- Démarrage ---------- */
theme();
if(A){ lastAppsSig=A.homeApps(); loadApps(); }
render();
if(C.city) fetchWeather(false);
setInterval(function(){ if(!document.hidden){ refresh('clock'); } }, 15000);
setInterval(pollMedia, 1000); setTimeout(pollMedia, 300);
setInterval(function(){ if(!document.hidden){ refresh('battery'); refresh('alarm'); refresh('agenda'); fetchWeather(false); } }, 120000);
document.addEventListener('visibilitychange', function(){ if(!document.hidden) window.accueilResume(); });
if(A){ var pp=J(A.homePerms(),{}); if(!pp.home && !localStorage.getItem('socle-welcome')){ localStorage.setItem('socle-welcome','1'); setTimeout(function(){ openSheet('<h2>Bienvenue dans Socle</h2><div class="empty" style="font-size:14px;color:var(--tx2);line-height:1.55">Pour que Socle remplace ton écran d\'accueil, choisis-le comme <b>appli d\'accueil</b> par défaut. Tu pourras revenir à l\'ancien à tout moment depuis les mêmes réglages.<br><br>Astuces : appui long sur une tuile pour modifier la disposition, appui long sur une appli pour l\'ajouter aux favoris, glisser vers le haut pour toutes les applis.</div><div style="display:flex;gap:8px;margin-top:16px"><button class="pbtn main" id="wH">Choisir Socle</button><button class="pbtn" id="wL">Plus tard</button></div>','welcome'); $('wH').onclick=function(){ A.homeOpen('home',''); closeSheet(); }; $('wL').onclick=closeSheet; }, 600); } }
if(!C.city) setTimeout(function(){ refresh('weather'); }, 0);
})();
</script>
