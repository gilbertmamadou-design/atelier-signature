<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Tableur</title>
<meta name="theme-color" content="#1E7B45">
<meta name="description" content="Tableur : tableur hors ligne de la Suite MAG (formules, mises en forme, tableaux, graphiques, tableaux croisés, .xlsx, .ods, .csv, PDF)">

<link rel="stylesheet" href="office/office.css">

  <div id="ribbonHost"></div>
  <div id="ctxbar" hidden></div>

      <div id="gridHost" data-mpc-drop></div>
