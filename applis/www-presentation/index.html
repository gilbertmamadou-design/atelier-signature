<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Présentation</title>
<meta name="theme-color" content="#D9480F">
<meta name="description" content="Présentation : diaporamas hors ligne de la Suite MAG (import et export .pptx, PDF, mode présentateur)">
<link rel="stylesheet" href="office/office.css">
<link rel="stylesheet" href="pres.css">
</head>
<body>
<div id="app">
  <header id="titlebar"></header>
  <div id="ribbonHost"></div>
  <div id="masterBanner" class="master-banner" hidden></div>
  <div id="main">
    <aside id="thumbs"></aside>
    <section id="center">
      <div id="workarea">
        <div id="rulerC"></div><div id="rulerH"></div><div id="rulerV"></div>
        <div id="stage" tabindex="-1" aria-label="Diapositive" data-mpc-drop><div id="stageIn"><div id="gridLayer"></div><div id="canvas"></div><div id="overlay"></div></div></div>
      </div>
      <div id="sorter"></div>
      <div id="notes"><div id="notesGrip" aria-hidden="true"></div><div id="notesEd"></div></div>
    </section>
    <aside id="pane" hidden></aside>
  </div>
  <footer id="status"></footer>
</div>
<div id="backstage"></div>
<div id="show"></div>
<div id="presenter"></div>
<div id="dropHint">Déposer une présentation (.magpres, .pptx) pour l'ouvrir</div>
<div id="printBox"></div>
<noscript>Présentation a besoin de JavaScript.</noscript>
<!-- bibliothèques (licences : dossier LICENSES / À propos) -->
<script src="jszip.min.js"></script>
<script src="lucide-icons.js"></script>
<!-- pièces communes des applis bureautiques (pc/shared/office/) -->
<script src="office/office-core.js"></script>
<script src="office/office-history.js"></script>
<script src="office/office-ribbon.js"></script>
<script src="office/office-richtext.js"></script>
<script src="office/office-files.js"></script>
<script src="office/office-themes.js"></script>
<script src="office/office-raster.js"></script>
<script src="office/office-pdf.js"></script>
<!-- Présentation -->
<script src="pres-shapes.js"></script>
<script src="pres-model.js"></script>
<script src="pres-charts.js"></script>
<script src="pres-render.js"></script>
<script src="pres-editor.js"></script>
<script src="pres-actions.js"></script>
<script src="pres-show.js"></script>
<script src="pres-io.js"></script>
<script src="pres-pptx.js"></script>
<script src="pres-templates.js"></script>
<script src="pres-ui.js"></script>
<script src="pres-app.js"></script>
</body>
</html>
