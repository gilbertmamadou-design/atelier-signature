<style>

:root{

.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}@media (max-width:520px){.tools{grid-template-columns:1fr 1fr;gap:10px}.tool{padding:12px;gap:6px}.tool p{font-size:12px}.tool .ic{width:40px!important;height:40px!important}}

.cropov .btn{background:#2a2e38;color:#fff;border-color:#3a3f4b}.cropov .btn.primary{background:var(--brand);border-color:var(--brand)}
.cropov .seg{background:#2a2e38;border-color:#3a3f4b}.cropov .seg button{color:#e6e8ee;background:transparent;border-color:transparent}.cropov .seg button.on{background:#fff;color:#14161c}
.crop-busy[hidden]{display:none!important}

.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.pg{position:relative;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:6px;align-items:center}
.pg.sel{border-color:var(--accent)}.pg.del{opacity:.35}

.stage{position:relative;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;touch-action:none;max-width:100%}.stage img.page{display:block;width:100%}
.stage .ov{position:absolute;border:2px dashed var(--accent);cursor:move;touch-action:none}.stage .ov img{width:100%;height:100%;object-fit:contain;pointer-events:none}.stage .ov span{display:block;white-space:nowrap;pointer-events:none;line-height:1}
.dbadge{position:absolute;top:-5px;right:-5px;background:var(--brand);color:#fff;border-radius:99px;font-size:11px;line-height:17px;padding:0 5px}
@media (max-width:420px){.hide-s{display:none}}
.dgrid{display:flex;flex-direction:column;gap:10px}
.doc{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px}
.doc .th{width:64px;height:84px;flex:none;border-radius:8px;border:1px solid var(--line);background:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center}.doc .th img{width:100%;height:100%;object-fit:cover;object-position:top}
.doc .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.docshero{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;text-align:left;width:100%;color:var(--ink)}
.res{background:var(--ok-bg);border:1px solid var(--ok);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.prog{height:8px;border-radius:99px;background:var(--brand-bg);overflow:hidden}.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:60;max-width:min(92vw,520px);font-weight:700;font-size:14px}
.overlay{position:fixed;inset:0;z-index:70;background:rgba(10,15,25,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet{background:var(--surface);border-radius:16px;padding:16px;width:100%;max-width:560px}
.notice{background:var(--warn-bg);border:1px solid var(--warn);border-radius:12px;padding:10px 12px;font-size:14px}
details.help summary{cursor:pointer;font-weight:700;list-style:none;display:flex;gap:10px;align-items:center}details.help summary::-webkit-details-marker{display:none}details.help summary::after{content:"›";margin-left:auto;font-size:22px;transition:transform .2s}details.help[open] summary::after{transform:rotate(90deg)}details.help ol{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
@keyframes rise{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}main.anim>.stack>*{animation:rise .3s cubic-bezier(.2,.8,.2,1) both}

</style>

const TOOLS=[
 ["Organiser",[["merge","Fusionner","Assembler plusieurs PDF en un seul, dans l'ordre choisi","#2C6FB7"],["split","Diviser","Séparer chaque page, ou par plages (1-3, 4-6…)","#2C6FB7"],["org","Organiser les pages","Réordonner, faire pivoter ou supprimer des pages","#2C6FB7"],["rot","Faire pivoter","Tourner toutes les pages de 90° ou 180°","#2C6FB7"]]],

function loadScript(src){ return new Promise((ok,ko)=>{ const s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=ko; document.head.appendChild(s); }); }

  if(MP&&MP.fileMenu){ try{ const b=await blobToB64(blob); if(open&&MP.openFile) MP.openFile(b,name,mime); else MP.fileMenu(b,name,mime,"",name,""); return; }catch(e){} }

  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); }

function renderHome(){ app.innerHTML=`<div class="stack"><div class="hero"><h1>Tous vos PDF, sur place</h1><p>Fusionner, diviser, compresser, convertir, signer… Les fichiers sont traités sur votre appareil : rien n'est envoyé sur internet.</p><span class="priv">🔒 Vos documents restent chez vous</span></div>
  <button class="docshero" id="docsHero"><span style="font-size:30px">📁</span><span class="grow"><b>Mes documents</b><br><span class="muted small" id="docsHeroN">Vos scans et PDF gardés dans l'application</span></span><span>›</span></button>
  ${TOOLS.map(([g,list])=>`<div class="sec">${g}</div><div class="tools">${list.map(t=>`<button class="tool" data-t="${t[0]}">${icon(t)}<h3>${t[1]}</h3><p>${t[2]}</p></button>`).join("")}</div>`).join("")}</div>`;
  app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>go(b.dataset.t)); $("#docsHero").onclick=()=>go("docs"); docsList().then(L=>{ const e=$("#docsHeroN"); if(e&&L.length) e.textContent=`${L.length} document${L.length>1?"s":""} · ${kb(L.reduce((a,d)=>a+d.size,0))}`; }); }
$("#home").onclick=()=>go(null); $("#helpB").onclick=()=>go("help"); $("#docsB").onclick=()=>go("docs");

/* ================= PLAN DE TRAVAIL ================= */
const ACCEPT={img2pdf:"image/*",scan:"image/*"};
const MULTI={merge:1,img2pdf:1,scan:1};
function renderTool(){ const t=TOOL[S.tool], multi=MULTI[S.tool], acc=ACCEPT[S.tool]||"application/pdf,.pdf";
  app.innerHTML=`<div class="stack"><div class="row" style="gap:12px;flex-wrap:nowrap">${icon(t,52)}<div><h1 style="font-size:26px">${t[1]}</h1><span class="muted">${t[2]}</span></div></div>
    <label class="drop" id="drop"><input class="hid" type="file" id="fin" accept="${acc}" ${multi?"multiple":""}>${S.tool==="scan"?`<input class="hid" type="file" id="fcam" accept="image/*" capture="environment">`:""}
      <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="color:var(--brand)"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
      <b>${S.files.length?(multi?"Ajouter d'autres fichiers":"Choisir un autre fichier"):(acc.startsWith("image")?"Choisir des images":multi?"Choisir des PDF":"Choisir un PDF")}</b><span class="muted small">ou glissez-les ici${multi?" · plusieurs fichiers possibles":""}</span>
      ${S.tool==="scan"?`<button class="btn primary" id="camB" type="button">📷 Photographier une page</button>`:""}</label>
    <div id="work"></div><div id="out"></div></div>`;
  const add=async (fl,cam)=>{ fl=[...fl].filter(f=>acc.startsWith("image")?f.type.startsWith("image/"):(f.type==="application/pdf"||/\.pdf$/i.test(f.name))); if(!fl.length){ toast(acc.startsWith("image")?"Choisissez des images (JPG, PNG)":"Choisissez un fichier PDF"); return; }
    for(const f of fl){ const o={id:Math.random().toString(36).slice(2),f,name:f.name,size:f.size,buf:await readBuf(f)}; if(multi) S.files.push(o); else S.files=[o]; }
    $("#out").innerHTML=""; const keep=S.opt; S.opt={}; if(S.tool==="scan"||S.tool==="img2pdf"){ S.opt.mode=keep.mode; S.opt.page=keep.page; S.opt.mar=keep.mar; Object.keys(S.opt).forEach(k=>S.opt[k]==null&&delete S.opt[k]); } renderWork(); if(cam&&S.tool==="scan") cropEditor(S.files[S.files.length-1],"quad"); };
  $("#fin").onchange=e=>{ const f=e.target.files; add(f); e.target.value=""; };
  if($("#camB")) $("#camB").onclick=e=>{ e.preventDefault(); e.stopPropagation(); $("#fcam").click(); };
  if($("#fcam")) $("#fcam").onchange=e=>{ add(e.target.files,true); e.target.value=""; };
  const d=$("#drop"); ["dragenter","dragover"].forEach(k=>d.addEventListener(k,e=>{ e.preventDefault(); d.classList.add("over"); })); ["dragleave","drop"].forEach(k=>d.addEventListener(k,e=>{ e.preventDefault(); d.classList.remove("over"); })); d.addEventListener("drop",e=>add(e.dataTransfer.files));
  renderWork(); }
function fileList(sortable){ return `<div class="flist">${S.files.map((o,i)=>`<div class="fi"><div class="th" data-th="${o.id}"></div><div class="grow"><div class="nm">${esc(o.name)}</div><span class="muted small">${kb(o.size)}${o.pages?` · ${o.pages} page${o.pages>1?"s":""}`:""}</span>${o.ef?` <span class="edited">✂️ recadrée</span>`:""}</div>${o.f.type.startsWith("image/")?`<button class="btn small" data-crop="${i}" aria-label="Recadrer" title="Recadrer, pivoter, redresser">✂️</button>`:""}${sortable?`<button class="btn small" data-up="${i}" aria-label="Monter" ${i?"":"disabled"}>▲</button><button class="btn small" data-dn="${i}" aria-label="Descendre" ${i<S.files.length-1?"":"disabled"}>▼</button>`:""}<button class="btn small" data-rm="${i}" aria-label="Retirer">✕</button></div>`).join("")}</div>`; }
function bindList(){ app.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>{ const i=+b.dataset.up; [S.files[i-1],S.files[i]]=[S.files[i],S.files[i-1]]; renderWork(); });
  app.querySelectorAll("[data-dn]").forEach(b=>b.onclick=()=>{ const i=+b.dataset.dn; [S.files[i+1],S.files[i]]=[S.files[i],S.files[i+1]]; renderWork(); });
  app.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{ S.files.splice(+b.dataset.rm,1); renderWork(); });
  app.querySelectorAll("[data-crop]").forEach(b=>b.onclick=()=>cropEditor(S.files[+b.dataset.crop]));
  S.files.forEach(async o=>{ const el=app.querySelector(`[data-th="${o.id}"]`); if(!el) return; if(!o.th){ if(o.f.type.startsWith("image/")) o.th=URL.createObjectURL(o.f); else { o.th=await thumb(o.buf); try{ if(!o.pages){ const L=await libJs(); o.pages=(await L.getDocument({data:o.buf.slice(0)}).promise).numPages; const s=el.parentElement.querySelector(".small"); if(s) s.textContent=`${kb(o.size)} · ${o.pages} page${o.pages>1?"s":""}`; } }catch(e){} } } if(o.th) el.innerHTML=`<img src="${o.th}" alt="">`; }); }
const seg=(k,opts,def)=>{ if(S.opt[k]==null) S.opt[k]=def; return `<div class="seg" data-seg="${k}">${opts.map(([v,l])=>`<button type="button" class="${String(S.opt[k])===String(v)?"on":""}" data-v="${v}">${l}</button>`).join("")}</div>`; };
function bindSeg(re){ app.querySelectorAll("[data-seg]").forEach(g=>g.querySelectorAll("button").forEach(b=>b.onclick=()=>{ S.opt[g.dataset.seg]=b.dataset.v; re?re():g.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b)); })); }
function bindOpt(){ app.querySelectorAll("[data-o]").forEach(el=>el.addEventListener("input",()=>{ S.opt[el.dataset.o]=el.type==="checkbox"?el.checked:el.value; const lab=app.querySelector(`[data-ov="${el.dataset.o}"]`); if(lab) lab.textContent=el.value; })); }
const runBtn=(l)=>`<button class="btn primary big" id="run">${l}</button><div class="prog" id="prog" hidden><i></i></div>`;
function progress(p){ const g=$("#prog"); if(!g) return; g.hidden=false; g.firstElementChild.style.width=Math.round(p*100)+"%"; }
function done(files,note){ const out=$("#out"); progress(1); setTimeout(()=>{ const g=$("#prog"); if(g) g.hidden=true; },400);
  out.innerHTML=`<div class="res"><b>✅ Terminé${note?" · "+esc(note):""}</b>${files.map((f,i)=>`<div class="row" style="justify-content:space-between;gap:8px;flex-wrap:wrap"><span style="overflow-wrap:anywhere;flex:1 1 100%">📄 ${esc(f.name)} <span class="muted small">(${kb(f.blob.size)})</span></span><span class="row">${MP&&MP.openFile&&/pdf|image/.test(f.blob.type)?`<button class="btn small" data-op="${i}">👁 Voir</button>`:""}<button class="btn small primary" data-dl="${i}">${MP?"📤 Enregistrer, envoyer…":"⬇ Télécharger"}</button>${/pdf/.test(f.blob.type)?`<button class="btn small" data-pr="${i}">🖨 Imprimer</button>`:""}<button class="btn small" data-keep="${i}">📁 Garder</button></span></div>`).join("")}
    <div class="muted small" id="keptNote"></div>
    <button class="btn" id="again">↺ Recommencer avec un autre fichier</button></div>`;
  out.querySelectorAll("[data-pr]").forEach(b=>b.onclick=()=>printBlob(files[+b.dataset.pr].blob,files[+b.dataset.pr].name));
  out.querySelectorAll("[data-keep]").forEach(b=>b.onclick=async()=>{ const i=+b.dataset.keep; if(files[i].kept){ toast("Déjà dans Mes documents"); return; } await keepDoc(files[i]); b.textContent="✓ Gardé"; b.disabled=true; });
  if(S.tool==="scan"||D_AUTO()) (async()=>{ for(const f of files){ if(/pdf/.test(f.blob.type)) await keepDoc(f,true); } const n=$("#keptNote"); if(n) n.innerHTML="📁 Gardé automatiquement dans <b>Mes documents</b>."; out.querySelectorAll("[data-keep]").forEach((b,i)=>{ if(files[i]&&files[i].kept){ b.textContent="✓ Gardé"; b.disabled=true; } }); })();
  out.querySelectorAll("[data-dl]").forEach(b=>b.onclick=()=>giveFile(files[+b.dataset.dl].blob,files[+b.dataset.dl].name));
  out.querySelectorAll("[data-op]").forEach(b=>b.onclick=()=>giveFile(files[+b.dataset.op].blob,files[+b.dataset.op].name,true));
  $("#again").onclick=()=>go(S.tool); out.scrollIntoView({behavior:"smooth",block:"center"}); }
async function guard(fn){ const b=$("#run"); if(b) b.disabled=true; progress(.03); try{ await fn(); }catch(e){ console.error(e); toast(/password|encrypt/i.test(e?.message||"")?"Ce PDF est protégé par un mot de passe : ouvrez-le et réenregistrez-le sans protection d'abord":"Opération impossible : "+(e?.message||e)); const g=$("#prog"); if(g) g.hidden=true; } if(b) b.disabled=false; }
const pdfBlob=bytes=>new Blob([bytes],{type:"application/pdf"});
async function loadDoc(buf){ const {PDFDocument}=await libPdf(); return PDFDocument.load(buf,{ignoreEncryption:true}); }
function parseRanges(str,n){ const out=[]; String(str||"").split(/[,;]/).map(x=>x.trim()).filter(Boolean).forEach(p=>{ const m=p.match(/^(\d+)\s*[-à]\s*(\d+|fin)?$/i); if(m){ const a=+m[1], b=m[2]&&!/fin/i.test(m[2])?+m[2]:n; const r=[]; for(let i=Math.max(1,a);i<=Math.min(n,b);i++) r.push(i-1); if(r.length) out.push(r); } else if(/^\d+$/.test(p)&&+p>=1&&+p<=n) out.push([+p-1]); }); return out; }

function renderWork(){ const w=$("#work"); if(!w) return; const T=S.tool, n=S.files.length; if(!n){ w.innerHTML=""; return; } const F=S.files[0];
  ({
  merge(){ w.innerHTML=`<div class="card stack"><h2>Ordre des fichiers</h2>${fileList(true)}<span class="muted small">Les fichiers sont assemblés de haut en bas.</span>${runBtn(`Fusionner ${n} PDF`)}</div>`; bindList();
    $("#run").onclick=()=>guard(async()=>{ if(n<2) throw new Error("ajoutez au moins deux PDF"); const {PDFDocument}=await libPdf(), out=await PDFDocument.create(); for(let i=0;i<n;i++){ const src=await loadDoc(S.files[i].buf); (await out.copyPages(src,src.getPageIndices())).forEach(p=>out.addPage(p)); progress((i+1)/n*.9); } done([{name:"fusion_"+baseName(S.files[0].name)+".pdf",blob:pdfBlob(await out.save())}],`${out.getPageCount()} pages`); }); },
  split(){ w.innerHTML=`<div class="card stack">${fileList()}<h2>Comment diviser ?</h2>${seg("mode",[["each","Une page = un fichier"],["ranges","Par plages"],["extract","Extraire des pages"]],"each")}
      <div id="rg" ${S.opt.mode==="each"?"hidden":""}><label class="f">${S.opt.mode==="extract"?"Pages à garder":"Plages (un fichier par plage)"}<input type="text" data-o="ranges" value="${esc(S.opt.ranges||"")}" placeholder="${S.opt.mode==="extract"?"ex. 1, 3, 5-7":"ex. 1-3, 4-6, 7-fin"}"></label></div>${runBtn("Diviser le PDF")}</div>`;
    bindList(); bindSeg(renderWork); bindOpt();
    $("#run").onclick=()=>guard(async()=>{ const {PDFDocument}=await libPdf(), src=await loadDoc(F.buf), N=src.getPageCount(), b=baseName(F.name);
      let groups=S.opt.mode==="each"?src.getPageIndices().map(i=>[i]):parseRanges(S.opt.ranges,N); if(!groups.length) throw new Error("indiquez les pages, par exemple 1-3, 5");
      if(S.opt.mode==="extract") groups=[groups.flat()];
      const files=[]; for(let g=0;g<groups.length;g++){ const d=await PDFDocument.create(); (await d.copyPages(src,groups[g])).forEach(p=>d.addPage(p)); const r=groups[g]; files.push({name:S.opt.mode==="extract"?`${b}_extrait.pdf`:`${b}_${r.length>1?(r[0]+1)+"-"+(r[r.length-1]+1):"page"+(r[0]+1)}.pdf`,blob:pdfBlob(await d.save())}); progress((g+1)/groups.length*.8); }
      if(files.length>3){ const Z=await libZip(), z=new Z(); files.forEach(f=>z.file(f.name,f.blob)); done([{name:b+"_divise.zip",blob:await z.generateAsync({type:"blob"})},...files.slice(0,0)],`${files.length} fichiers dans un ZIP`); } else done(files); }); },
  async org(){ w.innerHTML=`<div class="card stack">${fileList()}<div class="row" style="justify-content:space-between"><h2>Pages</h2><span class="muted small">Touchez ⟲ ⟳ pour tourner, ◀ ▶ pour déplacer, 🗑 pour retirer</span></div><div class="pages" id="pgs"><div class="muted">Chargement des pages…</div></div>${runBtn("Enregistrer le nouveau PDF")}</div>`; bindList();
    const L=await libJs(), pdf=await L.getDocument({data:F.buf.slice(0)}).promise; if(!S.opt.order){ S.opt.order=[...Array(pdf.numPages).keys()].map(i=>({i,rot:0,del:false,img:""})); }
    const draw=()=>{ const g=$("#pgs"); if(!g) return; g.innerHTML=S.opt.order.map((p,k)=>`<div class="pg ${p.del?"del":""}"><div class="im"><img src="${p.img}" alt="Page ${p.i+1}" style="transform:rotate(${p.rot}deg)"></div><span class="n">Page ${p.i+1}</span><div class="acts"><button data-a="l" data-k="${k}" aria-label="Déplacer avant">◀</button><button data-a="rl" data-k="${k}" aria-label="Tourner à gauche">⟲</button><button data-a="rr" data-k="${k}" aria-label="Tourner à droite">⟳</button><button data-a="d" data-k="${k}" aria-label="Supprimer">${p.del?"↩":"🗑"}</button><button data-a="r" data-k="${k}" aria-label="Déplacer après">▶</button></div></div>`).join("");
      g.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{ const k=+b.dataset.k, O=S.opt.order, a=b.dataset.a; if(a==="l"&&k>0) [O[k-1],O[k]]=[O[k],O[k-1]]; if(a==="r"&&k<O.length-1) [O[k+1],O[k]]=[O[k],O[k+1]]; if(a==="rl") O[k].rot=(O[k].rot+270)%360; if(a==="rr") O[k].rot=(O[k].rot+90)%360; if(a==="d") O[k].del=!O[k].del; draw(); }); };
    draw();
    $("#run").onclick=()=>guard(async()=>{ const {PDFDocument,degrees}=await libPdf(), src=await loadDoc(F.buf), keep=S.opt.order.filter(p=>!p.del); if(!keep.length) throw new Error("gardez au moins une page"); const d=await PDFDocument.create();
      const pages=await d.copyPages(src,keep.map(p=>p.i)); pages.forEach((pg,k)=>{ pg.setRotation(degrees((pg.getRotation().angle+keep[k].rot)%360)); d.addPage(pg); });
      done([{name:baseName(F.name)+"_organise.pdf",blob:pdfBlob(await d.save())}],`${keep.length} page(s)`); });
    for(const p of S.opt.order){ if(!p.img){ const {c}=await renderPage(pdf,p.i+1,.35); p.img=c.toDataURL("image/jpeg",.7); if(S.tool!=="org") return; draw(); } } },
  rot(){ w.innerHTML=`<div class="card stack">${fileList()}<h2>Rotation</h2>${seg("ang",[["90","↻ 90° à droite"],["270","↺ 90° à gauche"],["180","180°"]],"90")}${runBtn("Faire pivoter")}</div>`; bindList(); bindSeg();
    $("#run").onclick=()=>guard(async()=>{ const {degrees}=await libPdf(), d=await loadDoc(F.buf); d.getPages().forEach(p=>p.setRotation(degrees((p.getRotation().angle+ +S.opt.ang)%360))); done([{name:baseName(F.name)+"_pivote.pdf",blob:pdfBlob(await d.save())}]); }); },
  zip(){ w.innerHTML=`<div class="card stack">${fileList()}<h2>Niveau de compression</h2>${seg("lvl",[["low","Légère (meilleure qualité)"],["mid","Recommandée"],["high","Forte (plus léger)"]],"mid")}
      <span class="muted small">Les pages sont recompressées en images : parfait pour les scans et les documents photographiés. Le texte ne sera plus sélectionnable. Si le résultat est plus lourd, l'original est conservé.</span>${runBtn("Compresser le PDF")}</div>`; bindList(); bindSeg();
    $("#run").onclick=()=>guard(async()=>{ const P={low:[1.6,.8],mid:[1.25,.62],high:[1,.45]}[S.opt.lvl], L=await libJs(), {PDFDocument}=await libPdf(), pdf=await L.getDocument({data:F.buf.slice(0)}).promise, d=await PDFDocument.create();
      for(let i=1;i<=pdf.numPages;i++){ const {c,pg}=await renderPage(pdf,i,P[0]), v1=pg.getViewport({scale:1}), jpg=await d.embedJpg(await (await canvasBlob(c,"image/jpeg",P[1])).arrayBuffer()), page=d.addPage([v1.width,v1.height]); page.drawImage(jpg,{x:0,y:0,width:v1.width,height:v1.height}); progress(i/pdf.numPages*.9); }
      const bytes=await d.save(), nb=pdfBlob(bytes), gain=Math.round(100*(1-nb.size/F.size));
      if(nb.size>=F.size) done([{name:F.name,blob:new Blob([F.buf],{type:"application/pdf"})}],"ce PDF est déjà bien compressé : original conservé");
      else done([{name:baseName(F.name)+"_compresse.pdf",blob:nb}],`${kb(F.size)} → ${kb(nb.size)} (−${gain} %)`); }); },
  img2pdf(){ imgTool(false); }, scan(){ imgTool(true); },
  async pdf2img(){ w.innerHTML=`<div class="card stack">${fileList()}<div class="grid2"><div class="stack" style="gap:6px"><b>Format</b>${seg("fmt",[["jpg","JPG"],["png","PNG"]],"jpg")}</div><div class="stack" style="gap:6px"><b>Qualité</b>${seg("q",[["1.5","Normale"],["2.5","Haute"],["4","Impression"]],"1.5")}</div></div>${runBtn("Convertir en images")}</div>`; bindList(); bindSeg();
    $("#run").onclick=()=>guard(async()=>{ const L=await libJs(), pdf=await L.getDocument({data:F.buf.slice(0)}).promise, b=baseName(F.name), png=S.opt.fmt==="png", files=[];
      for(let i=1;i<=pdf.numPages;i++){ const {c}=await renderPage(pdf,i,+S.opt.q); files.push({name:`${b}_page${i}.${png?"png":"jpg"}`,blob:await canvasBlob(c,png?"image/png":"image/jpeg",.9)}); progress(i/pdf.numPages*.85); }
      if(files.length>1){ const Z=await libZip(), z=new Z(); files.forEach(f=>z.file(f.name,f.blob)); done([{name:b+"_images.zip",blob:await z.generateAsync({type:"blob"})}],`${files.length} images dans un ZIP`); } else done(files); }); },
  word(){ textTool(true); }, txt(){ textTool(false); },
  sign(){ placeTool("sign"); }, text(){ placeTool("text"); },
  wm(){ w.innerHTML=`<div class="card stack">${fileList()}<label class="f">Texte du filigrane<input type="text" data-o="txt" value="${esc(S.opt.txt??"CONFIDENTIEL")}"></label>
      <div class="grid2"><label class="f">Taille <span class="muted" data-ov="sz">${S.opt.sz||60}</span><input type="range" min="20" max="140" data-o="sz" value="${S.opt.sz||60}"></label><label class="f">Opacité <span class="muted" data-ov="op">${S.opt.op||25}</span><input type="range" min="5" max="80" data-o="op" value="${S.opt.op||25}"></label></div>
      <div class="grid2"><div class="stack" style="gap:6px"><b>Inclinaison</b>${seg("ang",[["45","Diagonale"],["0","Horizontale"]],"45")}</div><div class="stack" style="gap:6px"><b>Couleur</b>${seg("col",[["gray","Gris"],["red","Rouge"],["blue","Bleu"]],"gray")}</div></div>${runBtn("Ajouter le filigrane")}</div>`; bindList(); bindSeg(); bindOpt();
    $("#run").onclick=()=>guard(async()=>{ const {StandardFonts,rgb,degrees}=await libPdf(), d=await loadDoc(F.buf), font=await d.embedFont(StandardFonts.HelveticaBold), t=winAnsi(S.opt.txt??"CONFIDENTIEL")||"COPIE", sz=+(S.opt.sz||60), op=+(S.opt.op||25)/100, a=+S.opt.ang, col={gray:rgb(.45,.45,.45),red:rgb(.8,.15,.12),blue:rgb(.12,.3,.7)}[S.opt.col];
      d.getPages().forEach(p=>{ const {width:W,height:H}=p.getSize(), tw=font.widthOfTextAtSize(t,sz), r=a*Math.PI/180; p.drawText(t,{x:W/2-Math.cos(r)*tw/2+Math.sin(r)*sz/3,y:H/2-Math.sin(r)*tw/2-Math.cos(r)*sz/3,size:sz,font,color:col,opacity:op,rotate:degrees(a)}); });
      done([{name:baseName(F.name)+"_filigrane.pdf",blob:pdfBlob(await d.save())}]); }); },
  num(){ w.innerHTML=`<div class="card stack">${fileList()}<div class="stack" style="gap:6px"><b>Position</b>${seg("pos",[["bc","En bas au centre"],["br","En bas à droite"],["tr","En haut à droite"],["tc","En haut au centre"]],"bc")}</div>
      <div class="stack" style="gap:6px"><b>Format</b>${seg("fmt",[["n","1"],["nN","1 / 12"],["page","Page 1 sur 12"]],"nN")}</div>

        if(it.type==="img"){ const png=cache[it.src]||(cache[it.src]=await d.embedPng(await (await fetch(it.src)).arrayBuffer())); const w2=it.w*W, h2=w2*it.ar; p.drawImage(png,{x:it.x*W,y:H-it.y*H-h2,width:w2,height:h2}); }
        else { const fs=it.fs*H, c=it.col, col=rgb(parseInt(c.slice(1,3),16)/255,parseInt(c.slice(3,5),16)/255,parseInt(c.slice(5,7),16)/255); p.drawText(it.txt,{x:it.x*W,y:H-it.y*H-fs*.8,size:fs,font,color:col}); } }
      done([{name:baseName(F.name)+(kind==="sign"?"_signe.pdf":"_annote.pdf"),blob:pdfBlob(await d.save())}]); }); };
  await show(); }

<script>/* Application Android : impression (MAGPrint.printHtml), et fichiers téléchargés -> menu Android (enregistrer dans un dossier, e-mail, partager, imprimer) */
(function(){if(!window.MAGPrint)return;var MP=window.MAGPrint;
function fixForms(src,dst){var a=src.querySelectorAll("input,textarea,select"),b=dst.querySelectorAll("input,textarea,select");for(var i=0;i<a.length&&i<b.length;i++){var x=a[i],y=b[i];if(x.tagName==="TEXTAREA")y.textContent=x.value;else if(x.tagName==="SELECT"){Array.prototype.forEach.call(y.options,function(o,k){if(k===x.selectedIndex)o.setAttribute("selected","");else o.removeAttribute("selected")})}else if(x.type==="checkbox"||x.type==="radio"){if(x.checked)y.setAttribute("checked","");else y.removeAttribute("checked")}else y.setAttribute("value",x.value)}}
function snap(win){var doc=win.document,d=doc.documentElement.cloneNode(true);fixForms(doc.documentElement,d);d.querySelectorAll("script").forEach(function(s){s.remove()});
  doc.querySelectorAll("canvas").forEach(function(c,i){try{var img=d.querySelectorAll("canvas")[i];if(img){var im=doc.createElement("img");im.src=c.toDataURL("image/png");im.style.cssText="max-width:100%";img.replaceWith(im)}}catch(e){}});
  return "<!doctype html>"+d.outerHTML}
function toB64(blob){return new Promise(function(ok,ko){var r=new FileReader();r.onload=function(){var x=String(r.result);ok(x.slice(x.indexOf(",")+1))};r.onerror=ko;r.readAsDataURL(blob)})}
function sendFile(href,name,win){if(!MP.fileMenu)return false;(win||window).fetch(href).then(function(r){return r.blob()}).then(function(b){return toB64(b).then(function(x){MP.fileMenu(x,name||"fichier",b.type||"application/octet-stream","","","")})}).catch(function(){});return true}
function openBlob(href,name,win){if(!MP.openFile)return sendFile(href,name,win);(win||window).fetch(href).then(function(r){return r.blob()}).then(function(b){return toB64(b).then(function(x){MP.openFile(x,name||("document"+(b.type.indexOf("pdf")>=0?".pdf":"")),b.type||"application/octet-stream")})}).catch(function(){});return true}
function hook(win){if(!win||win.__magp)return;win.__magp=1;
  /* liens créés par programme (a.click() hors de la page) */
  try{var AC=win.HTMLAnchorElement.prototype.click;win.HTMLAnchorElement.prototype.click=function(){var h=this.getAttribute("href")||"";if(/^(blob:|data:)/.test(h)){if(this.hasAttribute("download")){sendFile(h,this.getAttribute("download"),win);return}if(this.target==="_blank"){openBlob(h,"",win);return}}return AC.apply(this,arguments)}}catch(e){}
  win.print=function(){try{MP.printHtml(snap(win),win.document.title||"MAG Formation 13")}catch(e){}};
  var op=win.open;win.open=function(u){if(u&&/^(blob:|data:)/.test(String(u))){openBlob(String(u),"",win);return null}if(!u||u==="about:blank"){var buf="";var fw={closed:false,document:{open:function(){buf=""},write:function(h){buf+=h},writeln:function(h){buf+=h+"\n"},close:function(){}},focus:function(){},close:function(){fw.closed=true},print:function(){MP.printHtml(buf,"MAG Formation 13")}};return fw}return op?op.apply(win,arguments):null};
  win.document.addEventListener("click",function(e){var a=e.target&&e.target.closest?e.target.closest("a[href]"):null;if(!a)return;var h=a.getAttribute("href")||"";if(!/^(blob:|data:)/.test(h))return;if(a.hasAttribute("download")){e.preventDefault();e.stopPropagation();sendFile(h,a.getAttribute("download"),win)}else if(a.target==="_blank"){e.preventDefault();e.stopPropagation();openBlob(h,a.getAttribute("data-name")||"",win)}},true)}
hook(window);
function watch(f){var go=function(){try{hook(f.contentWindow)}catch(e){}};f.addEventListener("load",function(){if(f.contentWindow)f.contentWindow.__magp=0;go()});go()}
document.querySelectorAll("iframe").forEach(watch);
new MutationObserver(function(ms){ms.forEach(function(m){m.addedNodes.forEach(function(n){if(n.tagName==="IFRAME")watch(n)})})}).observe(document.documentElement,{childList:true,subtree:true});
})();</script>
