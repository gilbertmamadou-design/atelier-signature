(function(){
  var box = $("crop"), g = null;
  box.addEventListener("pointerdown", function(e){
    if (!ED.img) return;

    g = { h: h, x0: e.clientX, y0: e.clientY, c: Object.assign({}, ED.crop) };
  });
  box.addEventListener("pointermove", function(e){
    if (!g) return;
    var dx = (e.clientX - g.x0) / ED.dw, dy = (e.clientY - g.y0) / ED.dh, c = Object.assign({}, g.c), h = g.h;
    var minW = 48 / ED.dw, minH = 48 / ED.dh;
    if (h === "m"){
      c.x = Math.max(0, Math.min(1 - c.w, c.x + dx)); c.y = Math.max(0, Math.min(1 - c.h, c.y + dy));
    } else if (!ED.ratio){
      if (h.indexOf("w") >= 0){ var nx = Math.max(0, Math.min(c.x + c.w - minW, c.x + dx)); c.w += c.x - nx; c.x = nx; }
      if (h.indexOf("e") >= 0){ c.w = Math.max(minW, Math.min(1 - c.x, c.w + dx)); }
      if (h.indexOf("n") >= 0){ var ny = Math.max(0, Math.min(c.y + c.h - minH, c.y + dy)); c.h += c.y - ny; c.y = ny; }
      if (h.indexOf("s") >= 0){ c.h = Math.max(minH, Math.min(1 - c.y, c.h + dy)); }

      var d = edDims(), rn = ED.ratio * d.h / d.w;

/* ---------- Actualiser : relit les photos et vidéos du téléphone (et la corbeille affichée) en gardant la position
   (bouton ⟳ ou glisser vers le bas en haut de la grille) ---------- */
var RF = { busy: false, wait: null };
function doRefresh(){
  if (RF.busy || !G) { if (!G) toast("Actualisé"); return; }
  RF.busy = true;
  var btns = document.querySelectorAll(".rfb"), t0 = Date.now();
  btns.forEach(function(b){ b.classList.add("spinning"); });
  var end = function(msg){
    RF.wait = null;
    setTimeout(function(){ btns.forEach(function(b){ b.classList.remove("spinning"); }); RF.busy = false; }, Math.max(0, 700 - (Date.now() - t0)));
    toast(msg);
  };
  var p; try { p = JSON.parse(call("permState") || "{}"); } catch (e) { p = PERM; }
  if (p && typeof p.any === "boolean" && p.any !== PERM.any){ PERM = p; applyPerm(); }
  if (!PERM.any){ end("Actualisé"); return; }
  var to = setTimeout(function(){ if (RF.wait) end("Actualisé"); }, 20000);
  RF.wait = function(){ clearTimeout(to); end("Actualisé · " + plural(ITEMS.length, "élément")); };
  loadAll();
  if (PG.kind === "trash") loadTrash();
}
$("bRefresh").onclick = doRefresh; $("bRefresh2").onclick = doRefresh;
(function(){
  var y0 = null, pulled = 0, sc = null;
  var ind = document.createElement("div"); ind.id = "ptr"; ind.innerHTML = ico("refresh"); document.body.appendChild(ind);
  function blocked(){ return SEL.on || SELDRAG || V.on || ED.on || !$("sheet").hidden || !$("gate").hidden; }
  function reset(){ y0 = null; pulled = 0; sc = null; ind.classList.remove("on", "ready"); ind.style.transform = ""; }
  document.addEventListener("touchstart", function(e){
    reset();
    if (e.touches.length !== 1 || blocked()) return;
    sc = e.target.closest && e.target.closest(".view:not([hidden]) .gs, #albScroll");
    if (sc && sc.scrollTop <= 0) y0 = e.touches[0].clientY; else sc = null;
  }, { passive: true });
  document.addEventListener("touchmove", function(e){
    if (y0 == null) return;
    if (sc.scrollTop > 0 || e.touches.length !== 1 || SELDRAG){ reset(); return; }
    pulled = Math.max(0, e.touches[0].clientY - y0);
    ind.style.transform = "translate(-50%," + Math.min(70, pulled / 2) + "px) rotate(" + (pulled * 2) + "deg)";
    ind.classList.toggle("on", pulled > 12); ind.classList.toggle("ready", pulled > 110);
  }, { passive: true });
  document.addEventListener("touchend", function(){ if (y0 != null && pulled > 110 && !blocked()) doRefresh(); reset(); }, { passive: true });
  document.addEventListener("touchcancel", reset, { passive: true });
})();
