/* --- Wikimedia Commons (seulement WebM / MP4, lisibles par le téléphone) --- */
function wcSearch(q){
  var u='https://commons.wikimedia.org/w/api.php?action=query&format=json&formatversion=2&origin=*&generator=search&gsrnamespace=6&gsrlimit=40&gsrsearch='+encodeURIComponent('filetype:video '+(q||'nature'))+
    '&prop=videoinfo&viprop=url|size|mime|extmetadata|derivatives&viurlwidth=480&viextmetadatafilter=LicenseShortName|Artist|ImageDescription|DateTimeOriginal';
  return getJSON(u).then(function(r){
    var pages=(r.query&&r.query.pages)||[]; if(!Array.isArray(pages)) pages=Object.keys(pages).map(function(k){ return pages[k]; });
    pages.sort(function(a,b){ return (a.index||0)-(b.index||0); });
    return pages.map(function(pg){
      var v=(pg.videoinfo||pg.imageinfo||[])[0]; if(!v) return null;
      var src=wcPick(v); if(!src) return null;
      var md=v.extmetadata||{}, val=function(k){ return md[k]?stripHtml(md[k].value):''; };
      return {k:'wc', id:'wc:'+pg.title, title:pg.title.replace(/^(File|Fichier):/,'').replace(/\.[a-z0-9]+$/i,'').replace(/_/g,' '), thumb:v.thumburl||'', dur:Math.round(v.duration||0),
        sub:val('Artist').slice(0,60)||'Wikimedia Commons', licence:val('LicenseShortName')||'Licence libre', desc:val('ImageDescription'), url:src, page:v.descriptionurl||''};
    }).filter(Boolean);
  });
}
function wcPick(v){
  function ok(type,url){ type=String(type||'').toLowerCase(); return /^video\/(webm|mp4)/.test(type) && !/theora|vorbis.*theora/.test(type) || /\.(webm|mp4)$/i.test(url||'') && !/ogg|ogv/.test(type); }
  var der=(v.derivatives||[]).filter(function(d){ return ok(d.type,d.src) && (+d.height||0)<=720; });
  der.sort(function(a,b){ return (+b.height||0)-(+a.height||0); });
  if(/^video\/(webm|mp4)/i.test(v.mime||'') && (v.size||0)<400*1048576 && !(der.length && (v.height||0)>720)) return v.url;
  return der[0] ? der[0].src : null;
}

/* --- YouTube : flux RSS officiel, lecture dans l'appli YouTube --- */
function ytParseInput(s){
  s=String(s||'').trim();
  var m=/(UC[\w-]{22})/.exec(s); if(m) return {id:m[1]};
  m=/youtube\.com\/(@[^\/?#\s]+)/i.exec(s)||/^(@[\w.\-À-ÿ]+)$/.exec(s); if(m) return {page:'https://www.youtube.com/'+m[1]};
  m=/youtube\.com\/(c|user)\/([^\/?#\s]+)/i.exec(s); if(m) return {page:'https://www.youtube.com/'+m[1]+'/'+m[2]};
  if(/^[\w.\-]{3,}$/.test(s)) return {page:'https://www.youtube.com/@'+s};
  return null;
}
function ytResolve(s){
  var p=ytParseInput(s); if(!p) return Promise.reject(new Error('Adresse de chaîne non reconnue'));
  if(p.id) return Promise.resolve(p.id);
  return ytPageId(p.page);
}
/* Lit seulement l'identifiant officiel de la chaîne (UC…) sur sa page publique */
function ytPageId(page){
  return get(page).then(function(h){
    var m=/<link rel="canonical" href="https:\/\/www\.youtube\.com\/channel\/(UC[\w-]{22})"/.exec(h)||/"externalId":"(UC[\w-]{22})"/.exec(h)||/"channelId":"(UC[\w-]{22})"/.exec(h)||/channel_id=(UC[\w-]{22})/.exec(h);
    if(!m) throw new Error('Chaîne introuvable : vérifie l\'adresse');
    return m[1];
  });
}
function ytFeed(id){
  return get('https://www.youtube.com/feeds/videos.xml?channel_id='+id).then(function(x){
    var doc=new DOMParser().parseFromString(x,'application/xml');
    if(doc.getElementsByTagName('parsererror').length) throw new Error('Flux de la chaîne illisible');
    var feedTitle=(doc.querySelector('feed > title')||{}).textContent||'Chaîne YouTube';
    var tx=function(el,tag){ var n=el.getElementsByTagName(tag)[0]; return n?n.textContent:''; };
    var items=Array.prototype.map.call(doc.getElementsByTagName('entry'),function(e){
      var vid=tx(e,'yt:videoId'), th=e.getElementsByTagName('media:thumbnail')[0], st=e.getElementsByTagName('media:statistics')[0], ln=e.getElementsByTagName('link')[0];
      return {k:'yt', id:'yt:'+vid, vid:vid, title:tx(e,'title'), date:tx(e,'published'), thumb:th?https(th.getAttribute('url')).replace('hqdefault','mqdefault'):'https://i.ytimg.com/vi/'+vid+'/mqdefault.jpg',
        sub:feedTitle, views:st?+st.getAttribute('views'):undefined, desc:tx(e,'media:description'), short:ln&&/\/shorts\//.test(ln.getAttribute('href')||'')};
    }).filter(function(v){ return /^[\w-]{11}$/.test(v.vid); });
    return {title:feedTitle, items:items};
  });
}

/* ---------- Abonnements : nouveautés ---------- */
function subKey(s){ return s.yt ? 'yt:'+s.id : 'pt:'+s.name+'@'+s.host; }
function allSubs(){ return D.ptSubs.map(function(s){ return Object.assign({},s); }).concat(D.ytSubs.map(function(s){ return Object.assign({yt:1},s); })); }
function newCount(s){ var k=subKey(s), c=D.cache[k], seen=D.seen[k]||0; if(!c) return 0; return c.items.filter(function(v){ return new Date(v.date).getTime()>seen; }).length; }

function updBadge(){ var n=newTotal(); $('subBadge').hidden=!n; $('subBadge').textContent=n>99?'99+':n; }
function fetchSub(s){
  var k=subKey(s);
  var p = s.yt ? ytFeed(s.id).then(function(f){ return f.items.slice(0,15); }) : ptChannelVideos(s,15);
  return p.then(function(items){
    D.cache[k]={at:Date.now(), items:items.map(function(v){ var o=Object.assign({},v); delete o.desc; return o; })};
    if(!(k in D.seen)) D.seen[k]=Date.now()-3*86400000;   // nouvel abonnement : la semaine passée compte comme récente
    return items;
  });
}
var refreshing=null;
function refreshSubs(force){
  if(refreshing) return refreshing;
  if(!force && Date.now()-D.lastRefresh<30*60000) return Promise.resolve();
  var l=allSubs(); if(!l.length) return Promise.resolve();
  refreshing=Promise.all(l.map(function(s){ return fetchSub(s).catch(function(){}); })).then(function(){ D.lastRefresh=Date.now(); save(); updBadge(); publish(); refreshing=null; });
  return refreshing;
}
function latestFromSubs(n){
  var all=[]; allSubs().forEach(function(s){ var c=D.cache[subKey(s)]; if(c) c.items.forEach(function(v){ var o=Object.assign({},v); o.isNew=new Date(v.date).getTime()>(D.seen[subKey(s)]||0); all.push(o); }); });
  all.sort(function(a,b){ return new Date(b.date)-new Date(a.date); });

}

function partId(i){ var o=LAST_DET.o; return LAST_DET.parts && LAST_DET.parts.length>1 ? o.id+'#'+i : o.id; }

function playDet(i, restart){

function resolveDet(o){
  if(o.k==='pt'){
    var base='https://'+o.host+'/api/v1/videos/'+o.uuid;
    return getJSON(base).then(function(v){
      var s=ptSource(v);
      var ch=v.channel||{}, av=(ch.avatars&&ch.avatars.length?ch.avatars[Math.min(1,ch.avatars.length-1)]:ch.avatar)||null;
      var chan={name:ch.name, host:ch.host||o.host, display:ch.displayName||ch.name, avatar:av?(av.fileUrl||(av.path?'https://'+(ch.host||o.host)+av.path:'')):''};
      var r={parts:s?[{url:s.url, dur:v.duration}]:[], licence:'Licence : '+((v.licence&&v.licence.label)||'non précisée')+(s?' · Qualité '+s.q:''), desc:v.description||'', chan:chan, page:v.url||('https://'+o.host+'/w/'+(v.shortUUID||v.uuid)),
        meta:[fmtViews(v.views), v.publishedAt?fmtDate(v.publishedAt):'', v.duration?fmtT(v.duration):''].filter(Boolean).join(' · ')};
      if(!s) return r;
      // Sous-titres français si l'instance en propose
      return getJSON(base+'/captions').then(function(c){
        var fr=(c.data||[]).filter(function(x){ return x.language && x.language.id==='fr'; })[0];
        if(fr) r.parts[0].srt = fr.fileUrl || ('https://'+o.host+fr.captionPath);
        return r;
      }).catch(function(){ return r; });
    });
  }
  if(o.k==='ia'){
    return getJSON('https://archive.org/metadata/'+encodeURIComponent(o.ident)).then(function(md){
      var m=md.metadata||{};
      var parts=iaFiles(md);
      var lic=licName(Array.isArray(m.licenseurl)?m.licenseurl[0]:m.licenseurl, o.coll||(Array.isArray(m.collection)?m.collection[0]:m.collection));
      return {parts:parts, licence:'Licence : '+lic, desc:stripHtml(Array.isArray(m.description)?m.description.join('\n'):m.description), page:'https://archive.org/details/'+o.ident,
        meta:[m.year||(m.date||'').slice(0,4), Array.isArray(m.creator)?m.creator[0]:m.creator, parts.length===1&&parts[0].dur?fmtT(parts[0].dur):'', parts.length===1?fmtSize(parts[0].size):''].filter(Boolean).join(' · ')};
    });
  }
  if(o.k==='nasa'){
    return getJSON(o.manifest).then(function(urls){
      var s=nasaPick(urls);
      return {parts:s?[{url:s.url, srt:s.srt}]:[], licence:o.licence, page:'https://images.nasa.gov/details/'+encodeURIComponent(o.nasaId)};
    });
  }
  if(o.k==='wc') return Promise.resolve({parts:[{url:o.url, dur:o.dur}], licence:'Licence : '+o.licence, page:o.page});
  return Promise.reject(new Error('Source inconnue'));
}

    '<div class="app" data-q="'+esc((NFAJ.name+' musée archive film japon avant-guerre').toLowerCase())+'">'+aniLogo({c:'#5b4a3a',lg:'NFAJ'})+'<div class="t"><b>'+esc(NFAJ.name)+'</b><span class="pst free">Gratuit</span><span>'+esc(NFAJ.d)+'</span></div><div class="act"><button class="btn sm" data-anfaj="1">Site</button></div></div></div>';
  h+='<div data-blk="1" data-q="peertube animation libre"><div class="sect">Animation sous licence libre · PeerTube</div><div id="aPt">'+skel(3)+'</div></div>';
  h+='<div id="aNone" hidden>'+emptyBox(I.search,'Rien ici pour « '+aniQ+' ». Appuie sur Entrée pour chercher sur PeerTube (licences libres).')+'</div>';
  h+='<p class="foot">Infos vérifiées en '+ANI_DATE+'. Les offres gratuites changent souvent : en cas de doute, l\'appli ou le site officiel fait foi.</p>';
  $('main').innerHTML=h;
  aniFilter();
  var qa=$('qa');
  qa.addEventListener('input',function(){ aniQ=qa.value.trim(); $('qax').hidden=!qa.value; aniFilter(); });
  qa.addEventListener('keydown',function(e){ if(e.key==='Enter'){ qa.blur(); aniQ=qa.value.trim(); aniPt(); aniFilter(); } });
  $('main').onclick=function(e){
    var t=e.target.closest('[data-ach],[data-afol],[data-apf],[data-fav],[data-anfaj],[data-acont],[data-it],[data-retry],#qax'); if(!t) return;
    if(t.id==='qax'){ aniQ=''; viewAnime(); return; }
    if(t.dataset.retry){ aniPt(); return; }
    if(t.dataset.it){ aniMark(ITEMS[t.dataset.it]); return; }   // l'ouverture est faite par l'écouteur commun
    if(t.dataset.acont){ var x=continueItems().filter(function(c){ return c.id===t.dataset.acont; })[0]; if(x) play([{url:x.p.item.url, title:x.p.item.title, sub:x.p.item.sub, id:x.id, thumb:x.p.item.thumb}],0); return; }
    if(t.dataset.fav){ aniToggleFav(t.dataset.fav, t.dataset.fname); var y=window.scrollY; viewAnime(); window.scrollTo(0,y); return; }
    if(t.dataset.anfaj){ if(A&&A.openUrl) A.openUrl(NFAJ.url); else toast('S\'ouvre dans le navigateur'); return; }
    if(t.dataset.apf){ aniOpenPf(ANI_PF.filter(function(x){ return x.k===t.dataset.apf; })[0], inst); return; }
    var c=ANI_CH.filter(function(x){ return x.k===(t.dataset.ach||t.dataset.afol); })[0]; if(!c) return;
    var old=t.innerHTML; t.innerHTML='<span class="spin sm"></span>'+(t.dataset.afol?'':old);
    aniResolve(c).then(function(id){
      if(t.dataset.afol) aniToggleFollow(c,id);
      else go('chan',{key:'yt:'+id, title:c.name});
    }).catch(function(e){ t.innerHTML=old; toast(e.message,true); });
  };
  aniPt();
}
function aniFilter(){
  var q=aniQ.toLowerCase(), any=false;
  document.querySelectorAll('#main [data-blk]').forEach(function(b){
    // Bloc PeerTube : visible sans recherche, ou une fois la recherche lancée (Entrée)
    if(b.dataset.q!=null){ var show=!q||!!ANIPT[q]; b.hidden=!show; if(show&&q) any=true; return; }
    var n=0;
    b.querySelectorAll('[data-q]').forEach(function(el){ var ok=!q||el.dataset.q.indexOf(q)>=0; el.hidden=!ok; if(ok) n++; });
    b.hidden=!n;
    if(n) any=true;
  });
  var c=$('aCont'); if(c) c.hidden=!!q;
  var none=$('aNone'); if(none){ none.hidden=any||!q; if(!none.hidden) none.innerHTML=emptyBox(I.search,'Rien ici pour « '+aniQ+' ». Appuie sur Entrée pour chercher sur PeerTube (licences libres).'); }
}
function aniPt(){
  var q=aniQ||'', key=q.toLowerCase(), el=$('aPt'); if(!el) return;
  var term=q ? q+' animation' : 'animation';
  el.innerHTML='<div class="note" style="margin:-3px 2px 4px">'+(q?'Résultats pour « '+esc(q)+' » ':'Courts métrages et films d\'animation ')+'publiés sous licence Creative Commons ou dans le domaine public.</div>'+skel(3);
  var p=ANIPT[key]||(ANIPT[key]=ptSearch(term,{libre:1, anyLang:1, count:12}).then(function(r){ return r.items; }));
  p.then(function(l){
    var e=$('aPt'); if(!e||cur.view!=='anime'||(aniQ||'').toLowerCase()!==key) return;
    e.innerHTML=e.firstChild.outerHTML+(l.length?l.map(li).join(''):emptyBox(I.search,'Aucune vidéo sous licence libre trouvée.'));
    aniFilter();
  }).catch(function(err){ delete ANIPT[key]; var e=$('aPt'); if(e&&cur.view==='anime') e.innerHTML=errBox(err); });
}
function aniToggleFollow(c,id){
  if(D.ytSubs.some(function(s){ return s.id===id; })){ D.ytSubs=D.ytSubs.filter(function(s){ return s.id!==id; }); delete D.cache['yt:'+id]; delete D.seen['yt:'+id]; toast('Tu ne suis plus '+c.name); }
  else { D.ytSubs.push({id:id, title:c.name, thumb:''}); D.seen['yt:'+id]=Date.now()-3*86400000; toast('Tu suis '+c.name+' : ses vidéos arrivent dans Chaînes'); fetchSub({yt:1,id:id}).then(function(){ save(); updBadge(); publish(); }).catch(function(){}); }
  save(); updBadge(); publish();
  if(cur.view==='anime'){ var y=window.scrollY; viewAnime(); window.scrollTo(0,y); }
}
function aniOpenPf(x, inst){
  if(!x) return;
  if(!A){ toast('S\'ouvre dans l\'application Écran'); return; }
  if(inst[x.pkg] && A.openApp) A.openApp(x.pkg, x.name);
  else if(A.openUrl) A.openUrl(x.url);
}

/* ---------- Démarrage ---------- */
var _render=render;
render=function(v,a,r){ if(cur.view==='subs' && v!=='subs') markAllSeen(); _render(v,a,r); };
/* ---------- Actualiser : relit la vue affichée en gardant la position (vidéos du téléphone, chaînes suivies,
   recherches PeerTube et vidéos libres, avancement) — bouton ⟳ ou glisser vers le bas en haut de la page ---------- */
var refreshingAll=null;
function doRefresh(){
  if(refreshingAll) return refreshingAll;
  var b=$('bRef'), t0=Date.now(), v=cur.view, a=cur.args, job;
  b.classList.add('spinning');
  loadPos();
  if(v==='mine'||v==='folder'){
    // la liste reste affichée pendant la relecture : onScan la redessine à la même position
    job=new Promise(function(res){ if(LOCAL===null || !A || !A.scan){ render(v,a,true); } else scanLocal(); var k=0, w=setInterval(function(){ if((LOCAL!==null && !scanning) || ++k>200){ clearInterval(w); res(); } },100); });
  } else if(v==='home'||v==='subs'||v==='chan'){
    if(A && A.scan && A.perm && A.perm()!=='none' && !scanning) scanLocal();
    if(v==='home') HOME={};
    job=refreshSubs(true).then(function(){ if(cur.view===v) render(v,a,true); });
  } else {
    if(v==='pt') PTR=null;
    else if(v==='lib') LIBR={};
    else if(v==='anime') ANIPT={};
    render(v,a,true); job=Promise.resolve();
  }
  refreshingAll=job.then(function(){ refreshProgress(); updBadge(); publish(); toast('Actualisé'); }).catch(function(){ toast('Actualisé'); }).then(function(){
    setTimeout(function(){ b.classList.remove('spinning'); }, Math.max(0, 700-(Date.now()-t0)));
    refreshingAll=null;
  });
  return refreshingAll;
}
$('bRef').onclick=function(){ doRefresh(); };
(function(){
  var y0=null, pulled=0;
  var ind=document.createElement('div'); ind.id='ptr'; ind.innerHTML='<svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M20 11a8 8 0 1 0-2.3 5.7\"/><path d=\"M20 4v7h-7\"/></svg>'; document.body.appendChild(ind);
  function reset(){ y0=null; pulled=0; ind.classList.remove('on','ready'); ind.style.transform=''; }
  var m=$('main');
  m.addEventListener('touchstart',function(e){ y0=(window.scrollY<=0 && e.touches.length===1) ? e.touches[0].clientY : null; pulled=0; },{passive:true});
  m.addEventListener('touchmove',function(e){ if(y0==null) return; if(window.scrollY>0){ reset(); return; } pulled=Math.max(0,e.touches[0].clientY-y0); ind.style.transform='translate(-50%,'+Math.min(70,pulled/2)+'px) rotate('+(pulled*2)+'deg)'; ind.classList.toggle('on',pulled>12); ind.classList.toggle('ready',pulled>110); },{passive:true});
  m.addEventListener('touchend',function(){ if(y0!=null && pulled>110) doRefresh(); reset(); },{passive:true});
  m.addEventListener('touchcancel',reset,{passive:true});
})();

updBadge();
render('home');
if(A && A.scan && A.perm && A.perm()!=='none') scanLocal();
publish();
document.addEventListener('visibilitychange',function(){
  if(document.hidden){ markAllSeen(); return; }
  loadPos(); refreshProgress(); publish();
  if(A && A.perm && cur.view==='mine' && LOCAL===null) render('mine');
});
setTimeout(function(){ try{ if(P && P.takeSocle){ var x=P.takeSocle(); if(x) window.onSocle(x); } }catch(e){} },500);
})();
</script>
