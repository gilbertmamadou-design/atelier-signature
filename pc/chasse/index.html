 ["lievre","Lièvre","🐇","petit"],["lapin","Lapin de garenne","🐇","petit"],["faisan","Faisan","🐓","petit"],["perdrixg","Perdrix grise","🐦","petit"],["perdrixr","Perdrix rouge","🐦","petit"],

const S={prises:[],sorties:[],plans:[],obs:[],chiens:[],battues:[],armes:[],postes:[],settings:{nom:"",permis:"",territoire:"",mode:"Battue",dept:""},view:"dash",cur:null,photoCache:{},db:null,uid:null,assets:null,sample:null,downloads:null};

function parseTiff(v,t){

  const ascii=tag=>{const off=tag.count>4?t+u32(tag.vo):tag.vo;let s="";for(let i=0;i<tag.count;i++){const c=v.getUint8(off+i);if(!c)break;s+=String.fromCharCode(c)}return s};
  const out={}, i0=ifd(t+u32(t+4));
  try{ if(i0[0x8825]){ const g=ifd(t+u32(i0[0x8825].vo)); if(g[2]&&g[4]){ const la=rat(t+u32(g[2].vo),3), ln=rat(t+u32(g[4].vo),3); let lat=la[0]+la[1]/60+la[2]/3600, lng=ln[0]+ln[1]/60+ln[2]/3600;

  try{ if(i0[0x8769]){const ex=ifd(t+u32(i0[0x8769].vo)); if(ex[0x9003]) out.taken=ascii(ex[0x9003]);} }catch(e){}
  return out; }

function devicePos(maxAge=120000){ return new Promise(ok=>{ if(maxAge&&S.lastPos&&Date.now()-S.lastPos.t<maxAge) return ok(S.lastPos); if(!navigator.geolocation) return ok(null);

async function ingestPhotos(files){ const out=[]; let nogps=0;
  for(const f of files){ try{ const exif=parseExif(await f.arrayBuffer()), c=await compress(f,1280,.75), small=await compress(f,720,.7);
    const p={id:uid(),w:c.w,h:c.h,lat:exif.lat??null,lng:exif.lng??null,taken:exif.taken||null,added:new Date().toISOString()};
    if(p.lat==null&&Date.now()-(f.lastModified||0)<5*60e3){ const d=await devicePos(); if(d){ p.lat=+d.lat.toFixed(6); p.lng=+d.lng.toFixed(6); } }
    if(p.lat==null) nogps++;
    S.photoCache[p.id]=c.dataUrl;
    if(S.assets){ try{ p.asset=(await S.assets.upload(c.blob)).id; }catch(e){} }
    if(!p.asset){ if(!(await IDB.put(p.id,small.dataUrl))) p.data=small.dataUrl; }

  return out; }

const NOTIF_IDS={end:8101};
function sched(id,at,title,text){ if(!(MP&&MP.scheduleNotif)) return false; const d=at-Date.now(); if(d<=0) return false; try{ MP.scheduleNotif(d,title,text,id); return true; }catch(e){ return false; } }
function unsched(id){ try{ MP&&MP.cancelNotif&&MP.cancelNotif(id); }catch(e){} }
const hashId=s=>{ let h=7; for(const c of String(s)) h=(h*31+c.charCodeAt(0))|0; return 20000+Math.abs(h)%900000; };
const bDate=b=>new Date(`${b.date}T${b.heure||"08:00"}`);
function battueReminders(b){ const at=bDate(b).getTime(), id=hashId(b.id); unsched(id); unsched(id+1);
  if(b.rappel===false||b.annulee) return;
  const veille=new Date(bDate(b)); veille.setDate(veille.getDate()-1); veille.setHours(19,0,0,0);
  sched(id,veille.getTime(),`🦌 Battue demain – ${b.lieu||""}`,`Rendez-vous ${fmtD(b.date)} à ${b.heure||"8:00"}${b.rdv?" : "+b.rdv:""}. Gilet orange, permis validé, assurance.`);
  sched(id+1,at-3600e3,`⏰ Battue dans 1 heure`,`Rendez-vous à ${b.heure||"8:00"}${b.rdv?" – "+b.rdv:""}.`); }

function dest(lat,lng,brg,m){ const R=6371000, d=m/R, b=brg*Math.PI/180, la=lat*Math.PI/180, lo=lng*Math.PI/180; const la2=Math.asin(Math.sin(la)*Math.cos(d)+Math.cos(la)*Math.sin(d)*Math.cos(b)), lo2=lo+Math.atan2(Math.sin(b)*Math.sin(d)*Math.cos(la),Math.cos(d)-Math.sin(la)*Math.sin(la2)); return [la2*180/Math.PI,lo2*180/Math.PI]; }

function keepY(fn){ const y=scrollY; fn(); scrollTo(0,y); }
async function battueMap(b,touch){ let L; try{ L=await loadLeaflet(); }catch(e){ $("#bmap").innerHTML=`<div class="empty">Carte indisponible hors connexion. Les postes placés à votre position restent enregistrés.</div>`; return; } if(!$("#bmap")) return;
  const sat=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:"Imagerie © Esri"}), plan=L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"});
  const map=L.map("bmap",{layers:[sat]}); L.control.layers({"Satellite":sat,"Plan":plan},null,{position:"topright"}).addTo(map);
  const P=b.postes.filter(p=>p.lat!=null);
  if(P.length){ map.fitBounds(L.latLngBounds(P.map(p=>[p.lat,p.lng])).pad(.4),{maxZoom:17}); } else { const c=S.settings.loc||S.lastPos; map.setView(c?[c.lat,c.lng]:[46.6,2.4],c?15:5); }
  if(P.length>1) L.polyline(P.map(p=>[p.lat,p.lng]),{color:"#ffffff",weight:2,dashArray:"6 6"}).addTo(map);
  P.forEach((p,i)=>{ [P[i-1],P[i+1]].filter(Boolean).forEach(n=>{ const br=bearing(p,n), r=140, pts=[[p.lat,p.lng]]; for(let a=-30;a<=30;a+=5) pts.push(dest(p.lat,p.lng,br+a,r)); L.polygon(pts,{color:"#C0362C",weight:1,fillColor:"#C0362C",fillOpacity:.35}).addTo(map); });
    L.marker([p.lat,p.lng],{icon:L.divIcon({className:"",html:`<div style="width:30px;height:30px;border-radius:50%;background:#D9480F;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4)">${b.postes.indexOf(p)+1}</div>`,iconSize:[30,30],iconAnchor:[15,15]})}).addTo(map).bindPopup(`Poste ${b.postes.indexOf(p)+1}${p.nom?" : "+esc(p.nom):""}`); });
  map.on("click",e=>{ if(!S.tapAdd) return; S.tapAdd=false; b.postes.push({lat:+e.latlng.lat.toFixed(6),lng:+e.latlng.lng.toFixed(6),nom:""}); touch(); keepY(renderBattue); });
  setTimeout(()=>map.invalidateSize(),200); }
function signPad(title){ return new Promise(res=>{ const ov=document.createElement("div"); ov.className="overlay";
  ov.innerHTML=`<div class="sheet stack"><h2>${esc(title)}</h2><canvas style="width:100%;height:200px;background:#fff;border-radius:10px;border:1px solid var(--line);touch-action:none"></canvas><div class="row"><button class="btn" data-a="x">Annuler</button><button class="btn" data-a="c">Effacer</button><button class="btn green grow" data-a="ok">Valider</button></div></div>`;
  document.body.appendChild(ov); const cv=ov.querySelector("canvas"), r=devicePixelRatio||1; cv.width=cv.clientWidth*r; cv.height=cv.clientHeight*r; const ctx=cv.getContext("2d"); ctx.scale(r,r); ctx.lineWidth=2.4; ctx.lineCap="round"; ctx.strokeStyle="#14233a";
  let dr=false,dirty=false,last=null; const pos=e=>{ const q=cv.getBoundingClientRect(); return {x:e.clientX-q.left,y:e.clientY-q.top}; };
  cv.onpointerdown=e=>{ dr=true; last=pos(e); cv.setPointerCapture(e.pointerId); }; cv.onpointermove=e=>{ if(!dr) return; const p=pos(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; dirty=true; }; cv.onpointerup=()=>dr=false;
  ov.querySelector('[data-a="x"]').onclick=()=>{ ov.remove(); res(null); }; ov.querySelector('[data-a="c"]').onclick=()=>{ ctx.clearRect(0,0,cv.width,cv.height); dirty=false; };
  ov.querySelector('[data-a="ok"]').onclick=()=>{ if(!dirty){ toast("Signez d'abord"); return; } const u=cv.toDataURL("image/png"); ov.remove(); res(u); }; }); }
async function battuePdf(b){ try{ if(!(await need("jspdf","../shared/vendor/jspdf.umd.min.js","https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"))) throw new Error("module PDF indisponible");

  let y=40; doc.setTextColor(24,35,29); doc.setFontSize(10); [["Chef de battue",b.chef],["Rendez-vous",b.rdv],["Especes chassees",b.especes]].forEach(([k,v])=>{ doc.setFont("helvetica","bold"); doc.text(k+" :",M,y); doc.setFont("helvetica","normal"); doc.text(cl(v||"-"),M+38,y); y+=6; }); y+=2;

  doc.setFillColor(225,235,226); doc.rect(M,y,W-2*M,7,"F"); [["Nom",M+1],["Poste",M+70],["Permis",M+88],["Gilet",M+106],["Signature",M+124]].forEach(([l,x])=>doc.text(l,x,y+4.8)); y+=8; doc.setFont("helvetica","normal");
  b.participants.forEach(p=>{ if(y>270){ doc.addPage(); y=16; } doc.text(cl(p.nom||"-"),M+1,y+6); doc.text(cl(p.poste||"-"),M+70,y+6); doc.text(p.permis?"oui":"non",M+88,y+6); doc.text(p.gilet?"oui":"non",M+106,y+6); if(p.sig){ try{ doc.addImage(p.sig,"PNG",M+124,y,44,11); }catch(e){} } doc.setDrawColor(211,219,212); doc.line(M,y+12,W-M,y+12); y+=13; });
  if(b.postes.length){ y+=4; if(y>250){ doc.addPage(); y=16; } doc.setFont("helvetica","bold"); doc.setFontSize(12); doc.text("Postes",M,y); y+=6; doc.setFont("helvetica","normal"); doc.setFontSize(9.5); b.postes.forEach((p,i)=>{ if(y>285){ doc.addPage(); y=16; } doc.text(cl(`${i+1}. ${p.nom||"-"}  (${p.lat}, ${p.lng})`),M,y); y+=5.5; }); }
  await giveFile(doc.output("blob"),`Battue_${b.date}.pdf`,"application/pdf"); }catch(e){ toast("PDF impossible : "+(e?.message||e)); } }

const distM=(a,b)=>{ const R=6371000,t=x=>x*Math.PI/180, dl=t(b.lat-a.lat), dn=t(b.lng-a.lng), h=Math.sin(dl/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dn/2)**2; return 2*R*Math.asin(Math.sqrt(h)); };

function posteStats(p){ const P=S.prises.filter(x=>x.posteId===p.id); return {n:P.reduce((t,x)=>t+(+x.nombre||1),0),last:P.sort((a,b)=>String(b.date).localeCompare(String(a.date)))[0]}; }
function nearestPoste(lat,lng,max=150){ let best=null,bd=1e9; S.postes.forEach(p=>{ if(p.lat==null) return; const d=distM({lat,lng},p); if(d<bd){ bd=d; best=p; } }); return bd<=max?best:null; }

      <div class="grid2"><label class="f">État<select data-f="etat">${Object.entries(PETAT).map(([k,v])=>`<option value="${k}" ${p.etat===k?"selected":""}>${v[0]}</option>`).join("")}</select></label>${f("verif","Dernière vérification","","date")}</div>

    <div class="card stack"><h2>📍 Position</h2><b>${p.lat!=null?`${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}`:"Pas encore de position"}</b>${me&&p.lat!=null?`<span>Vous êtes à <b>${fmtM(distM(me,p))}</b>${distM(me,p)>15?` · direction <b>${DIR8[Math.round(bearingDeg(me,p)/45)%8]}</b> (${Math.round(bearingDeg(me,p))}°)`:" · vous y êtes"}</span>`:""}
      <div class="row"><button class="btn small green" id="pHere">📍 Ma position actuelle</button><button class="btn small" id="pTap">👆 ${S.tapP?"Touchez la carte…":"Placer sur la carte"}</button>${p.lat!=null?`<a class="btn small" href="${gmaps(p.lat,p.lng)}" target="_blank" rel="noopener">🧭 Y aller (Google Maps)</a>`:""}</div>
      <div class="mapwrap"><div id="pmap" style="height:260px;background:var(--forest-bg)"></div></div></div>
    <div class="card stack"><h2>🎯 Secteur de tir</h2><span class="muted small">Direction vers laquelle on tire depuis ce poste ; elle est dessinée sur la carte.</span>
      <div class="row">${DIR8.map((d,i)=>`<button class="fchip ${p.dir!==""&&p.dir!=null&&Math.round(p.dir/45)%8===i?"on":""}" data-dir="${i*45}">${d}</button>`).join("")}<button class="fchip" id="dirAim">📱 Viser avec le téléphone</button>${p.dir!==""&&p.dir!=null?`<button class="fchip" data-dir="">Effacer</button>`:""}</div>
      <label class="f">Ouverture du secteur : <span data-ov>${p.angle||90}°</span><input type="range" min="20" max="180" step="10" id="pAng" value="${p.angle||90}"></label></div>
    <div class="card stack"><label class="f">Notes<textarea data-f="notes" placeholder="Accès, échelle, vent favorable, lignes de tir interdites…">${esc(p.notes)}</textarea></label>${st.n?`<span>🎯 <b>${st.n}</b> pièce(s) prélevée(s) à ce poste${st.last?`, dernière le ${fmtD(st.last.date)} (${esc(labOf(st.last))})`:""}.</span>`:""}</div>
    <button class="btn green" id="pSave">✔ Enregistrer le poste</button>${saved?`<button class="btn danger" id="pDel">Supprimer ce poste</button>`:""}</div>`;
  const touch=()=>{ if(S.postes.some(x=>x.id===p.id)) save(p); };
  app.querySelectorAll("[data-f]").forEach(el=>el.addEventListener(el.tagName==="SELECT"||el.type==="date"?"change":"input",()=>{ p[el.dataset.f]=el.value; touch(); }));
  app.querySelectorAll("[data-ty]").forEach(b=>b.onclick=()=>{ p.type=b.dataset.ty; touch(); keepY(renderPoste); });
  app.querySelectorAll("[data-dir]").forEach(b=>b.onclick=()=>{ p.dir=b.dataset.dir===""?"":+b.dataset.dir; touch(); keepY(renderPoste); });
  $("#dirAim").onclick=()=>{ if(HEADING==null){ toast("Boussole indisponible sur cet appareil : choisissez la direction"); return; } p.dir=Math.round(HEADING); touch(); toast(`Direction enregistrée : ${p.dir}° (${DIR8[Math.round(p.dir/45)%8]})`); keepY(renderPoste); };
  $("#pAng").oninput=e=>{ p.angle=e.target.value; app.querySelector("[data-ov]").textContent=p.angle+"°"; touch(); };
  $("#pAng").onchange=()=>keepY(renderPoste);
  $("#pHere").onclick=async()=>{ const d=await devicePos(0); if(!d){ toast("Position indisponible : activez la localisation"); return; } p.lat=+d.lat.toFixed(6); p.lng=+d.lng.toFixed(6); touch(); toast(`Position enregistrée (précision ${Math.round(d.acc||0)} m)`); keepY(renderPoste); };
  $("#pTap").onclick=()=>{ S.tapP=!S.tapP; keepY(renderPoste); };
  $("#pph").onchange=async e=>{ const fl=[...e.target.files]; e.target.value=""; if(!fl.length) return; const ph=(await ingestPhotos(fl))[0]; if(ph){ p.photo=ph; if(p.lat==null&&ph.lat!=null){ p.lat=ph.lat; p.lng=ph.lng; } touch(); keepY(renderPoste); } };
  if($("#pphImg")) photoSrc(p.photo).then(s=>$("#pphImg").src=s);
  $("#pSave").onclick=()=>{ if(p.lat==null){ toast("Donnez la position du poste (ma position, ou sur la carte)"); return; } save(p); toast("Poste enregistré"); go("postes"); };
  if($("#pDel")) $("#pDel").onclick=async()=>{ await remove(p); toast("Poste supprimé"); go("postes"); };
  posteMap(p,touch); }
const bearingDeg=(a,b)=>{ const t=x=>x*Math.PI/180, f1=t(a.lat),f2=t(b.lat),dl=t(b.lng-a.lng); return (Math.atan2(Math.sin(dl)*Math.cos(f2),Math.cos(f1)*Math.sin(f2)-Math.sin(f1)*Math.cos(f2)*Math.cos(dl))*180/Math.PI+360)%360; };
function sectorPts(p,r=200){ const a=+(p.angle||90), pts=[[p.lat,p.lng]]; for(let x=-a/2;x<=a/2;x+=5) pts.push(dest(p.lat,p.lng,+p.dir+x,r)); return pts; }
function posteIcon(L,p,big){ return L.divIcon({className:"",html:`<div style="width:${big?40:34}px;height:${big?40:34}px;border-radius:10px;background:#fff;border:3px solid ${p.etat&&p.etat!=="bon"?"#C0362C":"#2C5A38"};display:flex;align-items:center;justify-content:center;font-size:${big?20:17}px;box-shadow:0 2px 6px rgba(0,0,0,.4);position:relative">${ptOf2(p)[1]}${p.num?`<b style="position:absolute;bottom:-9px;right:-9px;background:#D9480F;color:#fff;border-radius:99px;font:700 11px sans-serif;padding:1px 5px;border:2px solid #fff">${esc(p.num)}</b>`:""}</div>`,iconSize:[big?40:34,big?40:34],iconAnchor:[big?20:17,big?20:17]}); }
async function posteMap(p,touch){ const el=$("#pmap"); let L; try{ L=await loadLeaflet(); }catch(e){ if(el) el.innerHTML=`<div class="empty">Carte indisponible hors connexion.</div>`; return; } if(!el||!el.isConnected||el._leaflet_id) return;
  const sat=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:"Imagerie © Esri"}), m=L.map(el,{layers:[sat]});
  const c=p.lat!=null?p:S.lastPos||S.settings.loc; m.setView(c?[c.lat,c.lng]:[46.6,2.4],c?16:5);
  S.postes.filter(x=>x.id!==p.id&&x.lat!=null).forEach(x=>L.marker([x.lat,x.lng],{icon:posteIcon(L,x),opacity:.7}).addTo(m).bindPopup(esc(posteLab(x))));
  if(p.lat!=null){ if(p.dir!==""&&p.dir!=null) L.polygon(sectorPts(p),{color:"#D9480F",weight:1,fillColor:"#D9480F",fillOpacity:.25}).addTo(m); L.marker([p.lat,p.lng],{icon:posteIcon(L,p,true),draggable:true}).addTo(m).on("dragend",e=>{ const l=e.target.getLatLng(); p.lat=+l.lat.toFixed(6); p.lng=+l.lng.toFixed(6); touch(); keepY(renderPoste); }); }
  if(S.lastPos) L.circleMarker([S.lastPos.lat,S.lastPos.lng],{radius:7,color:"#fff",weight:3,fillColor:"#1E6FD9",fillOpacity:1}).addTo(m);
  m.on("click",e=>{ if(!S.tapP) return; S.tapP=false; p.lat=+e.latlng.lat.toFixed(6); p.lng=+e.latlng.lng.toFixed(6); touch(); keepY(renderPoste); });
  setTimeout(()=>m.invalidateSize(),200); }
function pickPostes(b,done){ const list=S.postes.filter(p=>p.lat!=null).sort((x,y)=>String(x.num||"").localeCompare(String(y.num||""),"fr",{numeric:true})), sel=new Set();
  if(!list.length){ toast("Aucun poste enregistré : Plus › Postes et miradors"); return; }
  const ov=document.createElement("div"); ov.className="overlay"; ov.innerHTML=`<div class="sheet stack"><h2>Choisir les postes de la battue</h2>${list.map(p=>`<label class="row" style="flex-wrap:nowrap;gap:10px"><input type="checkbox" value="${p.id}" style="width:22px;height:22px;min-height:0" ${b.postes.some(x=>x.posteId===p.id)?"checked disabled":""}> <span>${esc(posteLab(p))}<br><span class="muted small">${esc(p.territoire||"")}</span></span></label>`).join("")}<div class="row"><button class="btn" data-a="all">Tout cocher</button><button class="btn green grow" data-a="ok">Ajouter</button><button class="btn" data-a="x">Annuler</button></div></div>`;
  document.body.appendChild(ov); ov.onclick=e=>{ const a=e.target.dataset.a; if(e.target===ov||a==="x"){ ov.remove(); return; } if(a==="all") ov.querySelectorAll("input:not(:disabled)").forEach(c=>c.checked=true);
    if(a==="ok"){ ov.querySelectorAll("input:checked:not(:disabled)").forEach(c=>{ const p=S.postes.find(x=>x.id===c.value); b.postes.push({lat:p.lat,lng:p.lng,nom:"",posteId:p.id,label:posteLab(p)}); }); ov.remove(); done(); } }; }

/* ================= DÉMARRAGE ================= */
lsLoad(); render(); setTimeout(()=>{ scheduleEnd(); S.battues.forEach(b=>{ if(b.date>=nowLocal().slice(0,10)) battueReminders(b); }); },3000);
setTimeout(()=>{ if(MP&&MP.askLocation){ try{ MP.askLocation(); }catch(e){} } },2000);
(async()=>{ const c=CLX; if(!c?.use) return;
  try{ S.downloads=await c.use("downloads"); }catch(e){}
  try{ S.assets=await c.use("assets"); }catch(e){}
  try{ S.sample=await c.use("sample"); if(S.view==="prise") render(); }catch(e){}
  try{ const [db,user]=await Promise.all([c.use("db"),c.use("user")]); if(db&&user){ const id=await user.id(); if(id){ S.db=db; S.uid=id;
    const snap=await db.collection("data/users/"+id).get(); let ch=0;
    snap.docs.filter(d=>d.exists).forEach(d=>{ const o=JSON.parse(JSON.stringify(d.data())); if(o.kind==="settings"){ Object.assign(S.settings,o); return; } const k=ARR[o.kind]; if(!k) return; const a=S[k], i=a.findIndex(x=>x.id===o.id); if(i<0||(a[i].updated||0)<(o.updated||0)){ if(i<0) a.push(o); else a[i]=o; ch++; } });
    for(const k of ALLK) for(const o of S[k]) if(!snap.docs.some(d=>d.id===o.id)) persist(o);
    lsSave(); if(ch) render(); } } }catch(e){} })();

<script>/* Application Android : impression (MAGPrint.printHtml), et fichiers téléchargés -> menu Android (enregistrer dans un dossier, e-mail, partager, imprimer) */
(function(){if(!window.MAGPrint)return;var MP=window.MAGPrint;
function fixForms(src,dst){var a=src.querySelectorAll("input,textarea,select"),b=dst.querySelectorAll("input,textarea,select");for(var i=0;i<a.length&&i<b.length;i++){var x=a[i],y=b[i];if(x.tagName==="TEXTAREA")y.textContent=x.value;else if(x.tagName==="SELECT"){Array.prototype.forEach.call(y.options,function(o,k){if(k===x.selectedIndex)o.setAttribute("selected","");else o.removeAttribute("selected")})}else if(x.type==="checkbox"||x.type==="radio"){if(x.checked)y.setAttribute("checked","");else y.removeAttribute("checked")}else y.setAttribute("value",x.value)}}
function snap(win){var doc=win.document,d=doc.documentElement.cloneNode(true);fixForms(doc.documentElement,d);d.querySelectorAll("script").forEach(function(s){s.remove()});
  doc.querySelectorAll("canvas").forEach(function(c,i){try{var img=d.querySelectorAll("canvas")[i];if(img){var im=doc.createElement("img");im.src=c.toDataURL("image/png");im.style.cssText="max-width:100%";img.replaceWith(im)}}catch(e){}});
  return "<!doctype html>"+d.outerHTML}
function toB64(blob){return new Promise(function(ok,ko){var r=new FileReader();r.onload=function(){var x=String(r.result);ok(x.slice(x.indexOf(",")+1))};r.onerror=ko;r.readAsDataURL(blob)})}
function sendFile(href,name,win){if(!MP.fileMenu)return false;(win||window).fetch(href).then(function(r){return r.blob()}).then(function(b){return toB64(b).then(function(x){MP.fileMenu(x,name||"fichier",b.type||"application/octet-stream","","","")})}).catch(function(){});return true}
function openBlob(href,name,win){if(!MP.openFile)return sendFile(href,name,win);(win||window).fetch(href).then(function(r){return r.blob()}).then(function(b){return toB64(b).then(function(x){MP.openFile(x,name||("document"+(b.type.indexOf("pdf")>=0?".pdf":"")),b.type||"application/octet-stream")})}).catch(function(){});return true}
function hook(win){if(!win||win.__magp)return;win.__magp=1;
  /* liens créés par programme (a.click() hors de la page) */
  try{var AC=win.HTMLAnchorElement.prototype.click;win.HTMLAnchorElement.prototype.click=function(){var h=this.getAttribute("href")||"";if(/^(blob:|data:)/.test(h)){if(this.hasAttribute("download")){sendFile(h,this.getAttribute("download"),win);return}if(this.target==="_blank"){openBlob(h,"",win);return}}return AC.apply(this,arguments)}}catch(e){}
  win.print=function(){try{MP.printHtml(snap(win),win.document.title||"MAG Formation 13")}catch(e){}};
  var op=win.open;win.open=function(u){if(u&&/^(blob:|data:)/.test(String(u))){openBlob(String(u),"",win);return null}if(!u||u==="about:blank"){var buf="";var fw={closed:false,document:{open:function(){buf=""},write:function(h){buf+=h},writeln:function(h){buf+=h+"\n"},close:function(){}},focus:function(){},close:function(){fw.closed=true},print:function(){MP.printHtml(buf,"MAG Formation 13")}};return fw}return op?op.apply(win,arguments):null};
  win.document.addEventListener("click",function(e){var a=e.target&&e.target.closest?e.target.closest("a[href]"):null;if(!a)return;var h=a.getAttribute("href")||"";if(!/^(blob:|data:)/.test(h))return;if(a.hasAttribute("download")){e.preventDefault();e.stopPropagation();sendFile(h,a.getAttribute("download"),win)}else if(a.target==="_blank"){e.preventDefault();e.stopPropagation();openBlob(h,a.getAttribute("data-name")||"",win)}},true)}
hook(window);
function watch(f){var go=function(){try{hook(f.contentWindow)}catch(e){}};f.addEventListener("load",function(){if(f.contentWindow)f.contentWindow.__magp=0;go()});go()}
document.querySelectorAll("iframe").forEach(watch);
new MutationObserver(function(ms){ms.forEach(function(m){m.addedNodes.forEach(function(n){if(n.tagName==="IFRAME")watch(n)})})}).observe(document.documentElement,{childList:true,subtree:true});
})();</script>
