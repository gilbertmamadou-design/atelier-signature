<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Météo</title>
<meta name="theme-color" content="#0f1116">
<style>
:root{
  color-scheme:dark;
  --bg:#0f1116;--bg2:#181b23;--bg3:#222632;--bg4:#2c3140;--line:#ffffff14;
  --tx:#f2f3f7;--tx2:#b4b8c7;--tx3:#7d8294;
  --acc:#8fb4ff;--acc2:#b79bff;--ok:#6fd6a4;--bad:#ff7b7b;--warn:#ffb35c;--rain:#6fb6ff;--sun:#ffc94d;
  --r:18px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
svg{display:block}
a{color:var(--acc)}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* En-tête */
header.top{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 70%,#0f111600);padding:calc(10px + var(--safe-t)) 10px 8px;display:flex;align-items:center;gap:4px}
.ib{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:var(--tx2);flex:none;position:relative}
.ib:active{background:var(--bg3)}
.ib .badge{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 2px var(--bg)}
.place{flex:1;min-width:0;text-align:center}
.place .n{font-weight:750;font-size:18px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.place .n svg{width:15px;height:15px;color:var(--acc)}
.place .s{font-size:12px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;justify-content:center;gap:5px;margin-top:4px;height:6px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--bg4);display:block}
.dots i.on{background:var(--tx2);width:14px;border-radius:3px}
.spin{width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

main{padding:2px 14px calc(92px + var(--safe-b))}
.view{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.slide-l{animation:sl .28s ease}
.slide-r{animation:sr .28s ease}
@keyframes sl{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes sr{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}

.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin-bottom:12px}
.card h3{margin:0 0 11px;font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--tx3);font-weight:700;display:flex;align-items:center;gap:7px}
.card h3 .ic{width:15px;height:15px}
.card h3 .r{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:600;color:var(--tx3)}
.muted{color:var(--tx3)}
.small{font-size:12.5px}
.foot{font-size:12px;color:var(--tx3);text-align:center;margin:16px 8px 0;line-height:1.55}

/* Héros */
.hero{border-radius:24px;padding:18px 18px 16px;margin-bottom:12px;position:relative;overflow:hidden;border:1px solid var(--line);background:linear-gradient(160deg,#24406e,#162036 70%)}
.hero.night{background:linear-gradient(160deg,#1b2147,#11142a 70%)}
.hero.grey{background:linear-gradient(160deg,#2f3646,#1a1e28 70%)}
.hero.wet{background:linear-gradient(160deg,#233448,#151b26 70%)}
.hero.storm{background:linear-gradient(160deg,#352a4d,#16141f 70%)}
.hero .row1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hero .t{font-size:86px;font-weight:200;line-height:.95;letter-spacing:-3px}
.hero .t sup{font-size:40px;letter-spacing:0;vertical-align:top;position:relative;top:8px;font-weight:300}
.hero .wx{width:118px;height:118px;margin:-6px -6px -6px 0}
.hero .c{font-size:19px;font-weight:600;margin-top:8px}
.hero .f{color:#dfe5f3cc;margin-top:3px;font-size:14.5px}
.hero .f b{color:#fff;font-weight:600}
.hero .u{font-size:12px;color:#dfe5f399;margin-top:10px;display:flex;align-items:center;gap:6px}
.hero .u .dot{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.hero .u .dot.old{background:var(--warn)}

/* Bandeau à surveiller */
.watch{padding:4px 15px}
.watch .it{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.watch .it:first-child{border-top:0}
.watch .it .k{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;background:#ffb35c1f;color:var(--warn)}
.watch .it .k.rain{background:#6fb6ff1f;color:var(--rain)}
.watch .it .k.cold{background:#8fd0ff1f;color:#8fd0ff}
.watch .it .k.vig{background:#ffffff0d;color:var(--tx2)}
.watch .it .t{flex:1;min-width:0}
.watch .it .t div:first-child{font-weight:600}
.watch .it .t div+div{font-size:12.5px;color:var(--tx3)}
.watch .it .go{color:var(--tx3)}

/* Pluie dans l'heure */
.rh-sum{font-weight:600;font-size:16px}
.rh-sub{font-size:12.5px;color:var(--tx3);margin-top:2px}
.rh-bars{display:flex;align-items:flex-end;gap:5px;height:64px;margin-top:14px;border-bottom:1px solid var(--bg4);padding:0 1px}
.rh-bars div{flex:1;border-radius:5px 5px 2px 2px;background:var(--rain);min-height:3px;position:relative}
.rh-bars div.z{background:var(--bg4)}
.rh-bars div.now:after{content:"";position:absolute;left:50%;top:-8px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--tx2)}
.rh-lab{display:flex;justify-content:space-between;font-size:11.5px;color:var(--tx3);margin-top:6px}

/* Bande horaire */
.hscroll{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin:0 -15px;padding:0 15px}
.hscroll::-webkit-scrollbar{display:none}
.strip{display:flex;gap:2px;width:max-content}
.strip .h{width:52px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:14px}
.strip .h.cur{background:var(--bg3)}
.strip .h .hh{font-size:12.5px;color:var(--tx2)}
.strip .h .wx{width:32px;height:32px}
.strip .h .tt{font-weight:650}
.strip .h .pp{font-size:11px;color:var(--rain);height:14px}
.strip .h.sun .hh{color:var(--sun)}

/* Grille de détails */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.grid .card{margin:0;min-width:0}
.grid .wide{grid-column:1/-1}
.tile .v{font-size:26px;font-weight:600;line-height:1.1}
.tile .v small{font-size:14px;font-weight:500;color:var(--tx2);margin-left:2px}
.tile .d{font-size:12.5px;color:var(--tx3);margin-top:5px;line-height:1.35}
.tile .d b{color:var(--tx2);font-weight:600}
.wind{display:flex;align-items:center;gap:12px}
.wind svg.comp{width:74px;height:74px;flex:none}
.uvbar{height:6px;border-radius:3px;margin-top:10px;position:relative;background:linear-gradient(90deg,#6fd6a4,#e6dc5a 30%,#ffa94d 55%,#ff6b6b 78%,#c77dff)}
.uvbar i{position:absolute;top:-3px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--bg2);margin-left:-6px}
.sunrow{display:flex;justify-content:space-between;align-items:flex-end;margin-top:2px}
.sunrow .x{font-size:12px;color:var(--tx3)}
.sunrow .y{font-size:18px;font-weight:600}
.moon{display:flex;align-items:center;gap:14px}
.moon svg{width:64px;height:64px;flex:none}
.aqi-mini{display:flex;align-items:center;gap:10px}
.aqi-mini .dotl{width:12px;height:12px;border-radius:50%}

/* Heures */
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--tx3);margin-bottom:10px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:block}
.chart text{font-family:system-ui,-apple-system,Roboto,sans-serif}
.daysum{display:flex;flex-direction:column}
.daysum .r{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:center}
.daysum .r:first-child{border-top:0}
.daysum .r .n{width:96px;flex:none;font-weight:600}
.daysum .r .x{flex:1;font-size:13px;color:var(--tx2)}

/* 10 jours */
.days .d{border-top:1px solid var(--line)}
.days .d:first-child{border-top:0}
.days .row{display:grid;grid-template-columns:62px 34px 46px 30px 1fr 30px;align-items:center;gap:7px;padding:10px 0;width:100%;text-align:left}
.days .nm{font-weight:650;text-transform:capitalize;line-height:1.15}
.days .nm small{display:block;font-weight:400;color:var(--tx3);font-size:12px;text-transform:none}
.days .wx{width:34px;height:34px}
.days .pr{font-size:12px;color:var(--rain);line-height:1.2;text-align:center}
.days .pr small{display:block;color:#6fb6ffaa;font-size:11px}
.days .mn{color:var(--tx3);text-align:right;font-weight:550}
.days .mx{font-weight:700}
.rng{height:6px;border-radius:3px;background:var(--bg4);position:relative}
.rng i{position:absolute;top:0;bottom:0;border-radius:3px;display:block}
.rng b{position:absolute;top:-3px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--bg2);margin-left:-6px}
.days .more{display:none;padding:2px 0 14px;font-size:13px;color:var(--tx2)}
.days .d.open .more{display:block}
.days .more .g{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;background:var(--bg3);border-radius:14px;padding:12px}
.days .more .g div span{display:block;color:var(--tx3);font-size:11.5px}
.days .more .g div b{font-weight:600}
.days .more .c{margin-bottom:8px;font-weight:600;color:var(--tx)}

/* Radar */
.mapwrap{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:#0c0e13;height:calc(100vh - 300px);min-height:300px;max-height:640px;margin-bottom:10px}
#map{position:absolute;inset:0}
.mapmsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--tx3);font-size:14px}
.maptime{position:absolute;left:10px;top:10px;z-index:500;background:#0f1116d9;border:1px solid var(--line);border-radius:12px;padding:6px 10px;font-size:13px;font-weight:600;pointer-events:none}
.maptime small{display:block;font-weight:500;color:var(--tx3);font-size:11.5px}
.maptime.fc{border-color:#b79bff66}
.mapzoom{position:absolute;right:10px;top:10px;z-index:500;display:flex;flex-direction:column;gap:6px}
.mapzoom button{width:38px;height:38px;border-radius:12px;background:#0f1116d9;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.player{display:flex;align-items:center;gap:12px}
.play{width:48px;height:48px;border-radius:16px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#10131c;display:flex;align-items:center;justify-content:center;flex:none}
.play .ic{stroke-width:2.4}
.tl{flex:1;min-width:0}
.tl input{width:100%;accent-color:var(--acc);margin:0}
.tl .lab{display:flex;justify-content:space-between;font-size:11.5px;color:var(--tx3);margin-top:3px}
.rvleg{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--tx3);margin-top:12px}
.rvleg i{flex:1;height:6px;border-radius:3px;background:linear-gradient(90deg,#9ad7ff,#3fa3ff,#1c5fe0,#ffe14d,#ff8c1a,#e8202a,#c43cd8)}
.leaflet-container{background:#0c0e13;font:12px system-ui,sans-serif}
.leaflet-control-attribution{background:#0f1116b3!important;color:#9aa0b0!important;font-size:10px!important}
.leaflet-control-attribution a{color:#b4c6ee!important}

/* Air */
.gauge{display:flex;flex-direction:column;align-items:center}
.gauge svg{width:230px;height:128px}
.gauge .lv{font-size:20px;font-weight:700;margin-top:4px}
.gauge .ex{font-size:13.5px;color:var(--tx2);text-align:center;margin-top:6px;max-width:300px}
.pol .p{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-top:1px solid var(--line)}
.pol .p:first-child{border-top:0}
.pol .p .n{font-weight:600}
.pol .p .n small{font-weight:400;color:var(--tx3);margin-left:6px;font-size:12px}
.pol .p .v{text-align:right;font-size:13px;color:var(--tx2)}
.pol .p .b{grid-column:1/-1;height:5px;border-radius:3px;background:var(--bg4);overflow:hidden}
.pol .p .b i{display:block;height:100%;border-radius:3px}
.chip{display:inline-block;font-size:11.5px;font-weight:650;padding:2px 8px;border-radius:99px;background:var(--bg4);color:var(--tx2)}
.mini{display:flex;align-items:flex-end;gap:2px;height:46px;margin-top:8px}
.mini i{flex:1;border-radius:2px 2px 0 0;display:block;min-height:2px}
.expl{font-size:13px;color:var(--tx2);line-height:1.5}
.expl p{margin:0 0 8px}
.scale{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:12.5px;color:var(--tx2);margin-top:6px}
.scale i{width:12px;height:12px;border-radius:4px;display:block;margin-top:2px}

/* Barre d'onglets */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;background:#12141bf2;border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--safe-b));backdrop-filter:blur(10px)}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:14px;color:var(--tx3);font-size:11px;font-weight:600}
nav.tabs button .ic{width:22px;height:22px}
nav.tabs button.on{color:var(--tx)}
nav.tabs button.on .ic{color:var(--acc)}

/* Feuilles */
.veil{position:fixed;inset:0;background:#0009;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none}
.veil.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:22px 22px 0 0;border-top:1px solid #ffffff1f;max-height:90vh;display:flex;flex-direction:column;transform:translateY(105%);visibility:hidden;transition:transform .25s ease,visibility 0s .25s}
.sheet.on{transform:none;visibility:visible;transition:transform .25s ease}
.sheet.full{top:0;max-height:none;border-radius:0;border:0}
.sheet .sh{display:flex;align-items:center;gap:8px;padding:12px 10px 8px 18px}
.sheet.full .sh{padding-top:calc(12px + var(--safe-t))}
.sheet .sh h2{flex:1;margin:0;font-size:19px}
.sheet .sb{overflow-y:auto;padding:4px 16px calc(24px + var(--safe-b))}
.grab{width:38px;height:4px;border-radius:2px;background:var(--bg4);margin:8px auto 0}
.sheet.full .grab{display:none}

.search{display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--line);border-radius:14px;padding:0 12px;margin-bottom:12px}
.search input{flex:1;background:none;border:0;outline:0;padding:12px 0;font-size:15px;min-width:0}
.search .ic{color:var(--tx3)}
.list .it{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.list .it:first-child{border-top:0}
.list .it .m{flex:1;min-width:0;text-align:left}
.list .it .m div:first-child{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .it .m div+div{font-size:12.5px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .it .tp{font-weight:650;display:flex;align-items:center;gap:4px}
.list .it .tp .wx{width:28px;height:28px}
.list .it .ib{width:36px;height:36px}
.list .it.cur .m div:first-child{color:var(--acc)}
.res{display:flex;align-items:center;gap:10px;padding:10px 4px;border-radius:12px;width:100%;text-align:left}
.res:active{background:var(--bg3)}

.set{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.set:first-child{border-top:0;padding-top:2px}
.set .t{flex:1;min-width:0}
.set .t div:first-child{font-weight:600}
.set .t div+div{font-size:12.5px;color:var(--tx3);margin-top:2px}
.set .k{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--bg3);color:var(--tx2)}
.sw{position:relative;width:46px;height:28px;flex:none}
.sw input{opacity:0;position:absolute;inset:0;margin:0;z-index:1}
.sw span{position:absolute;inset:0;border-radius:99px;background:var(--bg4);transition:.2s}
.sw span:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#cfd3df;transition:.2s}
.sw input:checked+span{background:var(--acc)}
.sw input:checked+span:after{transform:translateX(18px);background:#fff}
.sub{padding:0 0 12px 48px}
.sub .lab{display:flex;justify-content:space-between;font-size:13px;color:var(--tx2)}
.sub .lab b{color:var(--acc);font-variant-numeric:tabular-nums}
.sub input[type=range]{width:100%;margin:10px 0 0;accent-color:var(--acc)}
.sub .hint{font-size:12px;color:var(--tx3);margin-top:4px}
.seg{display:flex;background:var(--bg3);border-radius:12px;padding:3px;gap:3px;margin-top:8px}
.seg button{flex:1;padding:8px 4px;border-radius:9px;font-size:13px;font-weight:600;color:var(--tx2);text-align:center;line-height:1.2}
.seg button.on{background:var(--bg4);color:var(--tx);box-shadow:0 0 0 1px #ffffff1c inset}
.seg.wrap{flex-wrap:wrap}
.seg.wrap button{flex:1 0 30%}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 14px;border-radius:13px;background:var(--bg3);border:1px solid var(--line);font-weight:600;font-size:14px;flex:1;min-width:0;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn.main{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#10131c;border:0}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.state{display:flex;gap:12px;align-items:flex-start}
.state .dot{width:10px;height:10px;border-radius:50%;background:var(--tx3);margin-top:6px;flex:none}
.state .dot.on{background:var(--ok);box-shadow:0 0 0 4px #6fd6a42a}
.state .dot.warn{background:var(--warn)}
.log{margin-top:10px;font-size:12.5px;color:var(--tx3)}
.log div{padding:6px 0;border-top:1px solid var(--line)}
.log b{color:var(--tx2);font-weight:600}

<script>
(function(){
'use strict';
const $ = id => document.getElementById(id);
const B = window.MAGMeteo || null, P = window.MAGPrint || null;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const J = (s, d) => { try { const v = JSON.parse(s); return v == null ? d : v; } catch (e) { return d; } };
const LS = {
  get(k, d){ try { return J(localStorage.getItem(k), d); } catch (e) { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k){ try { localStorage.removeItem(k); } catch (e) {} }
};
const round = v => v == null || isNaN(v) ? '–' : String(Math.round(v)).replace('-0', '0');
const fr1 = v => (Math.round(v * 10) / 10).toLocaleString('fr-FR');

function toast(t){ const e = $('toast'); e.textContent = t; e.className = 'on'; clearTimeout(toast.t); toast.t = setTimeout(() => { e.className = ''; }, 3200); }

/* ====================================================================
   Icônes
   ==================================================================== */
const ICO = {
  pin:'<path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
  nav:'<path d="M3 11l18-8-8 18-2-8z"/>',
  up:'<path d="M6 15l6-6 6 6"/>', down:'<path d="M6 9l6 6 6-6"/>', x:'<path d="M6 6l12 12M18 6L6 18"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>', ext:'<path d="M14 4h6v6M20 4l-9 9"/><path d="M19 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h4"/>',
  chev:'<path d="M9 6l6 6-6 6"/>', drop:'<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>',
  snow:'<path d="M12 2v20M4.5 6.5l15 11M19.5 6.5l-15 11"/>', therm:'<path d="M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0z"/>',
  wind:'<path d="M3 8h11a3 3 0 1 0-3-3M3 16h15a3 3 0 1 1-3 3M3 12h8"/>', bolt:'<path d="M13 2L5 14h6l-1 8 8-12h-6z"/>',
  shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M12 8v5M12 16v.5"/>',
  bell:'<path d="M6 9a6 6 0 1 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9"/><path d="M10 20a2 2 0 0 0 4 0"/>',
  leaf:'<path d="M5 19c0-9 6-14 15-14 0 9-5 15-14 15"/><path d="M5 19l8-8"/>', clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  flower:'<circle cx="12" cy="9" r="2.5"/><path d="M12 6.5a3 3 0 1 1 2.4 1.7M14.4 8.2a3 3 0 1 1-.1 3M14.3 11.2a3 3 0 1 1-4.6 0M9.7 11.2a3 3 0 1 1-.1-3M9.6 8.2A3 3 0 1 1 12 6.5M12 11.5V21M12 17c-2 0-3.5-1-4-3"/>',
  eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  gauge:'<path d="M4 18a9 9 0 1 1 16 0"/><path d="M12 13l4-4"/>', hum:'<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/><path d="M9.5 14.5a2.5 2.5 0 0 0 2.5 2.5"/>',
  sunr:'<path d="M4 18h16M7 14a5 5 0 0 1 10 0M12 4v3M5.6 7.6l1.4 1.4M18.4 7.6L17 9"/>', moon:'<path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/>',
  uv:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  play:'<path d="M8 5v14l11-7z"/>', pause:'<path d="M8 5v14M16 5v14"/>', share:'<circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.6M8.2 13.2l7.6 4.6"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>'
};
const ic = (n, cls) => '<svg class="ic' + (cls ? ' ' + cls : '') + '" viewBox="0 0 24 24">' + (ICO[n] || '') + '</svg>';

/* Illustrations météo (SVG original, 64×64) */
const WMO = {0:['Ciel dégagé','clear'],1:['Plutôt dégagé','mostly'],2:['Partiellement nuageux','partly'],3:['Couvert','overcast'],45:['Brouillard','fog'],48:['Brouillard givrant','fog'],51:['Bruine légère','drizzle'],53:['Bruine','drizzle'],55:['Bruine forte','drizzle'],56:['Bruine verglaçante','drizzle'],57:['Bruine verglaçante','drizzle'],61:['Pluie faible','rain'],63:['Pluie','rain'],65:['Forte pluie','heavy'],66:['Pluie verglaçante','rain'],67:['Pluie verglaçante','heavy'],71:['Neige faible','snow'],73:['Neige','snow'],75:['Forte neige','snow'],77:['Grains de neige','snow'],80:['Averses','showers'],81:['Averses','showers'],82:['Fortes averses','heavy'],85:['Averses de neige','snow'],86:['Averses de neige','snow'],95:['Orage','storm'],96:['Orage et grêle','hail'],99:['Orage et grêle','hail']};
const wname = c => (WMO[c] || ['—'])[0];
const wkind = c => (WMO[c] || [0, 'overcast'])[1];
function sunG(cx, cy, r){
  let s = '';
  for (let i = 0; i < 8; i++){ const a = i * Math.PI / 4, c = Math.cos(a), n = Math.sin(a);
    s += '<line x1="' + (cx + c * (r + 4)).toFixed(1) + '" y1="' + (cy + n * (r + 4)).toFixed(1) + '" x2="' + (cx + c * (r + 8.5)).toFixed(1) + '" y2="' + (cy + n * (r + 8.5)).toFixed(1) + '"/>'; }
  return '<g stroke="#ffc94d" stroke-width="3" stroke-linecap="round">' + s + '</g><circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="#ffc94d"/><circle cx="' + (cx - r * .3) + '" cy="' + (cy - r * .3) + '" r="' + (r * .45) + '" fill="#ffe08f" opacity=".55"/>';
}
function moonG(cx, cy, r){
  return '<path d="M' + (cx + r * .35) + ' ' + (cy - r) + 'A' + r + ' ' + r + ' 0 1 0 ' + (cx + r) + ' ' + (cy + r * .45) + 'A' + (r * .82) + ' ' + (r * .82) + ' 0 0 1 ' + (cx + r * .35) + ' ' + (cy - r) + 'z" fill="#e9e4c9"/><circle cx="' + (cx - r * .35) + '" cy="' + (cy + r * .2) + '" r="' + (r * .13) + '" fill="#cfc9a8"/><circle cx="' + (cx - r * .05) + '" cy="' + (cy + r * .55) + '" r="' + (r * .09) + '" fill="#cfc9a8"/>';
}
function cloudG(x, y, s, fill){
  return '<path transform="translate(' + x + ' ' + y + ') scale(' + s + ')" d="M12 40h31a10 10 0 0 0 1.5-19.9A13 13 0 0 0 19.6 17 10.5 10.5 0 0 0 12 40z" fill="' + fill + '"/>';
}
function drops(n, x0, y0, len, col){
  let s = '';
  for (let i = 0; i < n; i++){ const x = x0 + i * (n > 3 ? 7.5 : 10), y = y0 + (i % 2) * 4;
    s += '<line x1="' + x + '" y1="' + y + '" x2="' + (x - 3) + '" y2="' + (y + len) + '"/>'; }
  return '<g stroke="' + (col || '#6fb6ff') + '" stroke-width="3" stroke-linecap="round">' + s + '</g>';
}
function wxSvg(code, day, cls){
  const k = wkind(code); let g = '';
  const lt = '#dfe4ef', dk = '#97a1b6', st = '#6f7891';
  const orb = (cx, cy, r) => day ? sunG(cx, cy, r) : moonG(cx, cy, r);
  switch (k){
    case 'clear': g = day ? sunG(32, 32, 12) : moonG(31, 31, 15); break;
    case 'mostly': g = orb(27, 26, 11) + cloudG(26, 27, .62, lt); break;
    case 'partly': g = orb(23, 22, 10) + cloudG(8, 14, .95, lt); break;
    case 'overcast': g = cloudG(14, 4, .8, dk) + cloudG(4, 14, 1, lt); break;
    case 'fog': g = cloudG(6, 2, .95, dk) + '<g stroke="#b9c1d1" stroke-width="3" stroke-linecap="round"><line x1="10" y1="46" x2="50" y2="46"/><line x1="16" y1="53" x2="56" y2="53"/></g>'; break;
    case 'drizzle': g = cloudG(5, 2, 1, lt) + drops(3, 22, 46, 5); break;
    case 'rain': g = cloudG(5, 2, 1, dk) + drops(3, 22, 45, 9); break;
    case 'heavy': g = cloudG(5, 2, 1, st) + drops(5, 16, 44, 11, '#4f9dff'); break;
    case 'showers': g = orb(22, 18, 9) + cloudG(8, 10, .92, lt) + drops(3, 24, 50, 7); break;
    case 'snow': g = cloudG(5, 2, 1, lt) + '<g fill="#fff">' + [[20,49],[32,53],[44,49],[26,58],[38,58]].map(p => '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="2.6"/>').join('') + '</g>'; break;
    case 'storm': g = cloudG(5, 2, 1, st) + '<path d="M34 38l-9 13h7l-3 10 11-15h-7l4-8z" fill="#ffd43b"/>' + drops(2, 18, 46, 7); break;
    case 'hail': g = cloudG(5, 2, 1, st) + '<path d="M34 38l-9 13h7l-3 10 11-15h-7l4-8z" fill="#ffd43b"/><g fill="#e8f1ff"><circle cx="18" cy="51" r="2.6"/><circle cx="47" cy="50" r="2.6"/><circle cx="15" cy="59" r="2.2"/></g>'; break;
    default: g = cloudG(4, 8, 1, lt);
  }
  return '<svg class="wx' + (cls ? ' ' + cls : '') + '" viewBox="0 0 64 64" aria-hidden="true">' + g + '</svg>';
}

/* ====================================================================
   Lune (Meeus, chap. 49 : instants des phases principales)
   ==================================================================== */
const MOON = (function(){
  const R = Math.PI / 180, SYN = 29.530588861, S = Math.sin, C = Math.cos;
  function jde(k){
    const T = k / 1236.85, T2 = T * T, T3 = T2 * T;
    let J = 2451550.09766 + SYN * k + 0.00015437 * T2 - 0.00000015 * T3 + 0.00000000073 * T2 * T2;
    const E = 1 - 0.002516 * T - 0.0000074 * T2;
    const M = (2.5534 + 29.1053567 * k - 0.0000014 * T2 - 0.00000011 * T3) * R;
    const Mp = (201.5643 + 385.81693528 * k + 0.0107582 * T2 + 0.00001238 * T3) * R;
    const F = (160.7108 + 390.67050284 * k - 0.0016118 * T2 - 0.00000227 * T3) * R;
    const O = (124.7746 - 1.56375588 * k + 0.0020672 * T2 + 0.00000215 * T3) * R;
    const f = Math.round((k - Math.floor(k)) * 4) % 4;
    let c;
    if (f === 0 || f === 2){
      const a = f === 0 ? [-0.40720, 0.17241, 0.01608, 0.01039, 0.00739, -0.00514, 0.00208] : [-0.40614, 0.17302, 0.01614, 0.01043, 0.00734, -0.00515, 0.00209];
      c = a[0] * S(Mp) + a[1] * E * S(M) + a[2] * S(2 * Mp) + a[3] * S(2 * F) + a[4] * E * S(Mp - M) + a[5] * E * S(Mp + M) + a[6] * E * E * S(2 * M)
        - 0.00111 * S(Mp - 2 * F) - 0.00057 * S(Mp + 2 * F) + 0.00056 * E * S(2 * Mp + M) - 0.00042 * S(3 * Mp) + 0.00042 * E * S(M + 2 * F)
        + 0.00038 * E * S(M - 2 * F) - 0.00024 * E * S(2 * Mp - M) - 0.00017 * S(O) - 0.00007 * S(Mp + 2 * M) + 0.00004 * S(2 * Mp - 2 * F) + 0.00004 * S(3 * M);
    } else {
      c = -0.62801 * S(Mp) + 0.17172 * E * S(M) - 0.01183 * E * S(Mp + M) + 0.00862 * S(2 * Mp) + 0.00804 * S(2 * F) + 0.00454 * E * S(Mp - M)
        + 0.00204 * E * E * S(2 * M) - 0.0018 * S(Mp - 2 * F) - 0.0007 * S(Mp + 2 * F) - 0.0004 * S(3 * Mp) - 0.00034 * E * S(2 * Mp - M)
        + 0.00032 * E * S(M + 2 * F) + 0.00032 * E * S(M - 2 * F) - 0.00028 * E * E * S(Mp + 2 * M) + 0.00027 * E * S(2 * Mp + M) - 0.00017 * S(O);
      const W = 0.00306 - 0.00038 * E * C(M) + 0.00026 * C(Mp) - 0.00002 * C(Mp - M) + 0.00002 * C(Mp + M) + 0.00002 * C(2 * F);
      c += f === 1 ? W : -W;
    }
    return J + c - 69 / 86400;   // TT → UT (ΔT ≈ 69 s)
  }
  const toMs = j => (j - 2440587.5) * 86400000;
  const NAMES = ['Nouvelle lune', 'Premier quartier', 'Pleine lune', 'Dernier quartier'];
  const BETWEEN = ['Premier croissant', 'Gibbeuse croissante', 'Gibbeuse décroissante', 'Dernier croissant'];
  function events(ms){
    const jd = ms / 86400000 + 2440587.5, k0 = Math.floor((jd - 2451550.09766) / SYN);
    const ev = [];
    for (let k = k0 - 1; k <= k0 + 2; k++) for (let q = 0; q < 4; q++) ev.push({ t: toMs(jde(k + q / 4)), q });
    return ev.sort((a, b) => a.t - b.t);
  }
  function info(date){
    const ms = +date, ev = events(ms);
    let i = 0; while (i < ev.length - 1 && ev[i + 1].t <= ms) i++;
    const prev = ev[i], next = ev[i + 1];
    let pn = null, nn = null;
    for (const e of ev){ if (e.q === 0 && e.t <= ms) pn = e; if (e.q === 0 && e.t > ms && !nn) nn = e; }
    const frac = (ms - pn.t) / (nn.t - pn.t);
    const illum = (1 - Math.cos(2 * Math.PI * frac)) / 2;
    const near = Math.abs(ms - prev.t) < Math.abs(next.t - ms) ? prev : next;
    const name = Math.abs(ms - near.t) < 21 * 3600000 ? NAMES[near.q] : BETWEEN[prev.q];
    const nextMajor = ev.filter(e => e.t > ms && (e.q === 0 || e.q === 2))[0];
    return { name, frac, illum, age: (ms - pn.t) / 86400000, next: { name: NAMES[next.q], t: next.t }, nextMajor: { name: NAMES[nextMajor.q], t: nextMajor.t }, events: ev };
  }
  function svg(frac, size){
    const r = 26, cx = 32, cy = 32, k = Math.cos(2 * Math.PI * frac), wax = frac < 0.5, rx = Math.abs(k) * r;
    const limb = wax ? 1 : 0, term = k > 0 ? (wax ? 0 : 1) : (wax ? 1 : 0);
    const lit = frac < 0.015 || frac > 0.985 ? '' : (Math.abs(frac - .5) < 0.015
      ? '<circle cx="32" cy="32" r="26" fill="url(#mg)"/>'
      : '<path d="M' + cx + ' ' + (cy - r) + 'A' + r + ' ' + r + ' 0 0 ' + limb + ' ' + cx + ' ' + (cy + r) + 'A' + rx.toFixed(2) + ' ' + r + ' 0 0 ' + term + ' ' + cx + ' ' + (cy - r) + 'z" fill="url(#mg)"/>');
    return '<svg viewBox="0 0 64 64" width="' + (size || 64) + '" height="' + (size || 64) + '" aria-hidden="true"><defs><radialGradient id="mg" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#fbf6dc"/><stop offset="1" stop-color="#d9d2ad"/></radialGradient></defs><circle cx="32" cy="32" r="26" fill="#2a2f3d"/><circle cx="32" cy="32" r="26" fill="none" stroke="#ffffff14"/>' + lit + '</svg>';
  }
  return { info, svg, jde, toMs };
})();
window.MeteoMoon = MOON;

/* ====================================================================
   État
   ==================================================================== */
const DEF_AL = { place: '', every: 1, quiet: true, rain: { on: true, mm: 0.2 }, frost: { on: true, t: 1 }, heat: { on: true, t: 35 }, wind: { on: true, kmh: 70 }, storm: { on: true } };
let S = Object.assign({ model: 'mf', usePos: true, view: 'now', cur: 0 }, LS.get('meteo-reglages', {}));
let V = LS.get('meteo-villes', []);
let POS = LS.get('meteo-pos', null);
let AL = Object.assign({}, DEF_AL, LS.get('meteo-alertes', {}));
let VIEW = 'now', D = null, AQ = null, busy = false, locBusy = false, locErr = '';

function pages(){
  const l = [];
  if (S.usePos) l.push({ id: 'pos', pos: true, name: POS && POS.name ? POS.name : 'Ma position', sub: POS && POS.sub || '', cc: POS && POS.cc || 'FR', lat: POS && POS.lat, lon: POS && POS.lon });

}

let REQ = 0; const PEND = {};
function nativeJSON(url){
  return new Promise((res, rej) => {
    const id = 'r' + (++REQ) + '_' + Date.now();
    PEND[id] = { res, rej };
    try { B.fetch(id, url); } catch (e) { delete PEND[id]; rej(e); return; }
    setTimeout(() => { if (PEND[id]){ delete PEND[id]; rej(new Error('Délai dépassé')); } }, 35000);
  });
}
function getJSON(url){
  const ctl = 'AbortController' in window ? new AbortController() : null;
  const tm = setTimeout(() => { if (ctl) ctl.abort(); }, 15000);
  return fetch(url, ctl ? { signal: ctl.signal } : {}).then(r => { clearTimeout(tm); if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .catch(e => { clearTimeout(tm); if (B && B.fetch && !(e && /HTTP 4/.test(e.message))) return nativeJSON(url); throw e; });
}

/* Fusion des modèles : Météo-France en priorité, le meilleur modèle complète (au-delà de 4 jours, probabilités, UV…) */
function merge(sec){
  if (!sec || typeof sec !== 'object') return sec;
  const out = {}, bases = {};
  Object.keys(sec).forEach(k => { const m = k.match(/^(.*)_(best_match|meteofrance_seamless)$/); bases[m ? m[1] : k] = 1; });
  Object.keys(bases).forEach(b => {
    const mf = sec[b + '_meteofrance_seamless'], fb = sec[b + '_best_match'] !== undefined ? sec[b + '_best_match'] : sec[b];
    if (Array.isArray(mf) || Array.isArray(fb)){
      const n = Math.max(mf ? mf.length : 0, fb ? fb.length : 0), a = new Array(n);
      for (let i = 0; i < n; i++){ const x = mf ? mf[i] : null; a[i] = x != null ? x : (fb ? (fb[i] != null ? fb[i] : null) : null); }
      out[b] = a;
    } else out[b] = mf != null ? mf : fb;
  });
  return out;
}

}

function tColor(t){
  const st = [[-10,[122,167,255]],[0,[143,208,255]],[10,[127,224,192]],[18,[201,228,106]],[25,[255,200,87]],[32,[255,138,76]],[40,[255,77,109]]];

/* ====================================================================
   Analyses : pluie dans l'heure, points à surveiller
   ==================================================================== */
function rainHour(){
  const m = D && D.minutely_15; if (!m || !m.time || !m.precipitation) return null;
  const n = nowS(); let i0 = -1;
  for (let i = 0; i < m.time.length; i++) if (m.time[i] <= n && m.time[i] + 900 > n){ i0 = i; break; }
  if (i0 < 0){ for (let i = 0; i < m.time.length; i++) if (m.time[i] > n){ i0 = i; break; } }
  if (i0 < 0) return null;
  const sl = []; for (let i = i0; i < Math.min(m.time.length, i0 + 8); i++) sl.push({ t: m.time[i], v: m.precipitation[i] || 0 });
  if (sl.length < 4) return null;
  const TH = 0.05, word = v => v < 0.5 ? 'faible' : v < 2 ? 'modérée' : 'forte';
  let sum = '', sub = '';
  const tot1 = sl.slice(0, 4).reduce((a, b) => a + b.v, 0), mx = Math.max.apply(null, sl.map(x => x.v));
  if (sl[0].v >= TH){
    const end = sl.findIndex(x => x.v < TH);
    sum = end < 0 ? 'Pluie ' + word(mx) + ' pendant encore au moins 2 h' : 'Pluie ' + word(mx) + ', fin vers ' + hm(sl[end].t);
    sub = fr1(tot1) + ' mm dans l\'heure';
  } else {
    const st = sl.findIndex(x => x.v >= TH);
    if (st < 0){ sum = 'Pas de pluie dans les 2 prochaines heures'; sub = 'Prévision Météo-France au quart d\'heure'; }
    else { sum = 'Pluie ' + word(mx) + ' vers ' + hm(sl[st].t); sub = 'Environ ' + fr1(sl.reduce((a, b) => a + b.v, 0)) + ' mm d\'ici ' + hm(sl[sl.length - 1].t + 900); }
  }
  return { sl, sum, sub, mx, rainy: mx >= TH, first: sl.findIndex(x => x.v >= TH) };
}
function rainHourHtml(){
  const r = rainHour(); if (!r) return '';
  const top = Math.max(1, r.mx * 1.15);
  const bars = r.sl.map((x, i) => '<div class="' + (x.v < 0.05 ? 'z' : '') + (i === 0 ? ' now' : '') + '" style="height:' + (x.v < 0.05 ? 3 : Math.max(8, x.v / top * 100)) + '%;' + (x.v >= 2 ? 'background:#3f86ff' : x.v >= 0.5 ? 'background:#58a3ff' : '') + '"></div>').join('');
  return '<div class="card"><h3>' + ic('drop') + 'Pluie dans l\'heure<span class="r">par quart d\'heure</span></h3><div class="rh-sum">' + esc(r.sum) + '</div><div class="rh-sub">' + esc(r.sub) + '</div><div class="rh-bars">' + bars + '</div><div class="rh-lab"><span>Maintenant</span><span>' + hm(r.sl[Math.min(4, r.sl.length - 1)].t) + '</span><span>' + hm(r.sl[r.sl.length - 1].t + 900) + '</span></div></div>';
}

function watchList(){
  if (!D || !D.hourly) return [];
  const out = [], h = D.hourly, n = nowS(), i0 = hIndex();
  const r = rainHour();
  if (AL.rain.on && r && r.first > 0 && r.first < 4) out.push({ k: 'rain', ico: 'drop', t: 'Pluie dans l\'heure', d: r.sum });
  // Gel : de maintenant à 10 h le lendemain matin
  if (AL.frost.on){
    let mn = 99, at = 0, passed = false;
    for (let i = i0; i < Math.min(h.time.length, i0 + 30); i++){
      const hr = hh(h.time[i]); if (i > i0 && hr === 11) passed = true; if (passed) break;
      if (h.temperature_2m[i] != null && h.temperature_2m[i] < mn){ mn = h.temperature_2m[i]; at = h.time[i]; }
    }
    if (at && mn <= AL.frost.t) out.push({ k: 'cold', ico: 'snow', t: mn <= 0 ? 'Gel cette nuit' : 'Risque de gelée cette nuit', d: round(mn) + ' °C vers ' + hm(at) + ' : protège les plantes fragiles' });
  }
  if (AL.heat.on){
    const di = dIndex(), d = D.daily;
    for (let i = di; i < Math.min(d.time.length, di + 2); i++) if (d.temperature_2m_max[i] >= AL.heat.t){ out.push({ k: '', ico: 'therm', t: 'Forte chaleur ' + (i === di ? 'aujourd\'hui' : 'demain'), d: 'Jusqu\'à ' + round(d.temperature_2m_max[i]) + ' °C : hydrate-toi, volets fermés' }); break; }
  }

  for (let i = i0; i < Math.min(h.time.length, i0 + 13); i++){ if ((h.wind_gusts_10m[i] || 0) > gm){ gm = h.wind_gusts_10m[i]; ga = h.time[i]; } }

  return out;
}

function smooth(pts){
  let d = 'M' + pts[0][0] + ' ' + pts[0][1];
  for (let i = 0; i < pts.length - 1; i++){
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6, c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
    d += 'C' + c1x.toFixed(1) + ' ' + c1y.toFixed(1) + ' ' + c2x.toFixed(1) + ' ' + c2y.toFixed(1) + ' ' + p2[0].toFixed(1) + ' ' + p2[1].toFixed(1);
  }
  return d;
}
function hoursHtml(){

    '<div class="hscroll"><svg class="chart" width="' + Wt + '" height="' + H + '" viewBox="0 0 ' + Wt + ' ' + H + '">' + g + '</svg></div></div>';
  // Résumé par demi-journée

function halfDays(){
  const h = D.hourly, i0 = hIndex(), out = [];

  let i = i0;
  while (i < Math.min(h.time.length, i0 + 48) && out.length < 6){
    const hr = hh(h.time[i]), P = parts.find(p => hr >= p[0] && hr < p[1]);

    while (k < h.time.length && k < i0 + 48){ const r = hh(h.time[k]); if (!(r >= P[0] && r < P[1])) break; grp.push(k); k++; }

}

const AQL = [[20, 'Bon', '#50f0e6', 'Air de bonne qualité : profite pleinement des activités dehors.'], [40, 'Correct', '#50ccaa', 'Qualité acceptable : rien à changer pour la plupart des gens.'], [60, 'Moyen', '#f0e641', 'Les personnes sensibles (asthme, cœur, enfants, aînés) peuvent alléger les efforts intenses dehors.'], [80, 'Médiocre', '#ff6b5b', 'Réduis les efforts physiques intenses dehors, surtout en cas d\'asthme ou de gêne respiratoire.'], [100, 'Très mauvais', '#e0457b', 'Évite les efforts dehors ; les personnes sensibles restent plutôt à l\'intérieur.'], [1e9, 'Extrêmement mauvais', '#b46ae0', 'Reste à l\'intérieur autant que possible et aère tôt le matin.']];
function aqLevel(v){ for (let i = 0; i < AQL.length; i++) if (v <= AQL[i][0]) return { i, n: AQL[i][1], c: AQL[i][2], x: AQL[i][3] }; return { i: 5, n: AQL[5][1], c: AQL[5][2], x: AQL[5][3] }; }

function plevel(v, th){ if (v == null) return -1; let l = 0; for (let i = 0; i < th.length; i++) if (v >= th[i]) l = i + 1; return l; }
function pollenSummary(){
  if (!AQ || !AQ.current) return '';

  POLL.forEach(p => { const l = plevel(AQ.current[p[0]], p[2]); if (l > 0 && (!best || l > best.l)) best = { n: p[1], l }; });
  return best ? 'Pollen ' + best.n.toLowerCase() + ' : ' + PLV[best.l].toLowerCase() : 'Pas de pollen notable';
}
function airHtml(){

    '<div class="lv" style="color:' + L.c + '">' + L.n + '</div><div class="ex">' + L.x + '</div></div>';

    const arr = AQ.hourly.european_aqi.slice(k, k + 24), mx = Math.max(40, Math.max.apply(null, arr.filter(x => x != null)));
    s += '<div class="mini">' + arr.map(v => '<i style="height:' + (v == null ? 2 : Math.max(4, v / mx * 100)) + '%;background:' + (v == null ? '#3a4052' : aqLevel(v).c) + '"></i>').join('') + '</div><div class="rh-lab"><span>Maintenant</span><span>+12 h</span><span>+24 h</span></div>';
  }
  s += '</div>';
  // Polluants
  s += '<div class="card pol"><h3>' + ic('gauge') + 'Polluants<span class="r">µg/m³</span></h3>' + POLLU.map(p => {
    const v = c[p[0]]; if (v == null) return '';
    const l = plevel(v, p[3]), w = Math.min(100, v / p[3][4] * 100);
    return '<div class="p"><div class="n">' + p[1] + '<small>' + p[2] + '</small></div><div class="v"><b style="color:var(--tx)">' + round(v) + '</b> · ' + AQL[Math.min(5, l)][1].toLowerCase() + '</div><div class="b"><i style="width:' + Math.max(3, w) + '%;background:' + AQL[Math.min(5, l)][2] + '"></i></div></div>';
  }).join('') + '</div>';

  else {
    s += POLL.map(p => {

  s += '<div class="card"><h3>' + ic('eye') + 'Comment lire l\'indice</h3><div class="expl"><p>L\'indice européen retient le pire des cinq polluants (particules fines, particules, ozone, dioxyde d\'azote, dioxyde de soufre). En été, l\'ozone monte l\'après-midi par temps chaud et ensoleillé ; en hiver, ce sont plutôt les particules (chauffage au bois, trafic).</p></div><div class="scale">' +

const RV = { map: null, frames: [], layers: {}, i: 0, timer: null, at: 0, base: null, labels: null, mark: null, center: null };
function loadLeaflet(){

    let e;

  });
  add('../shared/vendor/leaflet.css', true).catch(() => add('https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css', true)).catch(() => {});
  return add('../shared/vendor/leaflet.js').catch(() => add('https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js')).then(() => { if (!window.L) throw new Error('Leaflet'); return window.L; });

function radarFrames(){
  getJSON('https://api.rainviewer.com/public/weather-maps.json').then(j => {
    const host = j.host || 'https://tilecache.rainviewer.com';
    const past = (j.radar && j.radar.past || []).map(f => ({ t: f.time, url: host + f.path, fc: false }));
    const fc = (j.radar && j.radar.nowcast || []).map(f => ({ t: f.time, url: host + f.path, fc: true }));
    if (!past.length) throw new Error('vide');
    Object.keys(RV.layers).forEach(k => RV.map.removeLayer(RV.layers[k])); RV.layers = {};
    RV.frames = past.concat(fc); RV.at = Date.now(); RV.last = past.length - 1;
    $('tl').setAttribute('max', RV.frames.length - 1);
    $('tlA').textContent = '-' + Math.round((past[past.length - 1].t - past[0].t) / 60) + ' min';
    $('tlB').textContent = fc.length ? '+' + Math.round((fc[fc.length - 1].t - past[past.length - 1].t) / 60) + ' min' : 'maintenant';
    $('mapMsg').hidden = true;
    radarFrame(RV.last);
  }).catch(() => { $('mapMsg').hidden = false; $('mapMsg').textContent = 'Radar indisponible pour le moment.'; });
}
function radarLayer(i){
  if (RV.layers[i]) return RV.layers[i];
  const f = RV.frames[i];
  const l = window.L.tileLayer(f.url + '/256/{z}/{x}/{y}/2/1_1.png', { tileSize: 256, opacity: 0, maxNativeZoom: 7, maxZoom: 10, zIndex: 10 + i });

}
function radarFrame(i){
  if (!RV.frames.length || !RV.map) return;
  i = Math.max(0, Math.min(RV.frames.length - 1, i));
  radarLayer(i).setOpacity(.78);
  Object.keys(RV.layers).forEach(k => { if (+k !== i) RV.layers[k].setOpacity(0); });
  radarLayer((i + 1) % RV.frames.length);   // préchargement de l'image suivante
  RV.i = i; $('tl').value = String(i); $('tl').setAttribute('value', i);
  const f = RV.frames[i], mins = Math.round((Date.now() / 1000 - f.t) / 60);
  const el = $('mapTime'); el.hidden = false; el.className = 'maptime' + (f.fc ? ' fc' : '');
  el.innerHTML = new Intl.DateTimeFormat('fr-FR', { hour: '2-digit', minute: '2-digit' }).format(f.t * 1000) + '<small>' + (f.fc ? 'prévision' : mins <= 12 ? 'dernière image' : 'il y a ' + mins + ' min') + '</small>';
}
function radarPlay(on){
  clearTimeout(RV.timer); RV.timer = null;
  $('playIc').innerHTML = on ? ICO.pause : ICO.play; $('bPlay').setAttribute('aria-label', on ? 'Pause' : 'Lecture');
  if (!on) return;
  const step = () => {
    const n = RV.i >= RV.frames.length - 1 ? 0 : RV.i + 1;
    radarFrame(n);
    RV.timer = setTimeout(step, n === RV.frames.length - 1 || n === RV.last ? 1600 : 550);
  };
  step();
}

  if (st){
    const ok = st.planned && any && st.notif === 'granted';
    h += '<div class="card"><div class="state"><span class="dot ' + (ok ? 'on' : any ? 'warn' : '') + '"></span><div style="flex:1"><div style="font-weight:650">' + (!any ? 'Aucune alerte activée' : st.notif !== 'granted' ? 'Notifications non autorisées' : st.planned ? 'Surveillance active, ' + (AL.every === 1 ? 'toutes les heures' : 'toutes les ' + AL.every + ' h') : 'Surveillance en attente') + '</div>' +
      '<div class="small muted">' + (ap ? 'Lieu : ' + esc(ap.name) : 'Choisis un lieu') + (st.last ? ' · dernière vérification ' + ago(st.last) : '') + '</div>' +
      (st.lastMsg ? '<div class="small" style="margin-top:4px;color:var(--tx2)">' + esc(st.lastMsg) + '</div>' : '') + '</div></div>' +
      '<div class="btns">' + (any && st.notif !== 'granted' ? '<button class="btn main" id="aNotif">' + ic('bell') + 'Autoriser les notifications</button>' : '') + '<button class="btn" id="aTest"' + (!any || !avail ? ' disabled style="opacity:.5"' : '') + '>Vérifier maintenant</button></div>' +
      (st.log && st.log.length ? '<div class="log">' + st.log.slice(0, 5).map(x => '<div><b>' + esc(x.title) + '</b><br>' + esc(x.text) + ' · ' + new Intl.DateTimeFormat('fr-FR', { weekday: 'short', hour: '2-digit', minute: '2-digit' }).format(x.at) + '</div>').join('') + '</div>' : '') + '</div>';
  }
  // Lieu surveillé
  const ps = pages();
  if (ps.length > 1){
    const cur = (ps.find(x => x.id === AL.place) || ps[0]).id;
    h += '<div class="card"><h3>' + ic('pin') + 'Lieu surveillé</h3><div class="seg wrap" id="aPlace" style="margin-top:0">' + ps.map(p => '<button data-v="' + esc(p.id) + '" class="' + (p.id === cur ? 'on' : '') + '">' + esc(p.pos ? 'Ma position' : p.name) + '</button>').join('') + '</div>' +
      (cur === 'pos' ? '<div class="small muted" style="margin-top:8px">Dernière position connue quand l\'appli était ouverte.</div>' : '') + '</div>';
  }
  // Alertes
  h += '<div class="card"><h3>' + ic('bell') + 'Me prévenir</h3>';
  ALDEF.forEach(a => {
    const o = AL[a[0]];
    h += '<div class="set"><div class="k">' + ic(a[1]) + '</div><div class="t"><div>' + a[2] + '</div><div>' + a[3] + '</div></div><label class="sw"><input type="checkbox" data-al="' + a[0] + '"' + (o.on ? ' checked' : '') + '><span></span></label></div>';
    if (!o.on) return;
    if (a[0] === 'rain') h += '<div class="sub"><div class="seg" data-k="rain.mm">' + [[0.1, 'Quelques gouttes'], [0.5, 'Vraie pluie'], [2, 'Forte pluie']].map(x => '<button data-v="' + x[0] + '" class="' + (o.mm === x[0] ? 'on' : '') + '">' + x[1] + '</button>').join('') + '</div></div>';
    if (a[0] === 'frost') h += slider('frost.t', 'Seuil', o.t, -3, 4, 1, ' °C', 'Les plantes gélives souffrent souvent dès 1 à 2 °C sous abri.');
    if (a[0] === 'heat') h += slider('heat.t', 'À partir de', o.t, 30, 40, 1, ' °C', '');
    if (a[0] === 'wind') h += slider('wind.kmh', 'Rafales dès', o.kmh, 40, 110, 5, ' km/h', 'Le mistral dépasse souvent 60 km/h en rafales.');
  });
  h += '</div>';
  h += '<div class="card"><h3>' + ic('clock') + 'Vérifier toutes les</h3><div class="seg" data-k="every" style="margin-top:0">' + [1, 2, 3].map(x => '<button data-v="' + x + '" class="' + (AL.every === x ? 'on' : '') + '">' + x + ' h</button>').join('') + '</div>' +
    '<div class="small muted" style="margin-top:8px">Avec réseau seulement. Android peut décaler un peu pour économiser la batterie : pour la pluie, garde 1 h.</div>' +
    '<div class="set" style="margin-top:6px;border-top:1px solid var(--line);padding-top:12px"><div class="t"><div>Silence la nuit</div><div>Pas de notification entre 22 h et 7 h</div></div><label class="sw"><input type="checkbox" id="aQuiet"' + (AL.quiet ? ' checked' : '') + '><span></span></label></div></div>';
  // Réglages
  h += '<div class="card"><h3>' + ic('gauge') + 'Prévisions</h3><div class="seg" data-k="model" style="margin-top:0"><button data-v="mf" class="' + (S.model !== 'auto' ? 'on' : '') + '">Météo-France d\'abord</button><button data-v="auto" class="' + (S.model === 'auto' ? 'on' : '') + '">Automatique</button></div>' +
    '<div class="small muted" style="margin-top:8px">' + (S.model !== 'auto' ? 'Modèles AROME et ARPEGE de Météo-France (très fins en Provence) sur 4 jours, puis le meilleur modèle disponible.' : 'Open-Meteo choisit le meilleur modèle pour ton lieu.') + '</div></div>';
  h += '<div class="card watch"><button class="it" id="aVig" style="width:100%;text-align:left"><div class="k vig">' + ic('shield') + '</div><div class="t"><div>Vigilance officielle Météo-France</div><div>Orages, pluie-inondation, vent, canicule, feux de forêt</div></div><span class="go">' + ic('ext') + '</span></button></div>';
  h += '<p class="foot">Météo · prévisions personnelles. Données Open-Meteo (Météo-France, ECMWF, DWD…), Copernicus CAMS, RainViewer. Les vigilances officielles restent la référence en cas de danger.</p>';
  $('alBody').innerHTML = h;

  const b = $('alBody');
  b.querySelectorAll('[data-al]').forEach(i => i.onchange = () => { AL[i.dataset.al].on = i.checked; saveAL(); if (i.checked) askNotif(); alertsBody(); });
  b.querySelectorAll('.seg[data-k]').forEach(g => g.onclick = e => {
    const x = e.target.closest('button'); if (!x) return;
    const k = g.dataset.k;
    if (k === 'model'){ S.model = x.dataset.v; saveS(); backup(); syncAlerts(); D = null; load(true); }
    else if (k === 'every'){ AL.every = +x.dataset.v; saveAL(); }
    else { const [a, f] = k.split('.'); AL[a][f] = +x.dataset.v; saveAL(); }
    alertsBody();
  });
  b.querySelectorAll('input[type=range]').forEach(i => {
    i.oninput = () => { $('lb-' + i.dataset.k.replace('.', '-')).textContent = (+i.value) + i.dataset.u; };
    i.onchange = () => { const [a, f] = i.dataset.k.split('.'); AL[a][f] = +i.value; saveAL(); };
  });
  const pl = $('aPlace'); if (pl) pl.onclick = e => { const x = e.target.closest('button'); if (!x) return; AL.place = x.dataset.v; saveAL(); alertsBody(); };
  $('aQuiet').onchange = function(){ AL.quiet = this.checked; saveAL(); };
  $('aVig').onclick = () => openUrl(vigUrl(page()));
  const nb = $('aNotif'); if (nb) nb.onclick = () => { if (B.notifPerm() === 'blocked') B.openSettings('notif'); else B.askNotif(); };
  const tb = $('aTest'); if (tb) tb.onclick = () => { tb.innerHTML = '<span class="spin"></span>Vérification…'; B.alertsTest(); };
}
function slider(k, lab, v, mn, mx, st, u, hint){
  return '<div class="sub"><div class="lab"><span>' + lab + '</span><b id="lb-' + k.replace('.', '-') + '">' + v + u + '</b></div><input type="range" min="' + mn + '" max="' + mx + '" step="' + st + '" value="' + v + '" data-k="' + k + '" data-u="' + u + '">' + (hint ? '<div class="hint">' + hint + '</div>' : '') + '</div>';
}
function askNotif(){ if (B && B.notifPerm && B.notifPerm() === 'ask') B.askNotif(); }

/* ====================================================================
   Tuile Socle, retour de notification, événements natifs
   ==================================================================== */
function publishTile(p, f){
  if (!P || !P.widgetPut || !f || !f.current) return;
  try {
    const keep = D; D = f;
    const di = dIndex(), h = f.hourly, i0 = hIndex(), next = [];
    for (let i = i0 + 1; i < h.time.length && next.length < 5; i++) if ((i - i0) % 2 === 1) next.push({ h: hh(h.time[i]), temp: Math.round(h.temperature_2m[i]), code: h.weather_code[i] });
    P.widgetPut(JSON.stringify({ place: p.name, now: { temp: Math.round(f.current.temperature_2m), code: f.current.weather_code, isDay: !!f.current.is_day }, today: { min: Math.round(f.daily.temperature_2m_min[di]), max: Math.round(f.daily.temperature_2m_max[di]), rain: f.daily.precipitation_probability_max[di] }, next, at: Date.now() }));
    D = keep;
  } catch (e) {}
}
window.onSocle = function(s){
  const o = typeof s === 'string' ? J(s, {}) : (s || {});
  if (!o.place) return;
  const n = String(o.place).toLowerCase(), ps = pages();
  let k = ps.findIndex(x => String(x.name).toLowerCase() === n);
  if (k < 0 && POS && String(POS.name).toLowerCase() === n) k = ps.findIndex(x => x.pos);
  if (k < 0){ toast(o.place + ' n\'est plus dans tes lieux'); return; }
  while (stack.length){ const c = stack.pop(); if (c) c(); }
  S.cur = k; saveS(); showView('now'); load(false);
};
window.meteoEvent = function(type, data){
  const o = typeof data === 'string' ? J(data, {}) : (data || {});
  if (type === 'fetch'){ const p = PEND[o.req]; if (!p) return; delete PEND[o.req]; if (o.ok){ try { p.res(JSON.parse(o.body)); } catch (e) { p.rej(e); } } else p.rej(new Error(o.err || 'HTTP ' + o.status)); }
  else if (type === 'location') gotLocation(o);
  else if (type === 'resume'){ const p = page(); const c = p && cacheGet(p); if (p && (!c || Date.now() - c.at > 15 * 60000)) load(false); if (p && p.pos && (!POS || Date.now() - POS.at > 30 * 60000)) locate(); if ($('alBody')) alertsBody(); }
  else if (type === 'notif'){ if ($('alBody')) alertsBody(); }
  else if (type === 'alertsTest'){ toast(o.msg || 'Vérification faite'); if ($('alBody')) alertsBody(); }
};

$('bCities').onclick = openCities;
$('bAlerts').onclick = openAlerts;
$('bRefresh').onclick = () => { if (busy) return; const p = page(); if (p && p.pos) locate(); load(true); if (VIEW === 'radar') { RV.at = 0; radarShow(); } };
document.addEventListener('visibilitychange', () => { if (!document.hidden){ const p = page(), c = p && cacheGet(p); if (p && c && Date.now() - c.at > 15 * 60000) load(false); else if (D) render(); } });
setInterval(() => { if (!document.hidden && D && VIEW === 'now') render(); }, 5 * 60000);

/* Démarrage */
if (B && B.alertsGet){ const n = J(B.alertsGet(), null); if (n && n.rain && !LS.get('meteo-alertes', null)) { ['every', 'quiet', 'rain', 'frost', 'heat', 'wind', 'storm'].forEach(k => { if (n[k] != null) AL[k] = n[k]; }); } }
if (S.usePos && (!POS || Date.now() - POS.at > 30 * 60000)) locate();
showView('now');
load(false);
if (S.cur !== 0){ const p0 = pages()[0]; if (p0 && p0.lat != null){ const c0 = cacheGet(p0); if (!c0 || Date.now() - c0.at > 30 * 60000) setTimeout(() => fetchPage(p0, 0), 1500); else publishTile(p0, c0.f); } }
})();
</script>
