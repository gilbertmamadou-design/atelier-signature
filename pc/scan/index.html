<style>
:root{
  color-scheme:dark;
  --bg:#0f1116;--bg2:#181b23;--bg3:#222632;--bg4:#2c3140;--line:#ffffff14;
  --tx:#f2f3f7;--tx2:#b4b8c7;--tx3:#7d8294;

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
svg{display:block}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.dots{fill:currentColor;stroke:none}
[hidden]{display:none!important}

/* Accueil */
.top{padding:calc(14px + var(--st)) 16px 6px;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:21px}
.logo svg{width:30px;height:30px}
.top .sp{flex:1}
.pill{font-size:12px;color:var(--tx2);background:var(--bg2);border:1px solid var(--line);padding:5px 10px;border-radius:99px;white-space:nowrap}
main{padding:4px 16px calc(28px + var(--sb))}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card h3{margin:0 0 12px;font-size:12.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--tx3);font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 14px;border-radius:13px;background:var(--bg3);border:1px solid var(--line);font-weight:600;font-size:14px;flex:1;min-width:0;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn.main{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#10131c;border:0}
.btn.big{padding:15px 14px;font-size:16px}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5}
.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin:12px -16px 0;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 12px;border-radius:99px;background:var(--bg3);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--tx2);white-space:nowrap}
.chip.on{background:#8fb4ff26;border-color:#8fb4ff80;color:var(--tx)}
.hint{font-size:12.5px;color:var(--tx3);margin-top:10px;line-height:1.45}
.search{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:0 12px;margin-bottom:12px}
.search .ic{color:var(--tx3)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;padding:12px 0;font-size:15px}
.list{display:flex;flex-direction:column;gap:2px}
.item{display:flex;align-items:center;gap:12px;padding:9px 4px 9px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}

.item .t{flex:1;min-width:0;text-align:left}
.item .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t span{display:block;font-size:12.5px;color:var(--tx3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.bar{display:flex;align-items:center;gap:4px;padding:calc(8px + var(--st)) 8px 6px;min-height:56px;flex:none}

.bar .name{flex:1;min-width:0;display:flex;align-items:center;gap:6px;padding:6px 6px;border-radius:10px;text-align:left}

.pg .grip .ic{width:16px;height:16px;stroke-width:3}

.pg.lift{opacity:.35}
.ghost{position:fixed;z-index:60;pointer-events:none;width:90px;border-radius:10px;box-shadow:0 12px 30px #000a;transform:translate(-50%,-60%) rotate(-3deg);opacity:.92}
.addt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;aspect-ratio:1/1.32;border-radius:10px;border:1.5px dashed #ffffff30;color:var(--tx2);font-size:13px;font-weight:600;width:100%}
.addt .ic{width:26px;height:26px}
.dock{display:flex;gap:8px;padding:10px 16px calc(12px + var(--sb));border-top:1px solid var(--line);background:var(--bg);flex:none}
.dock .btn{flex-direction:column;gap:3px;padding:9px 6px;font-size:12.5px}
.dock .btn.main{flex:1.3;flex-direction:row;font-size:15px}

/* Page */
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px 12px;position:relative}
.pv{position:relative;box-shadow:0 8px 28px #0009;background:#fff}
.pv canvas,.pv img.pimg{display:block;width:100%;height:100%}
.sig{position:absolute;touch-action:none;outline:1.5px dashed var(--acc);outline-offset:2px;cursor:move}
.sig img{display:block;width:100%;pointer-events:none}
.sig i{position:absolute;right:-13px;bottom:-13px;width:26px;height:26px;border-radius:50%;background:var(--acc);border:3px solid #10131c;touch-action:none}
.panel{flex:none;padding:6px 16px calc(10px + var(--sb));border-top:1px solid var(--line);background:var(--bg)}
.seg{display:flex;background:var(--bg3);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 4px;border-radius:9px;font-size:13px;font-weight:600;color:var(--tx2);text-align:center;line-height:1.2}
.seg button.on{background:var(--bg4);color:var(--tx);box-shadow:0 0 0 1px #ffffff1c inset}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.tools button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;font-weight:600;color:var(--tx2);padding:8px 0;border-radius:12px;background:var(--bg2);border:1px solid var(--line)}
.tools button .ic{color:var(--tx)}
.tools button.on{background:#8fb4ff26;border-color:#8fb4ff80;color:var(--tx)}
.adj{margin-top:8px}
.adj label{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--tx2)}
.adj label span{width:84px;flex:none}

input[type=range]{flex:1;min-width:0;accent-color:var(--acc);margin:7px 0}
.link{color:var(--acc);font-weight:600;font-size:13px;padding:6px 0}

/* Cadrage */
.crop-h{font-size:13px;color:var(--tx2);padding:0 16px 6px;flex:none}
.crop-stage{flex:1;min-height:0;position:relative}
.crop-stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.cbar{display:flex;gap:8px;padding:8px 16px 0;flex:none}
.cbar .btn{font-size:13px;padding:9px 6px}
.cbar.last{padding-bottom:calc(12px + var(--sb))}

/* Caméra */
.cam{background:#000}
.cam .bar{position:absolute;left:0;right:0;top:0;z-index:3;background:linear-gradient(#000c,#0000)}
.cam .ib{color:#fff}
.cam .ib.on{color:#ffd76a}
.autop{padding:6px 11px;border-radius:99px;border:1.5px solid #ffffff60;font-size:12.5px;font-weight:700;color:#fff}
.autop.on{background:var(--acc);border-color:var(--acc);color:#10131c}
.cview{flex:1;min-height:0;position:relative;overflow:hidden}
.cview video,.cview canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.cmsg{position:absolute;left:16px;right:16px;bottom:14px;text-align:center;z-index:2}
.cmsg span{display:inline-block;background:#000a;color:#fff;font-size:13.5px;font-weight:600;padding:7px 13px;border-radius:99px}
.cfall{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px;text-align:center;color:var(--tx2);font-size:14px;z-index:2}
.cfall .ic{width:44px;height:44px;color:var(--tx3)}
.cfall .btn{flex:none}
.flashfx{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:4;transition:opacity .35s}
.flashfx.on{opacity:.75;transition:none}
.cbot{flex:none;display:flex;align-items:center;justify-content:space-between;padding:16px 26px calc(22px + var(--sb));background:#000}
.cbot .side{width:58px;height:58px;display:flex;align-items:center;justify-content:center}
.cbot .gal{width:48px;height:48px;border-radius:14px;background:#ffffff1f;color:#fff;display:flex;align-items:center;justify-content:center}
.shut{width:76px;height:76px;position:relative;border-radius:50%}
.shut svg{position:absolute;inset:0;width:76px;height:76px}
.shut i{position:absolute;inset:10px;border-radius:50%;background:#fff;transition:transform .12s}
.shut:active i{transform:scale(.9)}
.shut[disabled] i{background:#999}
.done{position:relative;width:52px;height:64px;border-radius:9px;overflow:hidden;background:#ffffff1f;border:2px solid #fff;display:flex;align-items:center;justify-content:center;color:#fff}
.done img{width:100%;height:100%;object-fit:cover;display:block}
.done b{position:absolute;right:-1px;top:-1px;background:var(--acc);color:#10131c;font-size:12px;min-width:21px;height:21px;border-radius:0 0 0 9px;display:flex;align-items:center;justify-content:center;padding:0 4px}

/* Signature */
.padw{margin:6px 16px;flex:1;min-height:0;max-height:300px;position:relative;background:#fbfbf7;border-radius:16px;overflow:hidden}
.padw canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.padw .base{position:absolute;left:22px;right:22px;bottom:30%;border-bottom:1.5px dashed #9aa0b4;pointer-events:none}
.padw .base:before{content:"Signe ici";position:absolute;left:0;bottom:6px;font-size:12px;color:#9aa0b4}

/* Feuilles */
.shade{position:fixed;inset:0;background:#0009;z-index:40;animation:fi .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:#171a22;border-radius:22px 22px 0 0;border-top:1px solid var(--line);padding:8px 16px calc(18px + var(--sb));max-height:88vh;overflow-y:auto;animation:su .22s ease-out}
.sheet .grab{width:38px;height:4px;border-radius:9px;background:#ffffff30;margin:2px auto 12px}
.sheet h4{margin:0 0 12px;font-size:17px}
.sheet .lab{font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--tx3);margin:14px 0 7px}
.sheet .menu button{display:flex;align-items:center;gap:14px;width:100%;padding:13px 4px;font-size:15px;font-weight:500;border-top:1px solid var(--line);text-align:left}
.sheet .menu button:first-child{border-top:0}
.sheet .menu button .ic{color:var(--tx2)}
.sheet .menu button.danger,.sheet .menu button.danger .ic{color:var(--bad)}
.sheet .menu button small{display:block;font-size:12.5px;color:var(--tx3);font-weight:400}
.sheet .menu button.on{color:var(--acc)}
.sheet .menu button.on .ic{color:var(--acc)}
.field{width:100%;background:var(--bg3);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px;outline:0}
.field:focus{border-color:#8fb4ff80}
.info{font-size:13px;color:var(--tx2);margin-top:12px;min-height:18px}
@keyframes su{from{transform:translateY(100%)}}
@keyframes fi{from{opacity:0}}

#busy{position:fixed;inset:0;z-index:70;background:#0f1116b0;display:flex;align-items:center;justify-content:center}
#busy div{background:#2b3042;border:1px solid #ffffff1f;border-radius:16px;padding:16px 20px;display:flex;align-items:center;gap:12px;font-weight:600;max-width:80vw}
.spin{width:20px;height:20px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:16px;right:16px;top:calc(62px + var(--st));background:#2b3042f2;border:1px solid #ffffff1f;color:var(--tx);padding:11px 14px;border-radius:14px;font-size:14px;box-shadow:0 10px 30px #0008;opacity:0;visibility:hidden;transform:translateY(-12px);transition:opacity .2s,transform .2s,visibility 0s .2s;z-index:80;pointer-events:none}
#toast.on{opacity:1;visibility:visible;transform:none;transition:opacity .2s,transform .2s}
#toast.bad{border-color:#ff7b7b66}
.focusfx{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border:2px solid #fff;border-radius:50%;pointer-events:none;animation:ff .9s ease forwards}
@keyframes ff{from{transform:scale(1.4);opacity:1}to{transform:scale(1);opacity:0}}
</style>

  if (doc.format === 'a4') return land ? [297, 210] : [210, 297];
  if (doc.format === 'letter') return land ? [279.4, 215.9] : [215.9, 279.4];
  const t = TYPES[doc.type] || TYPES.doc, r = Math.max(w, h) / Math.min(w, h);
  let short, long;
  if (t.mm && t.mm.long) { long = t.mm.long; short = long / r; }
  else if (t.mm && t.mm.short) { short = t.mm.short; long = short * r; }
  else { short = 210; long = 210 * r; }
  long = Math.min(long, 5000);
  return land ? [long, short] : [short, long];
}
async function buildPdf(doc, pages) {
  if (!window.jspdf || !window.jspdf.jsPDF) throw new Error('Module PDF absent');
  const Q = QUALS[doc.quality] || QUALS.norm, { jsPDF } = window.jspdf; let pdf = null;
  for (let i = 0; i < pages.length; i++) {
    busy(`Création du PDF : page ${i + 1} sur ${pages.length}`); await frame();
    const cv = await composePage(pages[i], Q.px), url = cv.toDataURL('image/jpeg', Q.q), [pw, ph] = pageMm(doc, cv.width, cv.height), o = pw > ph ? 'l' : 'p';
    if (!pdf) pdf = new jsPDF({ orientation: o, unit: 'mm', format: [pw, ph], compress: true }); else pdf.addPage([pw, ph], o);
    const k = Math.min(pw / cv.width, ph / cv.height), w = cv.width * k, h = cv.height * k;
    pdf.addImage(url, 'JPEG', (pw - w) / 2, (ph - h) / 2, w, h, undefined, 'FAST');
  }
  try { pdf.setProperties({ title: doc.name, creator: 'Scan' }); } catch (e) { }
  const b64 = pdf.output('datauristring').split(',')[1];
  return { b64, name: fileSafe(doc.name) + '.pdf', mime: 'application/pdf', size: Math.round(b64.length * 0.75) };
}
async function buildJpegs(doc, pages) {
  const Q = QUALS[doc.quality] || QUALS.norm, out = [];
  for (let i = 0; i < pages.length; i++) {
    busy(`Image ${i + 1} sur ${pages.length}`); await frame();
    const cv = await composePage(pages[i], Q.px), b64 = cv.toDataURL('image/jpeg', Math.max(Q.q, 0.7)).split(',')[1];
    out.push({ b64, name: fileSafe(doc.name) + (pages.length > 1 ? ` - page ${i + 1}` : '') + '.jpg', mime: 'image/jpeg', size: Math.round(b64.length * 0.75) });
  }
  return out;
}
async function zipOf(files, name) {
  if (!window.JSZip) { try { await loadScript('../shared/vendor/jszip.min.js'); } catch (e) { } }
  if (!window.JSZip) return null;
  const z = new window.JSZip(); files.forEach(f => z.file(f.name, f.b64, { base64: true }));
  const b64 = await z.generateAsync({ type: 'base64' }); return { b64, name: fileSafe(name) + '.zip', mime: 'application/zip', size: Math.round(b64.length * 0.75) };
}
function download(f) { const a = document.createElement('a'); a.href = 'data:' + f.mime + ';base64,' + f.b64; a.download = f.name; document.body.appendChild(a); a.click(); a.remove(); }
function exportSheet(doc, pagesArg) {
  const kind = lsGet('scan.kind', 'pdf'), ms = MS(), canSave = !!(ms && ms.saveFile);
  let K = kind;
  sheet(`<h4>Exporter « ${esc(doc.name)} »</h4>
    <div class="lab">Fichier</div><div class="seg" data-g="kind"><button data-v="pdf">PDF</button><button data-v="jpg">Images JPEG</button></div>
    <div data-pdfonly><div class="lab">Taille des pages</div><div class="seg" data-g="format">${Object.entries(FORMATS).map(([k, l]) => `<button data-v="${k}">${l}</button>`).join('')}</div></div>
    <div class="lab">Qualité</div><div class="seg" data-g="quality">${Object.entries(QUALS).map(([k, q]) => `<button data-v="${k}">${q.label}</button>`).join('')}</div>
    <div class="info" id="exInfo"></div>
    <div class="menu" style="margin-top:6px">
      ${canSave ? `<button data-x="save">${ic('save')}<span>Enregistrer dans Documents/Scan<small>Directement sur le téléphone</small></span></button>` : ''}
      <button data-x="send">${ic('share')}<span>${MP() ? 'Envoyer, partager, imprimer' : 'Télécharger'}<small>${MP() ? 'E-mail, WhatsApp, Drive, imprimante, ou enregistrer ailleurs' : 'Fichier sur cet appareil'}</small></span></button>
    </div>`, el => {
    const upd = () => {
      el.querySelectorAll('[data-g]').forEach(g => { const v = g.dataset.g === 'kind' ? K : doc[g.dataset.g]; g.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === v)); });
      el.querySelector('[data-pdfonly]').hidden = K !== 'pdf';
      const n = doc.pages.length, Q = QUALS[doc.quality] || QUALS.norm;
      el.querySelector('#exInfo').textContent = `${plural(n, 'page')} · ${K === 'pdf' ? 'PDF ' + FORMATS[doc.format] : n > 1 ? plural(n, 'image') + (MP() ? ' (envoyées en .zip)' : '') : 'image JPEG'} · ${Q.sub.toLowerCase()}`;
    };
    upd();
    el.addEventListener('click', async e => {
      const b = e.target.closest('[data-g] button');
      if (b) { const g = b.parentElement.dataset.g; if (g === 'kind') { K = b.dataset.v; lsSet('scan.kind', K); } else { doc[g] = b.dataset.v; if (doc.pages.length) saveDoc(doc); } upd(); return; }
      const x = e.target.closest('[data-x]'); if (!x) return;
      await pageCommit();
      const pages = S.doc && S.doc.id === doc.id ? S.pages : (pagesArg || await loadPages(doc));
      if (!pages.length) { toast('Ce document n’a aucune page'); return; }
      try {
        if (x.dataset.x === 'save') {
          if (K === 'pdf') { const f = await buildPdf(doc, pages); busy('Enregistrement'); ms.saveFile(f.b64, f.name, f.mime); }
          else { const L = await buildJpegs(doc, pages); busy('Enregistrement'); L.forEach(f => ms.saveFile(f.b64, f.name, f.mime)); }
        } else {
          let f;
          if (K === 'pdf') f = await buildPdf(doc, pages);
          else { const L = await buildJpegs(doc, pages); f = L.length === 1 ? L[0] : await zipOf(L, doc.name); if (!f) { f = L[0]; toast('Envoi de la première image seulement (module ZIP absent)'); } }
          busy(false);
          const mp = MP();
          if (mp && mp.fileMenu) mp.fileMenu(f.b64, f.name, f.mime, '', doc.name, `Bonjour,\n\nVeuillez trouver ci-joint « ${doc.name} ».\n\nCordialement`);
          else download(f);
          window.__lastExport = { name: f.name, size: f.size };
        }
        busy(false); back();
      } catch (err) { console.error(err); busy(false); toast(err && err.message === 'Module PDF absent' ? 'Le module PDF n’est pas chargé' : 'L’export a échoué', true); }
    });
  });
}

/* =====================================================================
   Socle et démarrage
   ===================================================================== */
window.onSocle = function (a) {
  try { a = typeof a === 'string' ? JSON.parse(a) : a; } catch (e) { return; }
  if (!a || !a.scan || CAM.open) return;
  const ei = LAYERS.findIndex(l => l.editor), n = ei >= 0 ? LAYERS.length - ei - 1 : LAYERS.length;
  const go = () => { if (!S.doc) openEditor(newDoc(S.type)); openCamera(); };
  if (n > 0) { addEventListener('popstate', () => setTimeout(go, 0), { once: true }); history.go(-n); } else go();
};
initHome();
sigLoad();
loadDocs().then(() => {
  checkShared();
  setTimeout(() => { try { const mp = MP(); if (mp && mp.takeSocle) { const a = mp.takeSocle(); if (a) window.onSocle(a); } } catch (e) { } }, 400);
});
window.__scan = { S, detect, warp, filterCv, addPage, newDoc, importInto, openEditor, buildPdf, LAYERS, CAM, PG };
