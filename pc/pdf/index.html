// repérage simple d'une feuille claire sur un fond plus sombre
function detectSheet(src){ try{ const s=Math.min(1,320/Math.max(src.width,src.height)), w=Math.round(src.width*s), h=Math.round(src.height*s), c=document.createElement("canvas"); c.width=w; c.height=h; const x=c.getContext("2d"); x.drawImage(src,0,0,w,h);
  const d=x.getImageData(0,0,w,h).data, L=new Float32Array(w*h); let sum=0; for(let i=0;i<w*h;i++){ L[i]=.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2]; sum+=L[i]; }
  const hist=new Array(256).fill(0); for(const v of L) hist[v|0]++; let tot=w*h, sB=0, wB=0, max=0, thr=sum/tot, sAll=0; for(let i=0;i<256;i++) sAll+=i*hist[i];
  for(let t=0;t<256;t++){ wB+=hist[t]; if(!wB) continue; const wF=tot-wB; if(!wF) break; sB+=t*hist[t]; const mB=sB/wB, mF=(sAll-sB)/wF, b=wB*wF*(mB-mF)*(mB-mF); if(b>max){ max=b; thr=t; } }
  let best=[null,null,null,null], sc=[-1e9,-1e9,-1e9,-1e9], n=0;
  for(let y=0;y<h;y++) for(let X=0;X<w;X++){ if(L[y*w+X]<=thr) continue; n++; const f=[-X-y, X-y, X+y, -X+y]; for(let k=0;k<4;k++) if(f[k]>sc[k]){ sc[k]=f[k]; best[k]=[X,y]; } }
  if(n<w*h*.12||n>w*h*.97) return null; const q=best.map(([X,Y])=>[X/w,Y/h]); const area=Math.abs((q[2][0]-q[0][0])*(q[3][1]-q[1][1])-(q[3][0]-q[1][0])*(q[2][1]-q[0][1]))/2; return area>.15?q:null; }catch(e){ return null; } }

function editRecipe(r0,onSave){ const r=JSON.parse(JSON.stringify(r0)), ov=document.createElement("div"); ov.className="overlay"; document.body.appendChild(ov);
  const field=(si,[k,t,l,ch])=>{ const o=Object.assign({},STEPS[r.steps[si].k][2],r.steps[si].o), v=o[k];
    if(t==="seg") return `<div class="stack" style="gap:4px"><span class="small" style="font-weight:700">${l}</span><div class="seg">${ch.map(([cv,cl])=>`<button type="button" data-si="${si}" data-k="${k}" data-v="${cv}" class="${String(v)===String(cv)?"on":""}">${cl}</button>`).join("")}</div></div>`;
    if(t==="chk") return `<label class="chk"><input type="checkbox" data-si="${si}" data-k="${k}" ${v?"checked":""}> <span>${l}</span></label>`;
    return `<label class="f small">${l}<input type="${t==="num"?"number":"text"}" data-si="${si}" data-k="${k}" value="${esc(v??"")}"></label>`; };
  const draw=()=>{ ov.innerHTML=`<div class="sheet stack tall"><h2>${r0.steps.length?"Modifier la recette":"Nouvelle recette"}</h2><label class="f">Nom de la recette<input type="text" id="rn" value="${esc(r.name)}"></label>
    ${r.steps.map((s,si)=>{ const d=STEPS[s.k]; return `<div class="stepc"><div class="row" style="flex-wrap:nowrap"><b class="grow">${si+1}. ${esc(d[0])}</b><button class="btn small" data-up="${si}" ${si?"":"disabled"} aria-label="Monter">▲</button><button class="btn small" data-dn="${si}" ${si<r.steps.length-1?"":"disabled"} aria-label="Descendre">▼</button><button class="btn small" data-rm="${si}" aria-label="Retirer">✕</button></div>${d[3].map(f=>field(si,f)).join("")}${s.k==="lock"?`<span class="muted small">Le mot de passe vous sera demandé à chaque lancement.</span>`:""}${s.k==="ocr"?`<span class="muted small">Dans l'application Android seulement.</span>`:""}</div>`; }).join("")||`<span class="muted small">Ajoutez la première étape.</span>`}
    <label class="f">Ajouter une étape<select id="addS"><option value="">Choisir un outil…</option>${Object.entries(STEPS).map(([k,d])=>`<option value="${k}">${esc(d[0])}</option>`).join("")}</select></label>
    <div class="row"><button class="btn" data-a="x">Annuler</button><button class="btn primary grow" data-a="ok">Enregistrer la recette</button></div></div>`;
    const sh=ov.querySelector(".sheet"); sh.querySelector("#rn").oninput=e=>r.name=e.target.value;
    sh.querySelector("#addS").onchange=e=>{ const k=e.target.value; if(!k) return; if(k==="rename"&&r.steps.some(s=>s.k==="rename")){ toast("Il y a déjà une étape Renommer"); e.target.value=""; return; } r.steps.push({k,o:JSON.parse(JSON.stringify(STEPS[k][2]))}); if(k!=="rename"){ const i=r.steps.findIndex(s=>s.k==="rename"); if(i>=0&&i<r.steps.length-1) r.steps.push(r.steps.splice(i,1)[0]); } draw(); sh.scrollTop=sh.scrollHeight; };
    sh.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>{ const i=+b.dataset.up; [r.steps[i-1],r.steps[i]]=[r.steps[i],r.steps[i-1]]; draw(); });
    sh.querySelectorAll("[data-dn]").forEach(b=>b.onclick=()=>{ const i=+b.dataset.dn; [r.steps[i+1],r.steps[i]]=[r.steps[i],r.steps[i+1]]; draw(); });
    sh.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{ r.steps.splice(+b.dataset.rm,1); draw(); });
    sh.querySelectorAll("button[data-si]").forEach(b=>b.onclick=()=>{ const s=r.steps[+b.dataset.si]; s.o=s.o||{}; s.o[b.dataset.k]=b.dataset.v; b.parentElement.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b)); });
    sh.querySelectorAll("input[data-si]").forEach(i=>i.oninput=i.onchange=()=>{ const s=r.steps[+i.dataset.si]; s.o=s.o||{}; s.o[i.dataset.k]=i.type==="checkbox"?i.checked:i.type==="number"?+i.value:i.value; });
    sh.querySelector('[data-a="x"]').onclick=()=>ov.remove();
    sh.querySelector('[data-a="ok"]').onclick=()=>{ if(!r.name.trim()){ toast("Donnez un nom à la recette"); return; } if(!r.steps.length){ toast("Ajoutez au moins une étape"); return; } ov.remove(); onSave(r); toast("Recette enregistrée"); }; };
  draw(); }

S.inbox=[];
async function takeIncoming(){ const B=PB(); let j=""; try{ j=B&&B.pending?B.pending():""; }catch(e){}
  if(j){ let o={}; try{ o=JSON.parse(j); }catch(e){} for(const f of o.files||[]){ try{ const bytes=await brGet(f.token,f.size); S.inbox.push({name:f.name||"document.pdf",size:bytes.length,buf:bytes.buffer}); }catch(e){ toast("Fichier reçu illisible : "+(f.name||"")); } }
    if((o.errors||[]).length) toast("Fichier non reçu : "+o.errors.join(", ")); }
  routeIn(); }
function routeIn(){ if(S.want){ const t=S.want; S.want=null; go(t); return; } if(!S.inbox.length) return;
  if(S.tool&&TOOL[S.tool]&&!S.files.length&&!(ACCEPT[S.tool]||"").startsWith("image")) go(S.tool); else { go(null); toast("PDF reçu : choisissez un outil"); } }
window.atelierIncoming=()=>{ takeIncoming(); };
window.onSocle=a=>{ let o={}; try{ o=JSON.parse(a); }catch(e){ o={tool:String(a||"")}; } if(o&&o.tool&&(TOOL[o.tool]||o.tool==="docs"||o.tool==="help")) S.want=o.tool; takeIncoming(); };

 ["🗜","Compresser",["Trois niveaux. Idéal pour les scans et les photos de documents trop lourds pour un e-mail.","Les pages deviennent des images : le texte n'est plus sélectionnable. Si le fichier ne devient pas plus léger, l'original est gardé."]],
 ["📁","Mes documents",["Les PDF créés avec « Scanner un document » sont gardés tout seuls dans « 📁 Mes documents » (bouton en haut).","Pour les autres outils, touchez « 📁 Garder » sous le résultat, ou cochez « Garder aussi automatiquement » dans Mes documents.","Pour chaque document : 👁 Voir, 📤 Enregistrer ou envoyer, 🖨 Imprimer, ✏️ Renommer, 🗑 Supprimer.","« 💾 Tout sauvegarder (ZIP) » rassemble tous vos documents dans un seul fichier à ranger dans Drive ou sur un PC."]],
 ["✂️","Recadrer et redresser les photos",["Dans « Images en PDF » et « Scanner », touchez ✂️ à côté d'une photo.","Rectangle : faites glisser les coins ; formats Libre, A4, Carré, 4:3, 16:9.","Redresser un document : placez les 4 points rouges sur les coins de la feuille (une loupe aide à viser) ; 🪄 Auto les place tout seul quand la feuille est claire sur un fond plus sombre.","⟲ ⟳ pour faire pivoter. Après une photo prise avec « Photographier une page », le recadrage s'ouvre tout seul."]],
 ["📷","Scanner un document",["Sur téléphone : « Photographier une page », autant de fois que nécessaire, puis rangez les pages.","Le rendu « Noir et blanc » rend le document net et lisible, comme un vrai scanner."]],
 ["✍","Signer et ajouter du texte",["Signer : dessinez votre signature au doigt (ou à la souris), ou écrivez votre nom.","Faites glisser la signature à sa place, réglez sa taille, changez de page avec ◀ ▶, puis « Signer le PDF ».","Ajouter du texte : « Lu et approuvé », une date, une mention, en noir, bleu ou rouge."]],
 ["🔁","Convertir",["Images en PDF : une image par page, en A4 ou à la taille de l'image.","PDF en JPG : chaque page en image (ZIP si plusieurs pages).","PDF en Word et Extraire le texte : reprennent le texte ; la mise en forme n'est pas conservée et un scan n'a pas de texte."]],
 ["🔤","Reconnaître le texte (OCR)",["Pour un scan ou une photo de document : le texte devient cherchable, sélectionnable et copiable, sans changer l'aspect du PDF.","« Pages sans texte seulement » saute les pages qui ont déjà du texte (conseillé) ; « Toutes les pages » relit tout, au risque de doublons.","Sur PC, la lecture se fait sur l'ordinateur avec Tesseract (français), sans internet. Comptez quelques secondes par page ; « Annuler » arrête après la page en cours.","Cochez « Aussi en fichier texte » pour récupérer le texte reconnu dans un .txt.","Depuis Lecteur PDF : sur un document scanné, touchez « Rendre le texte cherchable »."]],
 ["⬛","Caviarder",["Écrivez les mots à masquer (noms, adresse…) et choisissez les motifs : e-mails, téléphones, IBAN, n° de sécurité sociale, dates. Touchez « Chercher et masquer ».","Vérifiez page par page ◀ ▶. Faites glisser le doigt pour noircir une zone à la main ; touchez une zone pour la retirer.","Les pages caviardées deviennent des images : le texte masqué disparaît vraiment du fichier. Les métadonnées sont effacées.","Un scan sans texte ne peut pas être fouillé : dessinez les zones à la main, ou lancez d'abord la reconnaissance de texte."]],
 ["⚡","Automatisations",["Une recette enchaîne plusieurs outils, par exemple : Compresser → Numéroter → Filigrane « COPIE » → Renommer.","Choisissez un ou plusieurs PDF, touchez une recette, puis « Lancer ». Plus de 3 résultats sont regroupés dans un ZIP.","« ＋ Nouvelle recette » ou ✏️ : ajoutez des étapes, réglez-les, rangez-les avec ▲ ▼. « Renommer » se place toujours à la fin : {nom} = nom d'origine, {date} = date du jour.","Les recettes sont gardées dans l'application. Le mot de passe d'une étape « Protéger » est demandé à chaque lancement."]],
 ["🔖","Tampon, en-tête et pied de page",["Tampon : Payé, Reçu, Validé, Bon pour accord, Copie conforme, Refusé, ou votre texte ; avec la date, la couleur, la position et les pages voulues. L'aperçu montre le résultat.","En-tête et pied de page : votre texte en haut et en bas de chaque page. Les boutons insèrent le numéro de page, le nombre de pages, la date, le nom du fichier."]],
 ["🧹","Pages blanches, recadrer, plusieurs pages par feuille, livret",["Pages blanches : les pages vides sont repérées (barrées de rouge). Réglez la tolérance, touchez une page pour la garder ou la retirer.","Recadrer : rogne les marges blanches autour du contenu, ou coupe / ajoute une marge en millimètres.","Plusieurs pages par feuille : 2 ou 4 pages sur une A4, pour imprimer un support de cours.","Livret : imprimez en recto verso (retournement bord court), pliez au milieu : livret A5."]],
 ["🔍","Comparer deux PDF",["Ajoutez l'ancienne version puis la nouvelle (▲ ▼ pour inverser).","Les mots ajoutés sont surlignés en vert, les mots supprimés barrés en rouge, page par page. Un rapport PDF est créé.","Seul le texte est comparé (pas les images ni la mise en page). Pour des scans, lancez d'abord la reconnaissance de texte."]],
 ["🛡","Aplatir, nettoyer, mot de passe",["Aplatir : les champs remplis et les annotations deviennent partie de la page, plus modifiables. « Tout en image » fige tout.","Nettoyer : retire métadonnées (auteur, logiciel…), JavaScript, pièces jointes cachées et, si vous le cochez, les liens.","Protéger : mot de passe d'ouverture (AES 256 bits), avec ou sans droit d'imprimer, copier, modifier. Notez-le : sans lui, le PDF ne s'ouvre plus.","Retirer le mot de passe : il faut le connaître. Mot de passe et retrait fonctionnent seulement dans l'application Android (pas sur PC)."]],
 ["📥","Recevoir un PDF d'une autre appli",["Dans Fichiers, Gmail, WhatsApp… : « Partager » › Atelier PDF. Choisissez ensuite l'outil : il s'ouvre avec ce fichier.","Depuis Lecteur PDF : menu ⋮ › Outils PDF."]],
 ["ℹ️","Ce que l'application ne fait pas",["Convertir Word, Excel ou PowerPoint en PDF : dans ces logiciels, utilisez « Enregistrer sous › PDF ».","Retrouver un mot de passe oublié.","Modifier le texte existant d'un PDF (ajoutez plutôt du texte par-dessus avec « Ajouter du texte »)."]]];
function renderHelp(){ app.innerHTML=`<div class="stack"><div class="row"><button class="btn small" id="bk">← Outils</button></div><h1>Aide</h1>${HELP.map((h,i)=>`<details class="card help" ${i===0?"open":""}><summary><span style="font-size:24px">${h[0]}</span>${esc(h[1])}</summary><ol>${h[2].map(t=>`<li>${esc(t)}</li>`).join("")}</ol></details>`).join("")}</div>`; $("#bk").onclick=()=>go(null); }

<script>/* Application Android : impression (MAGPrint.printHtml), et fichiers téléchargés -> menu Android (enregistrer dans un dossier, e-mail, partager, imprimer) */
(function(){if(!window.MAGPrint)return;var MP=window.MAGPrint;
function fixForms(src,dst){var a=src.querySelectorAll("input,textarea,select"),b=dst.querySelectorAll("input,textarea,select");for(var i=0;i<a.length&&i<b.length;i++){var x=a[i],y=b[i];if(x.tagName==="TEXTAREA")y.textContent=x.value;else if(x.tagName==="SELECT"){Array.prototype.forEach.call(y.options,function(o,k){if(k===x.selectedIndex)o.setAttribute("selected","");else o.removeAttribute("selected")})}else if(x.type==="checkbox"||x.type==="radio"){if(x.checked)y.setAttribute("checked","");else y.removeAttribute("checked")}else y.setAttribute("value",x.value)}}
function snap(win){var doc=win.document,d=doc.documentElement.cloneNode(true);fixForms(doc.documentElement,d);d.querySelectorAll("script").forEach(function(s){s.remove()});
  doc.querySelectorAll("canvas").forEach(function(c,i){try{var img=d.querySelectorAll("canvas")[i];if(img){var im=doc.createElement("img");im.src=c.toDataURL("image/png");im.style.cssText="max-width:100%";img.replaceWith(im)}}catch(e){}});
  return "<!doctype html>"+d.outerHTML}
function toB64(blob){return new Promise(function(ok,ko){var r=new FileReader();r.onload=function(){var x=String(r.result);ok(x.slice(x.indexOf(",")+1))};r.onerror=ko;r.readAsDataURL(blob)})}
function sendFile(href,name,win){if(!MP.fileMenu)return false;(win||window).fetch(href).then(function(r){return r.blob()}).then(function(b){return toB64(b).then(function(x){MP.fileMenu(x,name||"fichier",b.type||"application/octet-stream","","","")})}).catch(function(){});return true}
function openBlob(href,name,win){if(!MP.openFile)return sendFile(href,name,win);(win||window).fetch(href).then(function(r){return r.blob()}).then(function(b){return toB64(b).then(function(x){MP.openFile(x,name||("document"+(b.type.indexOf("pdf")>=0?".pdf":"")),b.type||"application/octet-stream")})}).catch(function(){});return true}
function hook(win){if(!win||win.__magp)return;win.__magp=1;
  /* liens créés par programme (a.click() hors de la page) */
  try{var AC=win.HTMLAnchorElement.prototype.click;win.HTMLAnchorElement.prototype.click=function(){var h=this.getAttribute("href")||"";if(/^(blob:|data:)/.test(h)){if(this.hasAttribute("download")){sendFile(h,this.getAttribute("download"),win);return}if(this.target==="_blank"){openBlob(h,"",win);return}}return AC.apply(this,arguments)}}catch(e){}
  win.print=function(){try{MP.printHtml(snap(win),win.document.title||"MAG Formation 13")}catch(e){}};
  var op=win.open;win.open=function(u){if(u&&/^(blob:|data:)/.test(String(u))){openBlob(String(u),"",win);return null}if(!u||u==="about:blank"){var buf="";var fw={closed:false,document:{open:function(){buf=""},write:function(h){buf+=h},writeln:function(h){buf+=h+"\n"},close:function(){}},focus:function(){},close:function(){fw.closed=true},print:function(){MP.printHtml(buf,"MAG Formation 13")}};return fw}return op?op.apply(win,arguments):null};
  win.document.addEventListener("click",function(e){var a=e.target&&e.target.closest?e.target.closest("a[href]"):null;if(!a)return;var h=a.getAttribute("href")||"";if(!/^(blob:|data:)/.test(h))return;if(a.hasAttribute("download")){e.preventDefault();e.stopPropagation();sendFile(h,a.getAttribute("download"),win)}else if(a.target==="_blank"){e.preventDefault();e.stopPropagation();openBlob(h,a.getAttribute("data-name")||"",win)}},true)}
hook(window);
function watch(f){var go=function(){try{hook(f.contentWindow)}catch(e){}};f.addEventListener("load",function(){if(f.contentWindow)f.contentWindow.__magp=0;go()});go()}
document.querySelectorAll("iframe").forEach(watch);
new MutationObserver(function(ms){ms.forEach(function(m){m.addedNodes.forEach(function(n){if(n.tagName==="IFRAME")watch(n)})})}).observe(document.documentElement,{childList:true,subtree:true});
})();</script>
