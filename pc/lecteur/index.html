<style>
:root{

  --r:18px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f3f4f7;--bg2:#ffffff;--bg3:#e9ebf0;--bg4:#d8dbe3;--line:#0000001a;--line2:#0000002e;
  --tx:#12141a;--tx2:#3d4252;--tx3:#5d6375;
  --acc:#c62f3e;--acc2:#a3203a;--ink:#ffffff;--ok:#1d8a55;--bad:#c62828;--warn:#9a5a00;
  --vbg:#c7cbd4;--bar:#fffffff2;--sheet:#ffffff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}

.num{font-variant-numeric:tabular-nums}

/* ---------- Accueil ---------- */
#home{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(12px + var(--safe-t)) 16px 8px;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;flex:1;min-width:0}
.logo svg{width:34px;height:34px;flex:none}
#refBtn.spinning svg{animation:sp .9s linear infinite}
#ptr{position:fixed;left:50%;top:calc(72px + var(--safe-t));transform:translate(-50%,0);width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--bg2);border:1px solid var(--line);color:var(--tx2);opacity:0;pointer-events:none;z-index:20;transition:opacity .15s}#ptr.on{opacity:1}#ptr.ready{color:var(--acc)}
.hb{width:50px;height:50px;border-radius:15px;display:flex;align-items:center;justify-content:center;background:var(--bg2);border:1px solid var(--line);flex:none}
.hb:active{background:var(--bg3)}
main{padding:2px 16px calc(110px + var(--safe-b))}
.search{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--line);border-radius:15px;padding:0 6px 0 14px;margin:4px 0 12px;color:var(--tx3);min-height:54px}
.search input{flex:1;background:transparent;border:0;outline:0;min-width:0;font-size:17px;color:var(--tx);padding:12px 0}
.search input::placeholder{color:var(--tx3)}
.search button{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--tx3)}
.seg{display:flex;background:var(--bg3);border-radius:15px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;min-height:48px;padding:6px 4px;border-radius:12px;font-size:15.5px;font-weight:700;color:var(--tx2);display:flex;align-items:center;justify-content:center;gap:7px}
.seg button.on{background:var(--bg2);color:var(--tx);box-shadow:0 0 0 1px var(--line2) inset}
.seg button small{font-size:12.5px;color:var(--tx3);font-weight:700}
.doc{display:flex;align-items:center;gap:12px;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:10px 6px 10px 10px;margin-bottom:10px;min-height:96px}
.doc:active{background:var(--bg3)}
.doc .th{width:58px;height:76px;flex:none;border-radius:7px;background:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px #0005;color:#a7adbb}
.doc .th img{width:100%;height:100%;object-fit:cover;object-position:top}
.doc .bd{flex:1;min-width:0}
.doc .tt{font-weight:700;font-size:16px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.doc .mt{font-size:13.5px;color:var(--tx3);margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 10px}
.doc .pb{height:4px;border-radius:4px;background:var(--bg4);margin-top:8px;overflow:hidden}
.doc .pb i{display:block;height:100%;background:var(--acc)}
.doc .ib{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:var(--tx3);flex:none}
.doc .ib.fav{color:#ffc24b}
.doc .ib.fav svg{fill:currentColor}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--bg3);color:var(--tx2)}
.tag.acc{background:color-mix(in srgb,var(--acc) 20%,transparent);color:var(--acc)}
.empty{text-align:center;color:var(--tx3);padding:34px 18px;font-size:15.5px;line-height:1.55}
.empty svg.i{width:60px;height:60px;margin:0 auto 14px;stroke-width:1.3;color:var(--tx3);opacity:.7}
.empty b{color:var(--tx);display:block;font-size:18px;margin-bottom:4px}
#openBtn{position:fixed;left:16px;right:16px;bottom:calc(14px + var(--safe-b));z-index:6;min-height:62px;border-radius:18px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--ink);font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 8px 24px #0006}
#openBtn:active{transform:scale(.98)}
#openBtn svg.i{width:26px;height:26px;stroke-width:2.2}

/* ---------- Boutons, feuilles ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:10px 14px;border-radius:15px;background:var(--bg3);border:1px solid var(--line);font-weight:700;font-size:16px;flex:1;min-width:0;text-align:center;line-height:1.2}
.btn:active{filter:brightness(1.15)}
.btn.main{background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--ink);border:0}
.btn.bad{color:var(--bad)}
.btn.sm{min-height:46px;font-size:14.5px;padding:8px 12px;border-radius:13px}
.btn[disabled]{opacity:.45}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
#sheetWrap{position:fixed;inset:0;z-index:60}
#sheetWrap .scrim{position:absolute;inset:0;background:#0009;opacity:0;transition:opacity .2s}
#sheetWrap.on .scrim{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88vh;background:var(--sheet);border-radius:22px 22px 0 0;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .22s ease-out;padding-bottom:var(--safe-b);box-shadow:0 -10px 30px #0006}
#sheetWrap.on .sheet{transform:none}
.sheet.tall{height:88vh}
.sheet .grab{width:44px;height:5px;border-radius:5px;background:var(--bg4);margin:9px auto 0}
.sheet .sh{display:flex;align-items:center;gap:8px;padding:8px 10px 6px 18px}
.sheet h2{flex:1;margin:0;font-size:19px;font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet .x{width:50px;height:50px;display:flex;align-items:center;justify-content:center;border-radius:14px;color:var(--tx2)}
.sheet .sb{padding:4px 16px 18px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;min-height:0}
.menu{display:flex;flex-direction:column}
.menu button{display:flex;align-items:center;gap:14px;min-height:58px;padding:8px 6px;border-radius:14px;font-size:16.5px;font-weight:600;text-align:left}
.menu button:active{background:var(--bg3)}
.menu button svg.i{color:var(--acc)}
.menu button span{flex:1;min-width:0}
.menu button small{display:block;font-size:13px;color:var(--tx3);font-weight:500;margin-top:1px}
.menu button.bad,.menu button.bad svg.i{color:var(--bad)}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 0;width:100%}
.lbl{font-size:12.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--tx3);font-weight:700;margin:16px 2px 8px}
.inp{width:100%;min-height:56px;padding:12px 14px;border-radius:14px;border:1px solid var(--line2);background:var(--bg);color:var(--tx);font-size:18px;outline:0}
.inp:focus{border-color:var(--acc)}
textarea.inp{min-height:110px;resize:vertical;line-height:1.4}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{min-height:48px;padding:8px 14px;border-radius:13px;background:var(--bg3);border:1px solid var(--line);font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:7px;flex:1;justify-content:center}
.opt.on{background:var(--acc);color:var(--ink);border-color:transparent}
.sw{display:flex;align-items:center;gap:12px;min-height:58px;padding:6px 2px}
.sw span{flex:1;font-weight:600}
.sw small{display:block;color:var(--tx3);font-weight:500;font-size:13px}
.tg{width:56px;height:32px;border-radius:99px;background:var(--bg4);position:relative;flex:none;transition:background .15s}
.tg::after{content:"";position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.tg.on{background:var(--acc)}
.tg.on::after{transform:translateX(24px)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:15px}
.kv dt{color:var(--tx3);font-weight:600}
.kv dd{margin:0;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text}
.note{font-size:14.5px;color:var(--tx2);line-height:1.5}
#toast{position:fixed;left:16px;right:16px;bottom:calc(92px + var(--safe-b));background:#2b3042;color:#f2f3f7;border:1px solid #ffffff1f;padding:13px 15px;border-radius:15px;font-size:15px;z-index:95;opacity:0;transform:translateY(20px);transition:.22s;pointer-events:none;box-shadow:0 8px 24px #0007}
#toast.on{opacity:1;transform:none}
#toast.bad{border-color:#ff7b7b88}
body.rd #toast{bottom:calc(150px + var(--safe-b))}
.spin{width:26px;height:26px;border:3px solid var(--tx3);border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;margin:26px auto}
.spin.sm{width:16px;height:16px;border-width:2px;margin:0;display:inline-block;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- Lecteur ---------- */
#viewer{position:fixed;inset:0;z-index:20;background:var(--vbg);overflow:hidden}
#viewer.paper-nuit{background:#0b0c0f}
#scroller{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#pages{position:relative;margin:0 auto;padding:calc(64px + var(--safe-t)) 8px calc(140px + var(--safe-b));transform-origin:0 0}
#viewer.mode-page #pages{display:flex;align-items:center;justify-content:center;padding:8px}
.pg{position:relative;margin:0 auto 10px;background:#fff;box-shadow:0 1px 4px #0006;overflow:hidden;--scale-factor:1}
#viewer.mode-page .pg{margin:0}
.pg>canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.pg .pn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:28px;font-weight:800;color:#c3c7d0}
#viewer.paper-nuit .pg{background:#1b1c20;box-shadow:none}
#viewer.paper-nuit .pg.inv>canvas{filter:invert(.9) hue-rotate(180deg) contrast(1.05)}
#viewer.paper-sepia .pg::after{content:"";position:absolute;inset:0;background:#f3e3c1;mix-blend-mode:multiply;pointer-events:none;z-index:1}
#viewer.paper-sepia .pg{background:#f3e3c1}
.pg.slide-l{animation:sl .22s ease-out}.pg.slide-r{animation:sr .22s ease-out}
@keyframes sl{from{transform:translateX(30%);opacity:.3}to{transform:none;opacity:1}}
@keyframes sr{from{transform:translateX(-30%);opacity:.3}to{transform:none;opacity:1}}
/* calque de texte de pdf.js (sélection, copie) */
.textLayer{position:absolute;text-align:initial;inset:0;overflow:hidden;opacity:1;line-height:1;-webkit-text-size-adjust:none;text-size-adjust:none;forced-color-adjust:none;transform-origin:0 0;z-index:2;-webkit-user-select:text;user-select:text}
.textLayer span,.textLayer br{color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0% 0%}
.textLayer span.markedContent{top:0;height:0}
.textLayer ::selection{background:#3b82f666}
.textLayer br::selection{background:transparent}
.textLayer .endOfContent{display:block;position:absolute;inset:100% 0 0;z-index:-1;cursor:default;-webkit-user-select:none;user-select:none}
.textLayer[data-main-rotation="90"]{transform:rotate(90deg) translateY(-100%)}
.textLayer[data-main-rotation="180"]{transform:rotate(180deg) translate(-100%,-100%)}
.textLayer[data-main-rotation="270"]{transform:rotate(270deg) translateX(-100%)}
.hitL,.lnkL,.formL{position:absolute;inset:0;pointer-events:none}
.hitL{z-index:3}
.hit{position:absolute;background:#ffd400;mix-blend-mode:multiply;border-radius:2px;opacity:.55}
.hit.cur{background:#ff7a00;opacity:.8;box-shadow:0 0 0 2px #ff7a00}
#viewer.paper-nuit .hit{mix-blend-mode:normal;opacity:.45}
.lnkL{z-index:4}
.lnkL a{position:absolute;pointer-events:auto;display:block}
.lnkL a:active{background:#3b82f633}
.formL{z-index:5}
.fw{position:absolute;pointer-events:auto;margin:0;border:0;padding:0 calc(var(--scale-factor)*2px);background:#d9e6ff99;color:#000;border-bottom:1.5px solid #3b6fd6;outline:0;border-radius:1px;font-family:Helvetica,Arial,sans-serif;line-height:1.15;-webkit-user-select:text;user-select:text}
.fw:focus{background:#fff8c4;box-shadow:0 0 0 2px #ff9a00}
.fw.filled{background:#e9f0ff66}
textarea.fw{resize:none;padding-top:calc(var(--scale-factor)*1px)}
select.fw{appearance:auto;-webkit-appearance:menulist}
.fw[disabled]{background:#eee6;border-bottom-color:#999}
.cb{display:flex;align-items:center;justify-content:center;border:1.5px solid #3b6fd6;background:#d9e6ffaa;padding:0;color:#000}
.cb::before{content:"";position:absolute;inset:-9px}
.cb.rb{border-radius:50%}
.cb svg{width:85%;height:85%;stroke:#000;stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.cb.on svg{opacity:1}
.cb.rb svg{display:none}
.cb.rb.on::after{content:"";width:50%;height:50%;border-radius:50%;background:#000}
#viewer.paper-nuit .fw{filter:invert(.9) hue-rotate(180deg)}
.annL{position:absolute;left:0;top:0;width:100%;height:100%;z-index:6;pointer-events:none;overflow:visible}
.annL .it{pointer-events:none;touch-action:none}
#viewer.ann.t-main .annL .it,#viewer.ann.t-erase .annL .it{pointer-events:visiblePainted;cursor:pointer}
#viewer.ann.t-main .annL .it.img,#viewer.ann.t-erase .annL .it.img,#viewer.ann.t-main .annL text.it,#viewer.ann.t-erase .annL text.it,#viewer.ann.t-main .annL .it.mk,#viewer.ann.t-erase .annL .it.mk{pointer-events:all}
#viewer.ann.t-pen .annL,#viewer.ann.t-hl .annL{pointer-events:all;touch-action:none}
#viewer.ann.t-text .annL,#viewer.ann.t-date .annL,#viewer.ann.t-sign .annL,#viewer.ann.t-mark .annL{pointer-events:all;touch-action:none}
/* outils Texte / Date : les champs de saisie du formulaire passent au-dessus (toucher un champ = le remplir) */
#viewer.ann.t-text .formL,#viewer.ann.t-date .formL{z-index:7}
#viewer.ann.t-text .formL .fw:not(input):not(textarea),#viewer.ann.t-date .formL .fw:not(input):not(textarea){pointer-events:none}
/* aperçu pendant l'appui, poignée de taille, loupe */
.annL text{text-rendering:geometricPrecision}
#viewer.ann .annL.grab{pointer-events:all;touch-action:none}
/* touch-action n'agit pas sur les éléments internes d'un SVG : c'est le calque entier qui décide (outil Déplacer : seuls les ajouts captent le doigt) */
#viewer.ann .annL{touch-action:none}
.annL .ghost{pointer-events:none}
.annL .ghost .gbox{fill:#ff7a0024;stroke:#ff7a00;stroke-width:2px;stroke-dasharray:5 3;vector-effect:non-scaling-stroke}
.annL .ghost .gsnap{fill:#1d8a5512;stroke:#1d8a55;stroke-width:3px;vector-effect:non-scaling-stroke}
.annL .ghost .gcar{stroke:#ff7a00;stroke-width:2px;vector-effect:non-scaling-stroke}
.annL .hdl{pointer-events:all;touch-action:none;cursor:nwse-resize}
.annL .hdl .hv{fill:#ff7a00;stroke:#fff;stroke-width:2px;vector-effect:non-scaling-stroke}
#viewer.ann.t-main .annL .selhit{pointer-events:all;touch-action:none}
#loupe{position:fixed;z-index:60;width:124px;height:124px;border-radius:50%;overflow:hidden;pointer-events:none;background:#fff;border:3px solid #fff;box-shadow:0 4px 18px #0008}
#loupe canvas{width:100%;height:100%;display:block}
.annL .sel{outline:none;stroke:#ff7a00;stroke-width:1.5;stroke-dasharray:4 3;fill:none}
#viewer.ann .lnkL a{pointer-events:none}
#viewer.paper-nuit .annL{filter:invert(.9) hue-rotate(180deg)}

/* barres */
.vbar{position:absolute;left:0;right:0;z-index:30;background:var(--bar);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);transition:transform .2s ease,opacity .2s}
#vtop{top:0;padding:calc(6px + var(--safe-t)) 6px 6px;display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--line)}
#vbot{bottom:0;padding:8px 8px calc(8px + var(--safe-b));border-top:1px solid var(--line)}
#viewer.nobars #vtop{transform:translateY(-110%);opacity:0;pointer-events:none}
#viewer.nobars #vbot{transform:translateY(110%);opacity:0;pointer-events:none}
.vb{width:52px;height:52px;border-radius:15px;display:flex;align-items:center;justify-content:center;flex:none;color:var(--tx)}
.vb:active{background:var(--bg3)}
.vb.on{color:var(--acc)}
.vb.on svg.i{fill:currentColor}
.vb.on.nofill svg.i{fill:none}
.vt{flex:1;min-width:0;padding:0 4px}
.vt b{display:block;font-size:16px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vt span{display:block;font-size:13px;color:var(--tx3)}
#saveBtn{min-height:46px;padding:0 14px;border-radius:13px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--ink);font-weight:800;font-size:15px;display:flex;align-items:center;gap:6px;flex:none}
.slrow{display:flex;align-items:center;gap:10px;padding:0 6px}
.slrow .pgl{min-width:78px;text-align:center;font-weight:800;font-size:16px;min-height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:var(--bg3);padding:0 8px}
input[type=range]{flex:1;min-width:0;height:44px;background:transparent;-webkit-appearance:none;appearance:none;margin:0}

   (bouton ⟳ ou glisser vers le bas en haut de la liste) */
var refreshing=false;
async function doRefresh(){
  if(refreshing) return; refreshing=true;
  var btn=$('refBtn'), t0=Date.now(), home=$('home'), y=home.scrollTop, lost=0, found=0;
  btn.classList.add('spinning');
  try{
    if(!importing){ try{ var l=await dbAll('docs'); if(l && !importing) DOCS=l; }catch(e){} }
    renderHome(); home.scrollTop=y;
    var b=B();
    if(b && b.check){
      var l2=recentSorted();
      for(var i=0;i<l2.length;i++){
        var d=l2[i]; if(/^idb:/.test(d.src||'')) continue;
        var st='ok'; try{ st=(window.MAGPC&&b.checkAsync?await b.checkAsync(d.src):b.check(d.src))||'ok'; }catch(e){}
        if(st!=='ok' && !d.lost){ d.lost=true; lost++; saveDoc(d,true); }
        else if(st==='ok' && d.lost){ d.lost=false; found++; saveDoc(d,true); }
        if(i%6===5) await new Promise(function(r){ setTimeout(r,0); });
      }
    }
    renderHome(); home.scrollTop=y; schedulePublish();
    toast('Actualisé'+(lost?' · '+lost+' document'+(lost>1?'s':'')+' introuvable'+(lost>1?'s':''):'')+(found?' · '+found+' retrouvé'+(found>1?'s':''):''));
  } finally {
    setTimeout(function(){ btn.classList.remove('spinning'); }, Math.max(0, 700-(Date.now()-t0)));
    refreshing=false;
  }
}
$('refBtn').onclick=function(){ doRefresh(); };
(function(){

  h.addEventListener('touchstart',function(e){ y0=(h.scrollTop<=0 && e.touches.length===1 && !blocked()) ? e.touches[0].clientY : null; pulled=0; },{passive:true});
  h.addEventListener('touchmove',function(e){ if(y0==null) return; if(h.scrollTop>0){ reset(); return; } pulled=Math.max(0,e.touches[0].clientY-y0); ind.style.transform='translate(-50%,'+Math.min(70,pulled/2)+'px) rotate('+(pulled*2)+'deg)'; ind.classList.toggle('on',pulled>12); ind.classList.toggle('ready',pulled>110); },{passive:true});

async function runSearch(q){
  q=q.trim(); V.lastQ=q;
  var nq=fold(q).replace(/ +/g,' ');
  if(nq.length<1) return;
  var gen=V.sgen=(V.sgen||0)+1;
  V.hits=[]; V.hitIdx=-1; $('sCnt').innerHTML='<span class="spin sm"></span>';
  var start=V.cur, order=[]; for(var i=0;i<V.n;i++) order.push(((start-1+i)%V.n)+1);
  var all=[], jumped=false, found=0;
  for(var k=0;k<order.length;k++){
    var p=order[k];
    try{ var t=await pageText(p); }catch(e){ continue; }
    if(gen!==V.sgen||!V.open) return;
    var from=0, idx;
    while((idx=t.norm.indexOf(nq, from))>=0){ all.push({p:p, s:idx, e:idx+nq.length}); found++; from=idx+Math.max(1,nq.length); if(found>=1000) break; }
    if(!jumped && found){ jumped=true; V.hits=all.slice().sort(hitCmp); V.hitIdx=V.hits.findIndex(function(h){ return h.p>=start; }); if(V.hitIdx<0) V.hitIdx=0; showHit(); }
    if(k%8===0){ $('sCnt').textContent=(V.hitIdx+1>0?(V.hitIdx+1)+'/':'')+found+'…'; await tick(); }
    if(found>=1000) break;
  }
  if(gen!==V.sgen) return;
  var curH=V.hits[V.hitIdx];
  V.hits=all.sort(hitCmp);
  V.hitIdx=curH?V.hits.findIndex(function(h){ return h.p===curH.p&&h.s===curH.s; }):-1;
  updCount();
  redrawHits();
  if(!found) toast('« '+q+' » introuvable dans ce document');
}
function hitCmp(a,b){ return a.p-b.p||a.s-b.s; }
function updCount(){ $('sCnt').textContent=V.hits.length?((V.hitIdx+1)+'/'+V.hits.length):'0'; }
function stepHit(d){ if(!V.hits.length) return; V.hitIdx=(V.hitIdx+d+V.hits.length)%V.hits.length; showHit(); updCount(); }
function showHit(){
  var h=V.hits[V.hitIdx]; if(!h) return;
  V.wantHit=h; updCount();

function drawHits(p){

  var L3=el.querySelector('.hitL'); if(!L3) return;
  L3.innerHTML='';
  var t=V.txt[p]; if(!t) return;
  var hs=V.hits.filter(function(h){ return h.p===p; }); if(!hs.length) return;
  var er=el.getBoundingClientRect(), s=el._s||1, cur=V.hits[V.hitIdx], curEl=null;
  hs.forEach(function(h){
    var isCur=cur&&cur.p===h.p&&cur.s===h.s;

      var a=t.starts[i], b=a+t.lens[i]; if(b<=h.s) continue; if(a>=h.e) break;

          d.style.cssText=cssBox({x:(q.left-er.left)/s, y:(q.top-er.top)/s, w:q.width/s, h:q.height/s});
          L3.appendChild(d); if(isCur&&!curEl) curEl=d;
        });

    }

  if(curEl && V.wantHit && V.wantHit.p===p){ V.wantHit=null; var cr=curEl.getBoundingClientRect(), sr=sc.getBoundingClientRect(); if(cr.top<sr.top+80||cr.bottom>sr.bottom-150) sc.scrollTop+=cr.top-sr.top-sc.clientHeight*0.35; if(cr.left<sr.left||cr.right>sr.right) sc.scrollLeft+=cr.left-sr.left-sc.clientWidth/2; }
}

/* ---------- Zones de signature : champs /Sig et mentions (« Signature », « Lu et approuvé »…) ---------- */
function rInter(a,b){ var w=Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x), h=Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y); return w>0&&h>0?w*h:0; }

/** Repère les zones d'une page (coordonnées de la page à l'échelle 1, comme les annotations) */
function findZones(p, v, an, tc){
  var W=v.width, H=v.height, out=[], sigs=[], obst=[], up=[];
  (an||[]).forEach(function(a){
    if(a.subtype!=='Widget' || !a.rect) return;
    var r=vpRect(p, a.rect); if(r.w<1||r.h<1) return;
    if(a.fieldType==='Sig'){ if(r.w>=20 && r.h>=10 && sigs.length<4) sigs.push({x:r.x, y:r.y, w:r.w, h:r.h, k:'sig', f:a.fieldName||''}); }
    else obst.push(r);
  });

    var s=it.str||''; if(!s.trim()) return;
    var m=pdfjsLib.Util.transform(v.transform, it.transform), fu=Math.hypot(it.transform[0],it.transform[1])||1, wu=(it.width||0)/fu;
    var xs=[], ys=[]; [[0,-0.25],[wu,-0.25],[0,0.9],[wu,0.9]].forEach(function(c){ xs.push(m[0]*c[0]+m[2]*c[1]+m[4]); ys.push(m[1]*c[0]+m[3]*c[1]+m[5]); });
    var b={x:Math.min.apply(null,xs), y:Math.min.apply(null,ys)}; b.w=Math.max.apply(null,xs)-b.x; b.h=Math.max.apply(null,ys)-b.y; b.i=idx;
    if(!/^[\s._\-…·:]*$/.test(s)) obst.push(b);              // pointillés / soulignés : pas un obstacle
    var fs=-m[3];
    if(m[0]>0 && fs>0 && Math.abs(m[1])<0.02*m[0] && Math.abs(m[2])<0.02*fs) up.push({x:m[4], x1:m[4]+wu*m[0], base:m[5], fs:fs, s:s, i:idx});   // texte droit à l'écran
  });
  // lignes puis segments (morceaux de texte contigus sur une même ligne)
  up.sort(function(a,b){ return a.base-b.base || a.x-b.x; });
  var lines=[];
  up.forEach(function(t){ var l=lines[lines.length-1]; if(l && Math.abs(t.base-l.base)<0.35*Math.max(t.fs,l.fs)) l.items.push(t); else lines.push({base:t.base, items:[t]}); });
  var segs=[];
  lines.forEach(function(l){
    l.items.sort(function(a,b){ return a.x-b.x; });
    var cur=null;
    l.items.forEach(function(t){
      if(cur && t.x-cur.x1<1.2*Math.max(t.fs,cur.fs)){ cur.s+=(t.x-cur.x1>0.15*t.fs?' ':'')+t.s; cur.x1=Math.max(cur.x1,t.x1); cur.fs=Math.max(cur.fs,t.fs); cur.ids.push(t.i); }
      else { cur={x:t.x, x1:t.x1, base:t.base, fs:t.fs, s:t.s, ids:[t.i]}; segs.push(cur); }
    });
  });
  segs.forEach(function(g){ g.f=fold(g.s); g.n=g.f.split(/[^a-z0-9]+/).filter(Boolean).length; g.top=g.base-0.85*g.fs; g.bot=g.base+0.25*g.fs; });
  var para=function(g){ return segs.some(function(o){ return o!==g && o.n>8 && o.base<g.base && g.base-o.base<2.2*g.fs && o.x<g.x1 && o.x1>g.x; }); };
  var ment=[];
  segs.forEach(function(g){
    if(g.n>8 || g.n<1) return;                                  // ligne d'un long paragraphe
    var st=SZ_STRONG.test(g.f), wk=!st && SZ_WEAK.test(g.f); if(!st && !wk) return;
    if(wk && g.top<H*0.4) return;                               // « le client » en en-tête : pas une zone
    if(para(g)) return;                                         // fin de paragraphe
    ment.push({g:g, st:st});

  ment.sort(function(a,b){ return (b.st-a.st) || a.g.top-b.g.top; });
  out=sigs.slice();
  ment.forEach(function(mm){
    if(out.length>=4) return;
    var g=mm.g, mr={x:g.x, y:g.top, w:g.x1-g.x, h:g.bot-g.top};
    var near=sigs.filter(function(s){ return rInter(rGrow(s,40), mr)>0; })[0];
    if(near){ if(!near.lab) near.lab=g.s; return; }                           // le champ de signature voisin suffit (il garde la mention)
    var ob=obst.filter(function(o){ return g.ids.indexOf(o.i)<0; });
    var free=function(r){ return !ob.some(function(o){ return rInter(o,r)>1; }); };
    var fit=function(r){ if(r.x+r.w>W-6) r.x=Math.max(6,W-6-r.w); if(r.x+r.w>W-6) r.w=W-6-r.x; if(r.y<6) r.y=6; if(r.y+r.h>H-6) r.h=H-6-r.y; return r; };
    var c=[], below=fit({x:g.x, y:g.bot+3, w:180, h:60});

function hexRgb(L, h){ var n=parseInt(h.slice(1),16); return L.rgb(((n>>16)&255)/255,((n>>8)&255)/255,(n&255)/255); }
function safeText(font, s){ var o=''; for(var i=0;i<s.length;i++){ var c=s[i]; if(c==='\n'){ o+=c; continue; } try{ font.encodeText(c); o+=c; }catch(e){ o+='?'; } } return o; }
async function buildCopy(){
  var Lb=await libPdf();
  var src=await V.pdf.getData();
  var doc=await Lb.PDFDocument.load(src, {ignoreEncryption:true, updateMetadata:false});
  if(doc.isEncrypted) throw new Error('Ce PDF est protégé contre la modification : impossible d\'en enregistrer une copie remplie ou annotée.');
  var font=await doc.embedFont(Lb.StandardFonts.Helvetica);
  // formulaire
  var names=Object.keys(V.fv), miss=0;
  if(names.length){
    var form=doc.getForm();
    try{ form.deleteXFA(); }catch(e){}
    names.forEach(function(n){
      var v=V.fv[n];
      try{
        var f=form.getField(n);
        if(f instanceof Lb.PDFTextField){ var t=safeText(font, String(v==null?'':v)); var ml=f.getMaxLength(); if(ml && t.length>ml) t=t.slice(0,ml); f.setText(t); }
        else if(f instanceof Lb.PDFCheckBox){ if(v && v!=='Off') f.check(); else f.uncheck(); }
        else if(f instanceof Lb.PDFRadioGroup){ if(v && v!=='Off'){ var opts=f.getOptions(); f.select(opts.indexOf(v)>=0?v:opts[0]); } else f.clear(); }
        else if(f instanceof Lb.PDFDropdown || f instanceof Lb.PDFOptionList){ if(v==='') f.clear(); else { try{ f.select(String(v)); }catch(e){ var a=findOpt(n,v); if(a) f.select(a); else throw e; } } }
      }catch(e){ console.warn('champ', n, e); miss++; }
    });
    try{ form.updateFieldAppearances(font); }catch(e){ console.warn(e); }
  }
  // annotations : coordonnées de l'écran (page à l'échelle 1) → points PDF
  var pages=doc.getPages(), imgs={}, placed=[];
  for(var i=0;i<V.ann.length;i++){
    var a=V.ann[i], page=pages[a.p-1]; if(!page) continue;
    var v=V.vp1[a.p]; if(!v){ v=(await V.pdf.getPage(a.p)).getViewport({scale:1}); V.vp1[a.p]=v; }
    var cv=function(x,y){ return v.convertToPdfPoint(x,y); }, rot=Lb.degrees(v.rotation||0);
    if(a.t==='ink'||a.t==='hl'){
      var d=''; for(var k=0;k<a.pts.length;k+=2){ var q=cv(a.pts[k],a.pts[k+1]); d+=(k?'L':'M')+q[0].toFixed(2)+' '+(-q[1]).toFixed(2)+' '; }
      if(a.pts.length===2){ var q2=cv(a.pts[0]+0.1,a.pts[1]); d+='L'+q2[0].toFixed(2)+' '+(-q2[1]).toFixed(2); }
      var o={x:0, y:0, borderColor:hexRgb(Lb,a.c), borderWidth:a.w, borderLineCap:Lb.LineCapStyle.Round};
      if(a.t==='hl'){ o.borderOpacity=0.4; o.blendMode=Lb.BlendMode.Multiply; }
      page.drawSvgPath(d, o);
    } else if(a.t==='text'){
      var ls=String(a.txt).split('\n');
      for(var j=0;j<ls.length;j++){ var bp=cv(a.x, a.y+j*a.s*1.2); page.drawText(safeText(font, ls[j]), {x:bp[0], y:bp[1], size:a.s, font:font, color:hexRgb(Lb,a.c), rotate:rot}); }
    } else if(a.t==='img'){
      var im=imgs[a.src]; if(!im){ im=await doc.embedPng(a.src); imgs[a.src]=im; }
      var bl=cv(a.x, a.y+a.h), tr=cv(a.x+a.w, a.y);
      page.drawImage(im, {x:bl[0], y:bl[1], width:a.w, height:a.h, rotate:rot});
      if(a.cap && a.cs){ var ct=safeText(font, String(a.cap)), cw=font.widthOfTextAtSize(ct, a.cs), cpp=capPos(a), cb=cv(cpp.cx-cw/2, cpp.y); page.drawText(ct, {x:cb[0], y:cb[1], size:a.cs, font:font, color:Lb.rgb(0.1,0.1,0.1), rotate:rot}); }
      placed.push({p:a.p-1, x:Math.min(bl[0],tr[0]), y:Math.min(bl[1],tr[1]), w:Math.abs(tr[0]-bl[0]), h:Math.abs(tr[1]-bl[1])});
    } else if(a.t==='mark'){
      var mc=hexRgb(Lb,a.c);
      if(a.k==='o'){ var mo=cv(a.x,a.y); page.drawCircle({x:mo[0], y:mo[1], size:a.s*MKR, color:mc}); }
      else {
        var md=''; (MKG[a.k]||MKG.v).forEach(function(ln){ ln.forEach(function(q,qi){ var r2=cv(a.x+q[0]*a.s, a.y+q[1]*a.s); md+=(qi?'L':'M')+r2[0].toFixed(2)+' '+(-r2[1]).toFixed(2)+' '; }); });
        page.drawSvgPath(md, {x:0, y:0, borderColor:mc, borderWidth:a.s*(MKW[a.k]||0.15), borderLineCap:Lb.LineCapStyle.Round});
      }
    }
  }
  if(placed.length) hideSigWidgets(Lb, doc, pages, placed);
  var out=await doc.save();
  return {bytes:out, miss:miss};
}
/* Champ de signature (/Sig) recouvert par la signature dessinée : le champ reste (non signé numériquement),
   seule son apparence (cadre, fond éventuel) est retirée pour que l'image posée reste visible partout. */
function hideSigWidgets(Lb, doc, pages, placed){
  try{
    var af=doc.catalog.lookup(Lb.PDFName.of('AcroForm')); if(!af) return;
    var AP=Lb.PDFName.of('AP'), MK=Lb.PDFName.of('MK'), BG=Lb.PDFName.of('BG');
    doc.getForm().getFields().forEach(function(f){
      if(!(f instanceof Lb.PDFSignature)) return;
      f.acroField.getWidgets().forEach(function(w){
        try{
          var ref=doc.context.getObjectRef(w.dict), r0=w.getRectangle(), r={x:r0.x, y:r0.y, w:r0.width, h:r0.height}, pi=-1;
          for(var i=0;i<pages.length && pi<0;i++){ var an=pages[i].node.Annots(); if(an && ref && an.asArray().some(function(x){ return x===ref || (x.objectNumber===ref.objectNumber && x.generationNumber===ref.generationNumber); })) pi=i; }
          var hit=placed.some(function(s){ if(pi>=0 && s.p!==pi) return false; var ov=rInter(s, r); return ov>0.3*Math.min(s.w*s.h, r.w*r.h); });
          if(!hit) return;
          w.dict.delete(AP);
          var mk=w.dict.lookup(MK); if(mk instanceof Lb.PDFDict) mk.delete(BG);
        }catch(e){}
      });
    });
  }catch(e){}
}
function findOpt(name, v){ for(var p in V.annots){ var l=V.annots[p]||[]; for(var i=0;i<l.length;i++){ var a=l[i]; if(a.fieldName===name && a.options){ for(var k=0;k<a.options.length;k++) if(a.options[k].exportValue===v) return a.options[k].displayValue; } } } return null; }
async function sendOut(bytes, name, mode, src){
  var b=B();
  if(!b||!b.outBegin){
    var u=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'})), x=document.createElement('a'); x.href=u; x.download=name; document.body.appendChild(x); x.click(); x.remove(); setTimeout(function(){ URL.revokeObjectURL(u); },20000);
    return {ok:true, mode:'browser', name:name};
  }
  var t=b.outBegin(); if(!t) throw new Error('Écriture impossible');
  var CH=786432;
  for(var i=0;i<bytes.length;i+=CH){ if(!b.outChunk(t, bytesToB64(bytes.subarray(i,i+CH)))){ try{ b.outCancel(t); }catch(e){} throw new Error('Écriture impossible (stockage plein ?)'); } if(i%(CH*4)===0) await tick(); }
  return await new Promise(function(res){
    OUT[t]=res; if(mode==='overwrite') b.outOverwrite(t, src, name); else b.outEnd(t, mode, name);
    setTimeout(function(){ if(OUT[t]){ delete OUT[t]; res({ok:false, err:'Pas de réponse'}); } }, mode==='saveas'||mode==='overwrite'?15*60000:120000);
  });
}
/* Enregistrer dans le fichier d'origine (version PC) : les ajouts deviennent partie du document, le brouillon est vidé */
async function overwriteDoc(){
  if(exporting || !V.open || !canOverwrite()) return; exporting=true;
  var d=V.doc, name=d.name||(d.title+'.pdf');
  toast('Enregistrement…', false, 60000);
  try{
    var r=await buildCopy();
    var o=await sendOut(r.bytes, name, 'overwrite', d.src);
    if(!o.ok){ if(o.err==='Annulé') toast('Enregistrement annulé'); else toast('Échec : '+(o.err||'erreur inconnue'), true, 5000); return; }
    if(V.open && V.doc===d){ V.fv={}; V.ann=[]; V.undo=[]; V.dirty=false; selectItem(null); }
    delete d.draft; d.size=r.bytes.length; saveDoc(d,true);
    toast(r.miss?r.miss+' champ'+(r.miss>1?'s n\'ont':' n\'a')+' pas pu être rempli'+(r.miss>1?'s':''):'Enregistré dans « '+(o.name||name)+' »', !!r.miss, 4000);
    try{ var lib=await libJs(), pdf=await lib.getDocument({data:r.bytes.slice(0)}).promise; await makeThumb(d, pdf); pdf.destroy(); saveDoc(d,true); }catch(e){}
    closeAllThen(function(){ openDoc(d); });                   // relit le fichier tel qu'il est maintenant
  }catch(e){ console.error(e); toast(e.message||'Enregistrement impossible', true, 6000); }
  finally{ exporting=false; }
}
var exporting=false;
async function exportCopy(mode, name){
  if(exporting) return; exporting=true;
  name=(name||copyName()).replace(/\.pdf$/i,'')+'.pdf';
  toast('Préparation de la copie…', false, 60000);

    var r=hasDraft()?await buildCopy():{bytes:await V.pdf.getData(), miss:0};
    var o=await sendOut(r.bytes, name, mode);
    if(!o.ok){ if(o.err==='Annulé'){ toast('Enregistrement annulé'); } else toast('Échec : '+(o.err||'erreur inconnue'), true, 5000); return; }
    if(r.miss) toast(r.miss+' champ'+(r.miss>1?'s n\'ont':' n\'a')+' pas pu être rempli'+(r.miss>1?'s':''), true, 5000);

}

/* =========================================================
   Lecture à voix haute (synthèse vocale d'Android, page par page)
   ========================================================= */
var T={on:false,paused:false,p:1,list:[],i:0,gen:0,id:''};
var RATES=[0.8,1,1.25,1.5];
$('tPlay').innerHTML=ic('pause'); $('tStop').innerHTML=ic('stop');
function sentences(raw){
  var t=raw.replace(/-\s+(?=[a-zà-ÿ])/g,'').replace(/\s+/g,' ').trim(); if(!t) return [];
  var out=[], re=/[^.!?…;:]+[.!?…;:]*["»”)]*\s*/g, m;
  while((m=re.exec(t))){ var s=m[0].trim(); if(!s) continue; while(s.length>260){ var cut=s.lastIndexOf(' ',240); if(cut<80) cut=240; out.push(s.slice(0,cut)); s=s.slice(cut).trim(); } if(/[\wÀ-ÿ0-9]/.test(s)) out.push(s); }
  return out;
}
async function ttsStart(){
  if(!V.n) return;
  T.on=true; T.paused=false; T.p=V.cur; T.web=false; T.noWeb=false;
  $('ttsbar').hidden=false; showBars(true); keepScreen(true); ttsUi();
  await ttsLoad();
  speakCur();
}
async function ttsLoad(){ var t=await pageText(T.p); T.list=sentences(t.raw); T.i=0; ttsUi(); }
function ttsUi(){ $('tInfo').textContent='Page '+T.p+(T.list.length?' · phrase '+Math.min(T.i+1,T.list.length)+'/'+T.list.length:''); $('tPlay').innerHTML=ic(T.paused?'play':'pause'); $('tPlay').setAttribute('aria-label',T.paused?'Reprendre':'Pause'); $('tRate').textContent='×'+String(S.rate).replace('.',','); $('bTts').classList.toggle('on',T.on); }
function speakCur(){
  if(!T.on||T.paused) return;
  if(T.i>=T.list.length){ ttsNext(); return; }
  var g=++T.gen, id='t'+g, text=T.list[T.i]; T.id=id; ttsUi();
  var b=B();
  if(b && b.ttsSpeak && !T.web){ b.ttsSpeak(id, text, S.rate); return; }
  if(window.speechSynthesis && window.SpeechSynthesisUtterance){
    var u=new SpeechSynthesisUtterance(text); u.lang='fr-FR'; u.rate=S.rate;
    var vs=speechSynthesis.getVoices().filter(function(v){ return /^fr/i.test(v.lang); }); if(vs.length) u.voice=vs[0];
    u.onend=function(){ if(g===T.gen){ T.i++; speakCur(); } }; u.onerror=function(ev){ if(ev&&ev.error==='interrupted') return; if(g===T.gen){ T.i++; speakCur(); } };
    speechSynthesis.speak(u); return;
  }
  toast('Synthèse vocale indisponible', true); ttsStop();
}
function ttsEvent(o){
  if(o.ev==='unavailable'){ T.web=true; if(T.on&&!T.paused) speakCur(); return; }
  if(o.id!==T.id) return;
  if(o.ev==='done'||o.ev==='error'){ T.i++; speakCur(); }
}
async function ttsNext(){
  var skipped=0;
  while(true){
    if(T.p>=V.n){ ttsStop(); toast('Fin du document'); return; }
    T.p++; if(V.open) goTo(T.p,0);
    await ttsLoad(); if(!T.on) return;
    if(T.list.length) break;
    if(++skipped>=5){ ttsStop(); toast('Pas de texte à lire (document scanné ?)', true); return; }
  }
  speakCur();
}
function haltEngine(){ T.gen++; try{ var b=B(); if(b&&b.ttsStop) b.ttsStop(); }catch(e){} try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){} }
function ttsStop(silent){ if(!T.on) return; T.on=false; T.paused=false; haltEngine(); $('ttsbar').hidden=true; ttsUi(); if(!silent) keepScreen(true); }
$('tPlay').onclick=function(){ if(!T.on) return; if(T.paused){ T.paused=false; speakCur(); } else { T.paused=true; haltEngine(); } ttsUi(); };
$('tStop').onclick=function(){ ttsStop(); };
$('tRate').onclick=function(){ var i=RATES.indexOf(S.rate); S.rate=RATES[(i+1)%RATES.length]; saveS(); ttsUi(); if(T.on&&!T.paused){ haltEngine(); speakCur(); } };
