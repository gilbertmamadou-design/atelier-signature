  lines.forEach(function(l){
    var i = l.indexOf(':'); if (i < 0) return;
    var head = l.slice(0, i), val = l.slice(i + 1), parts = head.split(';'), name = parts[0].toUpperCase().replace(/^ITEM\d+\./, ''), params = parts.slice(1).join(';').toUpperCase();
    if (/QUOTED-PRINTABLE/.test(params)) { var cs = /CHARSET=([\w-]+)/.exec(params); val = qpDecode(val, cs ? cs[1] : 'utf-8'); }
    if (name === 'BEGIN' && /VCARD/i.test(val)) { c = blank(); c.tel = []; return; }
    if (!c) return;
    if (name === 'END') { out.push(c); c = null; return; }
    var typ = params;
    switch (name) {
      case 'N': { var n = val.split(';').map(vUnesc); c.f = n[0] || ''; c.g = n[1] || ''; c.mid = n[2] || ''; c.pre = n[3] || ''; c.suf = n[4] || ''; break; }
      case 'FN': c.fn = vUnesc(val); break;
      case 'TEL': c.tel.push({ v:vUnesc(val).replace(/^tel:/i, ''), t:/CELL/.test(typ) && /WORK/.test(typ) ? 17 : /CELL|MOBILE/.test(typ) ? 2 : /FAX/.test(typ) ? (/HOME/.test(typ) ? 5 : 4) : /WORK/.test(typ) ? 3 : /HOME/.test(typ) ? 1 : /MAIN|PREF/.test(typ) && !/VOICE/.test(typ) ? 12 : 2 }); break;
      case 'EMAIL': c.mail.push({ v:vUnesc(val), t:/WORK/.test(typ) ? 2 : /HOME/.test(typ) ? 1 : 3 }); break;
      case 'ADR': { var a = val.split(';').map(vUnesc); c.adr.push({ street:[a[1], a[2]].filter(Boolean).join(', '), city:a[3] || '', zip:a[5] || '', country:a[6] || '', t:/WORK/.test(typ) ? 2 : /HOME/.test(typ) ? 1 : 3 }); break; }
      case 'ORG': c.co = vUnesc(val.split(';')[0]); break;
      case 'TITLE': c.job = vUnesc(val); break;
      case 'NOTE': c.note = (c.note ? c.note + '\n' : '') + vUnesc(val); break;
      case 'URL': c.web.push(vUnesc(val)); break;
      case 'BDAY': { var m = /^(\d{4})-?(\d{2})-?(\d{2})/.exec(val) || /^--(\d{2})-?(\d{2})/.exec(val); if (m) c.ev.push({ v:m.length === 4 ? m[1] + '-' + m[2] + '-' + m[3] : '--' + m[1] + '-' + m[2], t:3 }); break; }
      case 'PHOTO': {
        if (/ENCODING=B|ENCODING=BASE64|^DATA:/i.test(params + val)) {
          var b = val.replace(/^data:[^,]*,/i, '').replace(/\s+/g, '');
          if (b.length > 100 && b.length < 2000000) c.photo = 'data:image/jpeg;base64,' + b;
        }
        break;
      }
      case 'X-ANDROID-CUSTOM': case 'CATEGORIES': break;
    }
  });
  out.forEach(function(c){
    if (!c.g && !c.f && c.fn) { var p = c.fn.trim().split(/\s+/); if (p.length > 1) { c.g = p.slice(0, -1).join(' '); c.f = p[p.length - 1]; } else c.g = c.fn; }
    delete c.fn;
  });
  return out.filter(function(c){ return c.g || c.f || c.co || c.tel.length || c.mail.length; });
}
function importVcf(txt){
  var list = parseVcf(txt);
  if (!list.length) { toast('Aucun contact trouvé dans ce fichier', true); return; }
  loadAccounts();
  // Contacts dont un numéro existe déjà : proposés mais décochés
  var known = {}; all.forEach(function(c){ c.tel.forEach(function(t){ known[normTel(t)] = c.n; }); });
  list.forEach(function(c){ c._dup = c.tel.map(function(t){ return known[normTel(t.v)]; }).filter(Boolean)[0] || ''; c._on = !c._dup; });
  if (list.length === 1 && !list[0]._dup) { openEditor(list[0], { noFocus:true }); return; }
  var acc = defaultAccount();
  var h = '<div class="bar2"><button class="hb" data-a="close">' + ic('x') + '</button><h2>Importer</h2><button class="btn main sm" data-a="go">Importer</button></div><div class="scroll">' +
    '<div class="card"><button class="acc" data-a="acc">' + ic('cloud') + '<div class="t"><div>Enregistrer dans</div><div id="iAcc"></div></div>' + ic('go') + '</button></div><div id="iL"></div></div>';
  var L = layer('full', h), q = function(s){ return L.el.querySelector(s); };
  function draw(){
    q('#iAcc').textContent = acc.type ? accLabel(acc.name, acc.type) : 'Cet ordinateur (pas de synchronisation)';
    var n = list.filter(function(c){ return c._on; }).length;
    q('[data-a=go]').textContent = 'Importer (' + n + ')';
    q('#iL').innerHTML = '<div class="ch3">' + list.length + ' contact' + (list.length > 1 ? 's' : '') + ' dans le fichier</div><div class="card">' + list.map(function(c, i){
      var nm = [c.g, c.f].filter(Boolean).join(' ') || c.co || (c.tel[0] && c.tel[0].v) || '';
      return '<div class="set"><div class="t"><div>' + esc(nm) + '</div><div>' + esc(c._dup ? 'Déjà dans tes contacts : ' + c._dup : (c.tel[0] ? fmtTel(c.tel[0].v) : c.mail[0] ? c.mail[0].v : '')) + '</div></div><label class="sw"><input type="checkbox" data-i="' + i + '"' + (c._on ? ' checked' : '') + '><span></span></label></div>';
    }).join('') + '</div>';
  }
  draw();
  L.el.addEventListener('change', function(e){ var t = e.target; if (t.dataset.i != null) { list[+t.dataset.i]._on = t.checked; q('[data-a=go]').textContent = 'Importer (' + list.filter(function(c){ return c._on; }).length + ')'; } });
  L.el.addEventListener('click', function(e){
    var t = e.target.closest('[data-a]'); if (!t) return;
    if (t.dataset.a === 'close') closeLayer(L);
    else if (t.dataset.a === 'acc') ask('Enregistrer dans', '', accounts.map(function(x){ return { v:x, label:x.type ? x.label : 'Cet ordinateur', sub:x.type ? x.name : 'Pas de synchronisation', icon:x.type ? 'cloud' : 'device' }; })).then(function(v){ if (v) { acc = v; draw(); } });
    else if (t.dataset.a === 'go') {
      var sel = list.filter(function(c){ return c._on; }).map(function(c){ var o = JSON.parse(JSON.stringify(c)); delete o._on; delete o._dup; return o; });
      if (!sel.length) { toast('Aucun contact sélectionné', true); return; }
      var r; try { r = JSON.parse(A.saveMany(JSON.stringify(sel), acc.name, acc.type)); } catch(x){ r = { ok:0, ko:sel.length }; }
      closeLayer(L);
      toast(r.ok + ' contact' + (r.ok > 1 ? 's' : '') + ' importé' + (r.ok > 1 ? 's' : '') + (r.ko ? ', ' + r.ko + ' en échec' : ''), !!r.ko);
      load(); renderList();
    }
  });
}

/* ---------- Menu ---------- */
$('bMenu').onclick = function(){
  ask('Contacts', '', [
    { v:'exp', label:'Exporter tous les contacts (.vcf)', sub:'Sauvegarde, envoi vers le téléphone ou un autre carnet', icon:'down' },
    { v:'imp', label:'Importer un fichier .vcf', icon:'up' },
    { v:'dup', label:'Doublons' + (dups.length ? ' (' + dups.length + ')' : ''), sub:'Fiches qui partagent un même numéro', icon:'merge' },
    { v:'sort', label:S.sortFamily ? 'Trier par prénom' : 'Trier par nom de famille', icon:'user' }
  ]).then(function(v){
    if (v === 'exp') { if (!A) return; if (!all.length) { toast('Aucun contact à exporter', true); return; } var t = A.vcard(''); if (t) saveFile(t, 'contacts-' + new Date().toISOString().slice(0, 10) + '.vcf', 'Mes contacts'); else toast('Export impossible', true); }
    else if (v === 'imp') { if (A) A.pickFile(); }
    else if (v === 'dup') openDups();
    else if (v === 'sort') { S.sortFamily = !S.sortFamily; saveS(); load(); renderList(); }
  });
};

/* ---------- Événements de la liste ---------- */
$('list').addEventListener('click', function(e){
  var t = e.target.closest('[data-call],[data-id],[data-newtel]'); if (!t) return;
  if (t.dataset.call) { e.stopPropagation(); if (A) A.open('tel', t.dataset.call); return; }
  if (t.dataset.newtel) { var b = blank(); b.tel = [{ v:t.dataset.newtel, t:2 }]; openEditor(b); return; }
  openCard(+t.dataset.id);
});
var qT;
$('q').addEventListener('input', function(){ $('qx').hidden = !this.value; clearTimeout(qT); var v = this.value; qT = setTimeout(function(){ query = v; renderList(); }, 90); });
$('qx').onclick = function(e){ e.preventDefault(); $('q').value = ''; query = ''; this.hidden = true; renderList(); $('q').focus(); };
$('fab').onclick = function(){ if (A && hasPerm || !A) openEditor(null); };

/* ---------- Intents ---------- */
var fromIntent = null;
function handleIntent(j){
  var o; try { o = typeof j === 'string' ? JSON.parse(j) : j; } catch(e){ return; }
  if (!o || !o.k) return;
  while (layers.length) removeLayer(layers[layers.length - 1]);
  if (o.k === 'vcf') { importVcf(o.text); return; }
  if (o.k === 'view') { openCard(o.id); return; }
  var x = o.extra || {};
  function fill(E){
    if (x.name) { var p = x.name.trim().split(/\s+/); if (!E.g && !E.f) { if (p.length > 1) { E.g = p.slice(0, -1).join(' '); E.f = p[p.length - 1]; } else E.g = x.name.trim(); } }
    var have = E.tel.map(function(t){ return normTel(t.v); });
    E.tel = E.tel.filter(function(t){ return t.v; });
    (x.tel || []).forEach(function(t){ if (have.indexOf(normTel(t)) < 0) E.tel.push({ v:t, t:2 }); });
    if (!E.tel.length) E.tel.push({ v:'', t:2 });
    (x.mail || []).forEach(function(m){ if (!E.mail.some(function(y){ return y.v.toLowerCase() === m.toLowerCase(); })) E.mail.push({ v:m, t:1 }); });
    if (x.co && !E.co) E.co = x.co; if (x.job && !E.job) E.job = x.job;
    if (x.note) E.note = (E.note ? E.note + '\n' : '') + x.note;
    if (x.adr) E.adr.push({ street:x.adr, zip:'', city:'', country:'', t:1 });
    if (x.web) E.web.push(x.web);
    return E;
  }
  var done = function(saved, id){ if (A.done) A.done(saved, id || 0); };
  if (o.k === 'edit' && o.id) {
    var c = null; try { c = JSON.parse(A.contact(o.id)); } catch(e){}
    if (c) { var E = fill(fromCard(c)); E.id = c.id; openEditor(E, { done:done }); return; }
  }
  if (o.k === 'insertOrEdit') {
    // « Ajouter à un contact existant » ou « Créer un contact »
    ask('Ajouter ' + (x.tel && x.tel[0] ? fmtTel(x.tel[0]) : x.mail && x.mail[0] ? x.mail[0] : 'ces informations'), '', [
      { v:'new', label:'Créer un contact', icon:'plus' }, { v:'old', label:'Ajouter à un contact existant', icon:'user' }
    ]).then(function(v){
      if (v === 'new') openEditor(fill(blank()), { done:done, noFocus:true });
      else if (v === 'old') pickExisting(function(id){
        var c2 = null; try { c2 = JSON.parse(A.contact(id)); } catch(e){}
        if (c2) { var E2 = fill(fromCard(c2)); E2.id = c2.id; openEditor(E2, { done:done }); }
      });
      else done(false, 0);
    });
    return;
  }
  openEditor(fill(blank()), { done:done, noFocus:true });
}
function pickExisting(cb){
  var L = layer('full', '<div class="bar2"><button class="hb" data-a="close">' + ic('back') + '</button><label class="search" style="flex:1;margin:0">' + ic('user') + '<input id="pq" type="search" placeholder="Choisir un contact" autocomplete="off"></label></div><div class="scroll" id="pl"></div>');
  var inp = L.el.querySelector('#pq'), out = L.el.querySelector('#pl');
  function draw(){
    var q = fold(inp.value.trim());
    out.innerHTML = all.filter(function(c){ return !q || c.idx.indexOf(q) >= 0 || c.tidx.indexOf(q) >= 0; }).slice(0, 200).map(function(c){ return '<div class="it" data-id="' + c.id + '" role="button">' + avatar(c) + '<div class="t"><div>' + esc(c.n) + '</div><div>' + esc(c.org || (c.tel[0] ? fmtTel(c.tel[0]) : '')) + '</div></div></div>'; }).join('');
    wantPhotos();
  }
  draw(); inp.oninput = draw;
  setTimeout(function(){ inp.focus(); }, 280);
  L.el.addEventListener('click', function(e){
    var t = e.target.closest('[data-a],[data-id]'); if (!t) return;
    if (t.dataset.a === 'close') return closeLayer(L);
    closeLayer(L); setTimeout(function(){ cb(+t.dataset.id); }, 60);
  });
}

/* ---------- Actualiser : relit le carnet d'adresses du téléphone (synchronisations, autres applis) en gardant la position
   (bouton ⟳ ou glisser vers le bas en haut de la liste) ---------- */
var refreshing = false;
function doRefresh(){
  if (refreshing) return; refreshing = true;
  var b = $('bRef'), t0 = Date.now(), l = $('list'), st = l.scrollTop;
  b.classList.add('spinning');
  setTimeout(function(){
    try {
      if (A) { hasPerm = A.perm(); accounts = []; loadAccounts(); }
      load(); renderList(); l.scrollTop = st;
      toast(A && !hasPerm ? 'Actualisé · autorisation non accordée' : 'Actualisé · ' + all.length + ' contact' + (all.length > 1 ? 's' : ''));
    } finally {
      setTimeout(function(){ b.classList.remove('spinning'); }, Math.max(0, 700 - (Date.now() - t0)));
      refreshing = false;
    }
  }, 30);
}
$('bRef').onclick = doRefresh;
(function(){
  var l = $('list'), y0 = null, pulled = 0;
  var ind = document.createElement('div'); ind.id = 'ptr'; ind.innerHTML = '<svg class="ic" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>'; document.body.appendChild(ind);
  function reset(){ y0 = null; pulled = 0; ind.classList.remove('on', 'ready'); ind.style.transform = ''; }
  l.addEventListener('touchstart', function(e){ y0 = (l.scrollTop <= 0 && e.touches.length === 1 && !layers.length) ? e.touches[0].clientY : null; pulled = 0; }, { passive:true });
  l.addEventListener('touchmove', function(e){ if (y0 == null) return; if (l.scrollTop > 0) { reset(); return; } pulled = Math.max(0, e.touches[0].clientY - y0); ind.style.transform = 'translate(-50%,' + Math.min(70, pulled / 2) + 'px) rotate(' + (pulled * 2) + 'deg)'; ind.classList.toggle('on', pulled > 12); ind.classList.toggle('ready', pulled > 110); }, { passive:true });
  l.addEventListener('touchend', function(){ if (y0 != null && pulled > 110 && !layers.length) doRefresh(); reset(); }, { passive:true });
  l.addEventListener('touchcancel', reset, { passive:true });
})();

/* ---------- Événements venant d'Android ---------- */
var rT;
window.contactsEvent = function(kind, data){
  if (kind === 'pcphotos') { photos = {}; if (!layers.length) { load(); renderList(); } return; }
  if (kind === 'perm') { hasPerm = data === '1'; load(); renderList(); if (!hasPerm) toast('Sans cette autorisation, la liste reste vide', true); }
  else if (kind === 'resume') { clearTimeout(rT); rT = setTimeout(function(){ var was = hasPerm; hasPerm = A.perm(); if (was !== hasPerm || !layers.length) { var st = $('list').scrollTop; load(); renderList(); if (!query) $('list').scrollTop = st; } }, 250); }
  else if (kind === 'photo') { if (window.__photoTarget) window.__photoTarget(data); }
  else if (kind === 'file') importVcf(data);
  else if (kind === 'intent') handleIntent(data);
};
window.contactsBack = function(){ if (layers.length) { closeTop(); return true; } return false; };

/* ---------- Démarrage ---------- */
if (!A) $('noBridge').hidden = false;
else hasPerm = A.perm();
load(); renderList();
if (A) { var pend = A.pending && A.pending(); if (pend) setTimeout(function(){ handleIntent(pend); }, 50); }
window.__contacts = { parseVcf:parseVcf, normTel:normTel, findDups:function(){ return dups; } };
})();
