<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Caméras — mosaïque</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Suite MAG.exe : mosaïque des caméras (flux RTSP convertis en MJPEG par le programme, adresses 127.0.0.1) -->
<style>
:root{color-scheme:dark;--bg:#07090d;--tx:#eef1f7;--tx3:#8a91a3;--acc:#7fb2ff;--line:#ffffff1c}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,"Segoe UI",sans-serif;overflow:hidden;user-select:none}
header{position:fixed;inset:0 0 auto 0;height:46px;display:flex;align-items:center;gap:12px;padding:0 14px;background:linear-gradient(#000c,#0000);z-index:5;transition:opacity .4s}
header h1{margin:0;font-size:17px;font-weight:700;flex:1;letter-spacing:.3px}
header .clk{font-variant-numeric:tabular-nums;color:var(--tx3)}
.b{height:34px;min-width:34px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:#ffffff12;color:var(--tx);font:inherit;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.b:hover{background:#ffffff22}
body.idle header,body.idle .ptz,body.idle .back{opacity:0}body.idle{cursor:none}
#grid{position:absolute;inset:0;display:grid;gap:4px;padding:4px}
.t{position:relative;background:#000;border-radius:8px;overflow:hidden;cursor:zoom-in;min-width:0;min-height:0}
.t img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.t .n{position:absolute;left:10px;bottom:8px;padding:3px 10px;border-radius:8px;background:#000a;font-size:13.5px;font-weight:650;display:flex;align-items:center;gap:7px}
.t .n i{width:8px;height:8px;border-radius:50%;background:#ff5468;box-shadow:0 0 8px #ff5468;animation:rec 1.6s infinite}
.t.wait .n i{background:#ffb85c;box-shadow:none;animation:none}
@keyframes rec{50%{opacity:.35}}
.t .msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:6px;color:var(--tx3);font-size:14px;text-align:center;padding:10px}
.t.wait .msg{display:flex}.t.wait img{visibility:hidden}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid #ffffff22;border-top-color:var(--acc);animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
#one{position:absolute;inset:0;background:#000;display:none}#one.on{display:block}
#one .t{position:absolute;inset:0;border-radius:0;cursor:zoom-out}
.back{position:absolute;left:14px;top:56px;z-index:6;transition:opacity .4s}
.ptz{position:absolute;right:22px;bottom:22px;z-index:6;display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px);gap:6px;transition:opacity .4s}
.ptz button{border-radius:50%;border:1px solid var(--line);background:#000a;color:#fff;font-size:20px;cursor:pointer}
.ptz button:hover{background:var(--acc);color:#071226}
.ptz .z{border-radius:12px;font-size:16px}
#empty{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--tx3);text-align:center;padding:20px}
</style>
</head>
<body>
<header><h1>Caméras</h1><span class="clk" id="clk"></span>
<button class="b" id="bFs" title="Plein écran (F11)">⛶ Plein écran</button><button class="b" id="bX" title="Fermer (Échap)">✕</button></header>
<div id="grid"></div>
<div id="one"><button class="b back" id="bBack">‹ Toutes les caméras</button><div class="ptz" id="ptz" hidden>
<span></span><button data-d="up" aria-label="Haut">▲</button><span></span>
<button data-d="left" aria-label="Gauche">◀</button><button class="z" data-d="in" aria-label="Zoom avant">＋</button><button data-d="right" aria-label="Droite">▶</button>
<span></span><button data-d="down" aria-label="Bas">▼</button><button class="z" data-d="out" aria-label="Zoom arrière">－</button></div></div>
<div id="empty">Aucune caméra prête : testez d'abord vos caméras dans l'appli Caméras.</div>
<script>
(function () {
  'use strict';
  var V = window.MAGCamViewer, $ = function (id) { return document.getElementById(id); }, cams = [], cur = -1;
  function esc(s) { return String(s || '').replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function tile(c, url) {
    var d = document.createElement('div'); d.className = 't wait';
    d.innerHTML = '<img alt=""><div class="msg"><div class="spin"></div><span>Connexion à « ' + esc(c.name) + ' »…</span></div><div class="n"><i></i>' + esc(c.name) + '</div>';
    var img = d.querySelector('img'), tries = 0, tm = 0;
    function go() { clearTimeout(tm); d.classList.add('wait'); img.src = url + (url.indexOf('?') < 0 ? '?' : '&') + 'r=' + Date.now(); tm = setTimeout(function () { if (d.classList.contains('wait')) retry(); }, 15000); }
    function retry() { tries++; d.querySelector('.msg span').textContent = 'Caméra injoignable, nouvel essai…'; setTimeout(go, Math.min(10000, 2000 * tries)); }
    img.onload = function () { d.classList.remove('wait'); tries = 0; };
    img.onerror = retry;
    d.stop = function () { clearTimeout(tm); img.onerror = null; img.removeAttribute('src'); };
    go();
    return d;
  }
  function layout(n) { var c = n <= 1 ? 1 : n <= 4 ? 2 : n <= 9 ? 3 : 4; $('grid').style.gridTemplateColumns = 'repeat(' + c + ',minmax(0,1fr))'; $('grid').style.gridTemplateRows = 'repeat(' + Math.ceil(n / c) + ',minmax(0,1fr))'; }
  function grid() {
    $('grid').querySelectorAll('.t').forEach(function (t) { t.stop(); }); $('grid').innerHTML = '';
    cams.forEach(function (c, i) { var t = tile(c, c.sub); t.onclick = function () { one(i); }; $('grid').appendChild(t); });
    layout(cams.length); $('empty').style.display = cams.length ? 'none' : 'flex';
  }
  function one(i) {
    cur = i; $('grid').querySelectorAll('.t').forEach(function (t) { t.stop(); }); $('grid').innerHTML = '';
    var o = $('one'); var old = o.querySelector('.t'); if (old) { old.stop(); old.remove(); }
    var t = tile(cams[i], cams[i].main); t.onclick = back; o.insertBefore(t, o.firstChild); o.classList.add('on');
    $('ptz').hidden = !cams[i].ptz; document.title = cams[i].name + ' — Caméras';
  }
  function back() { var o = $('one'), t = o.querySelector('.t'); if (t) { t.stop(); t.remove(); } o.classList.remove('on'); cur = -1; document.title = 'Caméras — mosaïque'; grid(); }
  $('bBack').onclick = back;
  $('ptz').onclick = function (e) { var b = e.target.closest('[data-d]'); if (b && cur >= 0 && V) V.ptz(cur, b.dataset.d); };
  $('bX').onclick = function () { window.close(); };
  $('bFs').onclick = function () { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(function () { }); };
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { if (cur >= 0) back(); else if (!document.fullscreenElement) window.close(); }
    var k = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down', '+': 'in', '-': 'out' }[e.key];
    if (k && cur >= 0 && cams[cur].ptz && V) { e.preventDefault(); V.ptz(cur, k); }
    if (/^[1-9]$/.test(e.key) && cams[+e.key - 1]) one(+e.key - 1);
  });
  var idleT = 0; function wake() { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(function () { document.body.classList.add('idle'); }, 3500); }
  document.addEventListener('mousemove', wake); wake();
  function clk() { var d = new Date(); $('clk').textContent = d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }) + ' · ' + d.toLocaleTimeString('fr-FR'); }
  setInterval(clk, 1000); clk();
  if (!V) { $('empty').textContent = 'La mosaïque fonctionne dans le programme Suite MAG.exe.'; $('empty').style.display = 'flex'; return; }
  V.data().then(function (d) { cams = d.cams || []; if (d.start >= 0 && cams[d.start]) one(d.start); else grid(); if (!d.ffmpeg) { $('empty').textContent = 'Lecteur vidéo absent du programme : réinstallez Suite MAG.'; $('empty').style.display = 'flex'; } });
})();
</script>
</body>
</html>
