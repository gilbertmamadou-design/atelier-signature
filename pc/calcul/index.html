<style>

<script>
(function(){
'use strict';
var A = window.MAGPrint, $ = function(i){ return document.getElementById(i); };
var LS = {
  get: function(k, d){ try{ var v = localStorage.getItem('calc.'+k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set: function(k, v){ try{ localStorage.setItem('calc.'+k, JSON.stringify(v)); }catch(e){} }
};
function toast(t){ var e=$('toast'); e.textContent=t; e.className='on'; clearTimeout(toast.t); toast.t=setTimeout(function(){ e.className=''; }, 2600); }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

/* ---------- Format français ---------- */
var NF = (function(){ try{ return new Intl.NumberFormat('fr-FR', {maximumSignificantDigits:12}); }catch(e){ return null; } })();
function group(intStr){ return intStr.replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
function fmt(x, dec){
  if(typeof x !== 'number' || !isFinite(x)) return 'Erreur';
  if(dec != null){
    var p = Math.pow(10, dec); x = Math.round(x*p)/p;
    var s = Math.abs(x).toFixed(dec); if(s.indexOf('.') >= 0) s = s.replace(/\.?0+$/, '');
    var parts = s.split('.');
    return (x < 0 && +s !== 0 ? '−' : '') + group(parts[0]) + (parts[1] ? ','+parts[1] : '');
  }
  if(x === 0) return '0';
  var a = Math.abs(x);
  if(a >= 1e15 || a < 1e-7){
    var ex = x.toExponential(9).split('e');
    var m = ex[0].replace(/\.?0+$/, '').replace('.', ',').replace('-', '−');
    return m + 'E' + ex[1].replace('+','');
  }
  x = parseFloat(x.toPrecision(12));
  if(NF) return NF.format(x).replace(/[  ]/g, ' ').replace('-', '−');
  return String(x).replace('.', ',');
}
function plain(x){ return fmt(x).replace(/ /g, ''); } // sans espaces, pour copier ou réutiliser

/* ---------- Analyseur d'expressions (sans eval) ---------- */
var FUNCS = {
  sin:1, cos:1, tan:1, asin:1, acos:1, atan:1, ln:1, log:1, sqrt:1, cbrt:1
};
function tokenize(s){
  var t = [], i = 0, m;
  s = s.replace(/sin⁻¹/g,'asin').replace(/cos⁻¹/g,'acos').replace(/tan⁻¹/g,'atan');
  while(i < s.length){
    var c = s[i], rest = s.slice(i);
    if(/\s| | /.test(c)){ i++; continue; }
    if((m = /^(\d+(?:[.,]\d*)?|[.,]\d+)(?:E[+\-−]?\d+)?/.exec(rest))){
      t.push({t:'n', v:parseFloat(m[0].replace(',', '.').replace('−','-'))}); i += m[0].length; continue;
    }
    if((m = /^(asin|acos|atan|sin|cos|tan|ln|log|sqrt|cbrt|pi)/i.exec(rest))){
      var w = m[1].toLowerCase();
      if(w === 'pi') t.push({t:'n', v:Math.PI}); else t.push({t:'f', v:w});
      i += m[0].length; continue;
    }
    if(c === '√'){ t.push({t:'f', v:'sqrt'}); i++; continue; }
    if(c === '∛'){ t.push({t:'f', v:'cbrt'}); i++; continue; }
    if(c === 'π'){ t.push({t:'n', v:Math.PI}); i++; continue; }
    if(c === 'e'){ t.push({t:'n', v:Math.E}); i++; continue; }
    var map = {'+':'+','-':'−','−':'−','–':'−','*':'×','×':'×','x':'×','X':'×','·':'×','/':'÷','÷':'÷',':':'÷','^':'^','(':'(',')':')','%':'%','!':'!','²':'²','³':'³'};
    if(map[c]){ t.push({t:'o', v:map[c]}); i++; continue; }
    throw new Error('Caractère inconnu : '+c);
  }
  return t;
}
function fact(n){
  if(n < 0 || Math.floor(n) !== n) throw new Error('Factorielle : entier positif seulement');
  if(n > 170) return Infinity;
  var r = 1; for(var i = 2; i <= n; i++) r *= i; return r;
}
function evaluate(src, deg){
  var tk = tokenize(src), p = 0;
  if(!tk.length) throw new Error('vide');
  function peek(){ return tk[p]; }
  function isOp(v){ var x = tk[p]; return x && x.t === 'o' && x.v === v; }
  function startsOperand(){ var x = tk[p]; return x && (x.t === 'n' || x.t === 'f' || (x.t === 'o' && x.v === '(')); }
  function add(){
    var l = mul().v;
    while(isOp('+') || isOp('−')){
      var o = tk[p++].v, r = mul();
      if(r.pct) r.v = l * r.v;            // 100 + 20 % = 120
      l = o === '+' ? l + r.v : l - r.v;
    }
    return l;
  }
  function mul(){
    var first = unary(), l = first.v, n = 1;
    for(;;){
      if(isOp('×') || isOp('÷')){
        var o = tk[p++].v, r = unary().v; n++;
        if(o === '×') l *= r; else { if(r === 0) throw new Error('Division par zéro'); l /= r; }
      } else if(startsOperand()){ l *= unary().v; n++; }   // multiplication implicite : 2π, 3(4+1)
      else break;
    }
    return {v:l, pct: n === 1 && first.pct};
  }
  function unary(){
    if(isOp('−')){ p++; var r = unary(); return {v:-r.v, pct:r.pct}; }
    if(isOp('+')){ p++; return unary(); }
    return power();
  }
  function power(){
    var b = postfix();
    if(isOp('^')){ p++; var e = unary().v; var v = Math.pow(b.v, e); if(isNaN(v)) throw new Error('Puissance impossible'); return {v:v, pct:false}; }
    return b;
  }
  function postfix(){
    var v = primary(), pct = false;
    for(;;){
      if(isOp('!')){ p++; v = fact(v); pct = false; }
      else if(isOp('%')){ p++; v = v / 100; pct = true; }
      else if(isOp('²')){ p++; v = v*v; pct = false; }
      else if(isOp('³')){ p++; v = v*v*v; pct = false; }
      else break;
    }
    return {v:v, pct:pct};
  }
  function trig(f, x){
    var r;
    if(f === 'sin' || f === 'cos' || f === 'tan'){
      if(deg){
        var m = ((x % 360) + 360) % 360;
        if(f === 'sin' && (m === 0 || m === 180)) return 0;
        if(f === 'cos' && (m === 90 || m === 270)) return 0;
        if(f === 'tan' && (m === 0 || m === 180)) return 0;
        if(f === 'tan' && (m === 90 || m === 270)) throw new Error('tan non définie');
        x = x * Math.PI / 180;
      }
      r = Math[f](x);
      return Math.abs(r) < 1e-15 ? 0 : r;
    }
    if(x < -1 - 1e-12 || x > 1 + 1e-12) if(f !== 'atan') throw new Error('Hors domaine');
    r = Math[f](Math.max(-1, Math.min(1, x)));
    if(f === 'atan') r = Math.atan(x);
    return deg ? r * 180 / Math.PI : r;
  }
  function primary(){
    var x = peek();
    if(!x) throw new Error('Expression incomplète');
    if(x.t === 'n'){ p++; return x.v; }
    if(x.t === 'o' && x.v === '('){
      p++; var v = add();
      if(isOp(')')) p++; else if(p < tk.length) throw new Error('Parenthèse attendue');
      return v;
    }
    if(x.t === 'f'){
      p++;
      var a = isOp('(') ? primary() : unary().v, f = x.v;
      if(f === 'ln' || f === 'log'){ if(a <= 0) throw new Error('Logarithme d\'un nombre ≤ 0'); return f === 'ln' ? Math.log(a) : Math.log10(a); }
      if(f === 'sqrt'){ if(a < 0) throw new Error('Racine d\'un nombre négatif'); return Math.sqrt(a); }
      if(f === 'cbrt') return Math.cbrt(a);
      return trig(f, a);
    }
    throw new Error('Expression incomplète');
  }
  var r = add();
  if(p < tk.length) throw new Error('Expression mal formée');
  if(!isFinite(r)) throw new Error('Résultat trop grand');
  return r;
}
window.calcEval = function(s, deg){ return evaluate(s, deg == null ? true : deg); };

function num(s){
  s = String(s == null ? '' : s).trim();
  if(!s) return NaN;
  try{ return evaluate(s, true); }catch(e){ return NaN; }
}

var HIST = LS.get('hist', []);

function display(){
  var s = exprStr();
  var shown = s.replace(/(\d+)((?:,\d*)?)/g, function(_, a, b){ return group(a) + b; });
  $('expr').innerHTML = esc(shown) + '<span class="cur"></span>';
  $('expr').classList.toggle('small', shown.length > 14);
  var r = $('res'); r.classList.remove('err');
  if(lastErr){ r.textContent = lastErr; r.classList.add('err'); }
  else if(!s){ r.textContent = ''; }
  else {
    try{
      var v = evaluate(s, S.deg);
      r.textContent = /^[\d,]+$/.test(s) ? '' : '= ' + fmt(v);
    }catch(e){ r.textContent = ''; }
  }
  $('expr').scrollTop = 1e6;
  $('fAng').textContent = S.deg ? 'DEG' : 'RAD';
  document.querySelector('[data-k=ang]').textContent = S.deg ? 'DEG' : 'RAD';
  document.querySelector('[data-k=inv]').classList.toggle('on', inv);
  ['sin','cos','tan'].forEach(function(f){ var b = document.querySelector('[data-k='+f+']'); b.innerHTML = inv ? f+'<sup>−1</sup>' : f; });
  $('fMem').hidden = !mem;
  LS.set('expr', pieces);
}
function last(){ return pieces[pieces.length-1] || ''; }
function lastIsValue(){ var l = last(); return /[\d)πe%!²]$/.test(l) && !/[a-z√∛]\($/.test(l); }
function curNumber(){ // chiffres en fin d'expression
  var s = ''; for(var i = pieces.length-1; i >= 0 && /^[\d,]$/.test(pieces[i]); i--) s = pieces[i] + s; return s;
}
function result(){ try{ return evaluate(exprStr(), S.deg); }catch(e){ return NaN; } }
function press(k){
  lastErr = '';
  var isDigit = /^\d$/.test(k);
  if(done && (isDigit || k === ',' || k === 'pi' || k === 'e' || /^(sin|cos|tan|ln|log|sqrt|cbrt|\()$/.test(k))) pieces = [];
  done = false;
  if(isDigit){ pieces.push(k); }
  else if(k === ','){
    var n = curNumber();
    if(n.indexOf(',') < 0){ if(!n){ if(lastIsValue()) pieces.push('×'); pieces.push('0'); } pieces.push(','); }
  }
  else if(k === '+' || k === '−' || k === '×' || k === '÷'){
    var l = last();
    if(/^[+−×÷]$/.test(l)){ if(!(k === '−' && (l === '×' || l === '÷'))) pieces.pop(); }
    if(!pieces.length && k !== '−'){ if(HIST.length) pieces.push(plain(HIST[0].v)); else return; }
    if(last() === '(' && k !== '−') return;
    pieces.push(k);
  }
  else if(k === '%'){ if(lastIsValue()) pieces.push('%'); }
  else if(k === '('){ pieces.push('('); }
  else if(k === ')'){
    var open = 0; pieces.forEach(function(p){ open += (p.match(/\(/g)||[]).length - (p.match(/\)/g)||[]).length; });
    if(open > 0 && lastIsValue()) pieces.push(')');
  }
  else if(k === 'C'){ pieces = []; }
  else if(k === 'back'){ pieces.pop(); }
  else if(k === '='){
    var s = exprStr(); if(!s) return;
    try{
      var v = evaluate(s, S.deg);
      HIST.unshift({e:s, v:v, t:Date.now()}); if(HIST.length > 200) HIST.length = 200; LS.set('hist', HIST);
      pieces = [plain(v)]; done = true;
    }catch(e){ lastErr = e.message === 'vide' ? '' : e.message; }
  }
  else if(k === 'inv'){ inv = !inv; }
  else if(k === 'ang'){ S.deg = !S.deg; LS.set('set', S); }
  else if(/^(sin|cos|tan)$/.test(k)){ if(lastIsValue()) pieces.push('×'); pieces.push((inv ? k+'⁻¹' : k) + '('); inv = false; }
  else if(k === 'ln' || k === 'log'){ if(lastIsValue()) pieces.push('×'); pieces.push(k + '('); }
  else if(k === 'sqrt'){ if(lastIsValue()) pieces.push('×'); pieces.push('√('); }
  else if(k === 'cbrt'){ if(lastIsValue()) pieces.push('×'); pieces.push('∛('); }
  else if(k === 'sq'){ if(lastIsValue()) pieces.push('^', '2'); }
  else if(k === 'pow'){ if(lastIsValue()) pieces.push('^'); }
  else if(k === 'recip'){ if(lastIsValue()) pieces.push('^', '(', '−', '1', ')'); else if(!pieces.length){ pieces.push('1','÷'); } }
  else if(k === 'fact'){ if(lastIsValue()) pieces.push('!'); }
  else if(k === 'pi' || k === 'e'){ if(lastIsValue()) pieces.push('×'); pieces.push(k === 'pi' ? 'π' : 'e'); }
  else if(k === 'exp'){ if(/\d$/.test(last())) pieces.push('E'); }
  else if(k === 'mc'){ mem = 0; LS.set('mem', mem); toast('Mémoire effacée'); }
  else if(k === 'mr'){ if(lastIsValue()) pieces.push('×'); String(plain(mem)).replace('−','-').split('').forEach(function(c){ pieces.push(c === '-' ? '−' : c); }); }
  else if(k === 'mp' || k === 'mm'){
    var r = result(); if(isNaN(r)){ toast('Rien à mémoriser'); return; }
    mem += k === 'mp' ? r : -r; LS.set('mem', mem); toast('Mémoire : ' + fmt(mem));
  }
  display();
}

/* Copier */
function copyText(t, msg){
  function fb(){
    var ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); }catch(e){} ta.remove();
  }
  try{ if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).catch(fb); else fb(); }catch(e){ fb(); }
  toast(msg || 'Copié : ' + t);
}
function shareText(title, t){
  if(A && A.fileMenu){
    var b64 = btoa(unescape(encodeURIComponent(t)));
    A.fileMenu(b64, title.replace(/[^\wÀ-ÿ -]/g,'').trim().replace(/\s+/g,'-') + '.txt', 'text/plain', '', title, t);
  } else if(navigator.share){ navigator.share({title:title, text:t}).catch(function(){}); }
  else copyText(t, 'Texte copié, colle-le où tu veux');
}

  var k = e.key, m = {'*':'×','x':'×','/':'÷','-':'−','.':',',',':',','Enter':'=','=':'=','Backspace':'back','Escape':'C','Delete':'C','^':'pow','!':'fact','p':'pi','s':'sin','c':'cos','t':'tan','l':'ln','r':'sqrt'};
  var key = /^[0-9]$/.test(k) || k === '+' || k === '(' || k === ')' || k === '%' ? k : m[k];

  var b = e.target.closest('.hi'); if(!b) return;
  var h = HIST[+b.dataset.i];
  if(e.target.closest('.v')){ // réutiliser le résultat
    if(done || !pieces.length) pieces = [];
    else if(lastIsValue()) pieces.push('×');
    pieces.push(plain(h.v).replace('-','−'));
  } else { pieces = tokenPieces(h.e); }
  done = false; lastErr = ''; display(); popLayer();
  if(mode === 'ch') setMode('std');
});
function tokenPieces(s){
  var out = [], re = /(sin⁻¹\(|cos⁻¹\(|tan⁻¹\(|sin\(|cos\(|tan\(|ln\(|log\(|√\(|∛\(|.)/g, m;
  while((m = re.exec(s))) out.push(m[1]);
  return out;
}

var SHAPES = {rect:['Rectangle', [['a','Longueur','m'],['b','Largeur','m']]], tri:['Triangle', [['a','Base','m'],['b','Hauteur','m']]], cerc:['Cercle', [['a','Diamètre','m']]], trap:['Trapèze', [['a','Grande base','m'],['b','Petite base','m'],['c','Hauteur','m']]]};
function shapeArea(it){
  var a = num(it.a), b = num(it.b), c = num(it.c);
  if(it.f === 'rect') return [a*b, fmt(a,3)+' × '+fmt(b,3)];
  if(it.f === 'tri') return [a*b/2, fmt(a,3)+' × '+fmt(b,3)+' ÷ 2'];
  if(it.f === 'cerc') return [Math.PI*a*a/4, 'π × '+fmt(a,3)+'² ÷ 4'];
  return [(a+b)/2*c, '('+fmt(a,3)+' + '+fmt(b,3)+') ÷ 2 × '+fmt(c,3)];
}
var P0 = [{f:'rect', a:'5', b:'4'}];
R.surf = {
  form: function(){
    var P = val('p', P0), O = val('o', []);
    var h = '<div class="card"><h3>Pièces / surfaces<span class="sp"></span></h3>';
    P.forEach(function(it, i){
      var ar = shapeArea(it);
      h += '<div class="item"><div class="ih"><select data-pi="'+i+'" data-pk="f">'+Object.keys(SHAPES).map(function(s){ return '<option value="'+s+'"'+(s===it.f?' selected':'')+'>'+SHAPES[s][0]+'</option>'; }).join('')+'</select>'+(P.length > 1 ? '<button class="del" data-del="p" data-i="'+i+'" aria-label="Supprimer">'+svg('x')+'</button>' : '')+'</div>';
      SHAPES[it.f][1].forEach(function(f){ h += '<div class="f"><label>'+f[1]+'</label><div class="in"><input inputmode="decimal" data-pi="'+i+'" data-pk="'+f[0]+'" value="'+esc(it[f[0]]||'')+'"><span class="u">'+f[2]+'</span></div></div>'; });
      h += '<div class="sub" id="ps'+i+'">'+(isFinite(ar[0]) ? m2(ar[0]) : '')+'</div></div>';
    });
    h += '<button class="btn" data-add="p">'+svg('plus')+'Ajouter une surface</button></div>';
    h += '<div class="card"><h3>Ouvertures à déduire</h3>';
    O.forEach(function(it, i){
      h += '<div class="item"><div class="ih"><b>Ouverture '+(i+1)+'</b><button class="del" data-del="o" data-i="'+i+'" aria-label="Supprimer">'+svg('x')+'</button></div>';
      [['a','Largeur','m'],['b','Hauteur','m'],['n','Nombre','']].forEach(function(f){ h += '<div class="f"><label>'+f[1]+'</label><div class="in"><input inputmode="decimal" data-oi="'+i+'" data-ok="'+f[0]+'" value="'+esc(it[f[0]]||'')+'">'+(f[2]?'<span class="u">'+f[2]+'</span>':'')+'</div></div>'; });
      h += '</div>';
    });
    h += '<button class="btn" data-add="o">'+svg('plus')+'Ajouter une porte / fenêtre</button></div>';
    return h;
  },
  calc: function(){
    var P = val('p', P0), O = val('o', []), tot = 0, f = [], ok = true, lines = [];
    P.forEach(function(it, i){ var a = shapeArea(it); if(!isFinite(a[0])) { ok = false; return; } tot += a[0]; f.push(SHAPES[it.f][0]+' '+(i+1)+' : '+a[1]+' = '+fmt(a[0],3)+' m²'); lines.push([SHAPES[it.f][0]+' '+(i+1), m2(a[0])]); });
    var ded = 0;
    O.forEach(function(it, i){ var a = num(it.a), b = num(it.b), q = it.n ? num(it.n) : 1; if(!isFinite(a*b*q)) return; ded += a*b*q; f.push('Ouverture '+(i+1)+' : '+fmt(q)+' × '+fmt(a,3)+' × '+fmt(b,3)+' = '+fmt(a*b*q,3)+' m²'); });
    if(!ok || !P.length) return {html:bad()};

    return {html:out(m2(net).replace(' m²','<small>m²</small>'), lines, f.join('\n')), main:['Surface nette', m2(net)], lines:lines, formula:f.join('\n')};
  }
};
/* Béton */
var BT = {dalle:['Dalle',[['L','Longueur','m','5'],['l','Largeur','m','4'],['e','Épaisseur','m','0,12']]], sem:['Semelle',[['L','Longueur','m','10'],['l','Largeur','m','0,5'],['e','Hauteur','m','0,35']]], pot:['Poteau',[['a','Côté a (ou Ø)','m','0,25'],['b','Côté b (0 si rond)','m','0,25'],['h','Hauteur','m','2,5']]], tr:['Tranchée',[['L','Longueur','m','10'],['l','Largeur','m','0,4'],['e','Profondeur','m','0,6']]]};
R.beton = {
  form: function(){
    var t = val('t','dalle'), h = '<div class="card"><h3>Ouvrage</h3>'+SEG('t', Object.keys(BT).map(function(k){ return [k, BT[k][0]]; }), 'dalle');

    return h;
  },
  calc: function(){
    var t = val('t','dalle'), d = function(k){ var def = BT[t][1].filter(function(f){ return f[0] === k; })[0]; return n(t+'_'+k, def ? def[3] : ''); };
    var v, fv;
    if(t === 'pot'){
      var a = d('a'), b = d('b'), hh = d('h');
      if(!b){ v = Math.PI*a*a/4*hh; fv = 'V = π × '+fmt(a,3)+'² ÷ 4 × '+fmt(hh,3); }
      else { v = a*b*hh; fv = 'V = '+fmt(a,3)+' × '+fmt(b,3)+' × '+fmt(hh,3); }
    } else { var L = d('L'), l = d('l'), e = d('e'); v = L*l*e; fv = 'V = '+fmt(L,3)+' × '+fmt(l,3)+' × '+fmt(e,3); }

      ['Ciment', fmt(cim,0)+' kg'], ['Sacs de '+fmt(sac)+' kg', String(sacs)],
      ['Sable 0/4', fmt(sable,0)+' L (≈ '+fmt(sable*1.6/1000,2)+' t)'], ['Gravier 5/15 ou 4/20', fmt(grav,0)+' L (≈ '+fmt(grav*1.5/1000,2)+' t)'],
      ['Eau', fmt(eau,0)+' L'], ['Brouettes (60 L) de mélange', fmt(Math.ceil(vc*1000/60),0)]
    ];
    var f = fv+' = '+fmt(v,3)+' m³'+(q>1?'\nTotal = '+fmt(v,3)+' × '+fmt(q)+' = '+fmt(vt,3)+' m³':'')+'\nÀ commander = '+fmt(vt,3)+' × (1 + '+fmt(per)+' %) = '+fmt(vc,3)+' m³\nCiment = '+fmt(vc,3)+' × '+dos+' kg/m³ = '+fmt(cim,0)+' kg → '+fmt(cim,0)+' ÷ '+fmt(sac)+' = '+sacs+' sacs\nPar m³ : 400 L de sable, 800 L de gravier, eau ≈ moitié du poids de ciment (E/C = 0,5)';
    return {html:out(fmt(vc,2)+'<small>m³ de béton</small><div style="font-size:18px;margin-top:6px;line-height:1.3">'+sacs+' sacs de ciment <small>'+fmt(sac)+' kg</small></div>', lines, f, '<div class="hint" style="margin:8px 0 0">Les quantités de sable, gravier et eau sont des valeurs de chantier courantes, à ajuster selon tes granulats.</div>'), main:['Béton', fmt(vc,2)+' m³ · '+sacs+' sacs'], lines:lines, formula:f};
  }
};
/* Peinture */
R.peint = {

R.carr = {

/* Pente */

/* Escalier */
R.esc = {
  form: function(){ return '<div class="card"><h3>Dimensions</h3>'+F('H','Hauteur à monter (sol fini à sol fini)','cm','270')+F('h0','Hauteur de marche visée','cm','17')+F('R','Reculement disponible (option)','cm','')+F('B','Valeur de Blondel visée','cm','63')+'<div class="hint" style="margin:4px 2px">Blondel : 2 × hauteur + giron entre 60 et 64 cm (63 idéal). Marche confortable : 16 à 18 cm de haut, giron 25 à 30 cm.</div></div>'; },
  calc: function(){
    var H = n('H','270'), h0 = n('h0','17') || 17, Rc = n('R',''), B = n('B','63') || 63;
    if(!(H > 0)) return {html:bad()};
    var N, h, g, f;
    if(Rc > 0){
      var best = null;
      for(var k = 2; k <= 80; k++){
        var hh = H/k, gg = Rc/(k-1), sc = Math.abs(2*hh+gg-B) + (hh < 15 || hh > 21 ? 5 : 0);
        if(!best || sc < best.s) best = {s:sc, n:k, h:hh, g:gg};
      }
      N = best.n; h = best.h; g = best.g;
      f = 'Nombre de marches choisi pour que 2h + g soit le plus proche de '+fmt(B)+' cm\nh = '+fmt(H,1)+' ÷ '+N+' = '+fmt(h,2)+' cm\ng = reculement ÷ (marches − 1) = '+fmt(Rc,1)+' ÷ '+(N-1)+' = '+fmt(g,2)+' cm';
    } else {
      N = Math.max(1, Math.round(H/h0)); h = H/N; g = B - 2*h;
      f = 'Marches = '+fmt(H,1)+' ÷ '+fmt(h0,1)+' ≈ '+N+'\nh = '+fmt(H,1)+' ÷ '+N+' = '+fmt(h,2)+' cm\ng = '+fmt(B)+' − 2 × '+fmt(h,2)+' = '+fmt(g,2)+' cm';
    }
    var bl = 2*h+g, rec = (N-1)*g, ang = Math.atan(h/g)*180/Math.PI, ligne = Math.sqrt(rec*rec + (H-h)*(H-h));
    f += '\nBlondel : 2 × '+fmt(h,2)+' + '+fmt(g,2)+' = '+fmt(bl,2)+' cm\nReculement = ('+N+' − 1) × '+fmt(g,2)+' = '+fmt(rec,1)+' cm';
    var lines = [['Nombre de marches (hauteurs)', String(N)], ['Nombre de girons', String(N-1)], ['Hauteur de marche', fmt(h,2)+' cm'], ['Giron', fmt(g,2)+' cm'], ['2h + g', fmt(bl,2)+' cm'], ['Reculement (encombrement)', fmt(rec,1)+' cm'], ['Angle de l\'escalier', fmt(ang,1)+'°'], ['Longueur de la ligne de foulée (approx.)', fmt(ligne,0)+' cm']];
    var okb = bl >= 60 && bl <= 64, okh = h >= 15 && h <= 21, okg = g >= 21;
    var w = okb && okh && okg ? '<div class="okc">Escalier confortable : la règle de Blondel est respectée.</div>' : '<div class="warn">'+(!okb ? 'Blondel hors de la plage 60–64 cm. ' : '')+(!okh ? 'Hauteur de marche hors de 15–21 cm. ' : '')+(!okg ? 'Giron trop court (moins de 21 cm). ' : '')+'Ajuste le reculement ou la hauteur visée.</div>';
    return {html:out(N+'<small>marches</small><div style="font-size:18px;margin-top:6px;line-height:1.3">'+fmt(h,1)+' cm <small>de haut</small> · '+fmt(g,1)+' cm <small>de giron</small></div>', lines, f, w), main:['Escalier', N+' marches de '+fmt(h,1)+' cm, giron '+fmt(g,1)+' cm'], lines:lines, formula:f};
  }
};

    var h = '<div class="card"><h3>Type</h3>'+SEG('c', Object.keys(UN).map(function(k){ return [k, UN[k][0]]; }), 'lon', 'g4')+'</div>';
    var u = val('u_'+c, U[2]);
    h += '<div class="card"><h3>Valeur</h3><div class="f"><div class="in" style="flex:1;width:auto"><input id="i_cv" data-v="v_'+c+'" inputmode="decimal" value="'+esc(val('v_'+c,'1'))+'"></div><select data-sel="u_'+c+'">'+U[1].map(function(x){ return '<option'+(x[0]===u?' selected':'')+'>'+esc(x[0])+'</option>'; }).join('')+'</select></div></div>';
    return h;
  },
  calc: function(){
    var c = val('c','lon'), U = UN[c], u = val('u_'+c, U[2]), x = n('v_'+c,'1');
    if(!isFinite(x)) return {html:bad()};
    var rows, lines = [], f;
    if(c === 'tmp'){
      var C = u === '°C' ? x : u === '°F' ? (x-32)*5/9 : x-273.15;
      rows = [['°C', C], ['°F', C*9/5+32], ['K', C+273.15]];
      f = '°F = °C × 9/5 + 32 · K = °C + 273,15';
    } else {
      var base = U[1].filter(function(r){ return r[0] === u; })[0][1], si = x*base;
      rows = U[1].map(function(r){ return [r[0], si/r[1]]; });
      f = '1 '+u+' = '+U[1].filter(function(r){ return r[0] !== u; }).slice(0,3).map(function(r){ return fmt(parseFloat((base/r[1]).toPrecision(7)))+' '+r[0]; }).join(' = ');
    }
    function fs(v){ return fmt(parseFloat(v.toPrecision(7))); }
    rows.forEach(function(r){ lines.push([r[0], fs(r[1])]); });
    var h = '<div class="card res"><h3 style="text-transform:none;font-size:15px;color:var(--tx2)">'+fmt(x)+' '+esc(u)+' =</h3>'+rows.map(function(r){ return '<div class="conv'+(r[0]===u?' on':'')+'"><span>'+esc(r[0])+'</span><b>'+fs(r[1])+'</b></div>'; }).join('')+'<div class="formula">'+esc(f)+'</div><div class="row"><button class="btn" data-a="copy">'+svg('copy')+'Copier</button><button class="btn main" data-a="share">'+svg('share')+'Partager</button></div></div>';
    return {html:h, main:['Conversion', fmt(x)+' '+u], lines:lines, formula:f};
  }
};

function openTool(id){
  cur = id; var T = TOOLS.filter(function(t){ return t.id === id; })[0];
  $('toolTitle').textContent = T.t;
  $('toolLayer').hidden = false;
  renderTool();
  pushLayer(function(){ $('toolLayer').hidden = true; cur = null; stickyMain = null; if(io) io.disconnect(); $('sticky').hidden = true; });
}
window.calcOpenTool = openTool;
function renderTool(){
  $('toolBody').innerHTML = '<div id="tForm">'+R[cur].form()+'</div><div id="tOut"></div>';
  compute();
}
var lastRes = null, stickyMain = null, io = null, resVisible = false;
function upSticky(){ $('sticky').hidden = !stickyMain || resVisible; }
function watchRes(){
  var c = $('tOut').querySelector('.res');
  if(!('IntersectionObserver' in window)){ upSticky(); return; }
  if(io) io.disconnect();
  if(!c){ resVisible = false; upSticky(); return; }
  var t = c.querySelector('.big') || c;
  io = new IntersectionObserver(function(es){ resVisible = es[0].intersectionRatio > 0.95; upSticky(); }, {root:$('toolBody'), threshold:[0, 0.96, 1]});
  io.observe(t);
}
$('stGo').addEventListener('click', function(){ var c = $('tOut').querySelector('.res'); if(c) c.scrollIntoView({behavior:'smooth', block:'start'}); });
function compute(){
  var r = R[cur].calc(); lastRes = r;
  var main = r.main && r.lines ? r.main : null;
  $('tOut').innerHTML = r.html;
  stickyMain = main; if(main){ $('stK').textContent = main[0]; $('stV').textContent = main[1]; }
  watchRes();
  if(cur === 'surf'){ val('p',P0).forEach(function(it, i){ var e = $('ps'+i); if(e){ var a = shapeArea(it)[0]; e.textContent = isFinite(a) ? m2(a) : ''; } }); }
}
$('toolBody').addEventListener('input', function(e){
  var t = e.target;
  if(t.dataset.v){ setv(t.dataset.v, t.value); compute(); }
  else if(t.dataset.pi != null){ var P = val('p', P0).slice(); P[+t.dataset.pi] = Object.assign({}, P[+t.dataset.pi]); P[+t.dataset.pi][t.dataset.pk] = t.value; setv('p', P); if(t.tagName === 'SELECT') renderTool(); else compute(); }
  else if(t.dataset.oi != null){ var O = val('o', []); O[+t.dataset.oi][t.dataset.ok] = t.value; setv('o', O); compute(); }
});
$('toolBody').addEventListener('change', function(e){
  var t = e.target;
  if(t.dataset.sel){ setv(t.dataset.sel, t.value); compute(); }
  else if(t.dataset.pi != null && t.tagName === 'SELECT'){ var P = val('p', P0).slice(); P[+t.dataset.pi] = Object.assign({}, P[+t.dataset.pi], {f:t.value}); setv('p', P); renderTool(); }
});
$('toolBody').addEventListener('click', function(e){
  var b = e.target.closest('button'); if(!b) return;
  var sg = b.closest('.seg');
  if(sg && sg.dataset.s){ var k = sg.dataset.s, v = b.dataset.v; setv(k, /^\d+(\.\d+)?$/.test(v) ? +v : v); buzz(); renderTool(); return; }
  if(b.dataset.add){
    var L = val(b.dataset.add, b.dataset.add === 'p' ? P0 : []).slice(); L.push(b.dataset.add === 'p' ? {f:'rect', a:'', b:''} : {a:'0,9', b:'2,15', n:'1'}); setv(b.dataset.add, L); renderTool();
    var ins = $('toolBody').querySelectorAll(b.dataset.add === 'p' ? '[data-pi="'+(L.length-1)+'"][data-pk=a]' : '[data-oi="'+(L.length-1)+'"]'); if(ins[0] && b.dataset.add === 'p') ins[0].focus();
    return;
  }
  if(b.dataset.del){ var D = val(b.dataset.del, b.dataset.del === 'p' ? P0 : []).slice(); D.splice(+b.dataset.i, 1); setv(b.dataset.del, D); renderTool(); return; }
  if(b.dataset.a && lastRes && lastRes.lines){
    var T = TOOLS.filter(function(t){ return t.id === cur; })[0];
    var text = txt(T.t + (lastRes.main ? ' – ' + lastRes.main[1] : ''), lastRes.lines, lastRes.formula);
    if(b.dataset.a === 'copy') copyText(text, 'Calcul copié'); else shareText('Calcul ' + T.t, text);
  }
});
/* Valider une case avec Entrée : passe à la suivante */
$('toolBody').addEventListener('keydown', function(e){
  if(e.key !== 'Enter' || e.target.tagName !== 'INPUT') return;
  e.preventDefault(); var all = Array.prototype.slice.call($('toolBody').querySelectorAll('input')), i = all.indexOf(e.target);
  if(all[i+1]) all[i+1].focus(); else e.target.blur();
});

/* Démarrage */
setMode(S.mode || 'std');
if(pieces.length && !done) display();
})();
</script>
