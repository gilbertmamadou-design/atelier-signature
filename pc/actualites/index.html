      fn(x).then(function(){ done++; if(each) each(done, list.length); if(done >= list.length) res(); else next(); });

function normLink(u){ try{ var x = new URL(u); x.hash = ''; ['utm_source', 'utm_medium', 'utm_campaign', 'utm_term', 'utm_content', 'xtor', 'at_medium', 'at_campaign', 'xtref'].forEach(function(p){ x.searchParams.delete(p); }); return (x.host.replace(/^www\./, '') + x.pathname + x.search).toLowerCase(); }catch(e){ return String(u).toLowerCase(); } }
function addItems(feed, list, now){
  var n = 0;
  list.forEach(function(a, i){
    if(!a.ts) a.ts = now - i * 60000;     // sans date : ordre du flux
    if(now - a.ts > 4 * 86400000) return;
    var id = K.hash(normLink(a.l)), alt = K.hash(feed.m + '|' + K.norm(a.t));
    var ex = ITEMS[id] || ITEMS[alt];

      if(feed.r === 'une') ex.une = 1;
      if(!ex.img && a.img) ex.img = a.img;

/* Rafraîchir : tous les flux actifs en parallèle (6 à la fois), puis sujets, vigilance, tuile Socle */
function refresh(manual){
  if(loading) return Promise.resolve();
  loading = true; $('bRef').classList.add('spin'); prog(0.04);
  var feeds = activeFeeds(), now = Date.now(), okN = 0, byUrl = {}, urls = [];
  feeds.forEach(function(f){ if(!byUrl[f.u]){ byUrl[f.u] = []; urls.push(f.u); } byUrl[f.u].push(f); });   // une adresse n'est lue qu'une fois
  var p = pool(urls, 6, function(u){
    return getText(u).then(function(r){
      var st = { at: Date.now(), code: r.status }, l = [];
      if(r.status >= 200 && r.status < 300 && r.body){
        try{ l = K.parseFeed(r.body, now); st.n = l.length; st.ok = l.length > 0; if(!l.length) st.err = 'flux vide ou illisible'; if(l.length) okN++; }
        catch(e){ st.ok = false; st.err = 'flux illisible'; }
      } else { st.ok = false; st.err = r.err || ('erreur ' + r.status); }
      byUrl[u].forEach(function(f){ FS[f.id] = st; if(l.length) addItems(f, l, now); });
    });
  }, function(d, n){ prog(0.04 + 0.9 * d / n); });
  return Promise.all([p, fetchVig(false)]).then(function(){
    offline = urls.length > 0 && okN === 0;
    if(!offline){ lastAt = Date.now(); prune(lastAt); }
    retopic(); saveCache(); render(); publish();
    if(manual) toast(offline ? 'Pas de connexion : articles enregistrés affichés' : okN + ' flux lus sur ' + urls.length);
  }).catch(function(e){ console.warn('Rafraîchissement : ' + (e && e.message || e)); }).then(function(){
    loading = false; $('bRef').classList.remove('spin'); prog(1); setTimeout(function(){ prog(0); }, 350);
  });
}

  var c = alCfg(), seen = [], links = [], now = Date.now();
  try{ JSON.parse(B && B.notified ? B.notified() : '[]').forEach(function(s){ if(s && s.tok) seen.push({ tok: s.tok, at: s.at, t: s.t }); }); }catch(e){}
  var une = TOPICS.filter(function(tp){ return tp.items.some(function(o){ return o.une; }); });
  var l = K.decide(une, c, seen, links, 0, now, K.quietAt(c, new Date().getHours()));
  var el = $('pv'); if(!el) return l;
  el.innerHTML = l.length ? '<div class="list" style="margin-top:8px">' + l.map(function(n){ return '<button class="art" data-topic="' + n.topic + '"><span class="t"><b>' + esc(n.title) + '</b><span class="d">' + esc(n.text) + '</span></span></button>'; }).join('') + '</div>'
    : '<p class="note">Aucune alerte ne partirait maintenant' + (K.quietAt(c, new Date().getHours()) ? ' (heures calmes)' : '') + '.</p>';
  return l;
}

/* ---------- Tuile Socle : 3 sujets et la vigilance ---------- */
function publish(){
  if(!P || !P.widgetPut) return;
  var top = essentials().slice(0, 3);
  if(top.length < 3) top = top.concat(TOPICS.filter(function(t){ return t.n < 2 && t.items.some(function(o){ return o.une; }); }).slice(0, 3 - top.length));
  var o = { top: top.map(function(t){ return { t: t.title, n: t.n, src: mname(t.lead.m), at: t.newest }; }), t: Date.now(), by: 'appli' };
  if(vigOk()) o.vig = { lvl: VIG.lvl, dept: VIG.dept, code: VIG.code, ph: VIG.ph.map(function(p){ return { p: p.p, lvl: p.lvl }; }), to: VIG.to };
  try{ P.widgetPut(JSON.stringify(o)); }catch(e){}
}
var pendingSocle = null;
window.onSocle = function(a){
  var o = a; if(typeof a === 'string'){ try{ o = JSON.parse(a); }catch(e){ o = {}; } } if(!o) return;
  closeAll();
  if(o.tab === 'meteo') go('met');
  else if(o.tab === 'essentiel') go('ess');
  if(o.sujet){
    go('ess');
    var tp = topicByTitle(o.sujet);
    if(tp) openTopic(tp);
    else if(loading || !TOPICS.length) pendingSocle = o.sujet;
    else { openSearch(); var q = document.getElementById('q'); if(q){ q.value = o.sujet.split(/\s+/).slice(0, 4).join(' '); q.dispatchEvent(new Event('input')); } }
  }
};

/* ---------- Lecture à voix haute des titres de L'essentiel ---------- */
var speaking = false, spT = null;
function speakEss(){
  if(speaking){ stopSpeak(); return; }
  var l = essentials().slice(0, 8); if(!l.length) return;
  var ord = ['Premier sujet', 'Deuxième sujet', 'Troisième sujet', 'Quatrième sujet', 'Cinquième sujet', 'Sixième sujet', 'Septième sujet', 'Huitième sujet'];
  var txt = 'L\'essentiel de l\'actualité, ' + new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }) + ', ' + hhmm(Date.now()) + '. ' +
    l.map(function(t, i){ return ord[i] + ' : ' + t.title.replace(/[«»"]/g, '') + '. Couvert par ' + t.n + ' médias.'; }).join(' ');
  if(vigLvl() >= 2) txt += ' Météo : vigilance ' + VCOL[VIG.lvl] + ' en ' + VIG.dept + ' pour ' + VIG.ph.map(function(p){ return p.p; }).join(', ') + '.';
  speaking = true; renderEss();
  if(P && P.speak){ P.speak(txt); clearTimeout(spT); spT = setTimeout(function(){ speaking = false; if(TAB === 'ess') renderEss(); }, Math.min(240000, txt.length * 75)); }
  else if(window.speechSynthesis){ var u = new SpeechSynthesisUtterance(txt); u.lang = 'fr-FR'; u.onend = function(){ speaking = false; if(TAB === 'ess') renderEss(); }; speechSynthesis.cancel(); speechSynthesis.speak(u); }
  else { speaking = false; toast('Lecture à voix haute indisponible'); }
}
function stopSpeak(){ speaking = false; clearTimeout(spT); try{ if(P && P.speak) P.speak(' '); if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){} if(TAB === 'ess') renderEss(); }

/* ---------- Clics ---------- */
document.addEventListener('click', function(e){
  var t = e.target;
  var u = t.closest('[data-url]'); if(u){ e.preventDefault(); var url = u.dataset.url; if(B && B.openUrl) B.openUrl(url); else window.open(url, '_blank', 'noopener'); return; }
  var a = t.closest('[data-art]'); if(a){ var it = findItem(a.dataset.art); if(it) openArt(it); return; }
  var tp = t.closest('[data-topic]'); if(tp){ var x = topicById(tp.dataset.topic); if(x) openTopic(x); return; }
  var sh = t.closest('[data-share]'); if(sh){ var i2 = findItem(sh.dataset.share); if(i2) share(i2); return; }
  var fv = t.closest('[data-fav]'); if(fv){ toggleFav(fv.dataset.fav); return; }
  var rb = t.closest('[data-rub]'); if(rb){ RUB = rb.dataset.rub; SHOWN.fil = 40; renderFil(); $('main').scrollTop = 0; return; }
  var im = t.closest('[data-im]'); if(im){ IMGMODE = im.dataset.im; renderImg(); return; }
  var dp = t.closest('[data-dept]'); if(dp){ setDept(dp.dataset.dept); return; }
  var g = t.closest('[data-go]'); if(g){ go(g.dataset.go); return; }
  if(t.closest('#bSpeak')){ speakEss(); return; }
  var ac = t.closest('[data-act]'); if(!ac) return;
  var k = ac.dataset.act;
  if(k === 'morefil'){ SHOWN.fil += 40; renderFil(); }
  else if(k === 'moreimg'){ SHOWN.img += 40; renderImg(); }
  else if(k === 'dept') openDept();
  else if(k === 'gps') locate();
  else if(k === 'favs') openFavs();
  else if(k === 'search') openSearch();
  else if(k === 'sources') openSources();
  else if(k === 'about') openAbout();
  else if(k === 'perm'){ if(B && B.askNotif) B.askNotif(); }
  else if(k === 'osnotif'){ if(B && B.notifSettings) B.notifSettings(); }
  else if(k === 'test'){ if(B && B.testNotif){ if(B.askNotif) B.askNotif(); B.testNotif(); toast('Notification d\'essai envoyée'); } else toast('Disponible dans l\'appli Android'); }
  else if(k === 'now'){ if(B && B.runNow){ syncWorker(); B.runNow(); toast('Vérification lancée en arrière-plan'); } else toast('Disponible dans l\'appli Android'); }
  else if(k === 'preview') preview();
  else if(k === 'clear'){ ITEMS = {}; TOPICS = []; FS = {}; lastAt = 0; lsSet('cache', null); lsSet('fs', {}); toast('Cache vidé'); render(); }
});
$('bSearch').onclick = openSearch;
$('bFav').onclick = openFavs;
$('bRef').onclick = function(){ refresh(true); };
/* Réglages (interrupteurs, listes, champs) */
function setPath(path, v){ var p = path.split('.'), o = S; for(var i = 0; i < p.length - 1; i++) o = o[p[i]]; o[p[p.length - 1]] = v; }
document.addEventListener('change', function(e){
  var t = e.target;
  if(t.dataset.feed){ if(t.checked) delete S.feedsOff[t.dataset.feed]; else S.feedsOff[t.dataset.feed] = true; save(); syncWorker(); needRefresh = true; return; }
  var k = t.dataset.set; if(!k) return;
  var v = t.type === 'checkbox' ? t.checked : t.type === 'range' ? +t.value : t.tagName === 'SELECT' && /^\d+$/.test(t.value) ? +t.value : t.value;
  setPath(k, v); save();
  if(k === 'theme' || k === 'fs') theme();
  if(/^al\./.test(k)) syncWorker();
  if(/^(media|rubs)\./.test(k)){ needRefresh = true; syncWorker(); if(k.indexOf('rubs.') === 0 && !S.rubs[RUB] && RUB !== 'dept') RUB = 'une'; }
  if(k === 'al.on' && v && B && B.askNotif) B.askNotif();
  if(k === 'al.vigOn' && v && B && B.askNotif) B.askNotif();
  if(k === 'imgs' || k === 'kw') render();
  if(k === 'al.quietOn' || k === 'fs') renderPlus();
});
document.addEventListener('input', function(e){ if(e.target.id === 'fs'){ S.fs = +e.target.value; theme(); var s = e.target.parentNode.querySelector('small'); if(s) s.textContent = S.fs + ' %'; } });
var needRefresh = false;
/* Fermeture d'une feuille Sources : relire si des flux ont changé */
window.addEventListener('popstate', function(){ if(needRefresh && !SHEETS.some(function(s){ return s.kind === 'sources'; })){ needRefresh = false; refresh(false); } });

/* ---------- Tirer pour rafraîchir ---------- */
(function(){
  var main = $('main'), ptr = $('ptr'), y0 = null, dy = 0;
  main.addEventListener('touchstart', function(e){ y0 = main.scrollTop <= 0 && !SHEETS.length ? e.touches[0].clientY : null; dy = 0; }, { passive: true });
  main.addEventListener('touchmove', function(e){
    if(y0 == null) return;
    dy = e.touches[0].clientY - y0;
    if(dy <= 0){ ptr.classList.remove('on'); return; }
    if(dy > 8 && e.cancelable) e.preventDefault();
    var d = Math.min(dy * 0.5, 80); ptr.classList.add('on'); ptr.style.transform = 'translateY(' + (d - 30) + 'px) rotate(' + dy * 2 + 'deg)';
  }, { passive: false });
  main.addEventListener('touchend', function(){
    if(y0 == null) return; y0 = null;
    if(dy > 120){ ptr.classList.add('go'); ptr.style.transform = 'translateY(20px)'; refresh(true).then(function(){ ptr.classList.remove('on', 'go'); ptr.style.transform = ''; }); }
    else { ptr.classList.remove('on'); ptr.style.transform = ''; }
    dy = 0;
  });
})();

/* ---------- Démarrage ---------- */
window.addEventListener('online', function(){ if(offline) refresh(false); });
window.addEventListener('offline', function(){ offline = true; render(); });
document.addEventListener('visibilitychange', function(){ if(!document.hidden && Date.now() - lastAt > 10 * 60000) refresh(false); if(document.hidden && speaking && !(P && P.speak)) stopSpeak(); });
var had = loadCache();
retopic(); go(TAB);
syncWorker();
refresh(false).then(function(){
  if(pendingSocle){ var tp = topicByTitle(pendingSocle); pendingSocle = null; if(tp) openTopic(tp); }
});
setTimeout(function(){ try{ if(P && P.takeSocle){ var x = P.takeSocle(); if(x) window.onSocle(x); } }catch(e){} }, 300);
setInterval(function(){ if(!document.hidden && !loading && Date.now() - lastAt > 15 * 60000) refresh(false); }, 60000);
window.ActuApp = { refresh: refresh, go: go, topics: function(){ return TOPICS; }, items: uniqItems, S: S, preview: preview, openTopic: openTopic, topicByTitle: topicByTitle, searchItems: searchItems, vig: function(){ return VIG; }, setDept: setDept, publish: publish, activeFeeds: activeFeeds, uneFeeds: uneFeeds, syncWorker: syncWorker, fs: function(){ return FS; }, offline: function(){ return offline; } };
})();
</script>
