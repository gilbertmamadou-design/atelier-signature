<style>
:root{
  color-scheme:dark;
  --bg:#0f1116;--bg2:#181b23;--bg3:#222632;--bg4:#2c3140;--line:#ffffff14;
  --tx:#f2f3f7;--tx2:#b4b8c7;--tx3:#7d8294;

  --r:18px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
[hidden]{display:none!important}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(12px + var(--safe-t)) 16px 8px;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:21px;flex:1;min-width:0}
.logo svg{width:30px;height:30px;flex:none}
.hb{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--bg2);border:1px solid var(--line);flex:none}
.hb.acc{background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--ink);border:0}
#hRef.spinning svg{animation:sp .9s linear infinite}
#ptr{position:fixed;left:50%;top:calc(62px + var(--safe-t));transform:translate(-50%,0);width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--bg3);border:1px solid var(--line);color:var(--tx2);opacity:0;pointer-events:none;z-index:20;transition:opacity .15s}#ptr.on{opacity:1}#ptr.ready{color:var(--acc);border-color:#efbf7866}
.dirs .li{align-items:center}.dirs .li svg.i{color:var(--acc)}.dirs .li small{display:block;color:var(--tx3);font-size:12px;margin-top:2px}.dirs .li .x{margin-left:auto}
main{padding:2px 16px calc(96px + var(--safe-b))}
nav#tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;display:flex;justify-content:space-around;padding:8px 6px calc(8px + var(--safe-b));background:linear-gradient(transparent,var(--bg) 30%)}
nav#tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--tx3);padding:6px 18px;border-radius:14px;min-width:96px}
nav#tabs button svg{width:23px;height:23px}
nav#tabs button.on{color:var(--acc);background:#efbf7814}
.search{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px 13px;margin:4px 0 10px;color:var(--tx3)}
.search input{flex:1;background:transparent;border:0;outline:0;min-width:0;font-size:16px;color:var(--tx)}

.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:7px 12px;border-radius:99px;background:var(--bg2);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--tx2);display:inline-flex;align-items:center;gap:5px}

.sect{font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--tx3);font-weight:700;margin:16px 2px 10px;display:flex;align-items:center;gap:8px}
.sect span{flex:1}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.note{font-size:13.5px;color:var(--tx2);line-height:1.5}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 14px;border-radius:13px;background:var(--bg3);border:1px solid var(--line);font-weight:600;font-size:14px;white-space:nowrap}
.btn.main{background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--ink);border:0}

.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.row .btn{flex:1}
.empty{text-align:center;color:var(--tx3);padding:30px 18px;font-size:14px;line-height:1.55}
.empty svg.i{width:46px;height:46px;margin:0 auto 12px;stroke-width:1.4;color:var(--bg4)}
.spin{width:22px;height:22px;border:2.5px solid var(--tx3);border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;margin:26px auto}
.spin.sm{width:15px;height:15px;border-width:2px;margin:0;display:inline-block;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:16px;right:16px;bottom:calc(92px + var(--safe-b));background:#2b3042;border:1px solid #ffffff1f;padding:12px 14px;border-radius:14px;font-size:14px;z-index:90;opacity:0;transform:translateY(20px);transition:.22s;pointer-events:none;color:var(--tx)}
#toast.on{opacity:1;transform:none}

/* Bibliothèque */
.resume{display:flex;gap:14px;align-items:center;padding:12px;background:linear-gradient(135deg,#efbf781c,#e98f7810);border:1px solid #efbf7833;border-radius:var(--r);margin:4px 0 6px;width:100%;text-align:left}

.bk .bt{font-size:12.5px;font-weight:600;margin-top:7px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bk .ba{font-size:11.5px;color:var(--tx3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}

.bk .cw{position:relative}

.sortb svg.i{width:15px;height:15px}
.chips.cls{padding-top:0}

.bk .num{position:absolute;left:6px;top:6px;min-width:22px;text-align:center;font-size:11px;font-weight:800;background:var(--acc);color:var(--ink);border-radius:6px;padding:2px 5px;font-variant-numeric:tabular-nums}
.form label{display:block;font-size:12px;font-weight:700;color:var(--tx3);margin:12px 2px 6px;text-transform:uppercase;letter-spacing:.5px}

/* Catalogue */
.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:13px;padding:3px;gap:3px;margin:4px 0 10px}

.res .t{flex:1;min-width:0}
.res .t b{display:block;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.res .t span{display:block;font-size:12.5px;color:var(--tx2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .t small{display:block;font-size:11.5px;color:var(--tx3);margin-top:2px}

.res .add.have{color:var(--ok)}

/* Feuilles (panneaux du bas) */
#sheetWrap{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;justify-content:flex-end}
#sheetWrap .scrim{position:absolute;inset:0;background:#000a;opacity:0;transition:opacity .2s}
#sheetWrap.on .scrim{opacity:1}
.sheet{position:relative;background:var(--bg2);border-radius:22px 22px 0 0;border-top:1px solid #ffffff1c;max-height:86vh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .22s ease-out;padding-bottom:var(--safe-b)}
#sheetWrap.on .sheet{transform:none}
.sheet .grab{width:38px;height:4px;border-radius:4px;background:var(--bg4);margin:9px auto 2px;flex:none}

.sheet.tall{height:86vh}
.x{width:36px;height:36px;border-radius:11px;background:var(--bg3);display:flex;align-items:center;justify-content:center;flex:none}
.set{padding:12px 0;border-top:1px solid var(--line)}
.set:first-child{border-top:0;padding-top:4px}
.set .lab{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:14px;margin-bottom:8px}
.set .lab span{color:var(--acc);font-variant-numeric:tabular-nums;font-size:13.5px}
.set .seg{margin:0;background:var(--bg3);border:0}
.set .seg button.on{background:var(--bg4)}
.stp{display:flex;align-items:center;gap:8px}
.stp button{width:46px;height:42px;border-radius:12px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-weight:700;font-family:Georgia,serif}
.stp .v{flex:1;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;font-size:15px}
input[type=range]{width:100%;accent-color:var(--acc);margin:4px 0}
.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.themes button{border-radius:13px;padding:10px 4px 8px;font-size:12px;font-weight:600;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:3px}
.themes button b{font-family:Georgia,"Noto Serif",serif;font-size:19px;line-height:1}
.themes button.on{border-color:var(--acc)}
.swl{display:flex;align-items:center;gap:12px}
.swl .t{flex:1;font-weight:600;font-size:14px}
.swl .t small{display:block;font-weight:400;color:var(--tx3);font-size:12.5px}
.sw{position:relative;width:46px;height:28px;flex:none}
.sw input{opacity:0;position:absolute;inset:0;margin:0;z-index:1}
.sw span{position:absolute;inset:0;border-radius:99px;background:var(--bg4);transition:.2s}
.sw span:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#cfd3df;transition:.2s}
.sw input:checked+span{background:var(--acc)}
.sw input:checked+span:after{transform:translateX(18px);background:#fff}
.tabs2{display:flex;gap:4px;padding:0 16px 10px;flex:none}
.tabs2 button{flex:1;padding:8px 4px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--tx2);background:var(--bg3)}
.tabs2 button.on{background:var(--acc);color:var(--ink)}
.toc a,.li{display:flex;gap:10px;align-items:baseline;padding:11px 4px;border-top:1px solid var(--line);color:var(--tx);text-decoration:none;font-size:14.5px;line-height:1.35;width:100%;text-align:left}
.toc a:first-child,.li:first-child{border-top:0}
.toc a.cur{color:var(--acc);font-weight:700}
.toc a small{margin-left:auto;color:var(--tx3);font-size:12px;flex:none;font-variant-numeric:tabular-nums}
.li .t{flex:1;min-width:0}
.li .t q{display:block;quotes:none;font-family:Georgia,"Noto Serif",serif;font-size:14px;line-height:1.45;color:var(--tx);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.li .t small{display:block;color:var(--tx3);font-size:12px;margin-top:3px}
.li .t em{display:block;color:var(--tx2);font-size:13px;margin-top:4px;font-style:normal;padding-left:8px;border-left:2px solid var(--acc)}
.li .c{width:4px;align-self:stretch;border-radius:3px;flex:none}
.li .del{color:var(--tx3);padding:4px;flex:none;align-self:center}
.hit b{background:#efbf7840;color:var(--tx);border-radius:3px;padding:0 1px;font-weight:600}
.dots{display:flex;gap:10px}
.dots button{width:34px;height:34px;border-radius:50%;border:2px solid transparent}
.dots button.on{border-color:#fff}
textarea.inp,input.inp{width:100%;background:var(--bg3);border:1px solid var(--line);border-radius:13px;padding:11px 12px;outline:0;font-size:15px;resize:vertical;color:var(--tx)}
.def h4{margin:14px 0 6px;font-size:13px;color:var(--acc);text-transform:uppercase;letter-spacing:.5px}
.def ol{margin:0;padding-left:22px;font-size:14.5px;line-height:1.5}
.def li{margin-bottom:6px}
.def .w{font-family:Georgia,"Noto Serif",serif;font-size:24px;font-weight:700}
.minfo{display:flex;gap:14px;align-items:flex-start;margin-bottom:8px}
.minfo .cv{width:72px;flex:none}
.minfo .t b{display:block;font-size:16px;line-height:1.3}
.minfo .t span{display:block;color:var(--tx2);font-size:13.5px;margin-top:3px}
.minfo .t small{display:block;color:var(--tx3);font-size:12.5px;margin-top:6px;line-height:1.5}
.acts .li{align-items:center;font-weight:600}
.acts .li svg.i{color:var(--tx2)}

/* Lecteur EPUB */

#reader.t-nuit{--pbg:#000;--ptx:#a3a3a3;--pmut:#5a5a5a;--plk:#b98a4a;--pbar:#121212}
#frame{position:absolute;left:0;top:calc(30px + var(--safe-t));width:100vw;height:calc(100% - 58px - var(--safe-t) - var(--safe-b));border:0;display:block;background:var(--pbg)}
.rinfo{position:absolute;left:0;right:0;display:flex;align-items:center;gap:10px;padding:0 18px;font-size:11.5px;color:var(--pmut);font-variant-numeric:tabular-nums;pointer-events:none}
.rinfo span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#rInfoT{top:var(--safe-t);height:30px;justify-content:center}
#rInfoB{bottom:var(--safe-b);height:28px;justify-content:space-between}
#dim{position:absolute;inset:0;background:#000;pointer-events:none;opacity:0;z-index:2}
#ribbon{position:absolute;right:16px;top:var(--safe-t);width:16px;height:28px;color:var(--plk);z-index:3;pointer-events:none}

.rbar{position:absolute;left:0;right:0;z-index:5;background:var(--pbar);color:var(--ptx);transition:transform .2s,opacity .2s;box-shadow:0 0 24px #0005}

.rbar.bot{bottom:0;padding:8px 12px calc(8px + var(--safe-b))}
#reader:not(.ui) .rbar.top{transform:translateY(-110%);opacity:0;pointer-events:none}
#reader:not(.ui) .rbar.bot{transform:translateY(110%);opacity:0;pointer-events:none}
.rb{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;color:var(--ptx)}
.rb.on{color:var(--plk)}
.rbar .tt{flex:1;min-width:0;padding:0 4px}
.rbar .tt b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rbar .tt span{display:block;font-size:12px;color:var(--pmut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rbar.bot .prog{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--pmut);font-variant-numeric:tabular-nums}
.rbar.bot .prog input{flex:1;accent-color:var(--plk)}
.rbar.bot .acts2{display:flex;justify-content:space-around;margin-top:4px}
.rbar.bot .acts2 button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--ptx);padding:4px 8px;min-width:62px;border-radius:10px}

#selbar .cdot{width:28px;height:28px;border-radius:50%;flex:none;margin:0 2px;border:2px solid #ffffff30}
#selbar .sep{width:1px;height:26px;background:#ffffff22;margin:0 4px}

#selbar .sa svg.i{width:19px;height:19px}
#reader.tts #frame{height:calc(100% - 30px - 158px - var(--safe-t) - var(--safe-b))}
#reader.tts #rInfoB{visibility:hidden}
/* Lecture à voix haute (livre audio) : barre commune à l'EPUB et au PDF */
#abar{position:fixed;left:10px;right:10px;bottom:calc(8px + var(--safe-b));z-index:45;background:#262a35;color:#f2f3f7;border:1px solid #ffffff22;border-radius:20px;padding:7px 10px 9px;box-shadow:0 10px 30px #000a;max-width:640px;margin:0 auto}
#abar .ab1{display:flex;align-items:center;gap:8px;min-height:30px}
#abar .ab1 .t{flex:1;min-width:0;font-size:12.5px;color:#c4c8d4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#abar .ab1 .t b{color:#f2f3f7;font-weight:700}
#abar .ab2{display:flex;align-items:center;justify-content:space-between;gap:4px;margin:2px 4px 7px}
#abar .ab2 button{width:48px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#e6e8ef}
#abar .ab2 button:active{background:#ffffff14}
#abar .ab2 .pp{width:58px;height:58px;border-radius:50%;background:var(--acc);color:var(--ink)}
#abar .ab2 .pp svg.i{width:26px;height:26px}

#abar .ab3::-webkit-scrollbar{display:none}
#abar .ab3 button{flex:1 0 auto;padding:7px 10px;border-radius:11px;background:#ffffff12;font-size:12.5px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;justify-content:center;color:#e6e8ef}
#abar .ab3 button svg.i{width:16px;height:16px}
#abar .ab3 button.on{color:var(--acc)}
#abar .x{width:32px;height:32px;border-radius:10px;background:#ffffff12;display:flex;align-items:center;justify-content:center}
#abar .x svg.i{width:17px;height:17px}
#abar.wait #aPlay{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.6}}
body.aud #toast{bottom:calc(176px + var(--safe-b))}
body.aud #pScroll{padding-bottom:170px}
body.aud #pInd{bottom:calc(172px + var(--safe-b))}
.pg .tth{position:absolute;background:#ffd34d66;border-radius:2px;pointer-events:none;mix-blend-mode:multiply}

.vrow .t{flex:1;min-width:0}.vrow .t b{display:block;font-size:14.5px}.vrow .t small{display:block;color:var(--tx3);font-size:12px;margin-top:2px;line-height:1.35}

#rLoad{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:4;background:var(--pbg)}
#rLoad .spin{border-color:var(--pmut);border-right-color:transparent}

var dbp=null;
function db(){
  if(dbp) return dbp;
  dbp=new Promise(function(res,rej){
    var r=indexedDB.open('liseuse',1);
    r.onupgradeneeded=function(){ var d=r.result; if(!d.objectStoreNames.contains('books')) d.createObjectStore('books',{keyPath:'id'}); if(!d.objectStoreNames.contains('files')) d.createObjectStore('files',{keyPath:'id'}); };
    r.onsuccess=function(){ res(r.result); }; r.onerror=function(){ rej(r.error); };
  });
  return dbp;
}
function tx(store, mode, fn){
  return db().then(function(d){ return new Promise(function(res,rej){
    var t=d.transaction(store,mode), s=t.objectStore(store), out; var q=fn(s);
    if(q) q.onsuccess=function(){ out=q.result; };
    t.oncomplete=function(){ res(out); }; t.onerror=function(){ rej(t.error); }; t.onabort=function(){ rej(t.error||new Error('Stockage plein')); };
  }); });
}
function dbGet(st,id){ return tx(st,'readonly',function(s){ return s.get(id); }); }
function dbPut(st,o){ return tx(st,'readwrite',function(s){ return s.put(o); }); }
function dbDel(st,id){ return tx(st,'readwrite',function(s){ return s.delete(id); }); }

function bookById(id){ for(var i=0;i<BOOKS.length;i++) if(BOOKS[i].id===id) return BOOKS[i]; return null; }

  try{

async function pullFile(f){
  var parts=[], off=0, CH=1572864;
  while(true){
    var b=A.readChunk(f.id, off, CH); if(!b) break;
    var s=atob(b), u=new Uint8Array(s.length);

      var b=l[0]; metaSeen[b.id]=1;

      catch(e){ console.warn('métadonnées', b.title, e&&e.message); var c=bookById(b.id); if(c){ c.metaV=META_V; saveBook(c,true); } }
      if(n && n%12===0) relib();

    }
    // livres du catalogue Gutenberg : sujets, étagères et dates de l'auteur (Gutendex)
    var gl=BOOKS.filter(function(b){ return /^gut:\d+$/.test(b.src||'') && !b.gutV && !metaSeen['g'+b.id]; });
    for(var i=0;i<gl.length;i++){
      var g=gl[i]; metaSeen['g'+g.id]=1;
      try{
        var o=J(await get('https://gutendex.com/books/'+g.src.slice(4)), null), c2=bookById(g.id);
        if(o && o.id && c2){ addSubjects(c2, (o.subjects||[]).concat(o.bookshelves||[])); var au=(o.authors||[])[0]; if(au && !c2.adates && (au.birth_year||au.death_year)) c2.adates=(au.birth_year||'?')+'–'+(au.death_year||'?'); c2.gutV=1; saveBook(c2,true); n++; }
      }catch(e){}
      await wait(250);
    }
    if(n) relib();
    return n;
  })().catch(function(e){ console.warn(e); return 0; }).then(function(n){ metaRun=null; return n; });
  return metaRun;
}

/* ---------- Tri, filtres, classement ---------- */
var COLL=(function(){ try{ return new Intl.Collator('fr',{sensitivity:'base',numeric:true}); }catch(e){ return null; } })();
function cmp(a,b){ a=String(a==null?'':a); b=String(b==null?'':b); return COLL?COLL.compare(a,b):a.localeCompare(b,'fr',{sensitivity:'base'}); }
function titleKey(s){ return String(s||'').replace(/^(?:(?:le|la|les|un|une|des|the|an?)\s+|l['’]\s*)/i,''); }
var SORTS={recent:'Récents', title:'Titre', author:'Auteur', pct:'Avancement'};
var GROUPS={none:'Sans classement', author:'Auteur', genre:'Genre', series:'Série', lang:'Langue', year:'Année / siècle', coll:'Collection', state:'État de lecture', added:'Ajout récent'};
var PICK=null;   // filtre « Auteurs » / « Genres » : {t:'a'|'g', k, l}
function recentCmp(a,b){ return (b.opened||b.added||0)-(a.opened||a.added||0); }
function stateRank(b){ return b.done?2:(b.pct>0?0:1); }
function sortIn(l){
  if(L.sort==='title') l.sort(function(a,b){ return cmp(titleKey(a.title),titleKey(b.title)); });
  else if(L.sort==='author') l.sort(function(a,b){ var x=authorSort(a), y=authorSort(b); return (x?0:1)-(y?0:1) || cmp(x,y) || cmp(titleKey(a.title),titleKey(b.title)); });
  else if(L.sort==='pct') l.sort(function(a,b){ return stateRank(a)-stateRank(b) || (b.pct||0)-(a.pct||0) || recentCmp(a,b); });
  else l.sort(recentCmp);
  return l;
}
function hay(b){ return normTxt([b.title, b.author, shortAuthor(b.author), genresOf(b).join(' '), (b.subjects||[]).join(' '), b.series||'', b.publisher||''].join(' ')); }
function baseBooks(){
  var l=BOOKS.slice(), q=normTxt(libQ);
  if(q) l=l.filter(function(b){ return hay(b).indexOf(q)>=0; });
  var f=L.filter||'all';

}
function pickOk(b){ if(!PICK) return true; if(PICK.t==='a') return authorKey(b.author)===PICK.k; return genresOf(b).some(function(g){ return normTxt(g)===PICK.k; }); }

function sectionsOf(b, g){
  switch(g){
    case 'author': var a=shortAuthor(b.author); return a?[{k:'a:'+authorKey(b.author), l:a, o:authorSort(b)}]:[{k:'?', l:'Auteur inconnu', r:9}];
    case 'genre': var gs=genresOf(b); return gs.length?gs.map(function(x){ return {k:'g:'+normTxt(x), l:x, o:normTxt(x)}; }):[{k:'?', l:'Sans genre', r:9}];
    case 'series': return b.series?[{k:'s:'+normTxt(b.series), l:b.series, o:normTxt(b.series)}]:[{k:'?', l:'Hors série', r:9}];
    case 'lang': var c=langCode(b.lang); return c?[{k:'l:'+c, l:langLabel(c), o:0}]:[{k:'?', l:'Langue inconnue', r:9}];
    case 'year':
      var y=yearOf(b); if(!y) return [{k:'?', l:'Année inconnue', r:9}];
      if(y>=1900){ var d=Math.floor(y/10)*10; return [{k:'y:'+d, l:'Années '+d, o:d}]; }
      var sc=Math.floor((y-1)/100)+1; return [{k:'s:'+sc, l:roman(sc)+(sc===1?'er':'e')+' siècle', o:(sc-1)*100}];
    case 'coll': var cs=(b.colls||[]).filter(function(x){ return L.colls.indexOf(x)>=0; }); return cs.length?cs.map(function(x){ return {k:'c:'+x, l:x, o:L.colls.indexOf(x)}; }):[{k:'?', l:'Sans collection', r:9}];
    case 'state': return [b.done?{k:'done', l:'Terminés', r:2}:(b.pct>0?{k:'reading', l:'En cours', r:0}:{k:'new', l:'Non commencés', r:1})];
    case 'added': var age=(Date.now()-(b.added||0))/864e5; return [age<7?{k:'w', l:'Cette semaine', r:0}:age<31?{k:'m', l:'Ce mois-ci', r:1}:age<365?{k:'y', l:'Cette année', r:2}:{k:'o', l:'Plus ancien', r:3}];

}
function groupBooks(list, g){
  var m={}, out=[];
  list.forEach(function(b){ sectionsOf(b,g).forEach(function(s){ var x=m[s.k]; if(!x){ x=m[s.k]={k:s.k, l:s.l, o:s.o, r:s.r||0, books:[], lc:{}}; out.push(x); } if(x.books.indexOf(b)<0) x.books.push(b); x.lc[s.l]=(x.lc[s.l]||0)+1; }); });
  out.forEach(function(x){
    var best=0; Object.keys(x.lc).forEach(function(l){ if(x.lc[l]>best){ best=x.lc[l]; x.l=l; } });   // forme d'écriture la plus fréquente
    if(g==='lang') x.o=-x.books.length;
    if(g==='series' && x.k!=='?') x.books.sort(function(a,b){ return (a.seriesIdx||1e9)-(b.seriesIdx||1e9) || cmp(titleKey(a.title),titleKey(b.title)); });
    else sortIn(x.books);

  out.sort(function(a,b){ return a.r-b.r || (typeof a.o==='number' && typeof b.o==='number' ? a.o-b.o : cmp(a.o,b.o)) || cmp(a.l,b.l); });

}
function barItems(list, t){
  var m={}, out=[];

    var ks=t==='a'?(b.author?[[authorKey(b.author), shortAuthor(b.author), authorSort(b)]]:[]):genresOf(b).map(function(g){ return [normTxt(g), g, normTxt(g)]; });

  });

}

var scanWait=null, dirWait=null, scanP=null;
function dirsOk(){ return !!(A && A.scanFolders && A.pickFolder); }
function scanDirs(){
  if(!dirsOk() || !(L.dirs||[]).length) return Promise.resolve(0);
  if(scanP) return scanP;
  scanP=new Promise(function(res){
    var done=false, fin=function(n){ if(done) return; done=true; res(n||0); };
    scanWait=function(o){
      (o.folders||[]).forEach(function(f){ L.dirs.forEach(function(d){ if(d.uri===f.uri) d.lost=!f.ok; }); });
      L.seen=L.seen||{};
      var have={}; BOOKS.forEach(function(b){ have[b.key]=1; });
      var fresh=(o.found||[]).filter(function(x){ return x.uri && !L.seen[x.uri] && !have[x.name+'|'+x.size]; });
      fresh.forEach(function(x){ L.seen[x.uri]=1; });   // un livre supprimé de la bibliothèque ne revient pas tout seul
      saveL();
      if(!fresh.length){ fin(0); return; }
      dirWait=fin; A.importUris(JSON.stringify(fresh.map(function(x){ return x.uri; })));
    };
    setTimeout(function(){ if(!done && dirWait!==fin){ scanWait=null; fin(0); } },90000);     // pas de réponse du téléphone
    setTimeout(function(){ if(!done){ if(dirWait===fin) dirWait=null; scanWait=null; fin(0); } },600000);
    try{ A.scanFolders(JSON.stringify(L.dirs.map(function(d){ return d.uri; }))); }catch(e){ scanWait=null; fin(0); }
  }).then(function(n){ scanP=null; return n; });

}

  var g=++catGen;

    .catch(function(e){ if(g!==catGen) return; CAT.err=(e&&e.message)||'Recherche impossible'; })

}
async function catGet(it){
  if(DLST[it.src]) return;
  DLST[it.src]={pct:null}; drawCatRes();
  var name=(it.title||'livre').replace(/[\\/:*?"<>|]/g,'_').slice(0,80)+'.epub';
  if(it.src.indexOf('ws:')===0) toast('Wikisource prépare le livre, patiente un peu…');
  try{
    var r=await downloadBook(it.url, name, function(got,total){ DLST[it.src]={pct:total>0?Math.round(got*100/total):null}; drawCatRes(); });
    var blob=r.blob||await pullFile(r.file);
    var res=await importBlob(blob, name, 'epub', {src:it.src, title:it.title, author:it.author, subjects:it.subjects||null, dates:it.dates||''});
    toast(res.dup?'Déjà dans ta bibliothèque':'« '+res.book.title+' » ajouté à ta bibliothèque');
  }catch(e){ toast((e&&e.message)||'Téléchargement impossible', true); }
  delete DLST[it.src]; drawCatRes();
}

/* Parcours du texte : positions = décalage en caractères dans le texte du chapitre */
function buildNodes(){
  var c=R.fd.getElementById('c'), w=R.fd.createTreeWalker(c, NodeFilter.SHOW_TEXT), n, pos=0, nodes=[], starts=[], vis=[];
  while((n=w.nextNode())){ nodes.push(n); starts.push(pos); if(/\S/.test(n.data)) vis.push(nodes.length-1); pos+=n.data.length; }
  R.nodes=nodes; R.starts=starts; R.vis=vis; R.len=pos;
}
function nodeAt(o){
  var st=R.starts, lo=0, hi=st.length-1;
  if(hi<0) return null;
  while(lo<hi){ var mid=(lo+hi+1)>>1; if(st[mid]<=o) lo=mid; else hi=mid-1; }
  var i=lo;
  while(i<R.nodes.length-1 && (o-st[i]>=R.nodes[i].data.length)) i++;
  return {i:i, n:R.nodes[i], off:clamp(o-st[i],0,R.nodes[i].data.length)};
}
function rectAt(node, off){
  var r=R.fd.createRange(), len=node.data.length;
  if(!len) return null;
  off=clamp(off,0,len-1);
  r.setStart(node,off); r.setEnd(node,off+1);
  var rs=r.getClientRects(); if(rs.length) return rs[0];
  var b=r.getBoundingClientRect(); return b&&(b.width||b.height)?b:null;
}
function scroller(){ return R.fd.scrollingElement||R.fd.documentElement; }
function posMetric(node, off){
  var rc=rectAt(node, off); if(!rc) return null;
  var se=scroller();
  if(S.mode==='pages') return Math.floor((rc.left+rc.width/2+se.scrollLeft)/R.W);
  return rc.top+se.scrollTop;
}
function pageOfOffset(o){
  if(!R.nodes.length) return 0;
  var na=nodeAt(o); if(!na) return 0;
  var i=na.i, off=na.off;
  // un nœud d'espaces n'a pas de position : prendre le suivant visible
  var k=0; while(i<R.nodes.length && !/\S/.test(R.nodes[i].data.slice(off)) && k<200){ i++; off=0; k++; }
  if(i>=R.nodes.length) return S.mode==='pages'?R.pages-1:R.fd.getElementById('c').scrollHeight;
  var n=R.nodes[i]; while(off<n.data.length && /\s/.test(n.data.charAt(off))) off++;
  var m=posMetric(n, off);
  return m==null?0:m;
}
/* Décalage du premier caractère visible de la page (ou du haut de l'écran en défilement) */
function curOffset(){
  if(!R.vis||!R.vis.length) return 0;
  var se=scroller(), target=S.mode==='pages'?R.page:se.scrollTop+2;
  var ge=function(m){ return m!=null && m>=target; };
  var V=R.vis, lo=0, hi=V.length-1, ans=-1;
  while(lo<=hi){ var mid=(lo+hi)>>1, n=R.nodes[V[mid]], m=posMetric(n, n.data.length-1); if(ge(m)){ ans=mid; hi=mid-1; } else lo=mid+1; }
  if(ans<0) return R.len;
  var node=R.nodes[V[ans]], a=0, b=node.data.length-1;
  while(a<b){ var md=(a+b)>>1, mm=posMetric(node, md); if(ge(mm)) b=md; else a=md+1; }
  return R.starts[V[ans]]+a;
}
function countPages(){
  if(S.mode!=='pages'){ R.pages=1; return; }
  var e=R.fd.getElementById('lz-end'), se=scroller();
  var x=e?e.getBoundingClientRect().left+se.scrollLeft:se.scrollWidth;
  R.pages=Math.max(1, Math.floor((x-1)/R.W)+1, 1);
  var sw=Math.ceil(se.scrollWidth/R.W); if(sw>R.pages && x<=0) R.pages=sw;
}
function wrapRange(o, n, mk){
  var end=o+n, out=[];
  if(!R.nodes.length||n<=0) return out;
  var na=nodeAt(o); if(!na) return out;
  for(var i=na.i;i<R.nodes.length && R.starts[i]<end;i++){
    var node=R.nodes[i], s=R.starts[i], a=Math.max(0,o-s), b=Math.min(node.data.length,end-s);
    if(b<=a) continue;
    if(!/\S/.test(node.data.slice(a,b)) && node.parentNode && /^(table|tbody|tr|ul|ol)$/i.test(node.parentNode.localName)) continue;
    var mid=node; if(a>0) mid=node.splitText(a); if(b-a<mid.data.length) mid.splitText(b-a);
    var el=mk(); mid.parentNode.insertBefore(el, mid); el.appendChild(mid); out.push(el);
    buildNodes();
    var nn=nodeAt(s+b); if(!nn) break; i=nn.i-1; if(R.starts[nn.i]>=end) break;
  }
  return out;
}
function unwrap(sel){
  var l=R.fd.querySelectorAll(sel);
  if(!l.length) return;
  Array.prototype.forEach.call(l,function(m){ var p=m.parentNode; while(m.firstChild) p.insertBefore(m.firstChild,m); p.removeChild(m); p.normalize(); });
  buildNodes();
}
function paintHls(){
  unwrap('mark.hl');
  (R.b.hl||[]).filter(function(h){ return h.s===R.s; }).forEach(function(h){
    wrapRange(h.o, h.n, function(){ var m=R.fd.createElement('mark'); m.className='hl c-'+h.c+(h.note?' nt':''); m.setAttribute('data-hl',h.id); return m; });
  });
}

async function render(s, target){
  var gen=++R.gen;
  $('rLoad').hidden=false;
  var ch;
  try{ ch=await chapter(R.ep, s); }catch(e){ console.error(e); toast('Chapitre illisible', true); ch={body:document.createElement('div'), css:'', cls:''}; }
  if(gen!==R.gen || !R.open) return;
  unwrapTts();
  R.s=s;
  var d=R.fd, c=d.getElementById('c');
  d.getElementById('bk').textContent=ch.css;
  d.documentElement.lang=ch.lang||R.b.lang||'fr';
  c.className=ch.cls||'';
  c.textContent='';
  Array.prototype.forEach.call(ch.body.childNodes,function(n){ c.appendChild(d.importNode(n,true)); });
  var end=d.createElement('span'); end.id='lz-end'; c.appendChild(end);
  d.getElementById('nxb').textContent=s<R.ep.spine.length-1?'Chapitre suivant':'Fin du livre';
  applyCss();
  buildNodes();
  R.text=c.textContent;
  paintHls();
  var imgs=Array.prototype.slice.call(c.querySelectorAll('img'));
  if(imgs.length) await Promise.race([Promise.all(imgs.map(function(im){ return im.decode?im.decode().catch(function(){}):Promise.resolve(); })), wait(1500)]);
  if(gen!==R.gen) return;
  await new Promise(function(r){ requestAnimationFrame(function(){ r(); }); });
  layoutTo(target||{o:0});
  $('rLoad').hidden=true;
}
function layoutTo(t){
  countPages();
  var se=scroller();
  if(S.mode==='pages'){
    var p=0;
    if(t.page==='last') p=R.pages-1;
    else if(t.page!=null) p=t.page;
    else if(t.frag){ var el=R.fd.getElementById(t.frag)||R.fd.querySelector('[name="'+t.frag.replace(/"/g,'')+'"]'); p=el?pageOfOffset(offsetOfNode(el)):0; }
    else if(t.o) p=pageOfOffset(t.o);
    R.page=clamp(p,0,R.pages-1);
    se.scrollLeft=R.page*R.W;
  } else {
    var y=0;
    if(t.page==='last') y=se.scrollHeight;
    else if(t.frag){ var el2=R.fd.getElementById(t.frag); y=el2?el2.getBoundingClientRect().top+se.scrollTop-10:0; }
    else if(t.o) y=pageOfOffset(t.o)-12;
    se.scrollTop=Math.max(0,y);
  }
  afterMove(t.keepO!=null?t.keepO:null);
}
function offsetOfNode(el){
  var r=R.fd.createRange(); r.setStart(R.fd.getElementById('c'),0);

}
function offsetOfPoint(node, off){

  try{ r.setEnd(node,off); }catch(e){ return 0; }
  return r.toString().length;
}
var posT=null;

function chapTitle(s){ var t=null; (R.ep.toc||[]).forEach(function(x){ if(x.s<=s && (!t || x.s>=t.s)) t=x; }); return t?t.l:''; }

async function next(){

/* Gestes dans la page */
function bindFrame(d){
  var x0=0,y0=0,sl0=0,drag=false,moved=false,t0=0,touching=false;
  d.addEventListener('touchstart',function(e){
    if(e.touches.length!==1) return;
    touching=true; moved=false; drag=false; x0=e.touches[0].clientX; y0=e.touches[0].clientY; t0=Date.now(); sl0=scroller().scrollLeft;
  },{passive:true});

    if(!touching||e.touches.length!==1) return;
    var dx=e.touches[0].clientX-x0, dy=e.touches[0].clientY-y0;
    if(Math.abs(dx)>8||Math.abs(dy)>8) moved=true;
    if(S.mode!=='pages' || hasSel()) return;
    if(!drag && Math.abs(dx)>12 && Math.abs(dx)>Math.abs(dy)*1.2) drag=true;
    if(drag){ e.preventDefault(); scroller().scrollLeft=sl0-dx; }
  },{passive:false});
  d.addEventListener('touchend',function(e){
    if(!touching) return; touching=false;
    var t=e.changedTouches[0], dx=t.clientX-x0, dy=t.clientY-y0;
    if(S.mode==='pages'){
      if(drag){ drag=false; var fast=Date.now()-t0<300&&Math.abs(dx)>30;
        if(dx<-R.W*0.18||(fast&&dx<0)){ if(R.page<R.pages-1) goPage(R.page+1); else { goPage(R.page); next(); } }
        else if(dx>R.W*0.18||(fast&&dx>0)){ if(R.page>0) goPage(R.page-1); else { goPage(R.page); prev(); } }
        else goPage(R.page);
        return;
      }
      if(hasSel()) setTimeout(function(){ scroller().scrollLeft=R.page*R.W; },0);
    } else if(!moved){ } else { clearTimeout(posT); posT=setTimeout(function(){ afterMove(); },250); }
    if(!moved && Math.abs(dy)>60 && Math.abs(dy)>Math.abs(dx)) {}
  },{passive:true});
  d.addEventListener('click',function(e){
    if(hasSel()) return;
    if(moved){ moved=false; return; }
    var m=e.target.closest&&e.target.closest('mark.hl'); if(m){ hlSheet(m.getAttribute('data-hl')); return; }
    var a=e.target.closest&&e.target.closest('a[data-href]'); if(a){ followLink(a.getAttribute('data-href')); return; }

/* Décalage du caractère touché (lecture à voix haute : partir de la phrase touchée) ; null hors du texte */
function tapOffset(e){
  try{
    var d=R.fd, r=null, node, off;
    if(d.caretRangeFromPoint){ r=d.caretRangeFromPoint(e.clientX,e.clientY); if(!r) return null; node=r.startContainer; off=r.startOffset; }
    else if(d.caretPositionFromPoint){ var cp=d.caretPositionFromPoint(e.clientX,e.clientY); if(!cp) return null; node=cp.offsetNode; off=cp.offset; }
    else return null;
    if(!node || node.nodeType!==3 || !d.getElementById('c').contains(node) || !/[\p{L}\p{N}]/u.test(node.data)) return null;
    var rr=d.createRange(); rr.setStart(node, Math.max(0,Math.min(off,node.data.length-1))); rr.setEnd(node, Math.min(node.data.length, Math.max(0,Math.min(off,node.data.length-1))+1));
    var b=rr.getBoundingClientRect(); if(!b || (Math.abs(b.left+b.width/2-e.clientX)>40) || (Math.abs(b.top+b.height/2-e.clientY)>40)) return null;

}

  var r=s.getRangeAt(0), c=R.fd.getElementById('c');

  $('selbar').hidden=false;

/* Recherche dans le livre */
var FIND={q:'', res:[]};
function findSheet(){
  var sh=openSheet('Chercher dans le livre','<div class="search" style="margin-top:0">'+I.search+'<input id="fq" placeholder="Mot ou expression" value="'+esc(FIND.q)+'" enterkeyhint="search"></div><div id="fres"></div>',{tall:true});
  var q=sh.querySelector('#fq'), out=sh.querySelector('#fres');
  setTimeout(function(){ q.focus(); },250);
  var draw=function(){
    if(FIND.busy){ out.innerHTML='<div class="spin"></div>'; return; }
    if(!FIND.q){ out.innerHTML=''; return; }
    if(!FIND.res.length){ out.innerHTML='<div class="empty">Aucun résultat pour « '+esc(FIND.q)+' ».</div>'; return; }
    out.innerHTML='<div class="sect" style="margin-top:4px"><span>'+FIND.res.length+(FIND.res.length>=300?'+':'')+' résultat'+(FIND.res.length>1?'s':'')+'</span></div>'+FIND.res.map(function(r,i){ return '<button class="li hit" data-i="'+i+'"><div class="t"><q style="font-family:inherit;font-size:14px">…'+esc(r.a)+'<b>'+esc(r.m)+'</b>'+esc(r.z)+'…</q><small>'+esc(r.ch||('Partie '+(r.s+1)))+'</small></div></button>'; }).join('');
  };
  var run=async function(){
    var v=q.value.trim(); FIND.q=v; FIND.res=[]; if(v.length<2){ draw(); return; }
    FIND.busy=true; draw();
    var norm=function(t){ return t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[’]/g,"'"); };
    var nq=norm(v), res=[];
    for(var s=0;s<R.ep.spine.length && res.length<300;s++){
      var t=await chapterText(R.ep,s), nt=norm(t);
      // la normalisation NFD peut changer la longueur : on garde la correspondance des positions
      var map=null; if(nt.length!==t.length){ map=[]; var acc=''; for(var k=0;k<t.length;k++){ var nk=norm(t[k]); for(var z=0;z<nk.length;z++) map.push(k); } map.push(t.length); }
      var i=nt.indexOf(nq);
      while(i>=0 && res.length<300){ var o=map?map[i]:i, e=map?map[Math.min(i+nq.length,map.length-1)]:i+nq.length; res.push({s:s, o:o, n:e-o, a:t.slice(Math.max(0,o-40),o).replace(/\s+/g,' ').replace(/^\S*\s/,''), m:t.slice(o,e), z:t.slice(e,e+60).replace(/\s+/g,' '), ch:chapTitle(s)}); i=nt.indexOf(nq,i+nq.length); }
      if(s%5===4) await tick();
    }
    FIND.res=res; FIND.busy=false; if(q.value.trim()===v) draw();
  };
  q.onkeydown=function(e){ if(e.key==='Enter'){ q.blur(); run(); } };
  out.onclick=function(e){ var b=e.target.closest('[data-i]'); if(!b) return; var r=FIND.res[+b.dataset.i]; closeThen(async function(){ showUi(false); await render(r.s,{o:r.o}); flash(r.o,r.n); }); };
  draw();
}
function flash(o,n){ var ms=wrapRange(o,n,function(){ var m=R.fd.createElement('mark'); m.className='hit'; return m; }); setTimeout(function(){ if(R.open) unwrap('mark.hit'); },2600); }

function cleanWord(w){ w=String(w).trim().replace(/[’]/g,"'"); var m=/^(?:l|d|j|m|n|s|t|c|qu|jusqu|lorsqu|puisqu)'(.+)$/i.exec(w); if(m) w=m[1]; return w.replace(/^[^\p{L}]+|[^\p{L}-]+$/gu,''); }
async function wikt(word){
  var t=await get('https://fr.wiktionary.org/w/api.php?action=parse&format=json&formatversion=2&redirects=1&prop=text&origin=*&page='+encodeURIComponent(word));
  var o=J(t,{}); if(!o.parse||!o.parse.text) return null;
  var d=xml(o.parse.text,'text/html'), out=[], inFr=false, cur=null;
  var els=d.querySelectorAll('h2,h3,h4,ol');
  for(var i=0;i<els.length;i++){
    var el=els[i], tag=el.tagName;
    if(tag==='H2'){ var id=(el.id||'')+' '+((el.querySelector('[id]')||{}).id||''); inFr=/Fran[cç]ais/.test(id)||/^\s*Français/.test(el.textContent); if(!inFr && out.length) break; continue; }
    if(!inFr) continue;
    if(tag==='H3'||tag==='H4'){ var tt=el.textContent.replace(/\[.*?\]/g,'').replace(/\d+$/,'').trim(); if(/Étymologie|Prononciation|Voir aussi|Références|Traductions|Anagrammes|Synonymes|Dérivés|Apparentés|Vocabulaire|Hyperonymes|Hyponymes|Variantes|Paronymes|Homophones|Taux|Quasi|Holonymes|Méronymes|Antonymes|Expressions|Proverbes|Note|Composés|Gentilés|Abréviations|Augmentatifs|Diminutifs|Faux|Phrases|Dérivés autres|Forme/i.test(tt)) cur=null; else { cur={pos:tt, defs:[]}; out.push(cur); } continue; }
    if(tag==='OL' && cur && !cur.defs.length){
      Array.prototype.forEach.call(el.children,function(li){ if(cur.defs.length>=4) return; var c=li.cloneNode(true); Array.prototype.forEach.call(c.querySelectorAll('ul,ol,dl,.reference,sup,style'),function(x){ x.remove(); }); var s=c.textContent.replace(/\s+/g,' ').trim(); if(s) cur.defs.push(s); });
    }
  }
  return out.filter(function(x){ return x.defs.length; }).slice(0,4);
}
async function define(raw){
  var w=cleanWord(raw);
  var sh=openSheet('Dictionnaire','<div class="def"><div class="w">'+esc(w)+'</div><div id="defb"><div class="spin"></div></div></div>');
  var box=sh.querySelector('#defb');
  try{
    var r=await wikt(w.toLowerCase());
    if((!r||!r.length) && w!==w.toLowerCase()) r=await wikt(w);
    if(!r||!r.length){ box.innerHTML='<div class="empty">Pas de définition trouvée sur le Wiktionnaire pour ce mot.</div>'; }
    else box.innerHTML=r.map(function(p){ return '<h4>'+esc(p.pos)+'</h4><ol>'+p.defs.map(function(d){ return '<li>'+esc(d)+'</li>'; }).join('')+'</ol>'; }).join('')+'<p class="note" style="margin-top:14px">Source : Wiktionnaire (CC BY-SA)</p>'+(A&&A.openUrl?'<div class="row"><button class="btn" id="wkOpen">'+I.open+'Voir la page complète</button></div>':'');
    var bo=box.querySelector('#wkOpen'); if(bo) bo.onclick=function(){ A.openUrl('https://fr.wiktionary.org/wiki/'+encodeURIComponent(w.toLowerCase())); };
  }catch(e){ box.innerHTML='<div class="empty" style="color:var(--bad)">'+esc(e.message||'Pas de connexion')+'<br><span style="color:var(--tx3)">Le dictionnaire a besoin d’Internet.</span></div>'; }
}

/* Textes des chapitres EPUB avec les débuts de blocs (paragraphes, titres) : mêmes décalages que la page affichée */
var BLOCK=/^(p|div|h[1-6]|li|blockquote|section|article|header|footer|aside|dt|dd|tr|td|th|pre|figure|figcaption|hr|br|table|ul|ol|dl|center|address|nav|main)$/i;
async function chapterInfo(ep, i){
  ep.info=ep.info||{};
  if(ep.info[i]) return ep.info[i];
  var d=await loadDoc(ep,i), body=cleanBody(d, ep.spine[i]), parts=[], br=[], pos=0;
  (function walk(n){
    for(var c=n.firstChild;c;c=c.nextSibling){
      if(c.nodeType===3||c.nodeType===4){ parts.push(c.data); pos+=c.data.length; }
      else if(c.nodeType===1){ if(BLOCK.test(c.localName)) br.push(pos); walk(c); if(BLOCK.test(c.localName)) br.push(pos); }
    }
  })(body);
  var text=parts.join('');
  ep.info[i]={text:text, breaks:br};
  return ep.info[i];
}

/* ---------- PDF : texte par page (sans en-têtes, pieds de page ni numéros), position de chaque caractère ---------- */
async function pdfLines(n){
  PV.lines=PV.lines||{};
  if(PV.lines[n]) return PV.lines[n];
  var pg=await PV.pdf.getPage(n), vp=pg.getViewport({scale:1}), tc=await pg.getTextContent(), W=vp.width, H=vp.height, lines=[], cur=null;
  tc.items.forEach(function(it){
    if(typeof it.str!=='string') return;
    var tr=pdfjsLib.Util.transform(vp.transform, it.transform), fh=Math.hypot(tr[2],tr[3])||Math.abs(it.height)||10, x=tr[4], y=tr[5], w=Math.abs(it.width||0);
    var r={str:it.str, x0:x/W, x1:(x+w)/W, y0:(y-fh)/H, y1:(y+fh*0.22)/H};
    if(!cur || Math.abs(y-cur.y)>fh*0.55){ cur={y:y, h:fh, items:[]}; lines.push(cur); }
    if(it.str) cur.items.push(r);
    if(it.hasEOL) cur=null;
  });
  lines=lines.filter(function(l){ return l.items.some(function(r){ return /\S/.test(r.str); }); });
  lines.forEach(function(l){ l.text=l.items.map(function(r){ return r.str; }).join(' ').replace(/\s+/g,' ').trim(); l.top=Math.min.apply(null,l.items.map(function(r){ return r.y0; })); l.bot=Math.max.apply(null,l.items.map(function(r){ return r.y1; })); l.x1=Math.max.apply(null,l.items.map(function(r){ return r.x1; })); l.y/=H; l.h/=H; });
  return (PV.lines[n]=lines);
}
function hfKey(t){ return t.toLowerCase().replace(/\d+/g,'#').replace(/\s+/g,' ').trim(); }
async function pdfPageText(n){
  PV.tx=PV.tx||{};
  if(PV.tx[n]) return PV.tx[n];
  var lines=await pdfLines(n), near={};
  for(var k=n-2;k<=n+2;k++) if(k!==n && k>=1 && k<=PV.n){ try{ (await pdfLines(k)).forEach(function(l){ if(l.top<0.1||l.bot>0.9) near[hfKey(l.text)]=(near[hfKey(l.text)]||0)+1; }); }catch(e){} }
  // en-têtes et pieds : ligne courte en haut ou en bas de page, numéro seul, ou texte répété sur les pages voisines
  var keep=lines.filter(function(l){
    var edge=l.top<0.085||l.bot>0.925; if(!edge || l.text.length>90) return true;
    if(/^[\s\-–—|.·•]*(?:page\s*)?(?:\d{1,4}|[ivxlcdm]{1,7})(?:\s*(?:\/|sur|of)\s*\d{1,4})?[\s\-–—|.·•]*$/i.test(l.text)) return false;
    return !near[hfKey(l.text)];
  });
  var text='', map=[], rects=[], first=[], br=[], wmax=0;
  keep.forEach(function(l){ wmax=Math.max(wmax,l.x1); });
  keep.forEach(function(l, li){
    var prev=keep[li-1];
    if(prev){
      var gap=l.top-prev.bot, hy=/[\p{L}]-$/u.test(text) && /^\p{Ll}/u.test(l.text);
      if(hy){ text=text.slice(0,-1); map.pop(); }
      else { text+=' '; map.push(-1); }
      if(gap>prev.h*0.9 || (/[.!?:»”]$/.test(prev.text) && prev.x1<wmax*0.8)) br.push(text.length);
    }
    l.items.forEach(function(r, j){
      if(!r.str) return;
      if(j>0 && !/\s$/.test(text) && !/^\s/.test(r.str)){ var pr=l.items[j-1]; if(r.x0-pr.x1>0.004){ text+=' '; map.push(-1); } }
      var id=rects.length; rects.push(r); first.push(text.length);
      for(var c=0;c<r.str.length;c++){ map.push(id); }
      text+=r.str;
    });
  });
  return (PV.tx[n]={text:text, breaks:br, map:map, rects:rects, first:first});
}
function pdfHlRects(n, o, len){
  var t=PV.tx&&PV.tx[n]; if(!t) return [];
  var out=[], seg=null;
  for(var k=o;k<o+len && k<t.map.length;k++){
    var id=t.map[k]; if(id<0) continue;
    if(seg && seg.id===id){ seg.b=k; continue; }
    seg={id:id, a:k, b:k}; out.push(seg);
  }
  return out.map(function(g){ var r=t.rects[g.id], L=r.str.length||1, a=g.a-t.first[g.id], b=g.b-t.first[g.id]+1, w=r.x1-r.x0; return {x0:r.x0+w*a/L, x1:r.x0+w*b/L, y0:r.y0, y1:r.y1}; });
}
function pdfDrawHl(n){
  document.querySelectorAll('.pg .tth').forEach(function(e){ e.remove(); });
  var it=T.cur; if(!T.on||T.kind!=='pdf'||!it||it.s+1!==n) return null;
  var el=document.querySelector('.pg[data-p="'+n+'"]'); if(!el) return null;
  var rs=pdfHlRects(n,it.o,it.n), top=1;
  rs.forEach(function(r){ var d=document.createElement('div'); d.className='tth'; d.style.left=(r.x0*100)+'%'; d.style.top=(r.y0*100)+'%'; d.style.width=Math.max(0.2,(r.x1-r.x0)*100)+'%'; d.style.height=((r.y1-r.y0)*100)+'%'; el.appendChild(d); top=Math.min(top,r.y0); });
  return rs.length?{el:el, top:top}:null;
}
function pdfShowSentence(){

/* Toucher le texte d'une page PDF pendant la lecture : la lecture part de là */
$('pPages').addEventListener('click',function(e){

/* ---------- Media Session du navigateur (PC) : touches multimédia du clavier, contrôles de Windows ---------- */
function webMedia(on){
  if(NATIVE || !('mediaSession' in navigator)) return;
  var ms=navigator.mediaSession, h=function(k,f){ try{ ms.setActionHandler(k, on?f:null); }catch(e){} };
  h('play',function(){ if(AUD) AUD.resume(); }); h('pause',function(){ if(AUD) AUD.pause(); }); h('stop',function(){ stopTts(); });
  h('previoustrack',function(){ if(AUD) AUD.prev(); }); h('nexttrack',function(){ if(AUD) AUD.next(); });
  h('seekbackward',function(){ if(AUD) AUD.prevCh(); }); h('seekforward',function(){ if(AUD) AUD.nextCh(); });
  if(!on){ try{ ms.playbackState='none'; ms.metadata=null; }catch(e){} return; }
  webMediaMeta(); webMediaState();
}
function webMediaMeta(){ if(NATIVE || !('mediaSession' in navigator) || !window.MediaMetadata || !T.book) return; try{ var b=T.book; navigator.mediaSession.metadata=new MediaMetadata({title:curLabel()||b.title, artist:shortAuthor(b.author||''), album:b.title, artwork:b.thumb?[{src:b.thumb, sizes:'120x180', type:'image/jpeg'}]:[]}); }catch(e){} }
function webMediaState(){ if(NATIVE || !('mediaSession' in navigator)) return; try{ navigator.mediaSession.playbackState=!T.on?'none':(T.state==='pause'||T.state==='stop')?'paused':'playing'; }catch(e){} }

/* ---------- Commandes venues d'ailleurs : Jarvis (Majordome), tuile Socle, notification, autre fenêtre (PC) ---------- */
function normT(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[’']/g,' ').replace(/[^a-z0-9 ]/g,' ').replace(/\b(le|la|les|l|un|une|des|du|de|d)\b/g,' ').replace(/\s+/g,' ').trim(); }
function findBook(q){
  var n=normT(q); if(!n) return null;
  var best=null, bs=0;
  BOOKS.forEach(function(b){
    var t=normT(b.title), a=normT(b.author), sc=0;
    if(t===n) sc=100; else if(t.indexOf(n)===0) sc=80; else if(t.indexOf(n)>=0) sc=60;
    else { var w=n.split(' ').filter(function(x){ return x.length>1; }), hit=w.filter(function(x){ return (' '+t+' '+a+' ').indexOf(' '+x+' ')>=0; }).length; if(w.length && hit===w.length) sc=40; else if(w.length>1 && hit>=w.length-1 && (' '+t+' ').indexOf(' '+w[0]+' ')>=0) sc=20; }
    if(sc && (b.opened||0)>(best&&best.opened||0)) sc+=1;
    if(sc>bs){ bs=sc; best=b; }
  });
  return best;
}
async function openAndListen(b){
  if(T.on && T.book===b){ if(AUD) AUD.resume(); return; }
  var t=b.tts, from=t?{s:t.s,o:t.o}:null;
  if((R.open && R.b===b) || (PV.open && PV.b===b)){ startTts(from); return; }
  await new Promise(function(res){ closeAllThen(function(){ res(); }); });
  if(T.on) stopTts(true);
  await openBook(b);
  for(var k=0;k<80 && !((R.open&&R.b===b&&R.ep&&R.fd&&$('rLoad').hidden)||(PV.open&&PV.b===b&&PV.n));k++) await wait(100);
  if(!from && b.kind==='pdf'){ var cp=b.pos||{page:1}; from={s:(cp.page||1)-1, o:0}; }
  startTts(from);
}
async function audioCmd(o){
  var c=o.audio, src=o.src||'';
  if(src==='majordome' && /^(read|resume|play|toggle)$/.test(c)) await wait(1400);   // Majordome finit sa réponse
  if(c==='toggle'){ if(T.on){ AUD.toggle(); return true; } c='read'; }
  if(c==='pause'){ if(!T.on) return false; AUD.pause(); return true; }
  if(c==='stop'){ if(!T.on) return false; stopTts(); return true; }
  if(c==='next'){ if(!T.on) return false; AUD.next(); return true; }
  if(c==='prev'){ if(!T.on) return false; AUD.prev(); return true; }
  if(c==='nextch'){ if(!T.on) return false; return AUD.nextCh(); }
  if(c==='prevch'){ if(!T.on) return false; return AUD.prevCh(); }
  if(c==='sleep'){ if(!T.on) return false; return setSleep(o.chap?{chap:true}:o.min>0?{min:+o.min}:null); }
  if(c==='read'||c==='resume'||c==='play'){
    if(T.on && !o.title){ if(T.state==='pause'||T.state==='stop') AUD.resume(); return true; }
    var b=o.title?findBook(o.title):bookById(L.last);
    if(!b){ toast(o.title?'Aucun livre « '+o.title+' » dans ta bibliothèque':'Aucun livre en cours', true); return false; }
    await openAndListen(b);
    if(o.min>0) setSleep({min:+o.min});
    return true;
  }
  return false;
}
window.LiseuseAudio={ player:function(){ return AUD; }, state:function(){ return T; }, cmd:audioCmd, voice:voiceId, engine:vxEngine, start:startTts, stop:stopTts };   // commandes et essais
var LCH=null; try{ LCH=window.BroadcastChannel && window.MAGPC ? new BroadcastChannel('mag-liseuse') : null; }catch(e){}
if(LCH) LCH.onmessage=function(e){ var d=e.data||{}; if(!d.audio) return; audioCmd(d).then(function(ok){ LCH.postMessage({ack:d.id, ok:!!ok}); }, function(){ LCH.postMessage({ack:d.id, ok:false}); }); };
function nativeAudio(o){
  if(o.ev==='cmd'){ audioCmd(J(o.arg,{})||{audio:o.cmd}); return; }
  if(AUD) AUD.native(o);
}
/* Position mémorisée par le lecteur natif pendant que la page dormait (écran éteint) : reprise exacte */
function nativePos(){
  if(!(A && A.audioPos)) return;
  var p=J(A.audioPos(),null); if(!p||!p.book) return;
  var b=bookById(p.book); if(!b) return;
  if(!b.tts || (p.at||0)>(b.tts.at||0)){ b.tts={s:p.s, o:p.o, at:p.at}; if(b.kind==='pdf') b.pos={page:p.s+1, f:0}; else b.pos={s:p.s, o:p.o}; saveBook(b,true); }
}

/* =========================================================
   Lecteur PDF
   ========================================================= */
var PV={open:false};
var ZOOMS=[0.6,0.8,1,1.25,1.5,2,2.5,3];
async function openPdf(b){
  var rec=await dbGet('files', b.id);
  if(!rec){ toast('Fichier du livre introuvable', true); return; }
  if(T.on) stopTts(true);
  PV={open:true, b:b, zoom:b.zoom||1, pages:[], rendering:{}};
  $('pdfv').hidden=false; document.body.classList.add('rd'); $('pTitle').textContent=b.title; $('pSub').textContent='Chargement…'; $('pPages').innerHTML='<div class="spin" style="border-color:#888;border-right-color:transparent"></div>';
  pushNav(closePdf);
  L.last=b.id; L.openId=b.id; saveL(); b.opened=Date.now(); saveBook(b);
  if(P && P.keepScreen) try{ P.keepScreen(true); }catch(e){}
  try{
    var pdf=await pdfOpen(rec.data.slice(0));
    if(!PV.open||PV.b!==b){ try{ pdf.destroy(); }catch(e){} return; }
    PV.pdf=pdf; PV.n=pdf.numPages;
    if(b.pages!==pdf.numPages){ b.pages=pdf.numPages; saveBook(b); }
    var p1=await pdf.getPage(1); var v=p1.getViewport({scale:1});
    PV.ratio=v.height/v.width; PV.sizes={};
    $('pSub').textContent=PV.n+' pages';
    pdfLayout();
    var pos=b.pos||{page:1,f:0};
    pdfGo(pos.page||1, pos.f||0);
  }catch(e){ console.error(e); $('pPages').innerHTML='<div class="empty" style="color:#ddd">Ce PDF ne peut pas être ouvert.<br><small>'+esc(e.message||'')+'</small></div>'; }
}
function pdfW(){ return Math.round(Math.min(window.innerWidth-16, 900)*PV.zoom); }
function pdfLayout(){
  var w=pdfW(), h='';
  for(var i=1;i<=PV.n;i++){ var r=PV.sizes[i]||PV.ratio; h+='<div class="pg" data-p="'+i+'" style="width:'+w+'px;height:'+Math.round(w*r)+'px"><i>'+i+'</i></div>'; }
  var pp=$('pPages'); pp.style.width=(w+16)+'px'; pp.innerHTML=h; PV.rendering={};
  $('pZoom').textContent=Math.round(PV.zoom*100)+' %';
  if(PV.io) PV.io.disconnect();
  PV.io=new IntersectionObserver(function(es){ es.forEach(function(e){ var n=+e.target.dataset.p; if(e.isIntersecting) pdfRender(n, e.target); }); },{root:$('pScroll'), rootMargin:'800px 0px'});
  pp.querySelectorAll('.pg').forEach(function(d){ PV.io.observe(d); });
}
async function pdfRender(n, el){
  if(PV.rendering[n]) return; PV.rendering[n]=1;
  try{
    var pg=await PV.pdf.getPage(n); if(!PV.open) return;
    var v1=pg.getViewport({scale:1}); var r=v1.height/v1.width;
    if(Math.abs((PV.sizes[n]||PV.ratio)-r)>0.01){ PV.sizes[n]=r; el.style.height=Math.round(parseFloat(el.style.width)*r)+'px'; }
    var cssW=parseFloat(el.style.width), dpr=Math.min(window.devicePixelRatio||1, 3), scale=Math.min(cssW*dpr/v1.width, 4096/v1.width);
    var vp=pg.getViewport({scale:scale}), cv=document.createElement('canvas'); cv.width=Math.round(vp.width); cv.height=Math.round(vp.height);
    var ctx=cv.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height);
    await pg.render({canvasContext:ctx, viewport:vp}).promise;
    if(!PV.open||!el.isConnected) return;
    el.innerHTML=''; el.appendChild(cv);
    if(T.on && T.kind==='pdf' && T.cur && T.cur.s+1===n) pdfDrawHl(n);
    // libérer les pages éloignées
    var cur=PV.cur||1; Object.keys(PV.rendering).forEach(function(k){ if(Math.abs(k-cur)>6){ var d=document.querySelector('.pg[data-p="'+k+'"]'); if(d){ d.innerHTML='<i>'+k+'</i>'; } delete PV.rendering[k]; } });
  }catch(e){ delete PV.rendering[n]; }
}
function pdfGo(page, f){
  var el=document.querySelector('.pg[data-p="'+clamp(page,1,PV.n)+'"]'); if(!el) return;
  $('pScroll').scrollTop=el.offsetTop-10+(f||0)*el.offsetHeight;
  pdfTrack();
}
function pdfCurPos(){
  var sc=$('pScroll'), y=sc.scrollTop+10, els=$('pPages').children, lo=0, hi=els.length-1;
  while(lo<hi){ var mid=(lo+hi+1)>>1; if(els[mid].offsetTop<=y) lo=mid; else hi=mid-1; }
  var el=els[lo]; if(!el||!el.dataset.p) return {page:1,f:0};
  return {page:+el.dataset.p, f:clamp((y-el.offsetTop)/el.offsetHeight,0,1)};
}
var pdfT=null;
function pdfTrack(){
  if(!PV.open||!PV.n) return;
  var p=pdfCurPos(); PV.cur=p.page;
  $('pInd').textContent=p.page+' / '+PV.n;
  clearTimeout(pdfT); pdfT=setTimeout(function(){ var b=PV.b; b.pos=p; b.pct=PV.n>1?clamp((p.page-1+p.f)/(PV.n-1),0,1):1; if(p.page===PV.n) b.pct=1; if(b.pct>=0.999) b.done=true; b.zoom=PV.zoom; saveBook(b); },300);
}
$('pScroll').addEventListener('scroll',pdfTrack,{passive:true});
function pdfZoom(z, cx, cy){
  if(!PV.n) return;
  var sc=$('pScroll'), old=PV.zoom; z=clamp(z,0.5,3);
  if(Math.abs(z-old)<0.01) return;
  cx=cx==null?sc.clientWidth/2:cx; cy=cy==null?sc.clientHeight/2:cy;
  var fx=(sc.scrollLeft+cx)/sc.scrollWidth, pos=pdfCurPos();
  PV.zoom=z; pdfLayout();
  pdfGo(pos.page,pos.f);
  sc.scrollLeft=fx*sc.scrollWidth-cx;
}
$('pIn').onclick=function(){ var z=ZOOMS.filter(function(x){ return x>PV.zoom+0.01; })[0]; if(z) pdfZoom(z); };
$('pOut').onclick=function(){ var z=ZOOMS.filter(function(x){ return x<PV.zoom-0.01; }).pop(); if(z) pdfZoom(z); };
$('pBack').onclick=function(){ back(); };
$('pInd').onclick=function(){
  if(!PV.n) return;
  var sh=openSheet('Aller à la page','<input class="inp" id="gp" type="number" inputmode="numeric" min="1" max="'+PV.n+'" placeholder="1 à '+PV.n+'"><div class="row" style="margin-top:12px"><button class="btn main" id="gpOk">Aller</button></div>');
  var i=sh.querySelector('#gp'); setTimeout(function(){ i.focus(); },250);
  var go=function(){ var n=parseInt(i.value,10); if(n>=1&&n<=PV.n) closeThen(function(){ pdfGo(n,0); }); };
  sh.querySelector('#gpOk').onclick=go; i.onkeydown=function(e){ if(e.key==='Enter') go(); };
};
(function(){ // pincer pour zoomer
  var sc=$('pScroll'), d0=0, z0=1, mid=null;
  sc.addEventListener('touchstart',function(e){ if(e.touches.length===2){ d0=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY); z0=PV.zoom; var r=sc.getBoundingClientRect(); mid={x:(e.touches[0].clientX+e.touches[1].clientX)/2-r.left, y:(e.touches[0].clientY+e.touches[1].clientY)/2-r.top}; } },{passive:true});
  sc.addEventListener('touchmove',function(e){ if(e.touches.length===2&&d0){ e.preventDefault(); var d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY); var k=d/d0; $('pPages').style.transform='scale('+k+')'; $('pPages').style.transformOrigin=(sc.scrollLeft+mid.x)+'px '+(sc.scrollTop+mid.y)+'px'; sc._k=k; } },{passive:false});
  sc.addEventListener('touchend',function(e){ if(d0&&e.touches.length<2){ var k=sc._k||1; d0=0; sc._k=1; $('pPages').style.transform=''; pdfZoom(z0*k, mid.x, mid.y); } },{passive:true});
})();
function closePdf(){
  if(!PV.open) return;
  pdfTrack(); clearTimeout(pdfT); var b=PV.b, p=pdfCurPos(); if(PV.n){ b.pos=p; b.pct=PV.n>1?clamp((p.page-1+p.f)/(PV.n-1),0,1):1; b.zoom=PV.zoom; saveBook(b,true); }
  if(T.on) stopTts(true);
  PV.open=false; if(PV.io) PV.io.disconnect(); try{ PV.pdf&&PV.pdf.destroy(); }catch(e){}
  $('pdfv').hidden=true; document.body.classList.remove('rd'); $('pPages').innerHTML='';
  L.openId=''; saveL();
  if(P && P.keepScreen) try{ P.keepScreen(false); }catch(e){}
  if(tab==='lib') viewLib();
}
window.addEventListener('resize',function(){ if(PV.open&&PV.n){ clearTimeout(PV.rz); PV.rz=setTimeout(function(){ var p=pdfCurPos(); pdfLayout(); pdfGo(p.page,p.f); },250); } });

/* =========================================================
   Démarrage
   ========================================================= */
document.addEventListener('visibilitychange',function(){ if(document.hidden){ if(R.open) savePos(true); if(PV.open) pdfTrack(); publish(); } });

async function start(){
  try{ setBooks(await dbAll('books')); }catch(e){ BOOKS=[]; toast('Stockage indisponible', true); }
  try{ nativePos(); }catch(e){}
  // la page a été rechargée pendant une lecture (Android) : on rouvre le livre et on reprend à la phrase en cours
  var nst=null; try{ nst=NATIVE&&A.audioState?J(A.audioState(),null):null; }catch(e){}
  var reattach=nst && nst.open && nst.book && bookById(nst.book);
  switchTab('lib');
  try{ if(A && A.cleanup) A.cleanup(); }catch(e){}
  var pend=''; try{ if(A && A.pending) pend=A.pending(); }catch(e){}
  if(pend){ onFiles(J(pend,{})); }
  else if(reattach){ var nb=bookById(nst.book); openAndListen(nb).then(function(){ if(nst.paused&&AUD) AUD.pause(); }); }
  else if(L.openId){ var b=bookById(L.openId); if(b) openBook(b); }   // l'appli avait été fermée pendant la lecture
  setTimeout(function(){ publish(); try{ if(P && P.takeSocle){ var x=P.takeSocle(); if(x) window.onSocle(x); } }catch(e){} },600);
  // nouveaux livres des dossiers suivis
  setTimeout(backfill, 2500);   // genres, séries… des livres importés avant cette version
  setTimeout(function(){ if((L.dirs||[]).length) scanDirs().then(function(n){ if(n){ if(tab==='lib' && !R.open){ var y=window.scrollY; viewLib(); window.scrollTo(0,y); } } }); },1500);
}
start();
})();
