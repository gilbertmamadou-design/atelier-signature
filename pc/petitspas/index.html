function themesOf(txt){ const n=" "+norm(txt)+" "; if(EXCL.some(x=>n.includes(x))) return [];
  return themesOn().filter(k=>THM[k]&&THM[k][3].some(w=>new RegExp("(^|[^a-z0-9])"+reEsc(w)+"([^a-z0-9]|$)").test(n))); }
const docsOf=ths=>{ const ok=new Set(docsShown().map(d=>d[0])); return [...new Set((ths||[]).flatMap(k=>THM[k]?THM[k][4]:[]))].filter(d=>ok.has(d)); };
const incRe=()=>"(^|[^a-z0-9])("+themesOn().flatMap(k=>THM[k]?THM[k][3]:[]).map(reEsc).join("|")+")([^a-z0-9]|$)";

/* ================= Recherche des nouveaux textes ================= */
async function getText(url){
  if(MP&&MP.httpFetch){ const k="g"+uid(); MP.httpFetch(k,url);
    for(let i=0;i<60;i++){ await new Promise(r=>setTimeout(r,500)); const r=MP.httpTake(k); if(r!=null&&r!=="__wait__") return r==="__err__"?null:r; } return null; }
  try{ const r=await fetch(url,{cache:"no-store"}); return r.ok?await r.text():null; }catch(e){ return null; }
}
function parseFeed(xml,feed){
  const out=[]; let doc; try{ doc=new DOMParser().parseFromString(xml,"text/xml"); }catch(e){ return out; }
  const tx=(el,sel)=>{ const x=el.getElementsByTagName(sel)[0]; return x?x.textContent.trim():""; };
  const strip=h=>String(h||"").replace(/<[^>]+>/g," ").replace(/&nbsp;/g," ").replace(/\s+/g," ").trim();
  [...doc.getElementsByTagName("entry")].forEach(e=>{ const l=e.getElementsByTagName("link")[0], link=l?(l.getAttribute("href")||l.textContent):"";
    out.push({id:tx(e,"id")||link,title:tx(e,"title"),link,date:(tx(e,"updated")||tx(e,"published")).slice(0,10),src:feed.name.split(" · ")[0],author:tx(e,"name"),sum:strip(tx(e,"summary")).slice(0,500)}); });
  [...doc.getElementsByTagName("item")].forEach(e=>{ const link=tx(e,"link"), d=tx(e,"pubDate")||tx(e,"dc:date")||tx(e,"date"), dt=d?new Date(d):null;
    out.push({id:tx(e,"guid")||link,title:tx(e,"title"),link,date:dt&&!isNaN(dt)?dt.toISOString().slice(0,10):"",src:feed.name.split(" · ")[0],author:"",sum:strip(tx(e,"description")).slice(0,500)}); });
  return out.filter(x=>x.title&&x.link);
}
async function resolveAuthor(f){ if(!f.key) return null; const t=await getText("https://legifrss.org/authors"); if(!t) return null;
  const names=[...new Set((t.match(/Minist[eè]re[^<>"\n\r]{3,170}/g)||[]).map(s=>s.trim()))]; const hit=names.find(n=>norm(n).includes(norm(f.key))); return hit?LGF+"?author="+encodeURIComponent(hit):null; }
let busy=false, prog="";
async function refresh(manual){
  if(busy) return; busy=true; prog="Connexion aux sources…"; rerender();
  const known=new Map(D.items.map(x=>[x.id,x])), first=!D.last; let added=0, ok=0; const fs=feedsOn();
  for(let i=0;i<fs.length;i++){ const f=fs[i]; prog=`Source ${i+1} / ${fs.length} : ${f.name}`; paintProg();
    let xml=await getText(f.url), items=xml?parseFeed(xml,f):null;
    if((!items||!items.length)&&f.key){ const u=await resolveAuthor(f); if(u&&u!==f.url){ xml=await getText(u); items=xml?parseFeed(xml,f):null; if(items&&items.length) D.fixed[f.id]=u; } }
    if(!items) continue; ok++;
    for(const it of items){ if(known.has(it.id)) continue; const th=themesOf(it.title+" "+(f.id.startsWith("sp-")?it.sum:"")); if(!th.length) continue;
      it.themes=th; it.status=(first&&it.date&&daysTo(it.date)<-14)?"lu":"new"; it.found=Date.now(); known.set(it.id,it); added++; }
  }
  D.items=[...known.values()].filter(x=>x.status==="suivi"||x.status==="new"||!x.date||daysTo(x.date)>-365).sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,800);
  if(ok) D.last=Date.now(); busy=false; save(); syncNative(); badges();
  if(manual) toast(ok?(added?`${added} nouveau(x) texte(s) pour la petite enfance`:"Rien de nouveau sur vos thèmes"):(MP&&!(window.MAGPC&&!MAGPC.net.proxy())?"Pas de connexion : réessayez plus tard":"La recherche automatique fonctionne dans l'application Android : la version en ligne ne peut pas lire les sources officielles (sur PC : relais réseau, voir le lanceur Suite MAG)."),4000);
  rerender();
}
function paintProg(){ const e=$("#prog"); if(e) e.textContent=prog; }
function takeNative(){ if(!(MP&&MP.veilleTake)) return; try{ const a=JSON.parse(MP.veilleTake()||"[]"); if(!a.length) return; const known=new Set(D.items.map(x=>x.id));
  a.forEach(it=>{ if(known.has(it.id)) return; const th=themesOf(it.title); if(!th.length) return; D.items.unshift({...it,themes:th,status:"new",found:Date.now()}); }); save(); }catch(e){} }
function syncNative(){ if(!(MP&&MP.veilleSetup)) return; try{ MP.veilleSetup(JSON.stringify({on:D.notif!==false,feeds:feedsOn().map(f=>f.url),inc:incRe(),exc:excRe(),seen:D.items.map(x=>x.id).slice(0,2000)})); }catch(e){} }

function share(x){ const txt=`${x.title}\n${x.src}${x.date?" – "+fmtDate(x.date):""}\n${x.link}`;
  if(navigator.share){ navigator.share({title:"Petite enfance : nouveau texte",text:txt}).catch(()=>{}); return; }
  const ov=sheet(`<h2>Partager ce texte</h2><a class="btn block p" href="mailto:?subject=${encodeURIComponent("Petite enfance : "+x.title.slice(0,80))}&body=${encodeURIComponent(txt)}">✉️ Envoyer par e-mail</a><a class="btn block g" href="https://wa.me/?text=${encodeURIComponent(txt)}" target="_blank" rel="noopener">💬 WhatsApp</a><button class="btn block" data-c>📋 Copier</button><button class="btn block" data-x>Fermer</button>`);
  ov.querySelector("[data-c]").onclick=async()=>{ try{ await navigator.clipboard.writeText(txt); toast("Copié"); }catch(e){ toast("Copie impossible"); } ov.remove(); };
  ov.querySelector("[data-x]").onclick=()=>ov.remove(); }
function sheet(html){ const ov=document.createElement("div"); ov.className="ov"; ov.innerHTML=`<div class="sheet stack">${html}</div>`; ov.onclick=e=>{ if(e.target===ov) ov.remove(); }; document.body.appendChild(ov); return ov; }
function rFeed(){
  const q=norm(S.q), f=S.flt, th=S.th;
  const st=k=>x=>k==="all"?x.status!=="archive":k==="new"?x.status==="new":k==="suivi"?x.status==="suivi":x.status==="archive";
  const L=D.items.filter(x=>st(f)(x)&&(!th||(x.themes||[]).includes(th))&&(!q||norm(x.title+" "+x.sum).includes(q)));
  const used=themesOn().filter(k=>D.items.some(x=>(x.themes||[]).includes(k)));
  app.innerHTML=`<div class="stack"><div><div class="lab">Journal officiel et actualités</div><h1>Nouveautés</h1></div>
    ${statusBox()}
    <input type="search" id="q" placeholder="🔎 Rechercher (vaccins, micro-crèche, CMG…)" value="${esc(S.q)}">
    <div class="row">${[["new","À lire"],["all","Tout"],["suivi","Suivis"],["archive","Archivés"]].map(([k,l])=>`<button class="fc ${f===k?"on":""}" data-f="${k}">${l}<b>${D.items.filter(st(k)).length}</b></button>`).join("")}</div>
    ${used.length>1?`<div class="scr"><button class="fc ${!th?"on":""}" data-th="">Tous thèmes</button>${used.map(k=>`<button class="fc ${th===k?"on":""}" data-th="${k}">${THM[k][1]} ${esc(THM[k][2])}</button>`).join("")}</div>`:""}
    ${f==="new"&&L.length>1?`<button class="btn s" id="allRead" style="align-self:flex-start">✓ Tout marquer comme lu</button>`:""}
    ${L.length?L.slice(0,200).map(itemHTML).join(""):`<div class="notice">${f==="new"?(D.last?"Rien de nouveau à lire. 👍":"Cliquez sur « Actualiser » pour lancer la première recherche."):"Aucun texte ici."}</div>`}
    <p class="foot">Sources : Journal officiel (via legifrss.org, relais non officiel de Légifrance) et Service-public, filtrés sur la petite enfance.</p></div>`;
  wireStatus(); wireItems();
  let qt; $("#q").addEventListener("input",e=>{ S.q=e.target.value; clearTimeout(qt); qt=setTimeout(()=>{ const p=e.target.selectionStart; rFeed(); const i=$("#q"); i.focus(); try{i.setSelectionRange(p,p)}catch(_){} },350); });
  app.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{ S.flt=b.dataset.f; rFeed(); });
  app.querySelectorAll("[data-th]").forEach(b=>b.onclick=()=>{ S.th=b.dataset.th; rFeed(); });
  if($("#allRead")) $("#allRead").onclick=()=>{ D.items.forEach(x=>{ if(x.status==="new") x.status="lu"; }); save(); badges(); rFeed(); };
}

function parcoursSVG(st,big){ const n=Math.max(1,st.length), W=360, H=big?200:180;
  const pts=st.map((_,i)=>{ const t=n===1?.5:i/(n-1); return [30+t*(W-60), (H*.55)+Math.sin(t*Math.PI*2)*(H*.22)]; });

  return `<svg viewBox="0 0 ${W} ${H}" class="art" role="img" aria-label="Animation du parcours"><defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF6EC"/><stop offset="1" stop-color="#EAF7F4"/></linearGradient></defs><rect width="${W}" height="${H}" fill="url(#pg)"/>
    <path d="${d}" fill="none" stroke="#EAD6C0" stroke-width="16" stroke-linecap="round"/><path d="${d}" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/>

/* ---- Mode présentation : étapes en grand, défilement automatique ---- */
function present(title,artHTML,steps,tip){
  const ov=document.createElement("div"); ov.className="pres";
  let i=-1, play=true, tm=null; const N=steps.length;
  const draw=()=>{ ov.innerHTML=`<div class="pres-top"><b>${esc(title)}</b><button data-q aria-label="Fermer">✕</button></div>
      <div class="pres-bar"><i style="width:${Math.round((i+1)/(N+1)*100)}%"></i></div>
      <div class="pres-body">${i<0?`<div class="pres-art">${artHTML}</div><h2>${esc(title)}</h2><p>${esc(tip||"")}</p>`:`<div class="pres-art sm">${artHTML}</div><div class="pres-num">${i+1}<small>/${N}</small></div><p class="pres-txt">${esc(steps[i])}</p>`}</div>
      <div class="pres-nav"><button data-p ${i<0?"disabled":""}>‹</button><button data-pl>${play?"⏸":"▶"}</button><button data-n ${i>=N-1?"disabled":""}>›</button></div>`;
    ov.querySelector("[data-q]").onclick=close; ov.querySelector("[data-p]").onclick=()=>{ i=Math.max(-1,i-1); restart(); }; ov.querySelector("[data-n]").onclick=()=>{ i=Math.min(N-1,i+1); restart(); }; ov.querySelector("[data-pl]").onclick=()=>{ play=!play; restart(); }; };
  const restart=()=>{ clearTimeout(tm); draw(); if(play&&i<N-1) tm=setTimeout(()=>{ i++; restart(); }, i<0?4000:7000); };
  const close=()=>{ clearTimeout(tm); ov.remove(); if(MP&&MP.keepScreen) try{ MP.keepScreen(false); }catch(e){} };
  let x0=null; ov.addEventListener("touchstart",e=>{ x0=e.touches[0].clientX; },{passive:true}); ov.addEventListener("touchend",e=>{ if(x0==null) return; const dx=e.changedTouches[0].clientX-x0; x0=null; if(Math.abs(dx)>60){ i=dx<0?Math.min(N-1,i+1):Math.max(-1,i-1); restart(); } });
  document.body.appendChild(ov); if(MP&&MP.keepScreen) try{ MP.keepScreen(true); }catch(e){} restart(); return ov; }

<script>/* Application Android : impression (MAGPrint.printHtml), et fichiers téléchargés -> menu Android (enregistrer dans un dossier, e-mail, partager, imprimer) */
(function(){if(!window.MAGPrint)return;var MP=window.MAGPrint;

function snap(win){var doc=win.document,d=doc.documentElement.cloneNode(true);fixForms(doc.documentElement,d);d.querySelectorAll("script").forEach(function(s){s.remove()});
  doc.querySelectorAll("canvas").forEach(function(c,i){try{var img=d.querySelectorAll("canvas")[i];if(img){var im=doc.createElement("img");im.src=c.toDataURL("image/png");im.style.cssText="max-width:100%";img.replaceWith(im)}}catch(e){}});

function toB64(blob){return new Promise(function(ok,ko){var r=new FileReader();r.onload=function(){var x=String(r.result);ok(x.slice(x.indexOf(",")+1))};r.onerror=ko;r.readAsDataURL(blob)})}
function sendFile(href,name,win){if(!MP.fileMenu)return false;(win||window).fetch(href).then(function(r){return r.blob()}).then(function(b){return toB64(b).then(function(x){MP.fileMenu(x,name||"fichier",b.type||"application/octet-stream","","","")})}).catch(function(){});return true}
function openBlob(href,name,win){if(!MP.openFile)return sendFile(href,name,win);(win||window).fetch(href).then(function(r){return r.blob()}).then(function(b){return toB64(b).then(function(x){MP.openFile(x,name||("document"+(b.type.indexOf("pdf")>=0?".pdf":"")),b.type||"application/octet-stream")})}).catch(function(){});return true}
function hook(win){if(!win||win.__magp)return;win.__magp=1;
  /* liens créés par programme (a.click() hors de la page) */
  try{var AC=win.HTMLAnchorElement.prototype.click;win.HTMLAnchorElement.prototype.click=function(){var h=this.getAttribute("href")||"";if(/^(blob:|data:)/.test(h)){if(this.hasAttribute("download")){sendFile(h,this.getAttribute("download"),win);return}if(this.target==="_blank"){openBlob(h,"",win);return}}return AC.apply(this,arguments)}}catch(e){}

new MutationObserver(function(ms){ms.forEach(function(m){m.addedNodes.forEach(function(n){if(n.tagName==="IFRAME")watch(n)})})}).observe(document.documentElement,{childList:true,subtree:true});
})();</script>
