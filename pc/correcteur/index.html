<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Correcteur</title>

<style>
/* Correcteur : orthographe, grammaire, conjugaison et synonymes en français, hors ligne (Grammalecte) */
:root{
  --bg:#f4f6fb;--bg2:#ffffff;--bg3:#eef1f7;--line:#dfe4ee;--tx:#1b2333;--tx2:#5b6578;--tx3:#8a93a5;
  --acc:#2f5fd0;--acc2:#e9effd;--bad:#d93636;--gram:#2f6fed;--ok:#1a9e5b;
  --safeT:env(safe-area-inset-top,0px);--safeB:env(safe-area-inset-bottom,0px);
  --font:19px;
}
@media (prefers-color-scheme:dark){:root{--bg:#12161d;--bg2:#1a2029;--bg3:#232b36;--line:#2c3542;--tx:#e9edf4;--tx2:#a4aebd;--tx3:#727d8d;--acc:#7aa2ff;--acc2:#22304b;--bad:#ff7b7b;--gram:#7aa2ff;--ok:#5fd394}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
[hidden]{display:none!important}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
#app{display:flex;flex-direction:column;height:100%;max-width:900px;margin:0 auto}
header{padding:calc(12px + var(--safeT)) 16px 8px;display:flex;align-items:center;gap:10px}
header img{width:34px;height:34px;border-radius:9px}
header h1{margin:0;font-size:21px;font-weight:800;flex:1;letter-spacing:-.01em}
.pill{font-size:12.5px;font-weight:700;padding:5px 11px;border-radius:99px;background:var(--bg3);color:var(--tx2);white-space:nowrap}
.pill.ok{color:var(--ok)}.pill.bad{color:var(--bad)}
main{flex:1;overflow:auto;padding:4px 14px 12px;display:flex;flex-direction:column;gap:10px}
.bar{display:flex;gap:6px;flex-wrap:wrap}
.b{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);font-weight:600;font-size:14px}
.b.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.b:disabled{opacity:.45}
#ret{width:100%;justify-content:center;padding:12px}
.ed{position:relative;flex:1;min-height:220px;background:var(--bg2);border:1px solid var(--line);border-radius:18px;overflow:hidden}
#mir,#ta{position:absolute;inset:0;margin:0;padding:16px;font:var(--font)/1.55 Georgia,"Noto Serif","DejaVu Serif",serif;white-space:pre-wrap;overflow-wrap:break-word;word-break:normal;letter-spacing:0;tab-size:4}
#mir{color:transparent;overflow:hidden;pointer-events:none}
#mir mark{color:transparent;background:none;text-decoration:underline wavy var(--bad);text-decoration-thickness:1.6px;text-underline-offset:5px;text-decoration-skip-ink:none}
#mir mark.gram{text-decoration-color:var(--gram)}
#mir mark.on{background:#ffd54a55;border-radius:3px}
#ta{width:100%;height:100%;border:0;outline:0;resize:none;background:transparent;color:var(--tx);overflow:auto;caret-color:var(--acc)}
#ta::placeholder{color:var(--tx3)}
#pop{position:fixed;z-index:20;left:12px;right:12px;bottom:calc(84px + var(--safeB));background:var(--bg2);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px #0004;padding:12px 14px;max-width:560px;margin:0 auto}
#pop .k{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
#pop .k.ortho{color:var(--bad)}#pop .k.gram{color:var(--gram)}
#pop p{margin:4px 0 10px}
#pop .s{display:flex;gap:6px;flex-wrap:wrap}
#pop .s button{padding:6px 13px;border-radius:99px;border:1px solid var(--line);background:var(--bg3);font-weight:600}
#pop .s button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
#pop .s button.l{border:0;background:none;color:var(--acc);font-weight:500;padding:6px 4px}
nav{display:flex;border-top:1px solid var(--line);background:var(--bg2);padding:4px 8px calc(4px + var(--safeB))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;font-size:12px;color:var(--tx3);border-radius:12px}
nav button.on{color:var(--acc);background:var(--acc2)}
#dic{flex:1;background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:14px}
#dic .mgc-in{font-size:17px}
.hint{color:var(--tx3);font-size:13px;margin:0}
#toast{position:fixed;left:50%;bottom:calc(90px + var(--safeB));transform:translate(-50%,20px);background:#1d2533;color:#fff;padding:10px 16px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;z-index:30;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app">
  <header><img src="icon-512.png" alt=""><h1>Correcteur</h1><span class="pill" id="st">Prêt</span></header>
  <main id="vCor">
    <div id="from" class="hint" hidden></div>
    <button type="button" class="b pri" id="ret" hidden>Renvoyer le texte corrigé</button>
    <div class="bar">
      <button type="button" class="b" id="bPaste"><svg class="i" viewBox="0 0 24 24"><rect x="8" y="3" width="8" height="4" rx="1"/><path d="M16 5h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2"/></svg>Coller</button>
      <button type="button" class="b" id="bCopy"><svg class="i" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>Copier</button>
      <button type="button" class="b" id="bShare"><svg class="i" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>Partager</button>
      <button type="button" class="b" id="bList"><svg class="i" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Toutes les fautes</button>
      <button type="button" class="b" id="bClr"><svg class="i" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>Effacer</button>
    </div>
    <div class="ed"><div id="mir" aria-hidden="true"></div><textarea id="ta" spellcheck="false" autocapitalize="sentences" placeholder="Écrivez ou collez votre texte ici : les fautes sont soulignées (rouge : orthographe, bleu : grammaire). Touchez un mot souligné pour le corriger." aria-label="Texte à corriger"></textarea></div>
    <p class="hint">Tout se fait sur ce téléphone, sans Internet. Astuce : dans n'importe quelle appli, sélectionnez un texte puis choisissez « Corriger » dans le menu.</p>
  </main>
  <main id="vDic" hidden><div id="dic"></div></main>
  <nav><button type="button" class="on" data-v="Cor"><svg class="i" viewBox="0 0 24 24"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg>Corriger</button><button type="button" data-v="Dic"><svg class="i" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>Dictionnaire</button></nav>
</div>
<div id="pop" hidden></div>
<div id="toast" role="status"></div>
<script src="correcteur/correcteur.js"></script>
<script>
(function(){
'use strict';
var $ = function(id){ return document.getElementById(id); };
var M = window.MagCorrecteur, ta = $('ta'), mir = $('mir'), ERR = [], checked = '', tCheck = 0, busy = false, again = false, launch = null;
var BR = window.MAGCorrecteur || null;   // pont Android (texte reçu d'une autre appli)
var DKEY = 'correcteur:brouillon';
function esc(s){ return String(s).replace(/[&<>]/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;' }[c]; }); }
function toast(m){ var t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(function(){ t.classList.remove('on'); }, 2800); }

/* ---------- soulignés : un calque identique au champ, derrière lui ---------- */
function paint(){
  var t = ta.value, h = '', p = 0;
  ERR.forEach(function(x, i){ if(x.s < p || x.e > t.length) return; h += esc(t.slice(p, x.s)) + '<mark class="' + x.t + '" data-i="' + i + '">' + esc(t.slice(x.s, x.e)) + '</mark>'; p = x.e; });
  mir.innerHTML = h + esc(t.slice(p)) + '\n ';
  mir.scrollTop = ta.scrollTop;
  var n = ERR.length, st = $('st');
  st.className = 'pill' + (!t.trim() ? '' : n ? ' bad' : ' ok');
  st.textContent = !t.trim() ? 'Prêt' : n ? n + ' faute' + (n > 1 ? 's' : '') : 'Aucune faute';
}
function check(){
  if(busy){ again = true; return; }
  var t = ta.value; if(t === checked){ paint(); return; }
  busy = true; $('st').textContent = 'Vérification…'; $('st').className = 'pill';
  M.check(t).then(function(list){
    busy = false;
    if(ta.value !== t){ check(); return; }
    checked = t; ERR = list; paint(); if(again){ again = false; check(); }
  }, function(e){ busy = false; $('st').textContent = 'Erreur'; toast(e.message); });
}
function soon(){ clearTimeout(tCheck); tCheck = setTimeout(check, 650); }
ta.addEventListener('input', function(){
  // décalage immédiat des soulignés pendant la frappe (évite qu'ils glissent), puis nouvelle vérification
  ERR = []; paint(); hidePop(); soon(); save();
});
ta.addEventListener('scroll', function(){ mir.scrollTop = ta.scrollTop; });
function save(){ try{ if(!launch) localStorage.setItem(DKEY, ta.value); }catch(e){} }

/* ---------- toucher un mot souligné ---------- */
function errAt(pos){ for(var i = 0; i < ERR.length; i++) if(pos >= ERR[i].s && pos <= ERR[i].e) return i; return -1; }
function hidePop(){ $('pop').hidden = true; mir.querySelectorAll('mark.on').forEach(function(m){ m.classList.remove('on'); }); }
function showPop(i){
  var x = ERR[i], P = $('pop'); if(!x) return;
  mir.querySelectorAll('mark').forEach(function(m){ m.classList.toggle('on', +m.dataset.i === i); });
  P.innerHTML = '<div class="k ' + x.t + '">' + (x.t === 'ortho' ? 'Orthographe' : 'Grammaire') + ' · « ' + esc(ta.value.slice(x.s, x.e)) + ' »</div><p>' + esc(x.msg) + '</p><div class="s">' +
    (x.sugg || []).slice(0, 6).map(function(s, k){ return '<button type="button" class="' + (k ? '' : 'pri') + '" data-s="' + esc(s).replace(/"/g, '&quot;') + '">' + esc(s) + '</button>'; }).join('') +
    '<button type="button" class="l" data-a="ign">Ignorer</button>' + (x.t === 'ortho' ? '<button type="button" class="l" data-a="add">Ajouter au dictionnaire</button>' : '') + '<button type="button" class="l" data-a="dic">Dictionnaire</button></div>';
  P.hidden = false;
  P.onclick = function(e){
    var b = e.target.closest('button'); if(!b) return;
    if(b.dataset.s != null){ ta.setRangeText(b.dataset.s, x.s, x.e, 'end'); ta.dispatchEvent(new Event('input')); ta.focus(); }
    else if(b.dataset.a === 'ign'){ ERR.splice(i, 1); paint(); hidePop(); }
    else if(b.dataset.a === 'add'){ M.addWord(ta.value.slice(x.s, x.e)); checked = ''; hidePop(); check(); toast('Mot ajouté à votre dictionnaire'); }
    else if(b.dataset.a === 'dic'){ hidePop(); view('Dic', x.word || ta.value.slice(x.s, x.e)); }
  };
}
ta.addEventListener('click', function(){ var i = errAt(ta.selectionStart); if(i >= 0 && ta.selectionStart === ta.selectionEnd) showPop(i); else hidePop(); });
ta.addEventListener('keyup', function(e){ if(/Arrow|Home|End/.test(e.key)){ var i = errAt(ta.selectionStart); if(i >= 0) showPop(i); else hidePop(); } });

/* ---------- boutons ---------- */
function copy(t, msg){
  function fb(){ var a = document.createElement('textarea'); a.value = t; a.style.position = 'fixed'; a.style.opacity = '0'; document.body.appendChild(a); a.select(); try{ document.execCommand('copy'); toast(msg || 'Texte copié'); }catch(e){ toast('Copie impossible'); } a.remove(); }
  try{ navigator.clipboard.writeText(t).then(function(){ toast(msg || 'Texte copié'); }, fb); }catch(e){ fb(); }
}
$('bCopy').onclick = function(){ if(ta.value) copy(ta.value); };
$('bPaste').onclick = function(){
  try{ navigator.clipboard.readText().then(function(t){ if(!t){ toast('Le presse-papiers est vide'); return; } ta.value = t; ta.dispatchEvent(new Event('input')); check(); }, function(){ toast('Appuyez longuement dans le texte, puis « Coller »'); ta.focus(); }); }
  catch(e){ toast('Appuyez longuement dans le texte, puis « Coller »'); ta.focus(); }
};
$('bShare').onclick = function(){
  var t = ta.value; if(!t) return;
  if(BR && BR.share){ BR.share(t); return; }
  if(navigator.share) navigator.share({ text: t }).catch(function(){}); else copy(t);
};
$('bList').onclick = function(){ M.open(ta, { title: 'Toutes les fautes', onDone: function(){ checked = ''; check(); } }); };
$('bClr').onclick = function(){ var b = $('bClr'); if(!ta.value) return; if(!b.dataset.sure){ b.dataset.sure = 1; b.lastChild.textContent = 'Confirmer'; setTimeout(function(){ delete b.dataset.sure; b.lastChild.textContent = 'Effacer'; }, 3000); return; } delete b.dataset.sure; b.lastChild.textContent = 'Effacer'; ta.value = ''; ta.dispatchEvent(new Event('input')); ta.focus(); };
document.querySelectorAll('nav button').forEach(function(b){ b.onclick = function(){ view(b.dataset.v); }; });
function view(v, w){
  document.querySelectorAll('nav button').forEach(function(b){ b.classList.toggle('on', b.dataset.v === v); });
  $('vCor').hidden = v !== 'Cor'; $('vDic').hidden = v !== 'Dic'; hidePop();
  if(v === 'Dic'){ if(!$('dic').firstChild || w != null) M.dicoIn($('dic'), w || ''); }
}

/* ---------- texte reçu d'une autre appli (menu « Corriger » de la sélection, ou « Partager ») ---------- */
function takeLaunch(){
  var o = null; try{ o = BR && BR.take ? JSON.parse(BR.take() || 'null') : null; }catch(e){ o = null; }
  if(!o || !o.text) return false;
  launch = o; ta.value = o.text; ERR = []; checked = ''; paint(); check();
  $('from').hidden = false; $('from').textContent = o.mode === 'process' ? (o.ro ? 'Texte sélectionné dans une autre appli (lecture seule) : corrigez-le puis copiez-le.' : 'Texte sélectionné dans une autre appli : corrigez-le puis renvoyez-le.') : 'Texte reçu d\'une autre appli.';
  $('ret').hidden = !(o.mode === 'process' && !o.ro);
  return true;
}
$('ret').onclick = function(){ if(BR && BR.reply) BR.reply(ta.value); };
window.correcteurIntent = function(){ if(takeLaunch()) view('Cor'); };

/* ---------- démarrage ---------- */
if(!takeLaunch()){ try{ ta.value = localStorage.getItem(DKEY) || ''; }catch(e){} }
paint(); if(ta.value) check(); else M.ready().catch(function(e){ $('st').textContent = 'Erreur'; toast(e.message); });
M.hotkey(function(){ return ta; });
document.addEventListener('backbutton', function(){ if(!$('pop').hidden) hidePop(); });
})();
</script>
</body>
</html>
