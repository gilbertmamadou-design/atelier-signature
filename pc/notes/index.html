<title>Carnet</title>
<meta name="theme-color" content="#0f1116">
<style>
:root{
  color-scheme:dark;
  --bg:#0f1116;--bg2:#181b23;--bg3:#222632;--bg4:#2c3140;--line:#ffffff14;--line2:#ffffff2a;
  --tx:#f2f3f7;--tx2:#b4b8c7;--tx3:#7d8294;
  --acc:#ffd166;--acc2:#ffb35c;--accd:#1c1606;--ok:#6fd6a4;--bad:#ff7b7b;
  --r:16px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:inherit}
svg{display:block}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
[hidden]{display:none!important}
.hb{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--tx2);flex:none}
.hb:active{background:#ffffff14}
.hb.on{color:var(--acc)}

/* En-tête et recherche */
#top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(8px + var(--safe-t)) 12px 8px}
#sbar{display:flex;align-items:center;gap:2px;background:var(--bg2);border:1px solid var(--line);border-radius:99px;padding:2px 4px;height:50px}
#q{flex:1;min-width:0;background:none;border:0;outline:0;font-size:16px;padding:0 4px}
#q::placeholder{color:var(--tx3)}
#viewTitle{display:flex;align-items:center;gap:8px;padding:12px 6px 2px;font-size:20px;font-weight:700}
#viewTitle .sp{flex:1}
#viewTitle button{font-size:13px;font-weight:600;color:var(--acc);padding:6px 10px;border-radius:10px;background:var(--bg2)}

main{padding:0 10px calc(110px + var(--safe-b))}
.sec{font-size:11.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--tx3);font-weight:700;margin:14px 6px 8px}
.cols{display:flex;gap:8px;align-items:flex-start}
.cols>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.list>div{display:flex;flex-direction:column;gap:8px}
.card{background:var(--bg2);border:1px solid var(--line2);border-radius:var(--r);overflow:hidden;cursor:pointer;position:relative;text-align:left;width:100%;transition:transform .1s}
.card:active{transform:scale(.985)}
.card.col{border-color:transparent}
.card .img{display:block;width:100%;object-fit:cover;background:#0003}
.card .imgs{display:flex;gap:2px}
.card .imgs .img{flex:1;min-width:0}
.card .in{padding:11px 13px 12px}
.card .ti{font-weight:650;font-size:16px;margin-bottom:5px;word-wrap:break-word}
.card .tx{font-size:14px;color:#e4e6ee;white-space:pre-wrap;word-wrap:break-word;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:10;overflow:hidden}
.list .card .tx{-webkit-line-clamp:4}
.card .li{display:flex;gap:8px;font-size:14px;align-items:flex-start;margin:3px 0;color:#e4e6ee}
.card .li i{width:14px;height:14px;border:1.6px solid currentColor;border-radius:3px;flex:none;margin-top:3px;opacity:.7}
.card .li.c span{text-decoration:line-through;opacity:.6}
.card .more{font-size:12.5px;color:var(--tx2);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 9px;border-radius:99px;background:#ffffff1a;color:#e8eaf0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .ic{width:14px;height:14px}
.chip>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.chip.past{text-decoration:line-through;opacity:.65}
.card .pinm{position:absolute;top:8px;right:8px;width:18px;height:18px;color:var(--tx2)}
.empty{text-align:center;color:var(--tx3);padding:70px 30px 20px;font-size:15px}
.empty svg{width:72px;height:72px;margin:0 auto 14px;stroke-width:1.3;opacity:.6}
.empty b{display:block;color:var(--tx2);font-size:16px;margin-bottom:4px}

/* Barre du bas */
#bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg2);border-top:1px solid var(--line);padding:6px 10px calc(6px + var(--safe-b));display:flex;align-items:center;gap:2px;height:calc(64px + var(--safe-b))}
#bottom .sp{flex:1}
#fab{position:fixed;right:16px;bottom:calc(30px + var(--safe-b));z-index:7;width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--accd);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px #0009}
#fab .ic{width:30px;height:30px;stroke-width:2.2}
#fab:active{transform:scale(.95)}

/* Tiroir */
.scrim{position:fixed;inset:0;background:#0009;z-index:40}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(82vw,320px);background:var(--bg2);z-index:41;padding:calc(16px + var(--safe-t)) 10px calc(16px + var(--safe-b));overflow-y:auto;border-radius:0 22px 22px 0;transform:translateX(-102%);transition:transform .22s}
#drawer.on{transform:none}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:21px;padding:4px 12px 14px}
.logo svg{width:30px;height:30px}
.dr{display:flex;align-items:center;gap:16px;width:100%;padding:13px 16px;border-radius:0 99px 99px 0;margin-left:-10px;padding-left:26px;font-size:15px;font-weight:550;color:var(--tx)}
.dr .ic{color:var(--tx2)}
.dr.on{background:#ffd16624;color:var(--acc)}
.dr.on .ic{color:var(--acc)}
.dr span{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dr small{color:var(--tx3);font-size:12.5px}
.dsec{font-size:11.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--tx3);font-weight:700;padding:14px 16px 6px;display:flex;align-items:center}
.dsec .sp{flex:1}
.dsec button{color:var(--acc);font-size:12px;letter-spacing:0;text-transform:none}
.dline{height:1px;background:var(--line);margin:8px 6px}

/* Éditeur */
#ed{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column}
#ed .bar{display:flex;align-items:center;gap:2px;padding:calc(6px + var(--safe-t)) 6px 4px}
#ed .bar .sp{flex:1}
#edBody{flex:1;overflow-y:auto;padding:0 0 30px}
#edImgs{display:grid;grid-template-columns:1fr 1fr;gap:3px}
#edImgs img{width:100%;display:block;object-fit:cover;cursor:pointer;background:#0003}
#edImgs img:only-child{grid-column:span 2}
#edImgs img.wide{grid-column:span 2}
#edTitle{display:block;width:100%;background:none;border:0;outline:0;font-size:22px;font-weight:650;padding:14px 18px 6px;resize:none}
#edText{display:block;width:100%;background:none;border:0;outline:0;font-size:16.5px;line-height:1.5;padding:6px 18px 10px;resize:none;min-height:180px;overflow:hidden}
#edTitle::placeholder,#edText::placeholder{color:#ffffff66}
#edChips{padding:0 18px}
#edChips .chip{font-size:13px;padding:5px 11px;cursor:pointer}
#edTrash{margin:10px 14px 0;padding:12px 14px;border-radius:14px;background:#ff7b7b1a;border:1px solid #ff7b7b40;font-size:14px;color:#ffc9c9}
#edTrash .row{margin-top:10px}
#edFoot{display:flex;align-items:center;gap:2px;padding:4px 6px calc(4px + var(--safe-b));border-top:1px solid #ffffff12}
#edFoot .sp{flex:1;text-align:center;font-size:12.5px;color:var(--tx2);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#ed.ro textarea,#ed.ro input{pointer-events:none}

/* Liste à cocher */
#edList{padding:4px 6px 4px 4px}
.it{display:flex;align-items:flex-start;gap:2px;position:relative;border-radius:10px;background:inherit}
.it.drag{z-index:3;background:#ffffff14;box-shadow:0 6px 20px #0008}
.it .hd{width:30px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--tx3);touch-action:none;cursor:grab;flex:none}
.it .hd .ic{width:18px;height:18px}
.it .cb{width:40px;height:44px;display:flex;align-items:center;justify-content:center;flex:none}
.it .cb i{width:22px;height:22px;border:2px solid var(--tx2);border-radius:5px;display:flex;align-items:center;justify-content:center}
.it.c .cb i{background:var(--tx2);border-color:var(--tx2)}
.it.c .cb i:after{content:"";width:10px;height:5px;border:2.4px solid #1a1c22;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.it textarea{flex:1;min-width:0;background:none;border:0;outline:0;resize:none;font-size:16.5px;line-height:1.4;padding:10px 4px;overflow:hidden;height:44px}
.it.c textarea{text-decoration:line-through;color:var(--tx3)}
.it .x{width:40px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--tx3);visibility:hidden;flex:none}
.it:focus-within .x{visibility:visible}
.it.c .hd{visibility:hidden}
.addit{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 38px;color:var(--tx2);font-size:16px;width:100%;text-align:left}
.chkh{display:flex;align-items:center;gap:8px;padding:12px 16px 6px;color:var(--tx2);font-size:14px;font-weight:600;width:100%}
.chkh .ic{width:18px;height:18px;transition:transform .2s}
.chkh.closed .ic{transform:rotate(-90deg)}
.lsep{height:1px;background:#ffffff14;margin:6px 14px}

/* Feuilles (menus du bas) */
.sheet{position:fixed;inset:0;z-index:50;background:#0008;display:flex;align-items:flex-end}
.pan{background:var(--bg2);border-radius:22px 22px 0 0;border-top:1px solid var(--line);width:100%;max-height:86dvh;overflow-y:auto;padding:8px 0 calc(12px + var(--safe-b))}
.grab{width:42px;height:5px;border-radius:5px;background:var(--bg4);margin:4px auto 10px}
.pan h2{margin:0 18px 10px;font-size:18px}
.mi{display:flex;align-items:center;gap:16px;width:100%;padding:14px 20px;font-size:15.5px;text-align:left}
.mi:active{background:#ffffff0d}
.mi .ic{color:var(--tx2)}
.mi.bad,.mi.bad .ic{color:var(--bad)}
.pal{display:flex;flex-wrap:wrap;gap:12px;padding:6px 18px 12px}
.pal button{width:46px;height:46px;border-radius:50%;border:2px solid #ffffff30;display:flex;align-items:center;justify-content:center}
.pal button.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.pal button .ic{width:20px;height:20px;color:var(--tx2)}
.fld{padding:6px 18px}
.fld label{display:block;font-size:13px;color:var(--tx3);margin-bottom:5px}
.fld input,.fld select{width:100%;background:var(--bg3);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px;outline:0}
.fld input:focus{border-color:#ffd16688}
.two{display:flex;gap:10px;padding:0 18px}
.two .fld{padding:6px 0;flex:1}
.seg{display:flex;background:var(--bg3);border-radius:12px;padding:3px;gap:3px;margin:4px 18px 8px}
.seg button{flex:1;padding:10px 4px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--tx2)}
.seg button.on{background:var(--bg4);color:var(--acc);box-shadow:0 0 0 1px #ffffff1c inset}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 18px 8px}
.quick button{background:var(--bg3);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;font-size:14px;font-weight:600}
.quick button small{display:block;color:var(--tx3);font-weight:500;font-size:12px}
.row{display:flex;gap:8px;padding:10px 18px 4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:12px 14px;border-radius:13px;background:var(--bg3);border:1px solid var(--line);font-weight:600;font-size:14.5px;flex:1;min-width:0;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn.main{background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--accd);border:0}
.btn.bad{color:var(--bad)}
.lab{display:flex;align-items:center;gap:14px;padding:11px 20px;width:100%;text-align:left;font-size:15.5px}
.lab .bx{width:22px;height:22px;border:2px solid var(--tx2);border-radius:5px;flex:none;display:flex;align-items:center;justify-content:center}
.lab.on .bx{background:var(--acc);border-color:var(--acc)}
.lab.on .bx:after{content:"";width:10px;height:5px;border:2.4px solid var(--accd);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.lab span{flex:1}
.lab .del{color:var(--tx3);padding:6px}
.newlab{display:flex;gap:8px;padding:6px 18px 8px}
.newlab input{flex:1;background:var(--bg3);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:15.5px;outline:0}
.newlab .btn{flex:none}
.hint{font-size:12.5px;color:var(--tx3);padding:0 18px 6px;line-height:1.45}

/* Visionneuse, dessin */
.full{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column}
.full .bar{display:flex;align-items:center;gap:4px;padding:calc(6px + var(--safe-t)) 6px 6px;background:#0d0f14}
.full .bar .sp{flex:1}
#viewImg{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#viewImg img{max-width:100%;max-height:100%}
#drawWrap{flex:1;min-height:0;position:relative;background:#fff;touch-action:none}
#drawWrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#drawTools{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px 7px;padding:10px 8px calc(10px + var(--safe-b));background:#0d0f14}
#drawTools .br{flex-basis:100%;height:0}
.pc{width:32px;height:32px;border-radius:50%;border:2px solid #ffffff40;flex:none}
.pc.on{box-shadow:0 0 0 3px var(--acc)}
.sz{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;background:#ffffff10}
.sz i{display:block;border-radius:50%;background:#ddd}
.sz.on{background:#ffd16640}

#undo{position:fixed;left:12px;right:12px;bottom:calc(80px + var(--safe-b));z-index:70;background:#2b3042;border:1px solid #ffffff1f;color:var(--tx);padding:6px 6px 6px 16px;border-radius:14px;font-size:14.5px;box-shadow:0 10px 30px #0008;display:flex;align-items:center;gap:8px;min-height:50px;transform:translateY(calc(100% + 120px));visibility:hidden;transition:transform .25s,visibility .25s}
#undo.on{transform:none;visibility:visible}
#undo span{flex:1}
#undo button{color:var(--acc);font-weight:700;padding:10px 12px;border-radius:10px}
body.edit #undo{bottom:calc(64px + var(--safe-b))}
#mic.rec{color:var(--bad);animation:pu 1s infinite}
@keyframes pu{50%{opacity:.4}}
</style>
</head>
<body>
<div id="top">
  <div id="sbar">
    <button class="hb" id="bMenu" aria-label="Menu"><svg class="ic" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <input id="q" type="search" placeholder="Rechercher dans tes notes" autocomplete="off">
    <button class="hb" id="bClearQ" aria-label="Effacer la recherche" hidden><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <button class="hb" id="bView" aria-label="Changer l'affichage"></button>
  </div>
  <div id="viewTitle" hidden><span id="vtTxt"></span><span class="sp"></span><button id="bEmptyTrash" hidden>Vider la corbeille</button></div>
</div>
<main id="main"></main>

<div id="bottom">
  <button class="hb" id="qList" aria-label="Nouvelle liste"><svg class="ic" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="M8 12l3 3 5-6"/></svg></button>
  <button class="hb" id="qDraw" aria-label="Nouveau dessin"><svg class="ic" viewBox="0 0 24 24"><path d="M4 20c2 0 3-1 3-3s1-3 3-3"/><path d="M10 14l9-9a1.8 1.8 0 0 1 2.5 2.5l-9 9z"/></svg></button>
  <button class="hb" id="qPhoto" aria-label="Nouvelle note avec photo"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="m3 17 5-5 4 4 3-3 6 6"/></svg></button>
  <button class="hb mic" id="qMic" aria-label="Nouvelle note dictée" hidden><svg class="ic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
  <span class="sp"></span>
</div>
<button id="fab" aria-label="Nouvelle note"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>

<div class="scrim" id="scrim" hidden></div>
<nav id="drawer"></nav>

<!-- Éditeur -->
<div id="ed" hidden>
  <div class="bar">
    <button class="hb" id="edBack" aria-label="Retour"><svg class="ic" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
    <span class="sp"></span>
    <button class="hb" id="edPin" aria-label="Épingler"></button>
    <button class="hb" id="edRem" aria-label="Rappel"><svg class="ic" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg></button>
    <button class="hb" id="edArch" aria-label="Archiver"></button>
  </div>
  <div id="edBody">
    <div id="edTrash" hidden>Cette note est dans la corbeille. Elle sera supprimée définitivement <span id="edTrashWhen"></span>.
      <div class="row" style="padding:10px 0 0"><button class="btn" id="edRestore">Restaurer</button><button class="btn bad" id="edKill">Supprimer définitivement</button></div></div>
    <div id="edImgs"></div>
    <textarea id="edTitle" rows="1" placeholder="Titre" maxlength="300"></textarea>
    <textarea id="edText" placeholder="Note"></textarea>
    <div id="edList" hidden></div>
    <div id="edChips" class="chips"></div>
  </div>
  <div id="edFoot">
    <button class="hb" id="edAdd" aria-label="Ajouter"><svg class="ic" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="M12 8v8M8 12h8"/></svg></button>
    <button class="hb" id="edCol" aria-label="Couleur"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0 0 18c1.2 0 1.8-.8 1.8-1.7 0-1.3-1-1.6-1-2.6 0-1 .8-1.7 1.8-1.7H17a4 4 0 0 0 4-4C21 6.6 17 3 12 3z"/><circle cx="7.5" cy="11" r="1.2"/><circle cx="10.5" cy="7" r="1.2"/><circle cx="15.5" cy="7.5" r="1.2"/></svg></button>

/* IndexedDB pour les images */
var dbp = null;
function db(){
  if(dbp) return dbp;
  dbp = new Promise(function(res, rej){
    try{
      var r = indexedDB.open('carnet', 1);
      r.onupgradeneeded = function(){ r.result.createObjectStore('img'); };
      r.onsuccess = function(){ res(r.result); };
      r.onerror = function(){ rej(r.error); };
    }catch(e){ rej(e); }
  });
  return dbp;
}
function idb(mode, fn){
  return db().then(function(d){ return new Promise(function(res, rej){
    var tx = d.transaction('img', mode), st = tx.objectStore('img'), out = fn(st);
    tx.oncomplete = function(){ res(out && 'result' in out ? out.result : undefined); };
    tx.onerror = function(){ rej(tx.error); };
  }); });
}
function imgPut(id, blob){ return idb('readwrite', function(s){ return s.put(blob, id); }); }
function imgGet(id){ return idb('readonly', function(s){ return s.get(id); }); }
function imgDel(id){ delete URLS[id]; return idb('readwrite', function(s){ return s.delete(id); }).catch(function(){}); }
var URLS = {};
function imgUrl(id){
  if(URLS[id]) return Promise.resolve(URLS[id]);
  return imgGet(id).then(function(b){ if(!b) return ''; URLS[id] = typeof b === 'string' ? b : URL.createObjectURL(b); return URLS[id]; }).catch(function(){ return ''; });
}
function fillImgs(root){
  root.querySelectorAll('img[data-img]').forEach(function(im){ imgUrl(im.dataset.img).then(function(u){ if(u) im.src = u; }); });
}

/* ---------- Couleurs ---------- */
var COLORS = [['', 'Par défaut', ''], ['rouge','Rouge','#5c2b29'], ['orange','Orange','#614a19'], ['jaune','Jaune','#635d19'], ['vert','Vert','#345920'], ['sarcelle','Sarcelle','#16504b'], ['bleu','Bleu','#2d555e'], ['marine','Bleu foncé','#1e3a5f'], ['violet','Violet','#42275e'], ['rose','Rose','#5b2245'], ['brun','Brun','#442f19'], ['gris','Gris','#3c3f43']];

/* ---------- Divers ---------- */
function toastEl(){ return $('undo'); }
var undoFn = null, undoT;
function toast(t, undo){
  $('undoTxt').textContent = t; $('undoBtn').hidden = !undo; undoFn = undo || null;
  toastEl().classList.add('on'); clearTimeout(undoT); undoT = setTimeout(function(){ toastEl().classList.remove('on'); undoFn = null; }, undo ? 6000 : 3000);
}
$('undoBtn').addEventListener('click', function(){ var f = undoFn; undoFn = null; toastEl().classList.remove('on'); if(f) f(); });
function snap(n){ return JSON.parse(JSON.stringify(n)); }
function findNote(id){ for(var i = 0; i < NOTES.length; i++) if(NOTES[i].id === id) return NOTES[i]; return null; }
function isEmpty(n){ return !n.title.trim() && !n.text.trim() && !(n.items||[]).some(function(i){ return i.t.trim(); }) && !(n.images||[]).length; }
function newNote(type){
  var t = Date.now();
  return {id:uid(), type:type || 'text', title:'', text:'', items:type === 'list' ? [{id:uid(), t:'', c:false}] : [], color:'', pinned:false, archived:false, trashed:0, labels:[], images:[], reminder:null, created:t, updated:t};
}
function fmtDate(t, withTime){
  var d = new Date(t), now = new Date(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  var hm = d.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
  var dd = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  var day = dd === today ? 'Aujourd\'hui' : dd === today + DAY ? 'Demain' : dd === today - DAY ? 'Hier' : d.toLocaleDateString('fr-FR', {day:'numeric', month:'short', year: d.getFullYear() === now.getFullYear() ? undefined : 'numeric'});
  return withTime === false ? day : day + ', ' + hm;
}
function noteText(n){
  var s = n.title ? n.title + '\n\n' : '';
  if(n.type === 'list'){
    var un = n.items.filter(function(i){ return !i.c && i.t.trim(); }), ch = n.items.filter(function(i){ return i.c && i.t.trim(); });
    s += un.map(function(i){ return '☐ ' + i.t; }).join('\n');
    if(ch.length) s += (un.length ? '\n' : '') + ch.map(function(i){ return '☑ ' + i.t; }).join('\n');
  } else s += n.text;
  return s.trim();
}

/* ---------- Pile d'écrans (bouton retour) ---------- */
var stack = [];
function pushLayer(close){ stack.push(close); history.pushState({d:stack.length}, ''); }
function popLayer(){ if(stack.length) history.back(); }
var after = [];
window.addEventListener('popstate', function(){ var c = stack.pop(); if(c) c(); var f = after.shift(); if(f) f(); });
function popThen(fn){ if(!stack.length){ fn(); return; } after.push(fn); history.back(); }

/* ---------- Vue principale ---------- */
var VIEW = {k:'notes'}, query = '';
function viewNotes(){
  var q = query.trim().toLowerCase();
  return NOTES.filter(function(n){
    if(q){
      if(n.trashed) return false;
      var hay = (n.title + ' ' + n.text + ' ' + (n.items||[]).map(function(i){ return i.t; }).join(' ') + ' ' + n.labels.join(' ')).toLowerCase();
      return q.split(/\s+/).every(function(w){ return hay.indexOf(w) >= 0; });
    }
    if(VIEW.k === 'trash') return !!n.trashed;
    if(n.trashed) return false;
    if(VIEW.k === 'archive') return n.archived;
    if(VIEW.k === 'rem') return !!n.reminder;
    if(VIEW.k === 'label') return n.labels.indexOf(VIEW.l) >= 0;
    return !n.archived;
  });
}
function cardHTML(n){
  var h = '<div class="card'+(n.color ? ' col' : '')+'" data-id="'+n.id+'" style="'+(n.color ? 'background:'+colHex(n.color) : '')+'" role="button" tabindex="0">';
  var ims = (n.images||[]).slice(0, PREF.grid ? 1 : 3);
  if(ims.length){
    h += '<div class="imgs">' + ims.map(function(im){ var r = im.w && im.h ? Math.max(.4, Math.min(1.8, im.h/im.w)) : .75; return '<img class="img" alt="" data-img="'+im.id+'" style="aspect-ratio:'+(1/r).toFixed(3)+(PREF.grid ? '' : ';max-height:160px')+(im.draw ? ';background:#fff' : '')+'">'; }).join('') + '</div>';
  }
  var body = '';
  if(n.pinned && VIEW.k !== 'notes') body += '';
  if(n.title) body += '<div class="ti">'+esc(n.title)+'</div>';
  if(n.type === 'list'){
    var un = n.items.filter(function(i){ return !i.c && i.t.trim(); }), ch = n.items.filter(function(i){ return i.c && i.t.trim(); });
    var max = PREF.grid ? 8 : 5;
    body += un.slice(0, max).map(function(i){ return '<div class="li"><i></i><span>'+esc(i.t)+'</span></div>'; }).join('');
    var rest = un.length - max;
    if(rest > 0) body += '<div class="more">+ '+rest+' autre'+(rest > 1 ? 's' : '')+'</div>';
    if(ch.length) body += '<div class="more">+ '+ch.length+' élément'+(ch.length > 1 ? 's' : '')+' coché'+(ch.length > 1 ? 's' : '')+'</div>';
  } else if(n.text.trim()){
    var t = n.text.length > 700 ? n.text.slice(0, 700) + '…' : n.text;
    body += '<div class="tx">'+esc(t)+'</div>';
  }
  var chips = chipsHTML(n, true);
  if(chips) body += '<div class="chips">'+chips+'</div>';
  if(body) h += '<div class="in">'+body+'</div>';
  else if(!ims.length) h += '<div class="in"><div class="tx" style="color:var(--tx3)">Note vide</div></div>';
  return h + '</div>';
}
function remLabel(r, short){
  return fmtDate(r.at) + (short ? '' : r.rep === 'day' ? ' · chaque jour' : r.rep === 'week' ? ' · chaque semaine' : '');
}
function chipsHTML(n, small){
  var h = '';
  if(n.reminder) h += '<span class="chip'+(n.reminder.at < Date.now() && n.reminder.rep === 'none' ? ' past' : '')+'" data-chip="rem">'+ic(n.reminder.rep !== 'none' ? 'repeat' : 'bell')+'<span>'+esc(remLabel(n.reminder, small))+'</span></span>';
  n.labels.forEach(function(l){ h += '<span class="chip" data-chip="lab"><span>'+esc(l)+'</span></span>'; });
  return h;
}
var EMPTY = {
  notes:['note', 'Tes notes apparaîtront ici', 'Clique sur + (ou touche N) pour écrire une note, ou sur les icônes en bas pour une liste, un dessin ou une photo.'],
  rem:['bell', 'Aucun rappel', 'Les notes avec un rappel apparaissent ici.'],
  archive:['arch', 'Aucune note archivée', 'Archive une note pour la ranger sans la supprimer.'],
  trash:['trash', 'Corbeille vide', 'Les notes supprimées restent ici 7 jours.'],
  label:['label', 'Aucune note avec cette étiquette', ''],
  search:['note', 'Aucun résultat', 'Essaie un autre mot.']
};
window.__carnetRender = function(){ render(); };
function render(){
  var list = viewNotes(), M = $('main');
  var titles = {notes:'', rem:'Rappels', archive:'Archives', trash:'Corbeille', label:VIEW.l};
  $('viewTitle').hidden = !titles[VIEW.k] || !!query.trim();
  $('vtTxt').textContent = titles[VIEW.k] || '';
  $('bEmptyTrash').hidden = VIEW.k !== 'trash' || !list.length;
  $('bView').innerHTML = ic(PREF.grid ? 'rows' : 'grid');
  $('bView').setAttribute('aria-label', PREF.grid ? 'Affichage en liste' : 'Affichage en grille');
  $('bottom').hidden = $('fab').hidden = VIEW.k === 'trash';
  if(!list.length){
    var e = EMPTY[query.trim() ? 'search' : VIEW.k];
    M.innerHTML = '<div class="empty">'+ic(e[0])+'<b>'+e[1]+'</b>'+e[2]+'</div>'; return;
  }
  var groups;
  if(VIEW.k === 'rem' && !query.trim()){
    list.sort(function(a, b){ return a.reminder.at - b.reminder.at; });
    var now = Date.now();
    groups = [['À venir', list.filter(function(n){ return n.reminder.at >= now || n.reminder.rep !== 'none'; })], ['Passés', list.filter(function(n){ return n.reminder.at < now && n.reminder.rep === 'none'; })]];
  } else {
    list.sort(function(a, b){ return VIEW.k === 'trash' ? b.trashed - a.trashed : (b.order || b.created) - (a.order || a.created); });
    var pin = list.filter(function(n){ return n.pinned && !n.archived && !n.trashed; });
    groups = pin.length && VIEW.k !== 'trash' ? [['Épinglées', pin], ['Autres', list.filter(function(n){ return pin.indexOf(n) < 0; })]] : [['', list]];
  }
  M.innerHTML = '';
  groups.forEach(function(g){
    if(!g[1].length) return;
    if(g[0] && groups.filter(function(x){ return x[1].length; }).length > 1 || g[0] === 'Épinglées') { var s = document.createElement('div'); s.className = 'sec'; s.textContent = g[0]; M.appendChild(s); }
    var wrap = document.createElement('div');
    if(PREF.grid){
      wrap.className = 'cols'; var nc = Math.max(2, Math.min(5, Math.floor((M.clientWidth || innerWidth) / 250))), cs = []; for (var ci = 0; ci < nc; ci++){ var cc = document.createElement('div'); wrap.appendChild(cc); cs.push(cc); } M.appendChild(wrap);
      g[1].forEach(function(n){
        var col = cs.reduce(function(a, b){ return b.offsetHeight < a.offsetHeight ? b : a; });
        col.insertAdjacentHTML('beforeend', cardHTML(n));
      });
    } else {
      wrap.className = 'list'; var c = document.createElement('div'); wrap.appendChild(c); M.appendChild(wrap);
      c.innerHTML = g[1].map(cardHTML).join('');
    }
  });
  fillImgs(M);
}
$('main').addEventListener('click', function(e){ var c = e.target.closest('.card'); if(c) openEditor(c.dataset.id); });
$('bView').addEventListener('click', function(){ PREF.grid = !PREF.grid; lsSet('carnet.pref', PREF); render(); });

/* ---------- Tiroir ---------- */
function renderDrawer(){

/* Glisser pour réordonner */
(function(){
  var drag = null;
  $('edList').addEventListener('pointerdown', function(e){
    var hd = e.target.closest('.hd'); if(!hd || E.trashed) return;
    var row = hd.closest('.it'); if(row.classList.contains('c')) return;
    e.preventDefault();

    drag = {row:row, y0:e.clientY, off:0, id:e.pointerId};
    row.classList.add('drag');
    try{ hd.setPointerCapture(e.pointerId); }catch(_){}
  });
  $('edList').addEventListener('pointermove', function(e){
    if(!drag || e.pointerId !== drag.id) return;
    var row = drag.row, dy = e.clientY - drag.y0;
    row.style.transform = 'translateY(' + (dy - drag.off) + 'px)';
    var prev = row.previousElementSibling, next = row.nextElementSibling;
    if(prev){ var pr = prev.getBoundingClientRect(); if(e.clientY < pr.top + pr.height / 2){ row.parentNode.insertBefore(row, prev); drag.off -= pr.height; row.style.transform = 'translateY(' + (dy - drag.off) + 'px)'; } }
    if(next){ var nr = next.getBoundingClientRect(); if(e.clientY > nr.top + nr.height / 2){ row.parentNode.insertBefore(next, row); drag.off += nr.height; row.style.transform = 'translateY(' + (dy - drag.off) + 'px)'; } }
    // défilement auto près des bords

    if(e.clientY < bd.top + 50) $('edBody').scrollTop -= 8; else if(e.clientY > bd.bottom - 50) $('edBody').scrollTop += 8;
  });
  function end(){
    if(!drag) return;
    drag.row.classList.remove('drag'); drag.row.style.transform = '';
    var order = Array.prototype.map.call($('ulist').children, function(r){ return r.dataset.id; });
    var un = order.map(function(id){ return E.items.filter(function(x){ return x.id === id; })[0]; }).filter(Boolean);
    E.items = un.concat(E.items.filter(function(i){ return i.c; }));
    drag = null; touch();
  }
  $('edList').addEventListener('pointerup', end);
  $('edList').addEventListener('pointercancel', end);
})();

  LABELS.sort(function(a, b){ return a.localeCompare(b, 'fr'); });
  saveLabels(); save(); saveNow();
  return Promise.all(jobs).then(function(){ planAll(); render(); return [added, upd]; });
}
window.carnetImport = importData;
$('fJson').addEventListener('change', function(){
  var f = this.files && this.files[0]; this.value = ''; if(!f) return;
  var r = new FileReader();
  r.onload = function(){
    try{ importData(JSON.parse(r.result)).then(function(c){ toast(c[0] + ' note' + (c[0] > 1 ? 's' : '') + ' ajoutée' + (c[0] > 1 ? 's' : '') + (c[1] ? ', ' + c[1] + ' mise' + (c[1] > 1 ? 's' : '') + ' à jour' : '')); }); }
    catch(e){ toast(e.message || 'Fichier illisible'); }
  };
  r.readAsText(f);
});

/* ---------- Création ---------- */
function create(type, focus){ var n = newNote(type); NOTES.unshift(n); save(); if(VIEW.k === 'archive' || VIEW.k === 'trash' || VIEW.k === 'rem'){ VIEW = {k:'notes'}; } if(VIEW.k === 'label') n.labels.push(VIEW.l); openEditor(n.id, {focus:focus !== false}); return n; }
window.carnetCreate = create;
$('fab').addEventListener('click', function(){ create('text'); });
$('qList').addEventListener('click', function(){ create('list'); });
$('qDraw').addEventListener('click', function(){ create('text', false); openDraw(null); });
$('qPhoto').addEventListener('click', function(){ imgTarget = null; E = null; $('fImg').value = ''; $('fImg').click(); });

/* ---------- Démarrage ---------- */
(function boot(){
  var now = Date.now(), purge = false;
  NOTES = NOTES.filter(function(n){
    if(n.trashed && now - n.trashed > 7 * DAY){ (n.images||[]).forEach(function(im){ imgDel(im.id); }); purge = true; return false; }
    if(isEmpty(n)){ purge = true; return false; }
    return true;
  });
  if(purge) save();
  planAll();
  render();
})();
setTimeout(function(){ publishWidget(); publishBackup(); try{ if(window.MAGPrint && MAGPrint.takeSocle){ var a = MAGPrint.takeSocle(); if(a) window.onSocle(a); } }catch(e){} }, 400);
})();

</script>
