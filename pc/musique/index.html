<style>
:root{
  --bg:#121016;--bg2:#1b1820;--bg3:#25212c;--line:#ffffff14;--tx:#f4f1f7;--tx2:#b9b2c3;--tx3:#7f778b;
  --acc:#ff7a59;--acc2:#ffb347;--ok:#5fd39b;--r:14px;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select{font:inherit;color:inherit}
svg{display:block}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icf{fill:currentColor;stroke:none}

/* En-tête */
header{padding:calc(10px + var(--safe-t)) 16px 8px;display:flex;align-items:center;gap:10px;background:linear-gradient(var(--bg),var(--bg) 70%,transparent);z-index:5}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:21px;letter-spacing:-.3px}
.logo i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font-style:normal}
.search{flex:1;display:flex;align-items:center;gap:6px;background:var(--bg2);border-radius:999px;padding:7px 12px;min-width:0}
.search input{flex:1;background:none;border:0;outline:0;min-width:0}
.search .ic{width:18px;height:18px;color:var(--tx3)}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--tx2);flex:none}
.iconbtn:active{background:var(--bg3)}
#refreshBtn.spinning svg{animation:rfspin .9s linear infinite}@keyframes rfspin{to{transform:rotate(360deg)}}
#ptr{position:fixed;left:50%;top:calc(58px + var(--safe-t));transform:translate(-50%,0);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--bg3);color:var(--tx2);opacity:0;pointer-events:none;z-index:20;transition:opacity .15s}#ptr.on{opacity:1}#ptr.ready{color:var(--acc)}

main{flex:1;overflow-y:auto;padding:4px 0 calc(150px + var(--safe-b))}
.view{display:none}.view.on{display:block}
.bar{display:flex;gap:8px;padding:6px 16px 10px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:999px;background:var(--bg3);font-weight:600;font-size:14px}
.pill.main{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#1a0f0a}
.pill .ic{width:18px;height:18px}
.count{color:var(--tx3);font-size:13px;margin-left:auto}
select.sort{background:var(--bg2);border:0;border-radius:999px;padding:8px 10px;font-size:13px;color:var(--tx2)}

/* Lignes de titre */
.row{display:flex;align-items:center;gap:12px;padding:7px 16px;cursor:pointer;position:relative}
.row:active{background:var(--bg2)}
.row .cov{width:46px;height:46px;border-radius:8px;flex:none}
.row .meta{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{color:var(--tx2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .d{color:var(--tx3);font-size:12px;flex:none}
.row.cur .t{color:var(--acc)}
.row .more{width:34px;height:34px;display:grid;place-items:center;color:var(--tx3);flex:none;border-radius:50%}
.row .num{width:22px;text-align:center;color:var(--tx3);font-size:13px;flex:none}
.eq{display:none;gap:2px;align-items:flex-end;height:14px;width:16px;flex:none}
.row.cur .eq{display:flex}
.eq b{flex:1;background:var(--acc);border-radius:1px;height:30%}
.playing .row.cur .eq b{animation:eq .9s ease-in-out infinite}
.eq b:nth-child(2){animation-delay:.25s!important}.eq b:nth-child(3){animation-delay:.5s!important}
@keyframes eq{0%,100%{height:25%}50%{height:100%}}

/* Pochettes */
.cov{background:#2a2530 center/cover no-repeat;position:relative;overflow:hidden}
.cov.gen{display:grid;place-items:center;font-weight:800;color:#fff9;text-transform:uppercase}

/* Grille albums */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px 12px;padding:4px 16px}
@media (max-width:420px){.grid{grid-template-columns:1fr 1fr}}
.card{cursor:pointer;min-width:0}
.card .cov{width:100%;aspect-ratio:1;border-radius:12px;box-shadow:0 8px 24px #0006}
.card .t{font-weight:600;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.card .s{color:var(--tx2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card:active .cov{transform:scale(.97)}
.artist .cov,.cov.round{border-radius:50%!important}
.row .cov.c52{width:52px;height:52px;border-radius:10px}

/* Détail */
.hero{display:flex;gap:16px;padding:6px 16px 14px;align-items:flex-end}
.hero .cov{width:132px;height:132px;border-radius:14px;flex:none;box-shadow:0 12px 30px #0008}
.hero.round .cov{border-radius:50%}
.hero h2{margin:0 0 4px;font-size:22px;line-height:1.15;word-break:break-word}
.hero p{margin:0;color:var(--tx2);font-size:13.5px}
.back{display:flex;align-items:center;gap:4px;color:var(--tx2);padding:4px 12px 8px;font-weight:600}
.sect{font-size:13px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.8px;padding:16px 16px 6px}
.hscroll{display:flex;gap:12px;overflow-x:auto;padding:0 16px 6px;scrollbar-width:none}
.hscroll .card{width:130px;flex:none}

/* Listes */
.lrow .cov{display:grid;place-items:center;font-size:22px}
.empty{padding:48px 28px;text-align:center;color:var(--tx2)}
.empty .big{font-size:52px;margin-bottom:10px}
.empty h3{color:var(--tx);margin:0 0 6px}

/* Onglets */
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:#121016f2;backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:4px 4px calc(4px + var(--safe-b));z-index:20}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;color:var(--tx3);font-weight:600}
nav.tabs button.on{color:var(--tx)}
nav.tabs button.on .ic{color:var(--acc)}

/* Mini lecteur */
#mini{position:fixed;left:8px;right:8px;bottom:calc(62px + var(--safe-b));display:none;align-items:center;gap:10px;padding:7px 8px 7px 7px;border-radius:14px;background:color-mix(in srgb,var(--acc) 22%,#1d1a22);box-shadow:0 10px 30px #000a;z-index:21;overflow:hidden;cursor:pointer}
#mini.on{display:flex}
#mini .cov{width:44px;height:44px;border-radius:9px;flex:none}
#mini .meta{flex:1;min-width:0}
#mini .t{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini .s{font-size:12.5px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini .prog{position:absolute;left:10px;right:10px;bottom:2px;height:2px;background:#ffffff22;border-radius:2px}
#mini .prog i{display:block;height:100%;background:var(--tx);border-radius:2px;width:0}
#mini .iconbtn{color:var(--tx)}

/* Lecteur plein écran */
#player{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);background:var(--bg);overflow:hidden}
#player.on{transform:none}
#player .bgart{position:absolute;inset:-40px;background:center/cover;filter:blur(50px) saturate(1.4) brightness(.45);opacity:.9;transform:scale(1.2);transition:background-image .4s}
#player .bgshade{position:absolute;inset:0;background:linear-gradient(#0000 0%,#121016cc 60%,#121016 100%)}
#player .in{position:relative;flex:1;display:flex;flex-direction:column;padding:calc(10px + var(--safe-t)) 22px calc(18px + var(--safe-b));max-width:520px;width:100%;margin:0 auto;min-height:0}
.ptop{display:flex;align-items:center;justify-content:space-between}
.ptop .lbl{font-size:12px;color:var(--tx2);text-transform:uppercase;letter-spacing:1px;text-align:center;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
.bigwrap{flex:1;display:grid;place-items:center;min-height:0;padding:14px 0}
.bigcov{width:min(100%,46vh,420px);aspect-ratio:1;border-radius:18px;box-shadow:0 24px 60px #000c;transition:transform .35s;touch-action:pan-y}
.paused .bigcov{transform:scale(.9)}
.pinfo{display:flex;align-items:center;gap:10px;margin-top:4px}
.pinfo .meta{flex:1;min-width:0}
.pinfo h2{margin:0;font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pinfo p{margin:2px 0 0;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fav.on{color:var(--acc)}
.fav.on .ic{fill:var(--acc)}
.seek{margin:18px 0 4px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:5px;background:linear-gradient(90deg,var(--tx) var(--p,0%),#ffffff2e var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#fff;margin-top:-5px;box-shadow:0 2px 6px #0008}
input[type=range]::-moz-range-track{height:5px;border-radius:5px;background:#ffffff2e}
input[type=range]::-moz-range-progress{height:5px;border-radius:5px;background:var(--tx)}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:#fff;border:0}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--tx2);font-variant-numeric:tabular-nums}
.ctrls{display:flex;align-items:center;justify-content:space-between;margin:14px 0 10px}
.ctrls .iconbtn{width:52px;height:52px;color:var(--tx)}
.ctrls .iconbtn .ic{width:28px;height:28px}
.ctrls .sm{color:var(--tx2)}
.ctrls .sm.on{color:var(--acc)}
.ctrls .sm .ic{width:22px;height:22px}
.playbig{width:74px;height:74px;border-radius:50%;background:#fff;color:#121016;display:grid;place-items:center;box-shadow:0 10px 30px #0008}
.playbig .ic{width:32px;height:32px}
.playbig:active{transform:scale(.94)}
.rep1{position:relative}
.rep1::after{content:"1";position:absolute;font-size:9px;font-weight:800;top:13px;left:50%;transform:translateX(-50%);color:var(--acc)}
.pbottom{display:flex;justify-content:space-around;margin-top:6px}
.pbottom button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--tx2);padding:6px 10px;border-radius:10px}
.pbottom button.on{color:var(--acc)}

/* Feuilles (menus) */
.scrim{position:fixed;inset:0;background:#0009;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--bg2);border-radius:20px 20px 0 0;padding:8px 0 calc(12px + var(--safe-b));transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-height:82vh;display:flex;flex-direction:column;max-width:620px;margin:0 auto}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:#ffffff30;margin:2px auto 8px}
.sheet .hd{display:flex;gap:12px;align-items:center;padding:4px 18px 10px;border-bottom:1px solid var(--line)}
.sheet .hd .cov{width:48px;height:48px;border-radius:8px;flex:none}
.sheet .hd .t{font-weight:700}
.sheet .hd .s{color:var(--tx2);font-size:13px}
.sheet .body{overflow-y:auto;padding:4px 0}
.mi{display:flex;align-items:center;gap:14px;padding:13px 20px;width:100%;text-align:left;font-size:15px}
.mi:active{background:var(--bg3)}
.mi .ic{color:var(--tx2)}
.mi.danger{color:#ff7b7b}.mi.danger .ic{color:#ff7b7b}
.mi .r{margin-left:auto;color:var(--tx3);font-size:13px}
.mi.sel{color:var(--acc)}.mi.sel .ic{color:var(--acc)}
.field{padding:8px 18px}
.field input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);outline:0}
.field input:focus{border-color:var(--acc)}
.btns{display:flex;gap:10px;padding:10px 18px 4px;justify-content:flex-end}

/* Aide */
.help{padding:0 18px 20px}
.help h3{margin:20px 0 6px;font-size:16px;display:flex;align-items:center;gap:8px}
.help p,.help li{color:var(--tx2);margin:4px 0}
.help ul{padding-left:20px;margin:4px 0}
.help b{color:var(--tx)}

/* Accès */
.gate{padding:40px 26px;text-align:center}
.gate .big{width:96px;height:96px;margin:10px auto 18px;border-radius:28px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font-size:46px;box-shadow:0 16px 40px #ff7a5944}
.gate h2{margin:0 0 8px}
.gate p{color:var(--tx2);margin:0 auto 18px;max-width:380px}
.drop{border:2px dashed #ffffff26;border-radius:18px;padding:26px 16px;margin:16px;text-align:center;color:var(--tx2)}
.drop.over{border-color:var(--acc);background:#ff7a5910}

#toast{position:fixed;left:50%;bottom:calc(140px + var(--safe-b));transform:translateX(-50%) translateY(20px);background:#2d2834;color:var(--tx);padding:10px 16px;border-radius:12px;font-size:14px;z-index:90;opacity:0;transition:.25s;pointer-events:none;max-width:88vw;text-align:center;box-shadow:0 8px 24px #0008}
#toast.on{opacity:1;transform:translateX(-50%)}
.hidden{display:none!important}
.alpha{position:fixed;right:2px;top:120px;bottom:150px;display:flex;flex-direction:column;justify-content:space-between;font-size:10px;font-weight:700;color:var(--tx3);z-index:6;padding:0 4px;touch-action:none;user-select:none}
.loading{padding:40px;text-align:center;color:var(--tx2)}
.spin{width:30px;height:30px;border:3px solid #ffffff22;border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (min-width:900px){
  main{padding-left:max(0px,calc((100vw - 900px)/2));padding-right:max(0px,calc((100vw - 900px)/2))}
  #mini{left:50%;transform:translateX(-50%);width:min(880px,calc(100vw - 16px))}
}
</style>

<script>
"use strict";
/* ============ Outils ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = ms => { ms = Math.max(0, Math.round((ms || 0) / 1000)); const h = Math.floor(ms / 3600), m = Math.floor(ms % 3600 / 60), s = ms % 60; return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s).padStart(2, "0"); };
const fmtLong = ms => { const m = Math.max(ms ? 1 : 0, Math.round((ms || 0) / 60000)); return m >= 60 ? Math.floor(m / 60) + " h " + String(m % 60).padStart(2, "0") : m + " min"; };
const norm = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const UNK_A = "Artiste inconnu", UNK_AL = "Album inconnu";
const pl = (n, w, ws) => n + " " + (n > 1 ? (ws || w + "s") : w);
const icon = (n, cls) => `<svg class="ic ${cls || ""}"><use href="#i-${n}"/></svg>`;
let toastT;
function toast(t) { const e = $("#toast"); e.textContent = t; e.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => e.classList.remove("on"), 2400); }
function hash(s) { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); }

/* ============ Stockage ============ */
const LS = "melodie:v1";
let ST = { fav: [], lists: [], counts: {}, recent: [], last: null, sort: "t", shuffle: false, repeat: 0 };
try { Object.assign(ST, JSON.parse(localStorage.getItem(LS) || "{}")); } catch (e) {}
let saveT;
function save() { clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem(LS, JSON.stringify(ST)); } catch (e) {} }, 300); }

const IDB = (() => {
  let dbp;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    try { const r = indexedDB.open("melodie", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }
    catch (e) { rej(e); }
  }));
  const tx = (mode, fn) => open().then(db => new Promise((res, rej) => { const t = db.transaction("kv", mode), s = t.objectStore("kv"); const r = fn(s); t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); }));
  return {
    get: k => tx("readonly", s => s.get(k)).catch(() => undefined),
    set: (k, v) => tx("readwrite", s => s.put(v, k)).catch(() => {}),
    del: k => tx("readwrite", s => s.delete(k)).catch(() => {}),
    keys: () => tx("readonly", s => s.getAllKeys()).catch(() => [])
  };
})();

/* ============ Pont Android ============ */
let MP = window.MAGPrint;
let NATIVE = !!(MP && MP.musicScan);

/* ============ Bibliothèque ============ */
let TR = [];                 // tous les titres
let BYID = new Map();
let ALBUMS = [], ARTISTS = [], FOLDERS = [];
const akey = t => NATIVE ? "n" + t.alb : "w" + norm(t.al) + "|" + norm(t.aa || t.a);

function index() {
  BYID = new Map(TR.map(t => [String(t.id), t]));
  const am = new Map(), ar = new Map(), fm = new Map();
  for (const t of TR) {
    t.a = t.a && t.a !== "<unknown>" ? t.a : UNK_A;
    t.al = t.al || UNK_AL;
    t.t = t.t || (t.fn || "Sans titre").replace(/\.[^.]+$/, "");
    t._s = norm(t.t + " " + t.a + " " + t.al);
    const k = akey(t);
    if (!am.has(k)) am.set(k, { k, al: t.al, a: t.aa || t.a, y: t.y || 0, tracks: [], rep: t });
    const A = am.get(k); A.tracks.push(t); if (t.y && !A.y) A.y = t.y; if (A.a !== (t.aa || t.a)) A.mixed = true;
    for (const name of splitArtists(t.a)) {
      const ak = norm(name);
      if (!ar.has(ak)) ar.set(ak, { k: ak, name, tracks: [], albums: new Set() });
      ar.get(ak).tracks.push(t); ar.get(ak).albums.add(k);
    }
    const f = t.f || "Musique";
    if (!fm.has(f)) fm.set(f, { k: f, name: f.split("/").filter(Boolean).pop() || f, path: f, tracks: [] });
    fm.get(f).tracks.push(t);
  }
  ALBUMS = [...am.values()];
  for (const A of ALBUMS) { if (A.mixed) A.a = "Artistes variés"; A.tracks.sort((x, y) => (x.tr % 1000 || 999) - (y.tr % 1000 || 999) || x.t.localeCompare(y.t)); }
  ALBUMS.sort((x, y) => (x.al === UNK_AL) - (y.al === UNK_AL) || x.al.localeCompare(y.al, "fr", { sensitivity: "base" }));
  ARTISTS = [...ar.values()].sort((x, y) => (x.name === UNK_A) - (y.name === UNK_A) || x.name.localeCompare(y.name, "fr", { sensitivity: "base" }));
  FOLDERS = [...fm.values()].sort((x, y) => x.name.localeCompare(y.name, "fr", { sensitivity: "base" }));
}
function splitArtists(a) {
  if (!a || a === UNK_A) return [UNK_A];
  const parts = a.split(/\s*(?:;|\/|,|\s&\s|\sfeat\.?\s|\sft\.?\s|\sfeaturing\s)\s*/i).map(s => s.trim()).filter(Boolean);
  return parts.length ? parts.slice(0, 4) : [a];
}
function sortedTracks(list, by) {
  const L = list.slice(), c = (x, y) => String(x).localeCompare(String(y), "fr", { sensitivity: "base" });
  if (by === "a") L.sort((x, y) => c(x.a, y.a) || c(x.al, y.al) || (x.tr % 1000) - (y.tr % 1000));
  else if (by === "al") L.sort((x, y) => c(x.al, y.al) || (x.tr % 1000) - (y.tr % 1000));
  else if (by === "add") L.sort((x, y) => (y.add || 0) - (x.add || 0));
  else if (by === "d") L.sort((x, y) => (y.d || 0) - (x.d || 0));
  else if (by === "n") L.sort((x, y) => (ST.counts[y.id] || 0) - (ST.counts[x.id] || 0));
  else L.sort((x, y) => c(x.t, y.t));
  return L;
}

/* ============ Pochettes ============ */
const ART = new Map();      // clé album -> url (ou "" si aucune)
const artQ = []; let artBusy = false;
const PALETTE = [["#ff7a59","#7b2ff7"],["#00c6ff","#0072ff"],["#f7971e","#ffd200"],["#ee0979","#ff6a00"],["#11998e","#38ef7d"],["#8e2de2","#4a00e0"],["#fc5c7d","#6a82fb"],["#e96443","#904e95"],["#3a7bd5","#00d2ff"],["#c94b4b","#4b134f"]];
function genCover(name) {
  const p = PALETTE[hash(name) % PALETTE.length];
  const ini = String(name || "?").replace(/[^\p{L}\p{N} ]/gu, "").split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("") || "♪";
  return { bg: `linear-gradient(135deg,${p[0]},${p[1]})`, ini };
}
function covHTML(t, cls, size) {
  const k = t ? akey(t) : "";
  const name = t ? t.al !== UNK_AL ? t.al : t.t : "♪";
  const g = genCover(name);
  const u = ART.get("c:" + k) || ART.get(k);
  const fs = Math.round((size || 46) * .36);
  if (u) return `<div class="cov ${cls || ""}" data-ak="${esc(k)}" style="background-image:url('${u}')"></div>`;
  if (t && !ART.has(k)) queueArt(t);
  return `<div class="cov gen ${cls || ""}" data-ak="${esc(k)}" data-ini="${esc(g.ini)}" style="background-image:${g.bg};font-size:${fs}px">${esc(g.ini)}</div>`;
}
const ARTV = "art2:";   // nouvelle version : les pochettes non trouvées avant sont recherchées à nouveau
function nativeArt(t) {
  try { return (MP.musicArt2 ? MP.musicArt2(String(t.alb), String(t.id), 320) : MP.musicArt(String(t.alb), 320)) || ""; } catch (e) { return ""; }
}
function queueArt(t) { const k = akey(t); if (ART.has(k) || artQ.some(x => akey(x) === k)) return; artQ.push(t); pumpArt(); }
async function pumpArt() {
  if (artBusy) return; artBusy = true;
  while (artQ.length) {
    const t = artQ.shift(), k = akey(t);
    if (ART.has(k)) continue;
    let u = await IDB.get(ARTV + k);
    if (u === undefined && NATIVE && t.alb != null) {
      u = nativeArt(t);
      IDB.set(ARTV + k, u);
    }
    ART.set(k, u || "");
    if (u) applyArt(k, u);
    await new Promise(r => setTimeout(r, 0));
  }
  artBusy = false;
}
function applyArt(k, u) {
  document.querySelectorAll(`.cov[data-ak="${CSS.escape(k)}"]`).forEach(e => { e.classList.remove("gen"); e.textContent = ""; e.style.backgroundImage = `url('${u}')`; });
  const cur = curTrack(); if (cur && akey(cur) === k) paintNow();
}
async function loadCustomArt() {
  const keys = await IDB.keys();
  for (const key of keys) if (String(key).startsWith("cart:")) { const u = await IDB.get(key); if (u) ART.set("c:" + key.slice(5), u); }
}
function artUrl(t) { if (!t) return ""; const k = akey(t); return ART.get("c:" + k) || ART.get(k) || ""; }
async function ensureArt(t) {
  const k = akey(t); if (ART.has(k) || ART.has("c:" + k)) return artUrl(t);
  artQ.unshift(t); await pumpArt(); return artUrl(t);
}

/* ============ Lecture ============ */
const P = { queue: [], i: -1, playing: false, pos: 0, dur: 0, shuffle: !!ST.shuffle, repeat: ST.repeat || 0, sleepAt: 0, from: "", order: [], op: 0 };
const audio = $("#audio");
let webUrl = null, sleepTimer = null, lastCounted = null;
const curTrack = () => BYID.get(String(P.queue[P.i]));
const q2native = ids => JSON.stringify(ids.map(id => { const t = BYID.get(String(id)); return { id: Number(id), alb: t.alb, d: t.d || 0, t: t.t, a: t.a, al: t.al }; }));

function playList(list, start, from) {
  if (!list.length) return;
  P.queue = list.map(t => String(t.id)); P.from = from || "";
  let i = Math.max(0, start || 0);
  if (start === -1) i = Math.floor(Math.random() * list.length);
  P.i = i;
  ST.last = { queue: P.queue, i: P.i, pos: 0, from: P.from }; save();
  if (NATIVE) { MP.musicPlay(q2native(P.queue), i, 0); P.playing = true; }
  else { buildOrder(i); webLoad(true); }
  counted(); paintNow(); renderCurrentMarks();
}
function shuffleAll(list, from) { if (!list.length) return; setShuffle(true); playList(list, -1, from); }
function toggle() {
  if (P.i < 0) { if (TR.length) playList(sortedTracks(TR, ST.sort), 0, "Tous les titres"); return; }
  if (NATIVE) {
    const st = nativeState();
    if (!st.alive || st.n !== P.queue.length) { MP.musicPlay(q2native(P.queue), P.i, P.pos || 0); P.playing = true; }
    else { MP.musicCmd("toggle", 0); P.playing = !P.playing; }
  } else {
    if (!audio.src) webLoad(true, P.pos);
    else if (audio.paused) audio.play().catch(() => {}); else audio.pause();
  }
  paintPlay();
}
function next() { if (P.i < 0) return; if (NATIVE) MP.musicCmd("next", 0); else webStep(1, true); }
function prev() { if (P.i < 0) return; if (NATIVE) MP.musicCmd("prev", 0); else { if (audio.currentTime > 4) audio.currentTime = 0; else webStep(-1, true); } }
function seek(ms) { P.pos = ms; if (NATIVE) MP.musicCmd("seek", Math.round(ms)); else if (audio.src) audio.currentTime = ms / 1000; }
function jump(i) {
  P.i = i; P.pos = 0;
  if (NATIVE) { const st = nativeState(); if (!st.alive || st.n !== P.queue.length) MP.musicPlay(q2native(P.queue), i, 0); else MP.musicCmd("jump", i); P.playing = true; }
  else { const k = P.order.indexOf(i); if (k >= 0) P.op = k; else buildOrder(i); webLoad(true); }
  counted(); paintNow(); renderCurrentMarks();
}
function setShuffle(on) {
  P.shuffle = on; ST.shuffle = on; save();
  if (NATIVE) MP.musicCmd("shuffle", on ? 1 : 0); else buildOrder(P.i < 0 ? 0 : P.i);
  paintModes();
}
function setRepeat(m) { P.repeat = m; ST.repeat = m; save(); if (NATIVE) MP.musicCmd("repeat", m); paintModes(); }
function setSleep(min) {
  P.sleepAt = min > 0 ? Date.now() + min * 60000 : (min === -1 ? -1 : 0);
  if (NATIVE) MP.musicCmd("sleep", min > 0 ? min : 0);
  clearTimeout(sleepTimer);
  if (min > 0 && !NATIVE) sleepTimer = setTimeout(() => { audio.pause(); P.sleepAt = 0; paintModes(); }, min * 60000);
  toast(min > 0 ? `Arrêt de la musique dans ${min} min` : min === -1 ? "Arrêt à la fin de ce titre" : "Minuterie désactivée");
  paintModes();
}
// File d'attente
function playNext(ids) {
  ids = ids.map(String);
  if (P.i < 0) { playList(ids.map(id => BYID.get(id)), 0, "File d'attente"); return; }
  P.queue.splice(P.i + 1, 0, ...ids); syncQueue(); toast(ids.length > 1 ? ids.length + " titres lus ensuite" : "Sera lu ensuite");
}
function addQueue(ids) {
  ids = ids.map(String);
  if (P.i < 0) { playList(ids.map(id => BYID.get(id)), 0, "File d'attente"); return; }
  P.queue.push(...ids); syncQueue(); toast(ids.length > 1 ? ids.length + " titres ajoutés à la file" : "Ajouté à la file d'attente");
}
function removeFromQueue(i) {
  if (i === P.i) { if (P.queue.length === 1) return; P.queue.splice(i, 1); if (P.i >= P.queue.length) P.i = 0; jump(P.i); return; }
  P.queue.splice(i, 1); if (i < P.i) P.i--; syncQueue();
}
function syncQueue() {
  ST.last = { queue: P.queue, i: P.i, pos: P.pos, from: P.from }; save();
  if (NATIVE) { const st = nativeState(); if (st.alive) { if (MP.musicQueue) MP.musicQueue(q2native(P.queue), P.i); else MP.musicPlay(q2native(P.queue), P.i, Math.round(st.pos || P.pos)); } }
  else buildOrder(P.i);
}

/* -- navigateur (PC, version en ligne) -- */
function buildOrder(start) {
  P.order = P.queue.map((_, k) => k);
  if (P.shuffle) { for (let k = P.order.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [P.order[k], P.order[j]] = [P.order[j], P.order[k]]; } const s = P.order.indexOf(start); if (s > 0) { P.order.splice(s, 1); P.order.unshift(start); } P.op = 0; }
  else P.op = Math.max(0, start);
}
async function webLoad(play, startMs) {
  const t = curTrack(); if (!t) return;
  const blob = await IDB.get("blob:" + t.id);
  if (!blob) { toast("Fichier introuvable : " + t.t); return; }
  if (webUrl) URL.revokeObjectURL(webUrl);
  webUrl = URL.createObjectURL(blob);
  audio.src = webUrl;
  if (startMs) audio.addEventListener("loadedmetadata", () => { audio.currentTime = startMs / 1000; }, { once: true });
  if (play) audio.play().catch(() => { P.playing = false; paintPlay(); });
  mediaSessionMeta();
}
function webStep(dir, user) {
  if (!P.queue.length) return;
  P.op += dir;
  if (P.op >= P.order.length) { if (P.repeat === 1 || user) P.op = 0; else { P.op = 0; P.i = P.order[0]; webLoad(false); counted(); paintNow(); renderCurrentMarks(); return; } }
  if (P.op < 0) P.op = P.repeat === 1 ? P.order.length - 1 : 0;
  P.i = P.order[P.op]; P.pos = 0; webLoad(true); counted(); paintNow(); renderCurrentMarks();
}
audio.addEventListener("play", () => { P.playing = true; paintPlay(); });
audio.addEventListener("pause", () => { P.playing = false; paintPlay(); });
audio.addEventListener("timeupdate", () => { P.pos = audio.currentTime * 1000; P.dur = (audio.duration || 0) * 1000; paintProgress(); });
audio.addEventListener("loadedmetadata", () => { const t = curTrack(); if (t && !t.d && audio.duration) { t.d = audio.duration * 1000; saveWebMeta(); } });
audio.addEventListener("ended", () => {
  if (P.sleepAt === -1) { P.sleepAt = 0; paintModes(); P.playing = false; paintPlay(); return; }
  if (P.repeat === 2) { audio.currentTime = 0; audio.play(); } else webStep(1, false);
});
audio.addEventListener("error", () => { if (audio.src) setTimeout(() => webStep(1, false), 600); });
function mediaSessionMeta() {
  if (!("mediaSession" in navigator)) return;
  const t = curTrack(); if (!t) return;
  const u = artUrl(t);
  try {
    navigator.mediaSession.metadata = new MediaMetadata({ title: t.t, artist: t.a, album: t.al, artwork: u ? [{ src: u, sizes: "512x512", type: "image/jpeg" }] : [] });
  } catch (e) {}
}
if ("mediaSession" in navigator) {
  const ms = navigator.mediaSession, set = (a, f) => { try { ms.setActionHandler(a, f); } catch (e) {} };
  set("play", () => audio.play()); set("pause", () => audio.pause());
  set("nexttrack", () => next()); set("previoustrack", () => prev());
  set("seekto", d => seek(d.seekTime * 1000));
}

/* -- Android -- */

      const d = x.getImageData(0, 0, 24, 24).data; let best = null, bs = -1;

    im.onload = () => { const s = Math.min(im.width, im.height), c = document.createElement("canvas"); c.width = c.height = size; c.getContext("2d").drawImage(im, (im.width - s) / 2, (im.height - s) / 2, s, s, 0, 0, size, size); URL.revokeObjectURL(u); res(c.toDataURL("image/jpeg", .86)); };
    im.onerror = () => res(""); im.src = u;
  });

/* ===== Recherche des pochettes manquantes ===== */
let coverStop = false;
async function findCovers(list, force) {
  if (!list.length) return;
  coverStop = false;
  SH = { stop: () => { coverStop = true; } };
  sheet(`<div class="hd"><div style="flex:1"><div class="t">Recherche des pochettes</div><div class="s" id="cvS">Vérification des pochettes déjà présentes…</div></div></div><div style="padding:14px 18px"><div style="height:6px;border-radius:6px;background:var(--bg3);overflow:hidden"><i id="cvP" style="display:block;height:100%;width:0;background:var(--acc);transition:width .3s"></i></div></div><div class="btns"><button class="pill" data-sh="stop">Arrêter</button></div>`);
  const S = (t, p) => { const e = $("#cvS"); if (e) e.textContent = t; const b = $("#cvP"); if (b && p != null) b.style.width = Math.round(p * 100) + "%"; };
  const hasCustom = A => ART.has("c:" + A.k);
  // 1) d'abord dans les fichiers du téléphone (chaque morceau de l'album)
  const todo = [];
  let i = 0;
  for (const A of list) {
    i++; if (coverStop) break;
    if (!force && (artUrl(A.rep) || hasCustom(A))) continue;
    if (!force && NATIVE) {
      if (!ART.has(A.k)) { const u = nativeArt(A.rep); ART.set(A.k, u); IDB.set(ARTV + A.k, u); if (u) { applyArt(A.k, u); continue; } }
      let found = "";
      for (const t of A.tracks.slice(0, 6)) { if (t === A.rep) continue; found = nativeArt(t); if (found) break; }
      if (found) { ART.set(A.k, found); IDB.set(ARTV + A.k, found); applyArt(A.k, found); continue; }
    }
    if (A.al === UNK_AL && A.a === UNK_A) continue;
    todo.push(A);
    if (i % 10 === 0) { S(`Vérification… ${i} / ${list.length}`, i / list.length * .2); await new Promise(r => setTimeout(r, 0)); }
  }
  let ok = 0, done = 0;
  const finish = () => {
    closeSheet();
    SH = {};
    setTimeout(() => sheet(`<div style="padding:24px 22px;text-align:center"><div style="font-size:46px">${ok ? "🖼️" : "🔍"}</div><h3 style="margin:8px 0">${!todo.length ? "Toutes les pochettes sont déjà là" : ok ? pl(ok, "pochette trouvée", "pochettes trouvées") : "Aucune pochette trouvée"}</h3><p style="color:var(--tx2);margin:0">${todo.length && ok < todo.length ? `${pl(todo.length - ok, "album")} sans résultat : vérifiez le nom de l'album et de l'artiste, ou ajoutez une photo avec le menu ⋮ de l'album.` : ""}</p><div class="btns" style="justify-content:center"><button class="pill main" data-sh="x">Parfait</button></div></div>`), 250);
    SH = { x: () => {} };
    if (curView === "albums") render.albums();
    paintNow();
  };
  if (!todo.length || coverStop) { finish(); return; }
  S(`Recherche sur Internet : 0 / ${todo.length}`, .2);
  const artistOf = A => A.a === "Artistes variés" ? A.rep.a : A.a;
  if (NATIVE && MP.musicCoverSearch) {
    for (const A of todo) MP.musicCoverSearch(String(A.rep.alb), artistOf(A) === UNK_A ? "" : artistOf(A), A.al === UNK_AL ? "" : A.al, A.rep.t, !!force);
    const pending = new Set(todo.map(A => String(A.rep.alb)));
    const t0 = Date.now();
    while (pending.size && !coverStop && Date.now() - t0 < 60000 + todo.length * 3000) {
      await new Promise(r => setTimeout(r, 700));
      let st = {}; try { st = JSON.parse(MP.musicCoverState() || "{}"); } catch (e) {}
      for (const id of [...pending]) {
        const v = st[id]; if (!v || v === "wait") continue;
        pending.delete(id); done++;
        if (v === "ok") {
          const A = todo.find(x => String(x.rep.alb) === id);
          const u = nativeArt(A.rep);
          if (u) { ok++; ART.set(A.k, u); await IDB.set(ARTV + A.k, u); if (hasCustom(A) && force) { ART.delete("c:" + A.k); IDB.del("cart:" + A.k); } applyArt(A.k, u); ST.dl = [...new Set([...(ST.dl || []), A.k])]; }
        }
      }
      S(`Recherche sur Internet : ${done} / ${todo.length} · ${pl(ok, "trouvée", "trouvées")}`, .2 + .8 * done / todo.length);
    }
    save();
  } else {
    for (const A of todo) {
      if (coverStop) break;
      try {
        const term = encodeURIComponent((artistOf(A) === UNK_A ? "" : artistOf(A)) + " " + (A.al === UNK_AL ? A.rep.t : A.al));
        const r = await fetch(`https://itunes.apple.com/search?media=music&entity=${A.al === UNK_AL ? "song" : "album"}&limit=5&term=${term}`);
        const j = await r.json();
        const hit = (j.results || [])[0];
        if (hit && hit.artworkUrl100) { const u = hit.artworkUrl100.replace("100x100bb", "600x600bb"); ok++; ART.set("c:" + A.k, u); await IDB.set("cart:" + A.k, u); applyArt(A.k, u); }
      } catch (e) { if (done === 0) { toast("Recherche sur Internet impossible depuis cette version"); break; } }
      done++; S(`Recherche sur Internet : ${done} / ${todo.length} · ${pl(ok, "trouvée", "trouvées")}`, .2 + .8 * done / todo.length);
    }
  }
  finish();
}

/* Lecture des étiquettes ID3 (titre, artiste, album, pochette) */
async function readTags(file) {
  const head = new Uint8Array(await file.slice(0, 10).arrayBuffer());
  if (head[0] === 0x66 && head[1] === 0x4C && head[2] === 0x61 && head[3] === 0x43) return readFlac(file);
  if (!(head[0] === 0x49 && head[1] === 0x44 && head[2] === 0x33)) return {};
  const ver = head[3], flags = head[5];
  const size = (head[6] & 127) << 21 | (head[7] & 127) << 14 | (head[8] & 127) << 7 | (head[9] & 127);
  const buf = new Uint8Array(await file.slice(10, 10 + Math.min(size, 8e6)).arrayBuffer());
  const out = {}; let p = 0;
  if (flags & 0x40) { const ext = ver === 4 ? ((buf[0] & 127) << 21 | (buf[1] & 127) << 14 | (buf[2] & 127) << 7 | (buf[3] & 127)) : ((buf[0] << 24 | buf[1] << 16 | buf[2] << 8 | buf[3]) + 4); p = ext; }
  const dec = (enc, b) => {
    try {
      if (enc === 0) return new TextDecoder("latin1").decode(b);
      if (enc === 1) return new TextDecoder(b[0] === 0xFE ? "utf-16be" : "utf-16le").decode(b[0] === 0xFF || b[0] === 0xFE ? b.subarray(2) : b);
      if (enc === 2) return new TextDecoder("utf-16be").decode(b);
      return new TextDecoder("utf-8").decode(b);
    } catch (e) { return ""; }
  };
  const clean = s => s.replace(/\0+$/, "").split("\0")[0].trim();
  const v2 = ver === 2, idLen = v2 ? 3 : 4, hLen = v2 ? 6 : 10;
  while (p + hLen < buf.length) {
    const id = String.fromCharCode(...buf.subarray(p, p + idLen));
    if (!/^[A-Z0-9]{3,4}$/.test(id)) break;
    let len = v2 ? (buf[p + 3] << 16 | buf[p + 4] << 8 | buf[p + 5]) : ver === 4 ? ((buf[p + 4] & 127) << 21 | (buf[p + 5] & 127) << 14 | (buf[p + 6] & 127) << 7 | (buf[p + 7] & 127)) : (buf[p + 4] << 24 | buf[p + 5] << 16 | buf[p + 6] << 8 | buf[p + 7]);
    const body = buf.subarray(p + hLen, p + hLen + len);
    p += hLen + len;
    if (!len || !body.length) continue;
    const txt = () => clean(dec(body[0], body.subarray(1)));
    if (id === "TIT2" || id === "TT2") out.t = txt();
    else if (id === "TPE1" || id === "TP1") out.a = txt();
    else if (id === "TPE2" || id === "TP2") out.aa = txt();
    else if (id === "TALB" || id === "TAL") out.al = txt();
    else if (id === "TRCK" || id === "TRK") out.tr = parseInt(txt()) || 0;
    else if (id === "TYER" || id === "TDRC" || id === "TYE") out.y = parseInt(txt()) || 0;
    else if ((id === "APIC" || id === "PIC") && !out.pic) {
      const enc = body[0]; let q = 1, mime = "image/jpeg";
      if (v2) { mime = String.fromCharCode(...body.subarray(1, 4)).toLowerCase() === "png" ? "image/png" : "image/jpeg"; q = 4; }
      else { let e = q; while (e < body.length && body[e]) e++; mime = String.fromCharCode(...body.subarray(q, e)) || mime; q = e + 1; }
      q++; // type d'image
      if (enc === 1 || enc === 2) { while (q + 1 < body.length && !(body[q] === 0 && body[q + 1] === 0)) q += 2; q += 2; } else { while (q < body.length && body[q]) q++; q++; }
      if (!/image/.test(mime)) mime = "image/jpeg";
      out.pic = new Blob([body.subarray(q)], { type: mime });
    }
  }
  return out;
}
async function readFlac(file) {
  const buf = new Uint8Array(await file.slice(0, 4e6).arrayBuffer()); const out = {}; let p = 4;
  const u32 = (o, le) => le ? (buf[o] | buf[o + 1] << 8 | buf[o + 2] << 16 | buf[o + 3] << 24) >>> 0 : (buf[o] << 24 | buf[o + 1] << 16 | buf[o + 2] << 8 | buf[o + 3]) >>> 0;
  const td = new TextDecoder("utf-8");
  while (p + 4 < buf.length) {
    const last = buf[p] & 128, type = buf[p] & 127, len = buf[p + 1] << 16 | buf[p + 2] << 8 | buf[p + 3]; const b = p + 4;
    if (type === 4) {
      let q = b; const vl = u32(q, 1); q += 4 + vl; const n = u32(q, 1); q += 4;
      for (let i = 0; i < n && q < b + len; i++) { const l = u32(q, 1); q += 4; const s = td.decode(buf.subarray(q, q + l)); q += l; const k = s.indexOf("="); const key = s.slice(0, k).toUpperCase(), v = s.slice(k + 1);
        if (key === "TITLE") out.t = v; else if (key === "ARTIST" && !out.a) out.a = v; else if (key === "ALBUM") out.al = v; else if (key === "ALBUMARTIST") out.aa = v; else if (key === "TRACKNUMBER") out.tr = parseInt(v) || 0; else if (key === "DATE") out.y = parseInt(v) || 0; }
    } else if (type === 6 && !out.pic) {
      let q = b + 4; const ml = u32(q); q += 4; const mime = td.decode(buf.subarray(q, q + ml)); q += ml; const dl = u32(q); q += 4 + dl + 16; const pl = u32(q); q += 4;
      out.pic = new Blob([buf.subarray(q, q + pl)], { type: mime || "image/jpeg" });
    }
    p = b + len; if (last) break;
  }
  return out;
}

/* ============ Commandes venues de la tuile Musique de Socle ============ */
// {play:1} : reprendre la dernière écoute (ou tout lire) ; skip:"next"/"prev" ; back:1 = revenir à Socle ensuite
let SOCLE_Q = null, LIB_READY = false;
window.onSocle = a => { try { SOCLE_Q = JSON.parse(a); } catch (e) { return; } if (LIB_READY) socleRun(); };
function socleRun() {
  const s = SOCLE_Q; SOCLE_Q = null;
  if (!s || !s.play || !NATIVE || !TR.length) return;
  const st = nativeState();
  if (P.i < 0 || !P.queue.length) playList(sortedTracks(TR, ST.sort), 0, "Tous les titres");
  else if (!(st.alive && st.playing)) { MP.musicPlay(q2native(P.queue), P.i, P.pos || 0); P.playing = true; paintPlay(); }
  if (s.skip === "next") setTimeout(next, 700); else if (s.skip === "prev") setTimeout(prev, 700);
  if (s.back && MP.appBack) setTimeout(() => MP.appBack(), 900);
}

/* ============ Démarrage ============ */
(async function start() {
  if (!NATIVE) { await new Promise(r => setTimeout(r, 200)); MP = window.MAGPrint; NATIVE = !!(MP && MP.musicScan); }
  await loadCustomArt();
  await loadLibrary();
  LIB_READY = true; if (SOCLE_Q) socleRun();
  if (NATIVE) { setInterval(pollNative, 500); document.addEventListener("visibilitychange", () => { if (!document.hidden) pollNative(); }); }
  setInterval(() => { if (P.sleepAt > 0) paintModes(); }, 20000);
})();
