let RL=null, rMap=null, rLayers=[], rIdx=0, rTimer=null;

async function radar(c){ clearInterval(rTimer); const box=$("#radar"); if(!box) return;
  try{ RL=await loadLeaflet(); }catch(e){ box.innerHTML=`<div style="padding:40px 16px;text-align:center" class="muted">Radar indisponible hors connexion (ou dans la version en ligne).</div>`; return; }
  if(rMap){ rMap.remove(); rMap=null; } rMap=RL.map(box,{zoomControl:true,attributionControl:true}).setView([c.lat,c.lng],7);
  RL.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png",{maxZoom:12,attribution:"© OpenStreetMap, © CARTO"}).addTo(rMap);
  RL.circleMarker([c.lat,c.lng],{radius:7,color:"#fff",weight:3,fillColor:"#E5662A",fillOpacity:1}).addTo(rMap);
  try{ const j=await fetchJSON("https://api.rainviewer.com/public/weather-maps.json"); const frames=[...(j.radar?.past||[]),...(j.radar?.nowcast||[])]; if(!frames.length) throw 0;
    rLayers=frames.map(f=>({t:f.time,fut:(j.radar.nowcast||[]).includes(f),l:RL.tileLayer(`${j.host}${f.path}/256/{z}/{x}/{y}/2/1_1.png`,{opacity:0,maxNativeZoom:7,maxZoom:12,zIndex:5})}));
    rLayers.forEach(x=>x.l.addTo(rMap)); rIdx=(j.radar.past||[]).length-1; const sl=$("#rSlider"); sl.max=rLayers.length-1; sl.value=rIdx; showFrame(rIdx);
    sl.oninput=e=>{ stopR(); showFrame(+e.target.value); }; $("#rPlay").onclick=()=>{ rTimer?stopR():playR(); }; playR();
  }catch(e){ $("#rTime").textContent="Radar indisponible"; } }
function showFrame(i){ rIdx=i; rLayers.forEach((x,k)=>x.l.setOpacity(k===i?.75:0)); const f=rLayers[i]; if(f){ $("#rTime").textContent=(f.fut?"Prévision ":"")+new Date(f.t*1000).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}); $("#rSlider").value=i; } }
function playR(){ stopR(); $("#rPlay").textContent="⏸ Pause"; rTimer=setInterval(()=>showFrame((rIdx+1)%rLayers.length),700); }
function stopR(){ clearInterval(rTimer); rTimer=null; const b=$("#rPlay"); if(b) b.textContent="▶ Lecture"; }

function locate(){ if(!navigator.geolocation){ toast("Position indisponible"); return; } try{ MP&&MP.askLocation&&MP.askLocation(); }catch(e){} toast("Recherche de votre position…");
  navigator.geolocation.getCurrentPosition(async p=>{ const lat=+p.coords.latitude.toFixed(4), lng=+p.coords.longitude.toFixed(4); let name="Ma position"; try{ const j=await fetchJSON(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lng}&localityLanguage=fr`,6000); name=j.city||j.locality||name; }catch(e){}
    S.gps={name,lat,lng,gps:true}; S.cur=-1; persist(); try{ localStorage.setItem("ciel-gps",JSON.stringify(S.gps)); }catch(e){} show(); },()=>toast("Position refusée : ajoutez une ville à la main"),{timeout:15000,maximumAge:600000}); }
try{ S.gps=JSON.parse(localStorage.getItem("ciel-gps")||"null"); }catch(e){}
function menu(){ const ov=document.createElement("div"); ov.className="overlay"; ov.innerHTML=`<div class="sheet"><h2>Réglages</h2>
  <h3>Mes villes</h3>${S.cities.map((c,i)=>`<div class="row" style="flex-wrap:nowrap"><span class="grow">${esc(c.name)}</span><button class="btn small" data-up="${i}" ${i?"":"disabled"}>▲</button><button class="btn small" data-del="${i}">✕</button></div>`).join("")||`<span class="muted small">Aucune ville enregistrée.</span>`}<span class="muted small">La météo du matin concerne votre position, ou à défaut la première ville de la liste.</span>
  <button class="btn" id="mAdd">＋ Ajouter une ville</button><button class="btn" id="mGps">📍 Actualiser ma position</button>
  ${MP&&MP.scheduleNotif?`<label class="row" style="gap:8px;font-weight:700"><input type="checkbox" id="mMorn" ${S.settings.morning?"checked":""} style="width:22px;height:22px"> 🔔 Météo du jour chaque matin à 7 h</label>`:""}
  <button class="btn" id="mHelp">❓ Aide</button><button class="btn" data-x>Fermer</button></div>`; document.body.appendChild(ov);
  ov.onclick=e=>{ if(e.target===ov||e.target.dataset.x!==undefined) ov.remove(); };
  ov.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{ S.cities.splice(+b.dataset.del,1); S.cur=S.gps?-1:0; persist(); ov.remove(); show(); });
  ov.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>{ const i=+b.dataset.up; [S.cities[i-1],S.cities[i]]=[S.cities[i],S.cities[i-1]]; persist(); ov.remove(); menu(); show(); });
  ov.querySelector("#mAdd").onclick=()=>{ ov.remove(); addCity(); }; ov.querySelector("#mGps").onclick=()=>{ ov.remove(); locate(); }; ov.querySelector("#mHelp").onclick=()=>{ ov.remove(); help(); };
  const mm=ov.querySelector("#mMorn"); if(mm) mm.onchange=e=>{ S.settings.morning=e.target.checked; persist(); if(!S.settings.morning){ try{ MP.cancelNotif(8501); }catch(err){} } toast(S.settings.morning?"Météo du matin activée":"Météo du matin désactivée"); }; }
function scheduleMorning(c,F,al){ if(!(MP&&MP.scheduleNotif)||!S.settings.morning) return; const main=S.gps||S.cities[0]; if(!main||keyOf(main)!==keyOf(c)) return; const n=new Date(), at=new Date(n); at.setHours(7,0,0,0); if(at<=n) at.setDate(at.getDate()+1); const ds=at.toISOString().slice(0,10), D=F.daily, i=D.time.indexOf(`${at.getFullYear()}-${pad(at.getMonth()+1)}-${pad(at.getDate())}`); if(i<0) return;
  try{ MP.scheduleNotif(at-n,`${WMO(D.weather_code[i])[1]} à ${c.name} · ${R(D.temperature_2m_min[i])}° / ${R(D.temperature_2m_max[i])}°`,`Pluie ${D.precipitation_probability_max[i]||0} %, rafales ${R(D.wind_gusts_10m_max[i])} km/h, UV ${R(D.uv_index_max[i]??0)}. Soleil ${hm(D.sunrise[i])}–${hm(D.sunset[i])}.${al.length?" ⚠ "+al.map(a=>a[2]).join(", "):""}`,8501); }catch(e){} }
function shareText(c,F){ const C=F.current, D=F.daily, di=Math.max(0,D.time.indexOf(C.time.slice(0,10))); const t=`Météo à ${c.name} : ${WMO(C.weather_code)[1].toLowerCase()}, ${R(C.temperature_2m)}° (ressenti ${R(C.apparent_temperature)}°). Aujourd'hui ${R(D.temperature_2m_min[di])}° / ${R(D.temperature_2m_max[di])}°, pluie ${D.precipitation_probability_max[di]||0} %. Demain : ${WMO(D.weather_code[di+1])[1].toLowerCase()}, ${R(D.temperature_2m_min[di+1])}° / ${R(D.temperature_2m_max[di+1])}°.`;
  if(navigator.share){ navigator.share({text:t}).catch(()=>{}); return; } try{ navigator.clipboard.writeText(t).then(()=>toast("Météo copiée : collez-la dans un message")).catch(()=>toast(t)); }catch(e){ toast(t); } }
const HELP=[["🏙","Villes et position",["Les boutons en haut changent de ville ; « ＋ Ville » en ajoute une.","📍 utilise votre position (le nom de la commune s'affiche).","☰ : ranger ou retirer les villes, météo du matin, aide."]],
 ["🌤","Lire la météo",["En haut : température, ressenti et ciel animé selon le temps qu'il fait.","« Pluie dans les 3 heures » : quart d'heure par quart d'heure.","48 heures : courbes de température, pluie, vent ou UV ; faites défiler, touchez un point pour la valeur.","16 jours : touchez un jour pour le détail."]],
 ["📡","Radar",["Animation des 2 dernières heures et prévision à 30 min. Le curseur fait défiler les images, ⏸ met en pause, la carte se zoome."]],
 ["⚠","Alertes et conseils",["Alertes calculées : orage, vent, chaleur, gel, fortes pluies, neige, verglas, brouillard, UV, pollution.","Conseils : tenue, parapluie, soleil, jardin, linge, route, meilleur créneau pour le sport.","La vigilance officielle reste celle de Météo-France."]],
 ["🔔","Notifications",["Dans l'application Android : chaque matin à 7 h, la météo du jour de votre ville principale (☰ pour l'activer ou la couper)."]]];
function help(){ const ov=document.createElement("div"); ov.className="overlay"; ov.innerHTML=`<div class="sheet"><h2>Aide</h2>${HELP.map((h,i)=>`<details class="help" ${i===0?"open":""}><summary><span style="font-size:20px">${h[0]}</span>${h[1]}</summary><ol>${h[2].map(t=>`<li>${esc(t)}</li>`).join("")}</ol></details>`).join("")}<button class="btn" data-x>Fermer</button></div>`; document.body.appendChild(ov); ov.onclick=e=>{ if(e.target===ov||e.target.dataset.x!==undefined) ov.remove(); }; }

/* ================= DÉMARRAGE ================= */
if(S.cur>=S.cities.length) S.cur=S.gps?-1:0; if(S.cur===-1&&!S.gps) S.cur=0;
show(); if(!S.cities.length&&!S.gps) locate();
setInterval(()=>{ if(!document.hidden&&city()) show(); },20*60e3);
</script>
<script>/* Application Android : impression (MAGPrint.printHtml), et fichiers téléchargés -> menu Android (enregistrer dans un dossier, e-mail, partager, imprimer) */
(function(){if(!window.MAGPrint)return;var MP=window.MAGPrint;
function fixForms(src,dst){var a=src.querySelectorAll("input,textarea,select"),b=dst.querySelectorAll("input,textarea,select");for(var i=0;i<a.length&&i<b.length;i++){var x=a[i],y=b[i];if(x.tagName==="TEXTAREA")y.textContent=x.value;else if(x.tagName==="SELECT"){Array.prototype.forEach.call(y.options,function(o,k){if(k===x.selectedIndex)o.setAttribute("selected","");else o.removeAttribute("selected")})}else if(x.type==="checkbox"||x.type==="radio"){if(x.checked)y.setAttribute("checked","");else y.removeAttribute("checked")}else y.setAttribute("value",x.value)}}
function snap(win){var doc=win.document,d=doc.documentElement.cloneNode(true);fixForms(doc.documentElement,d);d.querySelectorAll("script").forEach(function(s){s.remove()});
  doc.querySelectorAll("canvas").forEach(function(c,i){try{var img=d.querySelectorAll("canvas")[i];if(img){var im=doc.createElement("img");im.src=c.toDataURL("image/png");im.style.cssText="max-width:100%";img.replaceWith(im)}}catch(e){}});
  return "<!doctype html>"+d.outerHTML}
function toB64(blob){return new Promise(function(ok,ko){var r=new FileReader();r.onload=function(){var x=String(r.result);ok(x.slice(x.indexOf(",")+1))};r.onerror=ko;r.readAsDataURL(blob)})}
function sendFile(href,name,win){if(!MP.fileMenu)return false;(win||window).fetch(href).then(function(r){return r.blob()}).then(function(b){return toB64(b).then(function(x){MP.fileMenu(x,name||"fichier",b.type||"application/octet-stream","","","")})}).catch(function(){});return true}
function openBlob(href,name,win){if(!MP.openFile)return sendFile(href,name,win);(win||window).fetch(href).then(function(r){return r.blob()}).then(function(b){return toB64(b).then(function(x){MP.openFile(x,name||("document"+(b.type.indexOf("pdf")>=0?".pdf":"")),b.type||"application/octet-stream")})}).catch(function(){});return true}
function hook(win){if(!win||win.__magp)return;win.__magp=1;
  /* liens créés par programme (a.click() hors de la page) */
  try{var AC=win.HTMLAnchorElement.prototype.click;win.HTMLAnchorElement.prototype.click=function(){var h=this.getAttribute("href")||"";if(/^(blob:|data:)/.test(h)){if(this.hasAttribute("download")){sendFile(h,this.getAttribute("download"),win);return}if(this.target==="_blank"){openBlob(h,"",win);return}}return AC.apply(this,arguments)}}catch(e){}
  win.print=function(){try{MP.printHtml(snap(win),win.document.title||"MAG Formation 13")}catch(e){}};
  var op=win.open;win.open=function(u){if(u&&/^(blob:|data:)/.test(String(u))){openBlob(String(u),"",win);return null}if(!u||u==="about:blank"){var buf="";var fw={closed:false,document:{open:function(){buf=""},write:function(h){buf+=h},writeln:function(h){buf+=h+"\n"},close:function(){}},focus:function(){},close:function(){fw.closed=true},print:function(){MP.printHtml(buf,"MAG Formation 13")}};return fw}return op?op.apply(win,arguments):null};
  win.document.addEventListener("click",function(e){var a=e.target&&e.target.closest?e.target.closest("a[href]"):null;if(!a)return;var h=a.getAttribute("href")||"";if(!/^(blob:|data:)/.test(h))return;if(a.hasAttribute("download")){e.preventDefault();e.stopPropagation();sendFile(h,a.getAttribute("download"),win)}else if(a.target==="_blank"){e.preventDefault();e.stopPropagation();openBlob(h,a.getAttribute("data-name")||"",win)}},true)}
hook(window);
function watch(f){var go=function(){try{hook(f.contentWindow)}catch(e){}};f.addEventListener("load",function(){if(f.contentWindow)f.contentWindow.__magp=0;go()});go()}
document.querySelectorAll("iframe").forEach(watch);
new MutationObserver(function(ms){ms.forEach(function(m){m.addedNodes.forEach(function(n){if(n.tagName==="IFRAME")watch(n)})})}).observe(document.documentElement,{childList:true,subtree:true});
})();</script>
